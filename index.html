 после wait результаты видны без join\n    int sum = 0;\n    for (int x : res) sum += x;\n    for (auto& t : ts) t.join();\n    if (sum != 100) {\n        std::cout << \"FAIL: sum = \" << sum\n                  << \": wait вернулся раньше времени\\n\";\n        return 1;\n    }\n    std::cout << sum << '\\n';\n}\n", "mode": "tsan", "expect": "100", "hint": "Счётчик меняется под мьютексом; `notify_all` на нуле; `wait` с предикатом `count_ == 0`.", "solution": "class CountDownLatch {\npublic:\n    explicit CountDownLatch(int n) : count_(n) {}\n\n    void count_down() {\n        std::lock_guard lk(m_);\n        if (count_ > 0 && --count_ == 0)\n            cv_.notify_all();  // под замком: latch может умереть\n    }\n    void wait() {\n        std::unique_lock lk(m_);\n        cv_.wait(lk, [this] { return count_ == 0; });\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable cv_;\n    int count_;  // guarded by m_\n};\n"}, {"id": "mt-t11", "lesson": "mt-jthread", "title": "jthread и stop_token", "task": "Заполни в `run_worker` тип потока, который сам останавливается и присоединяется в деструкторе, и проверку токена в цикле.", "prefix": "#include <atomic>\n#include <chrono>\n#include <iostream>\n#include <thread>\n\nusing namespace std::chrono_literals;\n\nconst auto main_id = std::this_thread::get_id();\nstd::atomic<int> ticks{0}, ticks_on_main{0};\n\nvoid tick() {\n    if (std::this_thread::get_id() == main_id) ++ticks_on_main;\n    ++ticks;\n}\n", "code": "// Воркер тикает, пока его не попросят остановиться.\n// Функция ждёт 10ms и выходит; к выходу воркер\n// должен быть остановлен и присоединён.\nvoid run_worker() {\n    std::____ worker([](std::stop_token st) {\n        while (!st.____()) {\n            tick();\n            std::this_thread::sleep_for(1ms);\n        }\n    });\n    std::this_thread::sleep_for(10ms);\n}   // здесь: request_stop() + join()\n", "check": "int main() {\n    run_worker();\n    int after = ticks;\n    std::this_thread::sleep_for(20ms);\n    if (after == 0 || ticks_on_main > 0) {\n        std::cout << \"FAIL: воркер не тикал \"\n                     \"в своём потоке\\n\";\n        return 1;\n    }\n    if (ticks != after) {\n        std::cout << \"FAIL: воркер тикает после \"\n                     \"выхода из run_worker\\n\";\n        return 1;\n    }\n    std::cout << (after > 0) << '\\n';\n}\n", "mode": "gcc", "expect": "1", "hint": "C++20: `jthread`, метод токена `stop_requested`.", "solution": "// Воркер тикает, пока его не попросят остановиться.\n// Функция ждёт 10ms и выходит; к выходу воркер\n// должен быть остановлен и присоединён.\nvoid run_worker() {\n    std::jthread worker([](std::stop_token st) {\n        while (!st.stop_requested()) {\n            tick();\n            std::this_thread::sleep_for(1ms);\n        }\n    });\n    std::this_thread::sleep_for(10ms);\n}   // здесь: request_stop() + join()\n"}, {"id": "mt-t12", "lesson": "mt-queue", "title": "Блокирующая очередь", "task": "Реализуй `push` и блокирующий `pop`. Один производитель, один потребитель, проверка под TSan.", "prefix": "#include <chrono>\n#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <queue>\n#include <stdexcept>\n#include <thread>\n", "code": "template <class T>\nclass ConcurrentQueue {\npublic:\n    void push(T v) {\n        // TODO: положить под замком, разбудить потребителя\n        throw std::logic_error(\"TODO\");\n    }\n    T pop() {\n        // TODO: дождаться элемента, забрать front\n        throw std::logic_error(\"TODO\");\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable cv_;\n    std::queue<T> q_;  // guarded by m_\n};\n", "check": "int main() {\n    ConcurrentQueue<int> q;\n    std::thread producer([&] {\n        // потребитель успеет прийти к пустой очереди\n        std::this_thread::sleep_for(std::chrono::milliseconds(10));\n        for (int i = 1; i <= 100; ++i) q.push(i);\n    });\n    long sum = 0;\n    bool fifo = true;\n    for (int i = 1; i <= 100; ++i) {\n        int x = q.pop();\n        if (x != i) fifo = false;\n        sum += x;\n    }\n    producer.join();\n    if (!fifo || sum != 5050) {\n        std::cout << \"FAIL: pop вернул не 1..100 \"\n                     \"по порядку\\n\";\n        return 1;\n    }\n    std::cout << sum << '\\n';\n}\n", "mode": "tsan", "expect": "5050", "hint": "push: lock_guard, push, после скобки notify_one. pop: unique_lock + wait с предикатом.", "solution": "template <class T>\nclass ConcurrentQueue {\npublic:\n    void push(T v) {\n        {\n            std::lock_guard lk(m_);\n            q_.push(std::move(v));\n        }\n        cv_.notify_one();\n    }\n    T pop() {\n        std::unique_lock lk(m_);\n        cv_.wait(lk, [this] { return !q_.empty(); });\n        T v = std::move(q_.front());\n        q_.pop();\n        return v;\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable cv_;\n    std::queue<T> q_;  // guarded by m_\n};\n"}, {"id": "mt-t13", "lesson": "mt-queue", "title": "Bounded queue с close", "task": "Реализуй ограниченную очередь: `push` ждёт свободное место, `pop` ждёт элемент, `close` будит всех. После закрытия `push` возвращает false, а `pop` дочитывает остаток.", "prefix": "#include <atomic>\n#include <chrono>\n#include <condition_variable>\n#include <cstddef>\n#include <deque>\n#include <iostream>\n#include <mutex>\n#include <optional>\n#include <stdexcept>\n#include <thread>\n#include <vector>\n", "code": "template <class T>\nclass BoundedQueue {\npublic:\n    explicit BoundedQueue(std::size_t cap) : cap_(cap) {}\n\n    bool push(T v) {  // ждёт место; false - очередь закрыта\n        throw std::logic_error(\"TODO\");\n    }\n    std::optional<T> pop() {  // nullopt - закрыта и пуста\n        throw std::logic_error(\"TODO\");\n    }\n    void close() {\n        throw std::logic_error(\"TODO\");\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable not_full_, not_empty_;\n    std::deque<T> q_;      // guarded by m_\n    const std::size_t cap_;\n    bool closed_ = false;  // guarded by m_\n};\n", "check": "int fail(const char* why) {\n    std::cout << \"FAIL: \" << why << '\\n';\n    return 1;\n}\n\nint main() {\n    {   // 1. push ждёт места, close не теряет остаток\n        BoundedQueue<int> q(2);\n        q.push(1);\n        q.push(2);\n        std::atomic<bool> pushed{false};\n        std::thread t([&] { q.push(3); pushed = true; });\n        std::this_thread::sleep_for(std::chrono::milliseconds(20));\n        bool early = pushed;\n        auto first = q.pop();  // освобождает место\n        t.join();\n        if (early) return fail(\"push не ждёт места\");\n        q.close();\n        auto a = q.pop(), b = q.pop(), c = q.pop();\n        if (!first || !a || !b || c || *a + *b != 5)\n            return fail(\"pop после close: не тот остаток\");\n        if (q.push(4)) return fail(\"push после close\");\n    }\n    // 2. Два производителя, два потребителя\n    BoundedQueue<int> q(2);\n    std::vector<std::thread> prod, cons;\n    std::atomic<long> sum{0};\n    for (int p = 0; p < 2; ++p)\n        prod.emplace_back([&] {\n            for (int i = 1; i <= 100; ++i) q.push(i);\n        });\n    for (int c = 0; c < 2; ++c)\n        cons.emplace_back([&] {\n            while (auto v = q.pop()) sum += *v;\n        });\n    for (auto& t : prod) t.join();\n    q.close();\n    for (auto& t : cons) t.join();\n    if (sum != 10100) return fail(\"потеряны элементы\");\n    std::cout << sum << ' ' << q.push(1) << '\\n';\n}\n", "mode": "tsan", "expect": "10100 0", "hint": "Два cv: `not_full_` и `not_empty_`. Оба предиката учитывают `closed_`, `close` зовёт `notify_all` на оба.", "solution": "template <class T>\nclass BoundedQueue {\npublic:\n    explicit BoundedQueue(std::size_t cap) : cap_(cap) {}\n\n    bool push(T v) {  // ждёт место; false - очередь закрыта\n        std::unique_lock lk(m_);\n        not_full_.wait(lk, [this] {\n            return closed_ || q_.size() < cap_;\n        });\n        if (closed_) return false;\n        q_.push_back(std::move(v));\n        lk.unlock();\n        not_empty_.notify_one();\n        return true;\n    }\n    std::optional<T> pop() {  // nullopt - закрыта и пуста\n        std::unique_lock lk(m_);\n        not_empty_.wait(lk, [this] {\n            return closed_ || !q_.empty();\n        });\n        if (q_.empty()) return std::nullopt;\n        T v = std::move(q_.front());\n        q_.pop_front();\n        lk.unlock();\n        not_full_.notify_one();\n        return v;\n    }\n    void close() {\n        {\n            std::lock_guard lk(m_);\n            closed_ = true;\n        }\n        not_full_.notify_all();\n        not_empty_.notify_all();\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable not_full_, not_empty_;\n    std::deque<T> q_;      // guarded by m_\n    const std::size_t cap_;\n    bool closed_ = false;  // guarded by m_\n};\n"}, {"id": "mt-t14", "lesson": "mt-pool", "title": "submit с future", "task": "Воркеры и shutdown уже готовы (класс выше). Реализуй `submit`: задача уходит в очередь, её выполняет воркер, вызывающий получает `std::future` с результатом или исключением.", "prefix": "#include <atomic>\n#include <condition_variable>\n#include <functional>\n#include <future>\n#include <iostream>\n#include <memory>\n#include <mutex>\n#include <queue>\n#include <stdexcept>\n#include <string>\n#include <thread>\n#include <type_traits>\n#include <vector>\n\nclass ThreadPool {\npublic:\n    explicit ThreadPool(int n) {\n        for (int i = 0; i < n; ++i)\n            workers_.emplace_back([this] { loop(); });\n    }\n    ~ThreadPool() {\n        {\n            std::lock_guard lk(m_);\n            stop_ = true;\n        }\n        cv_.notify_all();\n        for (auto& t : workers_) t.join();\n    }\n\n    template <class F>  // реализуешь ниже\n    auto submit(F f) -> std::future<std::invoke_result_t<F>>;\n\nprivate:\n    void loop() {\n        while (true) {\n            std::function<void()> job;\n            {\n                std::unique_lock lk(m_);\n                cv_.wait(lk, [this] {\n                    return stop_ || !tasks_.empty();\n                });\n                if (stop_ && tasks_.empty()) return;\n                job = std::move(tasks_.front());\n                tasks_.pop();\n            }\n            job();\n        }\n    }\n\n    std::mutex m_;\n    std::condition_variable cv_;\n    std::queue<std::function<void()>> tasks_;  // guarded by m_\n    bool stop_ = false;                        // guarded by m_\n    std::vector<std::thread> workers_;\n};\n", "code": "template <class F>\nauto ThreadPool::submit(F f)\n    -> std::future<std::invoke_result_t<F>> {\n    // TODO: packaged_task в shared_ptr, future наружу,\n    // в очередь - лямбда, которая вызовет task\n    throw std::logic_error(\"TODO\");\n}\n", "check": "const auto main_id = std::this_thread::get_id();\nstd::atomic<int> on_main{0};  // задачи, выполненные в main\n\nint main() {\n    ThreadPool pool(4);\n    std::vector<std::future<int>> fs;\n    for (int i = 0; i < 8; ++i)\n        fs.push_back(pool.submit([i] {\n            if (std::this_thread::get_id() == main_id) ++on_main;\n            return i * i;\n        }));\n    auto bad = pool.submit([]() -> int {\n        throw std::runtime_error(\"boom\");\n    });\n    int sum = 0;\n    for (auto& f : fs) sum += f.get();\n    std::string err = \"нет исключения\";\n    try {\n        bad.get();\n    } catch (const std::exception& e) {\n        err = e.what();\n    }\n    if (on_main > 0) {\n        std::cout << \"FAIL: задачи должны выполнять воркеры\\n\";\n        return 1;\n    }\n    if (sum != 140 || err != \"boom\") {\n        std::cout << \"FAIL: sum \" << sum << \", \" << err << '\\n';\n        return 1;\n    }\n    std::cout << sum << \"\\ncaught: \" << err << '\\n';\n}\n", "mode": "gcc", "expect": "140\ncaught: boom", "hint": "`std::function` требует копируемости, поэтому `packaged_task` кладут в `shared_ptr`.", "solution": "template <class F>\nauto ThreadPool::submit(F f)\n    -> std::future<std::invoke_result_t<F>> {\n    using R = std::invoke_result_t<F>;\n    auto task =\n        std::make_shared<std::packaged_task<R()>>(std::move(f));\n    std::future<R> fut = task->get_future();\n    {\n        std::lock_guard lk(m_);\n        tasks_.emplace([task] { (*task)(); });\n    }\n    cv_.notify_one();\n    return fut;\n}\n"}, {"id": "mt-t15", "lesson": "mt-future", "title": "promise и future", "task": "Передай результат `compute()` из потока через `std::promise`. Заполни три пропуска в `compute_in_thread`.", "prefix": "#include <future>\n#include <iostream>\n#include <thread>\n\nconst auto main_id = std::this_thread::get_id();\nint calls_off_main = 0;  // вызовы не из main-потока\n\nint compute() {  // долгая работа\n    if (std::this_thread::get_id() != main_id) ++calls_off_main;\n    return 42;\n}\n", "code": "// Посчитать compute() в отдельном потоке\n// и вернуть результат через promise/future\nint compute_in_thread() {\n    std::promise<int> p;\n    std::future<int> f = p.____();\n    std::thread t([p = std::move(p)]() mutable {\n        p.____(compute());\n    });\n    int r = f.____();\n    t.join();\n    return r;\n}\n", "check": "int main() {\n    int r = compute_in_thread();\n    if (calls_off_main != 1) {\n        std::cout << \"FAIL: compute должен один раз \"\n                     \"выполниться в отдельном потоке\\n\";\n        return 1;\n    }\n    if (r != 42) {\n        std::cout << \"FAIL: r = \" << r << '\\n';\n        return 1;\n    }\n    std::cout << r << '\\n';\n}\n", "mode": "gcc", "expect": "42", "hint": "Взять future, положить значение, забрать значение.", "solution": "// Посчитать compute() в отдельном потоке\n// и вернуть результат через promise/future\nint compute_in_thread() {\n    std::promise<int> p;\n    std::future<int> f = p.get_future();\n    std::thread t([p = std::move(p)]() mutable {\n        p.set_value(compute());\n    });\n    int r = f.get();\n    t.join();\n    return r;\n}\n"}, {"id": "mt-t16", "lesson": "mt-future", "title": "packaged_task в потоке", "task": "Запусти `task` в отдельном потоке с аргументами `a` и `b`. Результат придёт в `f`.", "prefix": "#include <future>\n#include <iostream>\n#include <thread>\n\nconst auto main_id = std::this_thread::get_id();\nint calls_off_main = 0;  // вызовы не из main-потока\n\nint mul(int a, int b) {\n    if (std::this_thread::get_id() != main_id) ++calls_off_main;\n    return a * b;\n}\n", "code": "// Выполнить task в отдельном потоке с аргументами a, b\nint mul_in_thread(int a, int b) {\n    std::packaged_task<int(int, int)> task(mul);\n    std::future<int> f = task.get_future();\n    std::thread t(____, a, b);  // запустить task в потоке\n    int r = f.get();\n    t.join();\n    return r;\n}\n", "check": "int main() {\n    int r = mul_in_thread(6, 7);\n    if (calls_off_main != 1) {\n        std::cout << \"FAIL: task должен один раз \"\n                     \"выполниться в отдельном потоке\\n\";\n        return 1;\n    }\n    if (r != 42) {\n        std::cout << \"FAIL: r = \" << r << '\\n';\n        return 1;\n    }\n    std::cout << r << '\\n';\n}\n", "mode": "gcc", "expect": "42", "hint": "`packaged_task` нельзя копировать.", "solution": "// Выполнить task в отдельном потоке с аргументами a, b\nint mul_in_thread(int a, int b) {\n    std::packaged_task<int(int, int)> task(mul);\n    std::future<int> f = task.get_future();\n    std::thread t(std::move(task), a, b);  // запустить task в потоке\n    int r = f.get();\n    t.join();\n    return r;\n}\n"}, {"id": "mt-t17", "lesson": "mt-future", "title": "Исключение через future", "task": "Допиши `run`: `parse(x)` должен выполниться в отдельном потоке. Если он бросил исключение, поймай его и верни строку `error: ` + `what()`.", "prefix": "#include <atomic>\n#include <future>\n#include <iostream>\n#include <stdexcept>\n#include <string>\n#include <thread>\n\nconst auto main_id = std::this_thread::get_id();\nstd::atomic<int> calls{0}, calls_on_main{0};\n\nint parse(int x) {\n    ++calls;\n    if (std::this_thread::get_id() == main_id) ++calls_on_main;\n    if (x < 0) throw std::invalid_argument(\"negative\");\n    return x * 2;\n}\n", "code": "// parse(x) в отдельном потоке; результат строкой.\n// Если parse бросил - \"error: \" + what().\nstd::string run(int x) {\n    auto f = std::async(std::launch::____, parse, x);\n    // TODO: поймать исключение\n    return std::to_string(f.get());\n}\n", "check": "int main() {\n    std::string ok = run(21);\n    std::string bad = run(-1);\n    if (calls != 2 || calls_on_main > 0) {\n        std::cout << \"FAIL: parse должен выполниться \"\n                     \"в отдельном потоке\\n\";\n        return 1;\n    }\n    if (ok != \"42\" || bad != \"error: negative\") {\n        std::cout << \"FAIL: \" << ok << \" / \" << bad << '\\n';\n        return 1;\n    }\n    std::cout << ok << '\\n' << bad << '\\n';\n}\n", "mode": "gcc", "expect": "42\nerror: negative", "hint": "Политика `async`. Исключение вылетит из `get()`.", "solution": "// parse(x) в отдельном потоке; результат строкой.\n// Если parse бросил - \"error: \" + what().\nstd::string run(int x) {\n    auto f = std::async(std::launch::async, parse, x);\n    try {\n        return std::to_string(f.get());\n    } catch (const std::exception& e) {\n        return std::string(\"error: \") + e.what();\n    }\n}\n"}, {"id": "mt-t18", "lesson": "mt-atomic", "title": "fetch_mul через CAS", "task": "У `std::atomic<int>` нет умножения. Напиши `fetch_mul` на `compare_exchange_weak`: атомарно умножить и вернуть старое значение.", "prefix": "#include <atomic>\n#include <iostream>\n#include <stdexcept>\n#include <thread>\n#include <vector>\n", "code": "// Атомарно a *= k, вернуть старое значение\nint fetch_mul(std::atomic<int>& a, int k) {\n    // TODO: CAS-цикл\n    throw std::logic_error(\"TODO\");\n}\n", "check": "int main() {\n    std::atomic<int> x{1};\n    std::vector<std::thread> ts;\n    for (int t = 0; t < 4; ++t)\n        ts.emplace_back([&] {\n            for (int i = 0; i < 5; ++i) fetch_mul(x, 2);\n        });\n    for (auto& th : ts) th.join();\n    std::atomic<int> y{3};\n    int old = fetch_mul(y, 5);\n    if (x != (1 << 20) || old != 3 || y != 15) {\n        std::cout << \"FAIL: \" << x << ' ' << old << ' ' << y\n                  << \", ждали 1048576 3 15\\n\";\n        return 1;\n    }\n    std::cout << x << ' ' << old << ' ' << y << '\\n';\n}\n", "mode": "gcc", "expect": "1048576 3 15", "hint": "При неудаче CAS сам записывает свежее значение в `expected`.", "solution": "// Атомарно a *= k, вернуть старое значение\nint fetch_mul(std::atomic<int>& a, int k) {\n    int cur = a.load();\n    while (!a.compare_exchange_weak(cur, cur * k)) {\n        // cur обновился - пробуем снова\n    }\n    return cur;\n}\n"}, {"id": "mt-t19", "lesson": "mt-atomic", "title": "Спинлок на atomic_flag", "task": "Заполни две операции `atomic_flag`: захват (поставить флаг и узнать старое значение) и освобождение. TSan проверит, что гонки нет.", "prefix": "#include <atomic>\n#include <iostream>\n#include <mutex>\n#include <thread>\n", "code": "class SpinLock {\npublic:\n    void lock() {\n        while (flag_.____(std::memory_order_acquire)) {\n            // занято - крутимся\n        }\n    }\n    void unlock() { flag_.____(std::memory_order_release); }\n\nprivate:\n    std::atomic_flag flag_;  // C++20: изначально clear\n};\n", "check": "SpinLock spin;\nlong counter = 0;  // guarded by spin\n\nint main() {\n    auto work = [] {\n        for (int i = 0; i < 20000; ++i) {\n            std::lock_guard lk(spin);\n            ++counter;\n        }\n    };\n    std::thread a(work), b(work);\n    a.join();\n    b.join();\n    if (counter != 40000) {\n        std::cout << \"FAIL: counter = \" << counter << '\\n';\n        return 1;\n    }\n    std::cout << counter << '\\n';\n}\n", "mode": "tsan", "expect": "40000", "hint": "`test_and_set` и `clear`.", "solution": "class SpinLock {\npublic:\n    void lock() {\n        while (flag_.test_and_set(std::memory_order_acquire)) {\n            // занято - крутимся\n        }\n    }\n    void unlock() { flag_.clear(std::memory_order_release); }\n\nprivate:\n    std::atomic_flag flag_;  // C++20: изначально clear\n};\n"}, {"id": "mt-t20", "lesson": "mt-memory", "title": "Публикация через флаг", "task": "TSan видит гонку на `data`: relaxed не даёт happens-before. Поменяй порядки памяти в `produce` и `consume` на минимально достаточные.", "prefix": "#include <atomic>\n#include <iostream>\n#include <string>\n#include <thread>\n\nstd::string data;\nstd::atomic<bool> ready{false};\n", "code": "// Записать data и опубликовать флаг\nvoid produce(const std::string& s) {\n    data = s;\n    ready.store(true, std::memory_order_relaxed);  // TODO\n}\n\n// Дождаться флага и прочитать data\nstd::string consume() {\n    while (!ready.load(std::memory_order_relaxed)) {}  // TODO\n    return data;\n}\n", "check": "int main() {\n    std::string got;\n    std::thread consumer([&got] { got = consume(); });\n    std::thread producer([] { produce(\"payload\"); });\n    producer.join();\n    consumer.join();\n    if (got != \"payload\") {\n        std::cout << \"FAIL: got '\" << got << \"'\\n\";\n        return 1;\n    }\n    std::cout << got << '\\n';\n}\n", "mode": "tsan", "expect": "payload", "hint": "Запись флага публикует, чтение флага забирает.", "solution": "// Записать data и опубликовать флаг\nvoid produce(const std::string& s) {\n    data = s;\n    ready.store(true, std::memory_order_release);\n}\n\n// Дождаться флага и прочитать data\nstd::string consume() {\n    while (!ready.load(std::memory_order_acquire)) {}\n    return data;\n}\n"}, {"id": "mt-t21", "lesson": "mt-once", "title": "Инициализация ровно один раз", "task": "Четыре потока зовут `ensure_init`. `init_config` должна выполниться ровно один раз, и все потоки должны увидеть готовый `config`.", "prefix": "#include <iostream>\n#include <mutex>\n#include <thread>\n#include <vector>\n\nint inits = 0;\nint config = 0;\n\nvoid init_config() {  // дорогая инициализация\n    ++inits;\n    config = 42;\n}\n", "code": "std::____ init_flag;\n\n// Первый вызов делает init_config, остальные ждут его\nvoid ensure_init() {\n    std::____(init_flag, init_config);\n}\n", "check": "int main() {\n    std::vector<int> seen(4);\n    std::vector<std::thread> ts;\n    for (int i = 0; i < 4; ++i)\n        ts.emplace_back([&seen, i] {\n            ensure_init();\n            seen[i] = config;\n        });\n    for (auto& t : ts) t.join();\n    for (int s : seen)\n        if (s != 42) {\n            std::cout << \"FAIL: поток увидел config = \"\n                      << s << '\\n';\n            return 1;\n        }\n    if (inits != 1) {\n        std::cout << \"FAIL: inits = \" << inits << '\\n';\n        return 1;\n    }\n    std::cout << inits << ' ' << seen[0] + seen[3] << '\\n';\n}\n", "mode": "tsan", "expect": "1 84", "hint": "Флаг и функция из `<mutex>`.", "solution": "std::once_flag init_flag;\n\n// Первый вызов делает init_config, остальные ждут его\nvoid ensure_init() {\n    std::call_once(init_flag, init_config);\n}\n"}, {"id": "mt-t22", "lesson": "mt-tasks-sync", "title": "Ping-pong", "task": "Два потока говорят по очереди: `ping pong ping pong ping pong`. Напиши `play` на mutex + condition_variable. Слово произносится через `say`.", "prefix": "#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <stdexcept>\n#include <string>\n#include <thread>\n\nstd::mutex m;\nstd::condition_variable cv;\nint turn = 0;  // 0 - ping, 1 - pong; guarded by m\n\nstd::string said;             // всё сказанное по порядку\nint speaker_changes = 0;      // сколько раз сменился поток\nstd::thread::id last_speaker;\n\nvoid say(const char* word) {  // звать под m\n    said += word;\n    said += ' ';\n    if (std::this_thread::get_id() != last_speaker)\n        ++speaker_changes;\n    last_speaker = std::this_thread::get_id();\n}\n", "code": "// 3 раза: дождаться turn == me, сказать word, передать ход\nvoid play(int me, const char* word) {\n    // TODO\n    throw std::logic_error(\"TODO\");\n}\n", "check": "int main() {\n    std::thread b(play, 1, \"pong\");\n    std::thread a(play, 0, \"ping\");\n    a.join();\n    b.join();\n    if (said != \"ping pong ping pong ping pong \"\n        || speaker_changes != 6) {\n        std::cout << \"FAIL: '\" << said << \"', смен потока: \"\n                  << speaker_changes << '\\n';\n        return 1;\n    }\n    std::cout << said << '\\n';\n}\n", "mode": "gcc", "expect": "ping pong ping pong ping pong", "hint": "Состояние - `turn`. Ждать с предикатом `turn == me`, потом `say`, `turn = 1 - me` и notify.", "solution": "// 3 раза: дождаться turn == me, сказать word, передать ход\nvoid play(int me, const char* word) {\n    for (int i = 0; i < 3; ++i) {\n        std::unique_lock lk(m);\n        cv.wait(lk, [me] { return turn == me; });\n        say(word);\n        turn = 1 - me;\n        lk.unlock();\n        cv.notify_one();\n    }\n}\n"}, {"id": "mt-t23", "lesson": "mt-tasks-sync", "title": "Параллельная сумма", "task": "Каждый кусок массива считается в своей задаче через `sum_range`. Запусти задачи и собери результаты.", "prefix": "#include <algorithm>\n#include <atomic>\n#include <cstddef>\n#include <future>\n#include <iostream>\n#include <numeric>\n#include <thread>\n#include <vector>\n\nconst auto main_id = std::this_thread::get_id();\nstd::atomic<int> calls{0}, calls_on_main{0};\n\n// Сумма v[b, e)\nlong long sum_range(const std::vector<int>& v,\n                    std::size_t b, std::size_t e) {\n    ++calls;\n    if (std::this_thread::get_id() == main_id) ++calls_on_main;\n    return std::accumulate(v.begin() + b, v.begin() + e, 0LL);\n}\n", "code": "// Разбить v на n кусков, каждый сложить через\n// sum_range в своей задаче, собрать результаты\nlong long parallel_sum(const std::vector<int>& v, std::size_t n) {\n    std::size_t chunk = (v.size() + n - 1) / n;\n    std::vector<std::future<long long>> parts;\n    for (std::size_t b = 0; b < v.size(); b += chunk) {\n        std::size_t e = std::min(b + chunk, v.size());\n        parts.push_back(std::____(std::launch::async, [&v, b, e] {\n            return sum_range(v, b, e);\n        }));\n    }\n    long long total = 0;\n    for (auto& f : parts) total += ____;\n    return total;\n}\n", "check": "int main() {\n    std::vector<int> v(100'000);\n    std::iota(v.begin(), v.end(), 1);\n    long long s = parallel_sum(v, 4);\n    if (calls != 4 || calls_on_main > 0) {\n        std::cout << \"FAIL: нужно 4 куска, каждый \"\n                     \"в отдельном потоке\\n\";\n        return 1;\n    }\n    if (s != 5000050000LL) {\n        std::cout << \"FAIL: sum = \" << s << '\\n';\n        return 1;\n    }\n    std::cout << s << '\\n';\n}\n", "mode": "gcc", "expect": "5000050000", "hint": "Задача - через `std::async`, результат - через `get()`.", "solution": "// Разбить v на n кусков, каждый сложить через\n// sum_range в своей задаче, собрать результаты\nlong long parallel_sum(const std::vector<int>& v, std::size_t n) {\n    std::size_t chunk = (v.size() + n - 1) / n;\n    std::vector<std::future<long long>> parts;\n    for (std::size_t b = 0; b < v.size(); b += chunk) {\n        std::size_t e = std::min(b + chunk, v.size());\n        parts.push_back(std::async(std::launch::async, [&v, b, e] {\n            return sum_range(v, b, e);\n        }));\n    }\n    long long total = 0;\n    for (auto& f : parts) total += f.get();\n    return total;\n}\n"}, {"id": "mt-t24", "lesson": "mt-tasks-service", "title": "Шардированный счётчик", "task": "Допиши выбор шарда по хешу (через маску) и захват мьютекса нужного шарда. TSan проверит, что гонок нет.", "prefix": "#include <array>\n#include <cstddef>\n#include <functional>\n#include <iostream>\n#include <mutex>\n#include <string>\n#include <thread>\n#include <unordered_map>\n#include <vector>\n", "code": "class ShardedCounter {\npublic:\n    void add(const std::string& key) {\n        Shard& s = shards_[index(key)];\n        std::lock_guard lk(____);\n        ++s.map[key];\n    }\n    long get(const std::string& key) {\n        Shard& s = shards_[index(key)];\n        std::lock_guard lk(s.m);\n        auto it = s.map.find(key);\n        return it == s.map.end() ? 0 : it->second;\n    }\n\nprivate:\n    static constexpr std::size_t kShards = 16;  // степень двойки\n    struct Shard {\n        std::mutex m;\n        std::unordered_map<std::string, long> map;\n    };\n    std::size_t index(const std::string& key) const {\n        return std::hash<std::string>{}(key) ____ (kShards - 1);\n    }\n    std::array<Shard, kShards> shards_;\n};\n", "check": "int main() {\n    ShardedCounter c;\n    std::vector<std::thread> ts;\n    for (int t = 0; t < 4; ++t)\n        ts.emplace_back([&] {\n            for (int i = 0; i < 1000; ++i)\n                c.add(\"user\" + std::to_string(i % 10));\n        });\n    for (auto& th : ts) th.join();\n    for (int i = 0; i < 10; ++i) {\n        long n = c.get(\"user\" + std::to_string(i));\n        if (n != 400) {\n            std::cout << \"FAIL: user\" << i << \" = \" << n << '\\n';\n            return 1;\n        }\n    }\n    if (c.get(\"nobody\") != 0) {\n        std::cout << \"FAIL: nobody != 0\\n\";\n        return 1;\n    }\n    std::cout << c.get(\"user3\") << ' ' << c.get(\"nobody\") << '\\n';\n}\n", "mode": "tsan", "expect": "400 0", "hint": "Для степени двойки `h % n == (h & (n - 1))`. Замок - на мьютекс шарда.", "solution": "class ShardedCounter {\npublic:\n    void add(const std::string& key) {\n        Shard& s = shards_[index(key)];\n        std::lock_guard lk(s.m);\n        ++s.map[key];\n    }\n    long get(const std::string& key) {\n        Shard& s = shards_[index(key)];\n        std::lock_guard lk(s.m);\n        auto it = s.map.find(key);\n        return it == s.map.end() ? 0 : it->second;\n    }\n\nprivate:\n    static constexpr std::size_t kShards = 16;  // степень двойки\n    struct Shard {\n        std::mutex m;\n        std::unordered_map<std::string, long> map;\n    };\n    std::size_t index(const std::string& key) const {\n        return std::hash<std::string>{}(key) & (kShards - 1);\n    }\n    std::array<Shard, kShards> shards_;\n};\n"}, {"id": "mt-t25", "lesson": "mt-cpp20sync", "title": "Семафор: не больше 3 соединений", "task": "10 потоков одновременно ходят в \"БД\" через `query()`, а соединений всего 3. Ограничь параллелизм через `std::counting_semaphore`. Пик одновременных запросов меряет `query()`.", "prefix": "#include <atomic>\n#include <chrono>\n#include <iostream>\n#include <semaphore>\n#include <thread>\n#include <vector>\n\nstd::atomic<int> in_flight{0}, peak{0}, queries{0};\n\nvoid query() {  // \"запрос в БД\"; меряет пик\n    int now = ++in_flight;\n    int old = peak.load();\n    while (old < now && !peak.compare_exchange_weak(old, now)) {}\n    std::this_thread::sleep_for(std::chrono::milliseconds(10));\n    --in_flight;\n    ++queries;\n}\n", "code": "// TODO: семафор на 3 разрешения\n\nvoid connect_and_query() {\n    // TODO: взять разрешение\n    query();\n    // TODO: вернуть разрешение\n}\n", "check": "int main() {\n    {\n        std::vector<std::jthread> ts;\n        for (int i = 0; i < 10; ++i)\n            ts.emplace_back(connect_and_query);\n    }\n    if (queries != 10) {\n        std::cout << \"FAIL: запросов \" << queries << \" из 10\\n\";\n        return 1;\n    }\n    if (peak > 3) {\n        std::cout << \"FAIL: одновременно \" << peak\n                  << \" запросов, соединений 3\\n\";\n        return 1;\n    }\n    if (peak < 2) {\n        std::cout << \"FAIL: запросы идут по одному, \"\n                     \"а соединений 3\\n\";\n        return 1;\n    }\n    std::cout << \"peak<=3: \" << (peak <= 3) << '\\n';\n}\n", "mode": "tsan", "expect": "peak<=3: 1", "hint": "`std::counting_semaphore<3> slots(3);`, `acquire()` в начале запроса, `release()` в конце.", "solution": "std::counting_semaphore<3> slots(3);  // не больше 3 сразу\n\nvoid connect_and_query() {\n    slots.acquire();\n    query();\n    slots.release();\n}\n"}, {"id": "mt-t26", "lesson": "mt-cpp20sync", "title": "Флаг на atomic::wait", "task": "Consumer должен уснуть до публикации `data` - без мьютекса, cv и busy-wait. Допиши `consume` и `produce` на `wait`/`notify_one` у `std::atomic<bool>`.", "prefix": "#include <atomic>\n#include <chrono>\n#include <iostream>\n#include <thread>\n\nstd::atomic<bool> ready{false};\nint data = 0;  // обычная переменная\n", "code": "// Уснуть, пока ready == false, и вернуть data\nint consume() {\n    // TODO: уснуть без busy-wait\n    return data;\n}\n\n// Записать data, опубликовать ready, разбудить consumer\nvoid produce(int v) {\n    data = v;\n    // TODO: опубликовать ready и разбудить consumer\n}\n", "check": "int main() {\n    int got = 0;\n    std::thread consumer([&got] { got = consume(); });\n    // consumer успеет уснуть до публикации\n    std::this_thread::sleep_for(std::chrono::milliseconds(10));\n    produce(42);\n    consumer.join();\n    if (got != 42) {\n        std::cout << \"FAIL: got \" << got << '\\n';\n        return 1;\n    }\n    std::cout << \"got \" << got << '\\n';\n}\n", "mode": "tsan", "expect": "got 42", "hint": "`ready.wait(false)` спит, пока значение false. Producer: сначала `data`, потом `ready.store(true)`, потом `ready.notify_one()`.", "solution": "// Уснуть, пока ready == false, и вернуть data\nint consume() {\n    ready.wait(false);  // спим, пока ready == false\n    return data;\n}\n\n// Записать data, опубликовать ready, разбудить consumer\nvoid produce(int v) {\n    data = v;\n    ready.store(true);   // публикуем data\n    ready.notify_one();  // будим\n}\n"}, {"id": "mt-t27", "lesson": "mt-cpp20sync", "title": "Фазы на barrier", "task": "После каждой фазы нужно один раз вызвать `report(data)`. Сейчас его зовёт воркер 0 после барьера, и TSan видит гонку: соседи уже пишут следующую фазу. Перенеси `report` в функцию завершения барьера.", "prefix": "#include <atomic>\n#include <barrier>\n#include <iostream>\n#include <thread>\n#include <vector>\n\nconst auto main_id = std::this_thread::get_id();\nstd::atomic<int> steps_off_main{0};\n\n// Фаза s воркера w: пишет только свой кусок data\nvoid step(std::vector<long>& data, int w, int s) {\n    if (std::this_thread::get_id() != main_id) ++steps_off_main;\n    data[2 * w] += s;\n    data[2 * w + 1] *= 2;\n}\n\nstd::vector<long> reported;  // суммы, по порядку фаз\n\nvoid report(const std::vector<long>& data) {\n    long sum = 0;\n    for (long x : data) sum += x;\n    reported.push_back(sum);\n    std::cout << sum << '\\n';\n}\n", "code": "// workers потоков, steps фаз, после каждой - барьер.\n// После каждой фазы ровно один раз report(data).\nvoid run_phases(std::vector<long>& data, int workers,\n                int steps) {\n    std::barrier sync(workers);  // TODO: completion\n    std::vector<std::jthread> ts;\n    for (int w = 0; w < workers; ++w)\n        ts.emplace_back([&, w] {\n            for (int s = 0; s < steps; ++s) {\n                step(data, w, s);  // свой кусок\n                sync.arrive_and_wait();\n                // БАГ: соседи уже пишут следующую фазу\n                if (w == 0) report(data);\n            }\n        });\n}\n", "check": "int main() {\n    std::vector<long> data(6, 1);\n    run_phases(data, 3, 3);\n    if (steps_off_main != 9) {\n        std::cout << \"FAIL: фазы должны идти в 3 потоках\\n\";\n        return 1;\n    }\n    if (reported != std::vector<long>{9, 18, 36}) {\n        std::cout << \"FAIL: report видел не те суммы\\n\";\n        return 1;\n    }\n}\n", "mode": "tsan", "expect": "9\n18\n36", "hint": "`std::barrier sync(workers, done);`, где `done` - лямбда `noexcept`, которая зовёт `report(data)`. Она выполняется, пока все участники стоят на барьере.", "solution": "// workers потоков, steps фаз, после каждой - барьер.\n// После каждой фазы ровно один раз report(data).\nvoid run_phases(std::vector<long>& data, int workers,\n                int steps) {\n    // выполняется, пока все стоят на барьере\n    auto done = [&data]() noexcept { report(data); };\n    std::barrier sync(workers, done);\n    std::vector<std::jthread> ts;\n    for (int w = 0; w < workers; ++w)\n        ts.emplace_back([&, w] {\n            for (int s = 0; s < steps; ++s) {\n                step(data, w, s);  // свой кусок\n                sync.arrive_and_wait();\n            }\n        });\n}\n"}, {"id": "mt-t28", "lesson": "mt-monitor", "title": "Synchronized::with_lock", "task": "Допиши `with_lock`: лямбда должна выполняться над `value_` под замком. Сейчас TSan видит гонку на `unordered_map`.", "prefix": "#include <iostream>\n#include <mutex>\n#include <string>\n#include <thread>\n#include <unordered_map>\n#include <vector>\n", "code": "template <class T>\nclass Synchronized {\npublic:\n    template <class F>\n    auto with_lock(F f) {\n        // TODO: f должна выполняться под замком\n        return f(value_);\n    }\n\nprivate:\n    std::mutex m_;\n    T value_{};\n};\n", "check": "int main() {\n    Synchronized<std::unordered_map<std::string, int>> stats;\n    {\n        std::vector<std::jthread> ts;\n        for (int i = 0; i < 4; ++i)\n            ts.emplace_back([&] {\n                for (int j = 0; j < 1000; ++j)\n                    stats.with_lock([](auto& m) { ++m[\"get\"]; });\n            });\n    }\n    int n = stats.with_lock([](auto& m) { return m[\"get\"]; });\n    if (n != 4000) {\n        std::cout << \"FAIL: n = \" << n << '\\n';\n        return 1;\n    }\n    std::cout << n << '\\n';\n}\n", "mode": "tsan", "expect": "4000", "hint": "`std::lock_guard lk(m_);` перед `return f(value_);` - замок живёт до конца функции.", "solution": "template <class T>\nclass Synchronized {\npublic:\n    template <class F>\n    auto with_lock(F f) {\n        std::lock_guard lk(m_);  // f выполняется под замком\n        return f(value_);\n    }\n\nprivate:\n    std::mutex m_;\n    T value_{};\n};\n"}, {"id": "mt-t29", "lesson": "mt-monitor", "title": "withdraw ждёт денег", "task": "Сделай `Account` монитором с ожиданием: `withdraw` ждёт, пока на счёте не станет достаточно денег, баланс никогда не уходит в минус. Не забудь разбудить ждущих в `deposit`.", "prefix": "#include <atomic>\n#include <chrono>\n#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nusing namespace std::chrono_literals;\n", "code": "class Account {\npublic:\n    void deposit(long sum) {\n        {\n            std::lock_guard lk(m_);\n            balance_ += sum;\n        }\n        // TODO: разбудить ждущих\n    }\n    void withdraw(long sum) {  // ждёт, пока хватит денег\n        std::unique_lock lk(m_);\n        // TODO: ждать, пока balance_ >= sum\n        balance_ -= sum;\n    }\n    long balance() const {\n        std::lock_guard lk(m_);\n        return balance_;\n    }\n\nprivate:\n    mutable std::mutex m_;\n    std::condition_variable funds_;\n    long balance_ = 0;  // guarded by m_; должен быть >= 0\n};\n", "check": "int main() {\n    Account acc;\n    std::atomic<bool> a_done{false}, b_done{false};\n    std::thread a([&] { acc.withdraw(70); a_done = true; });\n    std::thread b([&] { acc.withdraw(30); b_done = true; });\n    // a и b приходят первыми, когда денег ещё нет\n    std::this_thread::sleep_for(20ms);\n    bool early = a_done || b_done;\n    for (int i = 0; i < 6; ++i) acc.deposit(10);\n    // 60: на b хватает, на a - нет\n    std::this_thread::sleep_for(20ms);\n    bool a_mid = a_done;\n    for (int i = 0; i < 4; ++i) acc.deposit(10);\n    a.join();\n    b.join();\n    if (early || a_mid) {\n        std::cout << \"FAIL: withdraw не дождался денег\\n\";\n        return 1;\n    }\n    if (acc.balance() != 0) {\n        std::cout << \"FAIL: balance = \" << acc.balance() << '\\n';\n        return 1;\n    }\n    std::cout << acc.balance() << '\\n';\n}\n", "mode": "tsan", "expect": "0", "hint": "`funds_.wait(lk, [&] { return balance_ >= sum; });`. В `deposit` - `notify_all`: ждущие ждут разных сумм.", "solution": "class Account {\npublic:\n    void deposit(long sum) {\n        {\n            std::lock_guard lk(m_);\n            balance_ += sum;\n        }\n        funds_.notify_all();  // ждут разных сумм\n    }\n    void withdraw(long sum) {  // ждёт, пока хватит денег\n        std::unique_lock lk(m_);\n        funds_.wait(lk, [&] { return balance_ >= sum; });\n        balance_ -= sum;\n    }\n    long balance() const {\n        std::lock_guard lk(m_);\n        return balance_;\n    }\n\nprivate:\n    mutable std::mutex m_;\n    std::condition_variable funds_;\n    long balance_ = 0;  // guarded by m_; должен быть >= 0\n};\n"}, {"id": "mt-t30", "lesson": "mt-channel", "title": "Channel: recv и close", "task": "`recv` должен ждать данных и возвращать `nullopt` только на закрытом и пустом канале. `close` должен будить всех ждущих. Сейчас потребители уходят сразу.", "prefix": "#include <atomic>\n#include <chrono>\n#include <condition_variable>\n#include <cstddef>\n#include <deque>\n#include <iostream>\n#include <mutex>\n#include <optional>\n#include <thread>\n#include <utility>\n", "code": "template <class T>\nclass Channel {\npublic:\n    explicit Channel(std::size_t cap) : cap_(cap) {}\n    bool send(T v) {\n        std::unique_lock lk(m_);\n        not_full_.wait(lk, [&] {\n            return closed_ || buf_.size() < cap_;\n        });\n        if (closed_) return false;\n        buf_.push_back(std::move(v));\n        lk.unlock();\n        not_empty_.notify_one();\n        return true;\n    }\n    std::optional<T> recv() {\n        std::unique_lock lk(m_);\n        // TODO: ждать данных или закрытия\n        if (buf_.empty()) return std::nullopt;\n        T v = std::move(buf_.front());\n        buf_.pop_front();\n        lk.unlock();\n        not_full_.notify_one();\n        return v;\n    }\n    void close() {\n        {\n            std::lock_guard lk(m_);\n            closed_ = true;\n        }\n        // TODO: кого разбудить?\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable not_full_, not_empty_;\n    std::deque<T> buf_;\n    const std::size_t cap_;\n    bool closed_ = false;\n};\n", "check": "int main() {\n    Channel<int> ch(100);  // вмещает всё: send не ждёт\n    std::atomic<long> sum{0};\n    auto consume = [&] {\n        while (auto v = ch.recv()) sum += *v;\n    };\n    std::thread c1(consume), c2(consume);\n    // оба потребителя успеют прийти к пустому каналу\n    std::this_thread::sleep_for(std::chrono::milliseconds(10));\n    for (int i = 1; i <= 100; ++i) ch.send(i);\n    ch.close();  // будит обоих\n    c1.join();\n    c2.join();\n    bool sent = ch.send(1);\n    if (sum != 5050 || sent) {\n        std::cout << \"FAIL: sum \" << sum\n                  << \", send after close \" << sent << '\\n';\n        return 1;\n    }\n    std::cout << \"sum \" << sum << '\\n';\n    std::cout << \"send after close: \" << sent << '\\n';\n}\n", "mode": "tsan", "expect": "sum 5050\nsend after close: 0", "hint": "Предикат `closed_ || !buf_.empty()` для `not_empty_.wait`. В `close` - `notify_all` на обе cv.", "solution": "template <class T>\nclass Channel {\npublic:\n    explicit Channel(std::size_t cap) : cap_(cap) {}\n    bool send(T v) {\n        std::unique_lock lk(m_);\n        not_full_.wait(lk, [&] {\n            return closed_ || buf_.size() < cap_;\n        });\n        if (closed_) return false;\n        buf_.push_back(std::move(v));\n        lk.unlock();\n        not_empty_.notify_one();\n        return true;\n    }\n    std::optional<T> recv() {\n        std::unique_lock lk(m_);\n        not_empty_.wait(lk, [&] {\n            return closed_ || !buf_.empty();\n        });\n        if (buf_.empty()) return std::nullopt;\n        T v = std::move(buf_.front());\n        buf_.pop_front();\n        lk.unlock();\n        not_full_.notify_one();\n        return v;\n    }\n    void close() {\n        {\n            std::lock_guard lk(m_);\n            closed_ = true;\n        }\n        not_full_.notify_all();\n        not_empty_.notify_all();\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable not_full_, not_empty_;\n    std::deque<T> buf_;\n    const std::size_t cap_;\n    bool closed_ = false;\n};\n"}, {"id": "mt-t31", "lesson": "mt-channel", "title": "Конвейер из двух стадий", "task": "`Channel` готов (выше). Допиши стадию `square_stage`: читает `in` до закрытия, шлёт квадраты в `out` и закрывает `out`, когда вход кончился.", "prefix": "#include <atomic>\n#include <chrono>\n#include <condition_variable>\n#include <cstddef>\n#include <deque>\n#include <iostream>\n#include <mutex>\n#include <optional>\n#include <thread>\n#include <utility>\n\ntemplate <class T>\nclass Channel {\npublic:\n    explicit Channel(std::size_t cap) : cap_(cap) {}\n    bool send(T v) {\n        std::unique_lock lk(m_);\n        not_full_.wait(lk, [&] {\n            return closed_ || buf_.size() < cap_;\n        });\n        if (closed_) return false;\n        buf_.push_back(std::move(v));\n        lk.unlock();\n        not_empty_.notify_one();\n        return true;\n    }\n    std::optional<T> recv() {\n        std::unique_lock lk(m_);\n        not_empty_.wait(lk, [&] {\n            return closed_ || !buf_.empty();\n        });\n        if (buf_.empty()) return std::nullopt;\n        T v = std::move(buf_.front());\n        buf_.pop_front();\n        lk.unlock();\n        not_full_.notify_one();\n        return v;\n    }\n    void close() {\n        {\n            std::lock_guard lk(m_);\n            closed_ = true;\n        }\n        not_full_.notify_all();\n        not_empty_.notify_all();\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable not_full_, not_empty_;\n    std::deque<T> buf_;\n    const std::size_t cap_;\n    bool closed_ = false;\n};\n", "code": "// Стадия: квадраты чисел из in -> out\nvoid square_stage(Channel<int>& in, Channel<int>& out) {\n    // TODO: читать in до закрытия, слать квадраты в out\n    out.close();\n}\n", "check": "int main() {\n    Channel<int> nums(16), squares(4);  // nums вмещает всё\n    std::jthread gen([&] {\n        for (int i = 1; i <= 10; ++i) nums.send(i);\n        nums.close();\n    });\n    std::jthread stage([&] { square_stage(nums, squares); });\n    long sum = 0;\n    while (auto v = squares.recv()) sum += *v;\n    if (sum != 385) {\n        std::cout << \"FAIL: sum \" << sum << \", ждали 385\\n\";\n        return 1;\n    }\n    std::cout << \"sum \" << sum << '\\n';\n}\n", "mode": "tsan", "expect": "sum 385", "hint": "`while (auto v = in.recv()) out.send(*v * *v);`, затем `out.close();`.", "solution": "// Стадия: квадраты чисел из in -> out\nvoid square_stage(Channel<int>& in, Channel<int>& out) {\n    while (auto v = in.recv()) out.send(*v * *v);\n    out.close();  // вход кончился - закрываем свой выход\n}\n"}, {"id": "mt-t32", "lesson": "mt-primitives", "title": "atomic_ref вместо смены типа", "task": "`count_request` зовут 4 потока сразу - гонка на поле `requests` чужой структуры. Тип поля менять нельзя. Сделай инкремент атомарным через `std::atomic_ref`.", "prefix": "#include <atomic>\n#include <iostream>\n#include <thread>\n#include <vector>\n\nstruct Stats {     // чужая структура: менять тип поля нельзя\n    long requests = 0;\n};\n", "code": "// Зовут из многих потоков сразу\nvoid count_request(Stats& st) {\n    ++st.requests;  // TODO: атомарно, без смены типа\n}\n", "check": "int main() {\n    Stats st;\n    {\n        std::vector<std::jthread> ts;\n        for (int i = 0; i < 4; ++i)\n            ts.emplace_back([&st] {\n                for (int j = 0; j < 1000; ++j) count_request(st);\n            });\n    }   // все потоки присоединены\n    if (st.requests != 4000) {\n        std::cout << \"FAIL: requests = \" << st.requests << '\\n';\n        return 1;\n    }\n    std::cout << st.requests << '\\n';\n}\n", "mode": "tsan", "expect": "4000", "hint": "`std::atomic_ref<long> r(st.requests);`, затем `r.fetch_add(1, std::memory_order_relaxed)`. Читать напрямую можно после join.", "solution": "// Зовут из многих потоков сразу\nvoid count_request(Stats& st) {\n    std::atomic_ref<long> r(st.requests);\n    r.fetch_add(1, std::memory_order_relaxed);\n}\n"}, {"id": "mt-t33", "lesson": "mt-primitives", "title": "Один результат - много ждущих", "task": "Три потока ждут одно значение конфига. Сейчас все зовут `get()` у одного `std::future` - TSan видит гонку, а второй `get()` ещё и бросает. Почини `three_readers`.", "prefix": "#include <atomic>\n#include <future>\n#include <iostream>\n#include <thread>\n#include <vector>\n\nconst auto main_id = std::this_thread::get_id();\nstd::atomic<int> total{0}, uses_off_main{0};\n\nvoid use(int v) {  // каждый поток передаёт сюда значение\n    if (std::this_thread::get_id() != main_id) ++uses_off_main;\n    total += v;\n}\n", "code": "// Три потока ждут одно значение config\n// и передают его в use\nvoid three_readers(std::promise<int>& config) {\n    std::future<int> ready = config.get_future();  // TODO\n    std::vector<std::jthread> ts;\n    for (int i = 0; i < 3; ++i)\n        ts.emplace_back([&ready] {\n            use(ready.get());  // ждут одно значение\n        });\n    config.set_value(14);\n}\n", "check": "int main() {\n    std::promise<int> config;\n    three_readers(config);\n    if (uses_off_main != 3) {\n        std::cout << \"FAIL: use должен вызваться \"\n                     \"в каждом из 3 потоков\\n\";\n        return 1;\n    }\n    if (total != 42) {\n        std::cout << \"FAIL: total = \" << total << '\\n';\n        return 1;\n    }\n    std::cout << total << '\\n';\n}\n", "mode": "tsan", "expect": "42", "hint": "`std::shared_future<int> ready = config.get_future().share();` и захват копии `[ready]`.", "solution": "// Три потока ждут одно значение config\n// и передают его в use\nvoid three_readers(std::promise<int>& config) {\n    std::shared_future<int> ready =\n        config.get_future().share();\n    std::vector<std::jthread> ts;\n    for (int i = 0; i < 3; ++i)\n        ts.emplace_back([ready] {\n            use(ready.get());  // ждут одно значение\n        });\n    config.set_value(14);\n}\n"}]}, {"id": "tests", "title": "Тесты", "lessons": [{"id": "tests-anatomy", "title": "Анатомия gtest-файла и сборка", "blocks": [{"type": "p", "text": "GoogleTest (gtest) — стандарт де-факто для юнит-тестов на C++. GoogleMock (gmock) — моки и матчеры, живёт в том же репозитории. Тестовый бинарник — обычная программа: макросы `TEST` регистрируют тесты в глобальном реестре, `main` вызывает `RUN_ALL_TESTS()`."}, {"type": "p", "text": "`TEST(Suite, Name)` разворачивается в класс `Suite_Name_Test` (наследник `::testing::Test`), тело теста — его метод. Поэтому имена — идентификаторы без кавычек. Тесты независимы: провал одного не останавливает остальные."}, {"type": "p", "text": "Код под тестом и тестовый файл. В проекте это `login.h` и `login_test.cpp`, здесь они склеены в один файл, чтобы запустить. `main` в файле нет: его даёт `gtest_main`, а на этой странице он дописывается сам."}, {"type": "code", "code": "// ---- login.h — код, который тестируем ----\n#include <string_view>\n\ninline bool IsValidLogin(std::string_view s) {\n  if (s.empty() || s.size() > 30) return false;\n  for (char c : s) {\n    const bool ok = (c >= 'a' && c <= 'z') ||\n                    (c >= '0' && c <= '9') || c == '-' || c == '.';\n    if (!ok) return false;\n  }\n  return true;\n}\n\n// ---- login_test.cpp ----\n// в проекте здесь #include \"login.h\"\n#include <string>\n\n#include <gtest/gtest.h>\n\n// TEST(ИмяSuite, ИмяТеста) — без кавычек, без подчёркиваний\nTEST(IsValidLoginTest, AcceptsLowercaseDigitsAndDash) {\n  // Arrange\n  const std::string login = \"alex-42\";\n  // Act\n  const bool ok = IsValidLogin(login);\n  // Assert\n  EXPECT_TRUE(ok);\n}\n\nTEST(IsValidLoginTest, RejectsEmpty) {\n  EXPECT_FALSE(IsValidLogin(\"\"));\n}\n\nTEST(IsValidLoginTest, RejectsUppercase) {\n  EXPECT_FALSE(IsValidLogin(\"Alex\"));\n}\n\nTEST(IsValidLoginTest, RejectsLongerThan30) {\n  EXPECT_TRUE(IsValidLogin(std::string(30, 'a')));\n  EXPECT_FALSE(IsValidLogin(std::string(31, 'a')));\n}\n", "mode": "gtest"}, {"type": "p", "text": "Тело теста — Arrange-Act-Assert: подготовили данные, сделали одно действие, проверили результат. Комментарии `// Arrange` не обязательны, хватит пустых строк между блоками."}, {"type": "list", "items": ["Suite: `ИмяКлассаTest` — `SessionStoreTest`. Для фикстуры имя suite = имя класса фикстуры.", "Тест: поведение в CamelCase, читается как спецификация — `ReturnsNulloptForExpiredToken`, `RejectsEmptyLogin`. Не `Test1`.", "Без `_` в именах suite и теста: gtest склеивает их через `_` в имя класса, возможны коллизии. Плюс префикс `DISABLED_` имеет особый смысл.", "Файл: `session_store_test.cpp` рядом с `session_store.cpp` или в каталоге `test/`."]}, {"type": "p", "text": "Свой `main` писать не нужно: линкуйся с `gtest_main` или `gmock_main`, там стандартный main. Свой нужен, только если до тестов надо что-то сделать:"}, {"type": "code", "code": "// свой main нужен редко: только если надо что-то\n// сделать до тестов (флаги, глобальное окружение)\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nTEST(SmokeTest, Works) { SUCCEED(); }\n\nint main(int argc, char** argv) {\n  // для чистого gtest: ::testing::InitGoogleTest(&argc, argv);\n  ::testing::InitGoogleMock(&argc, argv);  // gmock + gtest\n  return RUN_ALL_TESTS();\n}\n", "mode": "gtest"}, {"type": "p", "text": "Минимальный CMake. FetchContent скачивает googletest на этапе configure. `gtest_discover_tests` регистрирует каждый TEST как отдельный тест ctest."}, {"type": "code", "code": "cmake_minimum_required(VERSION 3.14)\nproject(auth CXX)\n\nset(CMAKE_CXX_STANDARD 20)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)\n\ninclude(FetchContent)\nFetchContent_Declare(\n  googletest\n  URL https://github.com/google/googletest/archive/refs/tags/v1.17.0.zip\n)\nFetchContent_MakeAvailable(googletest)\n\nadd_library(auth src/session_store.cpp)\ntarget_include_directories(auth PUBLIC include)\n\nenable_testing()\n\nadd_executable(auth_test test/session_store_test.cpp)\n# gmock_main = gtest + gmock + готовый main\ntarget_link_libraries(auth_test PRIVATE auth GTest::gmock_main)\n\ninclude(GoogleTest)\ngtest_discover_tests(auth_test)", "run": false}, {"type": "code", "code": "cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug\ncmake --build build -j\nctest --test-dir build --output-on-failure\n\n# бинарник можно звать напрямую, с флагами gtest:\n./build/auth_test --gtest_list_tests\n./build/auth_test --gtest_filter='SessionStoreTest.*-*Purge*'\n./build/auth_test --gtest_repeat=100 --gtest_shuffle\n./build/auth_test --gtest_break_on_failure   # стоп в отладчике", "run": false}, {"type": "list", "items": ["`--gtest_filter=A.*-*Slow*`: до `-` — что запускать (паттерны через `:`), после `-` — что исключить. `*` и `?` — wildcard.", "`--gtest_repeat=N` — прогнать N раз: ловит flaky-тесты.", "`--gtest_shuffle` — случайный порядок: ловит зависимость тестов друг от друга.", "Префикс `DISABLED_` в имени теста: компилируется, но не запускается; gtest пишет `YOU HAVE 1 DISABLED TEST`.", "`GTEST_SKIP() << \"причина\";` — пропустить тест по условию в рантайме (нет переменной окружения, нет БД)."]}, {"type": "warn", "text": "`GTest::gtest_main` и `GTest::gmock_main` — алиасы, которые создаёт сам googletest (через FetchContent или find_package). Если в тестах есть моки или `EXPECT_THAT` — нужен `gmock_main`, он уже включает gtest. Линковать оба не нужно."}, {"type": "tip", "text": "Вслух: «Сначала перечислю кейсы: обычный путь, границы, ошибки. Каждый кейс — отдельный TEST с именем-спецификацией, внутри Arrange-Act-Assert»."}]}, {"id": "tests-assert", "title": "Проверки: EXPECT, ASSERT и компания", "blocks": [{"type": "p", "text": "У каждой проверки две версии. `EXPECT_*` — нефатальная: фиксирует провал и идёт дальше. `ASSERT_*` — фатальная: фиксирует провал и делает `return;` из ТЕКУЩЕЙ функции. Исключений не бросает."}, {"type": "p", "text": "Правило: по умолчанию `EXPECT_`, чтобы за один прогон увидеть все расхождения. `ASSERT_` — когда продолжать бессмысленно или опасно: пустой optional, nullptr, не тот размер вектора, а дальше индексация."}, {"type": "code", "code": "#include <vector>\n\n#include <gtest/gtest.h>\n\nstd::vector<int> LoadIds() { return {1, 2, 3}; }\n\nTEST(LoadIdsTest, ReturnsSortedIds) {\n  const std::vector<int> ids = LoadIds();\n  // ASSERT: дальше ids[0] — на пустом векторе это UB\n  ASSERT_EQ(ids.size(), 3u);\n  // EXPECT: хотим увидеть ВСЕ расхождения за один прогон\n  EXPECT_EQ(ids[0], 1);\n  EXPECT_EQ(ids[1], 2);\n  EXPECT_EQ(ids[2], 3);\n}", "mode": "gtest"}, {"type": "code", "code": "#include <string>\n\n#include <gtest/gtest.h>\n\nTEST(CompareTest, Basics) {\n  const int attempts = 3;\n  EXPECT_EQ(attempts, 3);   // ==\n  EXPECT_NE(attempts, 0);   // !=\n  EXPECT_LT(attempts, 5);   // <\n  EXPECT_LE(attempts, 3);   // <=\n  EXPECT_GT(attempts, 0);   // >\n  EXPECT_GE(attempts, 3);   // >=\n  EXPECT_TRUE(attempts % 3 == 0);\n  EXPECT_FALSE(attempts > 10);\n\n  // size() — size_t: сравнивай с 2u, иначе warning\n  // signed/unsigned (-Wsign-compare) и шум в CI\n  const std::string s = \"ok\";\n  EXPECT_EQ(s.size(), 2u);\n\n  int* p = nullptr;\n  EXPECT_EQ(p, nullptr);\n}", "mode": "gtest"}, {"type": "p", "text": "Строки — главная ловушка. `EXPECT_EQ` вызывает `operator==`. У `std::string` это сравнение содержимого. У двух `const char*` или `char[]` — сравнение указателей."}, {"type": "code", "code": "#include <cstring>\n#include <string>\n\n#include <gtest/gtest.h>\n\nTEST(StringsTest, StdStringVsCString) {\n  const std::string s = \"alex\";\n  char buf[16];\n  std::strcpy(buf, \"alex\");\n  const char* login = \"alex\";\n\n  EXPECT_EQ(s, \"alex\");        // ok: operator== у std::string\n  EXPECT_EQ(s, login);         // ok: то же самое\n  EXPECT_STREQ(buf, login);    // ok: сравнивает содержимое\n  EXPECT_STREQ(s.c_str(), login);  // STREQ хочет const char*\n  EXPECT_STRNE(buf, \"bob\");\n  EXPECT_STRCASEEQ(\"ALEX\", login);  // без учёта регистра\n  // EXPECT_EQ(buf, login);    // FAIL: сравнит АДРЕСА\n  // EXPECT_STREQ(s, login);   // не скомпилируется\n}", "mode": "gtest"}, {"type": "warn", "text": "`EXPECT_EQ(buf, login)` с `char buf[]` падает, хотя строки одинаковые: gtest печатает два адреса. Два одинаковых литерала через `EXPECT_EQ` могут случайно пройти — компилятор склеил их в один адрес. Для C-строк только `EXPECT_STREQ`. А в `EXPECT_STREQ` нельзя передать `std::string` — не скомпилируется, нужен `.c_str()`."}, {"type": "p", "text": "Плавающая точка. `EXPECT_EQ` на double почти всегда ошибка. `EXPECT_DOUBLE_EQ` и `EXPECT_FLOAT_EQ` — «почти равно» с точностью до 4 ULP (единиц в последнем разряде). `EXPECT_NEAR(a, b, abs_error)` — явный абсолютный допуск."}, {"type": "code", "code": "#include <gtest/gtest.h>\n\nTEST(FloatTest, UseUlpOrTolerance) {\n  const double sum = 0.1 + 0.2;\n  // EXPECT_EQ(sum, 0.3);          // FAIL: 0.30000000000000004\n  EXPECT_DOUBLE_EQ(sum, 0.3);      // ok: разница <= 4 ULP\n  EXPECT_FLOAT_EQ(0.1f + 0.2f, 0.3f);\n  EXPECT_NEAR(sum, 0.3, 1e-9);     // явный абсолютный допуск\n\n  // возле нуля ULP-сравнение бесполезно: 1e-20 и 0.0\n  // далеки в ULP, тут только NEAR\n  EXPECT_NEAR(1e-20, 0.0, 1e-12);\n}", "mode": "gtest"}, {"type": "warn", "text": "ULP-сравнение относительное. Возле нуля оно бесполезно: `EXPECT_DOUBLE_EQ(1e-20, 0.0)` падает, между этими числами огромное количество ULP. Если ожидаемое значение 0 или допуск задан бизнесом (копейки, миллисекунды) — `EXPECT_NEAR`."}, {"type": "p", "text": "Исключения:"}, {"type": "code", "code": "#include <stdexcept>\n#include <string>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nint ParseTtl(const std::string& s) {\n  const int v = std::stoi(s);  // \"abc\" -> std::invalid_argument\n  if (v < 0) throw std::out_of_range(\"ttl is negative\");\n  return v;\n}\n\nTEST(ParseTtlTest, Exceptions) {\n  EXPECT_THROW(ParseTtl(\"-5\"), std::out_of_range);\n  // базовый класс тоже подходит: out_of_range — logic_error\n  EXPECT_THROW(ParseTtl(\"-5\"), std::logic_error);\n  EXPECT_ANY_THROW(ParseTtl(\"abc\"));\n  EXPECT_NO_THROW(ParseTtl(\"60\"));\n}\n\nTEST(ParseTtlTest, ExceptionMessage) {\n  // gmock-матчер: и тип, и текст what()\n  EXPECT_THAT([] { ParseTtl(\"-5\"); },\n              ::testing::ThrowsMessage<std::out_of_range>(\n                  ::testing::HasSubstr(\"negative\")));\n}", "mode": "gtest"}, {"type": "list", "items": ["`EXPECT_THROW(stmt, Type)` проходит, если брошен `Type` или его наследник. Брошено другое — провал «it throws a different type». Не брошено ничего — провал.", "`EXPECT_ANY_THROW(stmt)` — брошено что угодно. `EXPECT_NO_THROW(stmt)` — ничего не брошено.", "Текст исключения: матчер `ThrowsMessage<Type>(HasSubstr(...))` из gmock или `try/catch` в тесте с проверкой `e.what()`."]}, {"type": "p", "text": "К любой проверке можно дописать сообщение через `<<`. Правая часть вычисляется только при провале, так что дорогой контекст не замедляет зелёные тесты. В циклах и хелперах — `SCOPED_TRACE`: добавляет строку к каждому провалу в своей области видимости."}, {"type": "code", "code": "#include <string>\n#include <vector>\n\n#include <gtest/gtest.h>\n\nbool IsValidLogin(const std::string& s) { return !s.empty(); }\n\nTEST(MessagesTest, StreamContext) {\n  const std::vector<std::string> logins = {\"alex\", \"bob\"};\n  for (const auto& login : logins) {\n    // << печатается только при провале\n    EXPECT_TRUE(IsValidLogin(login)) << \"login=\" << login;\n  }\n}\n\n// хелпер: SCOPED_TRACE добавит \"откуда звали\" в сообщение\nvoid ExpectValid(const std::string& login) {\n  EXPECT_TRUE(IsValidLogin(login));\n}\n\nTEST(MessagesTest, ScopedTrace) {\n  for (const std::string login : {\"alex\", \"bob\"}) {\n    SCOPED_TRACE(\"login=\" + login);\n    ExpectValid(login);\n  }\n}", "mode": "gtest"}, {"type": "p", "text": "Хелперы с ASSERT:"}, {"type": "code", "code": "#include <string>\n\n#include <gtest/gtest.h>\n\nstruct User {\n  long id;\n  std::string login;\n};\n\n// ASSERT_* внутри хелпера делает `return;` ИЗ ХЕЛПЕРА,\n// поэтому хелпер обязан возвращать void\nvoid CheckUser(const User& u) {\n  ASSERT_FALSE(u.login.empty());\n  EXPECT_GT(u.id, 0);\n}\n\nTEST(UserTest, LoadedUserIsValid) {\n  const User u{42, \"alex\"};\n  // без обёртки тест продолжился бы после фатала в хелпере\n  ASSERT_NO_FATAL_FAILURE(CheckUser(u));\n  EXPECT_EQ(u.login, \"alex\");\n}\n\nTEST(UserTest, AlternativeWithHasFatalFailure) {\n  const User u{42, \"alex\"};\n  CheckUser(u);\n  if (HasFatalFailure()) return;\n  EXPECT_EQ(u.id, 42);\n}", "mode": "gtest"}, {"type": "warn", "text": "ASSERT в хелпере выходит только из хелпера — тест продолжается дальше. Чтобы остановить тест, оберни вызов в `ASSERT_NO_FATAL_FAILURE(...)` или проверь `HasFatalFailure()`. ASSERT в функции, которая возвращает не void, не компилируется: макрос делает `return;`. Если хелпер должен вернуть значение — верни его через out-параметр или используй EXPECT."}, {"type": "p", "text": "Свои типы в `EXPECT_EQ`: нужен `operator==`, иначе ошибка компиляции. Для читаемого вывода при провале — `operator<<` или функция `PrintTo(const T&, std::ostream*)`. Без них gtest напечатает `32-byte object <61-62 63-00 ...>`."}, {"type": "code", "code": "#include <ostream>\n#include <string>\n\n#include <gtest/gtest.h>\n\nstruct Token {\n  std::string value;\n  long uid = 0;\n  // C++20: сгенерированный оператор сравнения\n  bool operator==(const Token&) const = default;\n};\n\n// без этого gtest при провале напечатает байты объекта\nstd::ostream& operator<<(std::ostream& os, const Token& t) {\n  return os << \"Token{\" << t.value << \", uid=\" << t.uid << \"}\";\n}\n\nTEST(TokenTest, Equality) {\n  const Token a{\"abc\", 1};\n  const Token b{\"abc\", 1};\n  EXPECT_EQ(a, b);  // нужен operator==, иначе не скомпилируется\n}", "mode": "gtest"}, {"type": "p", "text": "Death-тесты проверяют, что код завершает процесс (abort, exit, падение assert). gtest запускает выражение в дочернем процессе и сверяет stderr с регэкспом. Нужны редко: для проверки инвариантов."}, {"type": "code", "code": "#include <cstdio>\n#include <cstdlib>\n\n#include <gtest/gtest.h>\n\nvoid MustBePositive(int x) {\n  if (x <= 0) {\n    std::fprintf(stderr, \"invariant violated: x=%d\\n\", x);\n    std::abort();\n  }\n}\n\n// суффикс DeathTest: gtest запустит такие suite первыми\nTEST(InvariantDeathTest, AbortsOnZero) {\n  // второй аргумент — регэксп по stderr упавшего процесса\n  EXPECT_DEATH(MustBePositive(0), \"invariant violated\");\n}\n\nTEST(InvariantDeathTest, ExitCode) {\n  EXPECT_EXIT(std::exit(3), ::testing::ExitedWithCode(3), \"\");\n}", "mode": "gtest"}, {"type": "tip", "text": "Вслух: «Здесь ASSERT, потому что дальше разыменую optional. Остальное — EXPECT, чтобы увидеть все расхождения за один прогон. Double сравниваю через NEAR с допуском»."}]}, {"id": "tests-fixtures", "title": "Фикстуры: TEST_F, SetUp, SetUpTestSuite", "blocks": [{"type": "p", "text": "Если несколько тестов готовят одно и то же — вынеси подготовку в фикстуру. Это класс-наследник `::testing::Test`, тесты объявляются через `TEST_F(ИмяФикстуры, Тест)`. Тест — наследник фикстуры, поэтому поля делают `protected`, и в теле теста они доступны напрямую."}, {"type": "p", "text": "Код под тестом и тесты. В проекте это `user_repo_mem.h` и отдельный тестовый файл:"}, {"type": "code", "code": "// ---- user_repo_mem.h — простой in-memory репозиторий ----\n#include <cstdint>\n#include <map>\n#include <optional>\n#include <string>\n\nstruct User {\n  std::int64_t id = 0;\n  std::string login;\n};\n\nclass InMemoryUserRepo {\n public:\n  std::int64_t Add(const std::string& login) {\n    const std::int64_t id = next_id_++;\n    users_[id] = User{id, login};\n    return id;\n  }\n  std::optional<User> Find(std::int64_t id) const {\n    const auto it = users_.find(id);\n    if (it == users_.end()) return std::nullopt;\n    return it->second;\n  }\n  bool Remove(std::int64_t id) { return users_.erase(id) > 0; }\n  std::size_t Size() const { return users_.size(); }\n\n private:\n  std::int64_t next_id_ = 1;\n  std::map<std::int64_t, User> users_;\n};\n\n// ---- user_repo_mem_test.cpp ----\n#include <gtest/gtest.h>\n\nclass UserRepoTest : public ::testing::Test {\n protected:\n  // вызывается перед КАЖДЫМ тестом, на НОВОМ объекте\n  void SetUp() override {\n    alex_id_ = repo_.Add(\"alex\");\n    bob_id_ = repo_.Add(\"bob\");\n  }\n  // void TearDown() override {}  // тут нечего чистить\n\n  InMemoryUserRepo repo_;\n  std::int64_t alex_id_ = 0;\n  std::int64_t bob_id_ = 0;\n};\n\nTEST_F(UserRepoTest, FindsAddedUser) {\n  const auto user = repo_.Find(alex_id_);\n  ASSERT_TRUE(user.has_value());\n  EXPECT_EQ(user->login, \"alex\");\n}\n\nTEST_F(UserRepoTest, RemoveDeletesOnlyThatUser) {\n  EXPECT_TRUE(repo_.Remove(alex_id_));\n  EXPECT_FALSE(repo_.Find(alex_id_).has_value());\n  EXPECT_TRUE(repo_.Find(bob_id_).has_value());\n}\n\n// изменения из прошлого теста сюда не доходят:\n// у каждого теста свой экземпляр UserRepoTest\nTEST_F(UserRepoTest, StartsWithTwoUsers) {\n  EXPECT_EQ(repo_.Size(), 2u);\n}\n", "mode": "gtest"}, {"type": "p", "text": "Для каждого TEST_F gtest создаёт НОВЫЙ объект фикстуры. Порядок вызовов:"}, {"type": "code", "code": "#include <cstdio>\n\n#include <gtest/gtest.h>\n\nclass LifecycleTest : public ::testing::Test {\n protected:\n  static void SetUpTestSuite() { std::puts(\"SetUpTestSuite\"); }\n  static void TearDownTestSuite() {\n    std::puts(\"TearDownTestSuite\");\n  }\n  LifecycleTest() { std::puts(\"  ctor\"); }\n  ~LifecycleTest() override { std::puts(\"  dtor\"); }\n  void SetUp() override { std::puts(\"  SetUp\"); }\n  void TearDown() override { std::puts(\"  TearDown\"); }\n};\n\nTEST_F(LifecycleTest, A) { std::puts(\"    body A\"); }\nTEST_F(LifecycleTest, B) { std::puts(\"    body B\"); }\n// Вывод (без строк gtest):\n// SetUpTestSuite\n//   ctor\n//   SetUp\n//     body A\n//   TearDown\n//   dtor\n//   ctor\n//   SetUp\n//     body B\n//   TearDown\n//   dtor\n// TearDownTestSuite", "mode": "gtest"}, {"type": "list", "items": ["Конструктор — простая инициализация полей. Можно делать поля `const` и ссылками.", "`SetUp()` — если при подготовке нужны ASSERT-проверки или вызов виртуальных функций (в конструкторе виртуальный вызов не дойдёт до наследника).", "Деструктор — освобождение ресурсов (RAII). `TearDown()` — если очистка может бросить исключение или в ней нужны проверки.", "Если ASSERT упал в `SetUp()`, тело теста не выполняется, но `TearDown()` и деструктор отработают.", "Пиши `override`. Опечатка вроде `void setUp()` без override молча станет обычным методом и не вызовется. Самую частую, `Setup()`, gtest ловит сам: ошибка компиляции с подсказкой `Setup_should_be_spelled_SetUp`."]}, {"type": "p", "text": "Дорогой ресурс на весь suite (соединение с БД, загрузка большого файла) — в статических `SetUpTestSuite()`/`TearDownTestSuite()`. Они вызываются один раз до первого и после последнего теста suite."}, {"type": "code", "code": "#include <memory>\n#include <string>\n#include <vector>\n\n#include <gtest/gtest.h>\n\n// дорогой ресурс: условно соединение с БД / загрузка словаря\nclass Dictionary {\n public:\n  Dictionary() { words_ = {\"admin\", \"root\", \"support\"}; }\n  bool IsReserved(const std::string& w) const {\n    for (const auto& r : words_) if (r == w) return true;\n    return false;\n  }\n private:\n  std::vector<std::string> words_;\n};\n\nclass ReservedLoginTest : public ::testing::Test {\n protected:\n  // один раз на весь suite. Методы СТАТИЧЕСКИЕ\n  static void SetUpTestSuite() {\n    dict_ = std::make_unique<Dictionary>();\n  }\n  static void TearDownTestSuite() { dict_.reset(); }\n\n  // C++17 inline static: не нужно определение в .cpp\n  static inline std::unique_ptr<Dictionary> dict_;\n};\n\nTEST_F(ReservedLoginTest, AdminIsReserved) {\n  EXPECT_TRUE(dict_->IsReserved(\"admin\"));\n}\n\nTEST_F(ReservedLoginTest, RegularLoginIsFree) {\n  EXPECT_FALSE(dict_->IsReserved(\"alex\"));\n}", "mode": "gtest"}, {"type": "warn", "text": "`SetUpTestSuite` и `TearDownTestSuite` — static. Варианты с `override`, `virtual` или без `static` не компилируются. Общий ресурс — это общее состояние: если тест его меняет, следующий тест видит изменения. Проверяй с `--gtest_shuffle`."}, {"type": "warn", "text": "Нельзя смешивать `TEST` и `TEST_F` с одним именем suite. Код компилируется, но при запуске gtest валит тест с сообщением «All tests in the same test suite must use the same test fixture class»."}, {"type": "p", "text": "Ресурс на весь бинарник (например, проверить, что тестовая БД поднята) — глобальное окружение `::testing::Environment`:"}, {"type": "code", "code": "#include <cstdio>\n\n#include <gtest/gtest.h>\n\n// один раз на весь бинарник (все suite): например,\n// проверить, что тестовая БД доступна\nclass PgEnvironment : public ::testing::Environment {\n public:\n  void SetUp() override { std::puts(\"start/check test DB\"); }\n  void TearDown() override { std::puts(\"stop test DB\"); }\n};\n\n// регистрация до RUN_ALL_TESTS: глобальная переменная\n// (или вызов в своём main). gtest сам удалит объект\n::testing::Environment* const kPgEnv =\n    ::testing::AddGlobalTestEnvironment(new PgEnvironment);\n\nTEST(SmokeTest, Works) { SUCCEED(); }", "mode": "gtest"}, {"type": "tip", "text": "Вслух: «Общую подготовку вынесу в фикстуру. Каждый тест получает свежий объект, поэтому тесты не зависят друг от друга. Дорогое — соединение с БД — в SetUpTestSuite, один раз на suite»."}]}, {"id": "tests-param", "title": "Параметризованные тесты", "blocks": [{"type": "p", "text": "Таблица «вход → ожидаемый результат» — классика для валидаторов, парсеров и граничных значений. В gtest это TEST_P, три шага:"}, {"type": "list", "items": ["Класс-фикстура: `class X : public ::testing::TestWithParam<T> {};`", "Тест: `TEST_P(X, Name) { ... GetParam() ... }`", "Набор значений: `INSTANTIATE_TEST_SUITE_P(Prefix, X, генератор);` — на уровне namespace, не внутри функции."]}, {"type": "code", "code": "#include <ostream>\n#include <string>\n#include <string_view>\n\n#include <gtest/gtest.h>\n\n// IsValidLogin из первого урока (в проекте — \"login.h\")\nbool IsValidLogin(std::string_view s) {\n  if (s.empty() || s.size() > 30) return false;\n  for (char c : s) {\n    const bool ok = (c >= 'a' && c <= 'z') ||\n                    (c >= '0' && c <= '9') || c == '-' || c == '.';\n    if (!ok) return false;\n  }\n  return true;\n}\n\nstruct LoginCase {\n  std::string login;\n  bool valid;\n};\n\n// чтобы в отчёте было видно параметр, а не байты\nstd::ostream& operator<<(std::ostream& os, const LoginCase& c) {\n  return os << '\"' << c.login << \"\\\" -> \" << c.valid;\n}\n\nclass LoginValidationTest\n    : public ::testing::TestWithParam<LoginCase> {};\n\nTEST_P(LoginValidationTest, MatchesExpectation) {\n  const LoginCase& c = GetParam();\n  EXPECT_EQ(IsValidLogin(c.login), c.valid);\n}\n\n// (префикс, fixture, генератор параметров[, генератор имён])\nINSTANTIATE_TEST_SUITE_P(\n    Basic, LoginValidationTest,\n    ::testing::Values(LoginCase{\"alex\", true},\n                      LoginCase{\"a.b-c\", true},\n                      LoginCase{\"\", false},\n                      LoginCase{\"Alex\", false},\n                      LoginCase{\"alex@ya\", false}));\n// имена тестов: Basic/LoginValidationTest.MatchesExpectation/0..4\n", "mode": "gtest"}, {"type": "p", "text": "Генераторы значений:"}, {"type": "code", "code": "#include <array>\n#include <string>\n#include <tuple>\n#include <vector>\n\n#include <gtest/gtest.h>\n\n// ValuesIn: из контейнера или C-массива\nconst std::vector<std::string> kReserved = {\"admin\", \"root\"};\n\nclass ReservedTest : public ::testing::TestWithParam<std::string> {};\n\nTEST_P(ReservedTest, IsNotEmpty) {\n  EXPECT_FALSE(GetParam().empty());\n}\n\nINSTANTIATE_TEST_SUITE_P(All, ReservedTest,\n                         ::testing::ValuesIn(kReserved));\n\n// Combine: декартово произведение -> std::tuple\nclass RetryTest\n    : public ::testing::TestWithParam<std::tuple<int, bool>> {};\n\nTEST_P(RetryTest, AttemptsArePositive) {\n  const auto [attempts, idempotent] = GetParam();\n  EXPECT_GT(attempts, 0);\n  (void)idempotent;\n}\n\n// 3 x 2 = 6 тестов\nINSTANTIATE_TEST_SUITE_P(\n    Grid, RetryTest,\n    ::testing::Combine(::testing::Values(1, 2, 5),\n                       ::testing::Bool()));\n\n// Range(begin, end, step): [0, 10) с шагом 5 -> 0, 5\nclass RangeTest : public ::testing::TestWithParam<int> {};\nTEST_P(RangeTest, NonNegative) { EXPECT_GE(GetParam(), 0); }\nINSTANTIATE_TEST_SUITE_P(Steps, RangeTest,\n                         ::testing::Range(0, 10, 5));", "mode": "gtest"}, {"type": "list", "items": ["`Values(a, b, c)` — перечисление.", "`ValuesIn(container)` — из вектора, массива или пары итераторов.", "`Range(begin, end, step)` — полуинтервал `[begin, end)`.", "`Bool()` — `false`, `true`.", "`Combine(g1, g2, ...)` — декартово произведение, параметр — `std::tuple`."]}, {"type": "p", "text": "Четвёртый аргумент — генератор имён. С ним в отчёте видно `ExactlyTtl`, а не `/2`, и упавший кейс можно запустить фильтром."}, {"type": "code", "code": "#include <string>\n\n#include <gtest/gtest.h>\n\nstruct TtlCase {\n  std::string name;  // только [A-Za-z0-9_]\n  int elapsed_sec;\n  bool expired;\n};\n\nclass TtlTest : public ::testing::TestWithParam<TtlCase> {};\n\nTEST_P(TtlTest, ExpiresAtBoundary) {\n  constexpr int kTtl = 3600;\n  const auto& c = GetParam();\n  EXPECT_EQ(c.elapsed_sec >= kTtl, c.expired);\n}\n\nINSTANTIATE_TEST_SUITE_P(\n    Boundaries, TtlTest,\n    ::testing::Values(TtlCase{\"Fresh\", 0, false},\n                      TtlCase{\"OneSecondLeft\", 3599, false},\n                      TtlCase{\"ExactlyTtl\", 3600, true},\n                      TtlCase{\"LongAgo\", 7200, true}),\n    [](const ::testing::TestParamInfo<TtlCase>& info) {\n      return info.param.name;\n    });\n// Boundaries/TtlTest.ExpiresAtBoundary/ExactlyTtl", "mode": "gtest"}, {"type": "warn", "text": "Имя кейса — только буквы, цифры и `_`. Имя `case-1` (с дефисом) или с пробелом — бинарник падает при старте: «Parameterized test name 'case-1' is invalid». Имена должны быть уникальны."}, {"type": "warn", "text": "TEST_P без INSTANTIATE_TEST_SUITE_P: тесты не запустятся, а современный gtest добавит падающий тест `GoogleTestVerification.UninstantiatedParameterizedTestSuite<X>`. Старое имя макроса `INSTANTIATE_TEST_CASE_P` — устаревшее, в новом коде не используй."}, {"type": "warn", "text": "Запятая внутри аргумента макроса ломает его: `INSTANTIATE_TEST_SUITE_P(P, X, std::vector<std::string>{\"a\", \"b\"})` не скомпилируется. Да и контейнер — не генератор: нужно `::testing::ValuesIn(vec)`."}, {"type": "p", "text": "Параметры поверх существующей фикстуры: наследуйся от неё и от `WithParamInterface<T>`. Не от `TestWithParam<T>`: он сам наследник `::testing::Test`, получится ромб и ошибка компиляции «ambiguous conversion ... to base class Test»."}, {"type": "code", "code": "#include <gtest/gtest.h>\n\nstruct TtlCase {\n  const char* name;\n  int elapsed_sec;\n  bool valid;\n};\n\n// твоя существующая фикстура (условно)\nclass SessionStoreTest : public ::testing::Test {\n protected:\n  static constexpr int kTtlSec = 3600;\n};\n\nclass SessionTtlTest\n    : public SessionStoreTest,\n      public ::testing::WithParamInterface<TtlCase> {};\n\nTEST_P(SessionTtlTest, ValidityDependsOnElapsedTime) {\n  // доступны и поля SessionStoreTest, и GetParam()\n  EXPECT_EQ(GetParam().elapsed_sec < kTtlSec, GetParam().valid);\n}\n\nINSTANTIATE_TEST_SUITE_P(\n    Boundaries, SessionTtlTest,\n    ::testing::Values(TtlCase{\"Fresh\", 0, true},\n                      TtlCase{\"ExactlyTtl\", 3600, false}),\n    [](const auto& info) { return std::string(info.param.name); });\n", "mode": "gtest"}, {"type": "p", "text": "Без TEST_P тоже можно: таблица и цикл в одном тесте. Проще, но это один тест — отдельный кейс не запустить фильтром."}, {"type": "code", "code": "#include <string>\n#include <string_view>\n\n#include <gtest/gtest.h>\n\n// IsValidLogin из первого урока (в проекте — \"login.h\")\nbool IsValidLogin(std::string_view s) {\n  if (s.empty() || s.size() > 30) return false;\n  for (char c : s) {\n    const bool ok = (c >= 'a' && c <= 'z') ||\n                    (c >= '0' && c <= '9') || c == '-' || c == '.';\n    if (!ok) return false;\n  }\n  return true;\n}\n\n// альтернатива без TEST_P: таблица + цикл + SCOPED_TRACE.\n// Минус: это ОДИН тест, фильтром отдельный кейс не запустить\nTEST(IsValidLoginTest, Table) {\n  struct Case {\n    std::string login;\n    bool valid;\n  };\n  const Case cases[] = {\n      {\"alex\", true},\n      {\"\", false},\n      {\"Alex\", false},\n      {std::string(31, 'a'), false},\n  };\n  for (const auto& [login, valid] : cases) {\n    SCOPED_TRACE(\"login=\\\"\" + login + \"\\\"\");\n    EXPECT_EQ(IsValidLogin(login), valid);\n  }\n}\n", "mode": "gtest"}, {"type": "list", "items": ["Типизированные тесты: `TYPED_TEST_SUITE` и `TYPED_TEST` — одни и те же тесты на нескольких типах (например, на двух реализациях интерфейса). Встречается редко."]}, {"type": "tip", "text": "Вслух: «Границы TTL оформлю табличным TEST_P: 0, ttl минус секунда, ровно ttl, сильно больше. У каждого кейса имя, упавший видно сразу»."}]}, {"id": "tests-matchers", "title": "Матчеры: EXPECT_THAT", "blocks": [{"type": "p", "text": "`EXPECT_THAT(value, matcher)` и `ASSERT_THAT` — из gmock (`#include <gmock/gmock.h>`). Матчер — предикат, который умеет объяснить, почему не совпало. Главное преимущество — сообщение о провале."}, {"type": "code", "code": "#include <map>\n#include <string>\n#include <vector>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing ::testing::Contains;\nusing ::testing::Each;\nusing ::testing::Elemen
