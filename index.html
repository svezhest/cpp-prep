front());\n        q_.pop();\n        return v;\n    }\n\n    std::optional<T> try_pop() {  // не ждёт\n        std::lock_guard lk(m_);\n        if (q_.empty()) return std::nullopt;\n        T v = std::move(q_.front());\n        q_.pop();\n        return v;\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable cv_;\n    std::queue<T> q_;  // guarded by m_\n};\n\nint main() {\n    ConcurrentQueue<int> q;\n    std::thread producer([&] {\n        for (int i = 1; i <= 100; ++i) q.push(i);\n    });\n    long sum = 0;\n    for (int i = 0; i < 100; ++i) sum += q.pop();  // ждёт\n    producer.join();\n    std::cout << sum << ' ' << q.try_pop().has_value() << '\\n';\n}", "expect": "5050 0"}, {"type": "warn", "text": "У такой очереди нет способа остановить потребителя: `pop()` ждёт вечно. В реальном сервисе нужна семантика закрытия - иначе shutdown зависнет. Это первое, о чём спросит интервьюер."}, {"type": "p", "text": "Ограниченная очередь (bounded) даёт backpressure: быстрый производитель не съест всю память. Два cv: производители ждут `not_full_`, потребители - `not_empty_`. Семантика `close()`: `push` после закрытия возвращает false; `pop` дочитывает остаток и только на пустой закрытой очереди возвращает `nullopt`."}, {"type": "code", "code": "#include <chrono>\n#include <condition_variable>\n#include <cstddef>\n#include <deque>\n#include <iostream>\n#include <mutex>\n#include <optional>\n#include <thread>\n#include <vector>\n\ntemplate <class T>\nclass BoundedQueue {\npublic:\n    explicit BoundedQueue(std::size_t cap) : cap_(cap) {}\n\n    bool push(T value) {  // false - очередь закрыта\n        std::unique_lock lk(m_);\n        not_full_.wait(lk, [this] {\n            return closed_ || q_.size() < cap_;\n        });\n        if (closed_) return false;\n        q_.push_back(std::move(value));\n        lk.unlock();\n        not_empty_.notify_one();\n        return true;\n    }\n\n    std::optional<T> pop() {  // nullopt - закрыта и пуста\n        std::unique_lock lk(m_);\n        not_empty_.wait(lk, [this] {\n            return closed_ || !q_.empty();\n        });\n        return take(lk);\n    }\n\n    template <class Rep, class Period>\n    std::optional<T> pop_for(\n        std::chrono::duration<Rep, Period> timeout) {\n        std::unique_lock lk(m_);\n        bool ok = not_empty_.wait_for(lk, timeout, [this] {\n            return closed_ || !q_.empty();\n        });\n        if (!ok) return std::nullopt;  // таймаут\n        return take(lk);\n    }\n\n    void close() {\n        {\n            std::lock_guard lk(m_);\n            closed_ = true;\n        }\n        not_full_.notify_all();   // будим ВСЕХ: и тех, и других\n        not_empty_.notify_all();\n    }\n\nprivate:\n    std::optional<T> take(std::unique_lock<std::mutex>& lk) {\n        if (q_.empty()) return std::nullopt;  // закрыта и пуста\n        T v = std::move(q_.front());\n        q_.pop_front();\n        lk.unlock();\n        not_full_.notify_one();\n        return v;\n    }\n\n    std::mutex m_;\n    std::condition_variable not_full_;\n    std::condition_variable not_empty_;\n    std::deque<T> q_;        // guarded by m_\n    const std::size_t cap_;\n    bool closed_ = false;    // guarded by m_\n};\n\nint main() {\n    BoundedQueue<int> q(4);\n    std::vector<std::thread> producers, consumers;\n    std::mutex sum_m;\n    long sum = 0;\n\n    for (int p = 0; p < 2; ++p)\n        producers.emplace_back([&] {\n            for (int i = 1; i <= 1000; ++i) q.push(i);\n        });\n    for (int c = 0; c < 3; ++c)\n        consumers.emplace_back([&] {\n            long local = 0;\n            while (auto v = q.pop()) local += *v;\n            std::lock_guard lk(sum_m);\n            sum += local;\n        });\n\n    for (auto& t : producers) t.join();\n    q.close();  // всё отправлено - закрываем\n    for (auto& t : consumers) t.join();\n    std::cout << sum << '\\n';  // 2 * (1 + ... + 1000)\n\n    using namespace std::chrono_literals;\n    BoundedQueue<int> empty(1);\n    std::cout << empty.pop_for(5ms).has_value() << '\\n';\n}", "expect": "1001000\n0"}, {"type": "p", "text": "Что проговорить про этот код:"}, {"type": "list", "items": ["Инвариант: `q_.size() <= cap_`; после `closed_ == true` новых элементов не появляется.", "Оба предиката учитывают `closed_`, а `close()` зовёт `notify_all` на оба cv. Забыть любое из трёх - зависание на shutdown.", "notify - после unlock: разбуженный поток не упрётся в наш мьютекс.", "`pop_for` возвращает `nullopt` и при таймауте, и при закрытии. Если вызывающему важно различать, верните enum или `std::variant`.", "Альтернатива \"drain\" - \"закрыть немедленно\": `close()` очищает очередь. Тогда скажите, что будет с потерянными элементами."]}, {"type": "warn", "text": "Возврат `T` по значению из `pop()`: если перемещающий конструктор `T` бросит после извлечения, элемент потерян. Именно поэтому `std::stack::pop()` возвращает void. Для очереди обычно достаточно сказать: \"требую noexcept move у T\" или сделать `bool pop(T& out)`."}, {"type": "p", "text": "Почему два cv, а не один: с одним cv и `notify_one` производитель может разбудить другого производителя вместо потребителя. Тот проверит предикат, снова уснёт, и сигнал потерян. С одним cv пришлось бы везде звать `notify_all` - это лишние пробуждения."}, {"type": "tip", "text": "Вслух перед кодом: \"Уточню семантику. Очередь ограниченная? pop блокирующий или с таймаутом? Что делать на shutdown - дочитать остаток или выбросить? Несколько производителей и потребителей?\" Эти вопросы сами по себе дают баллы."}]}, {"id": "mt-channel", "title": "Каналы как в Go", "blocks": [{"type": "p", "text": "В Go канал - встроенный тип: `ch <- v` ждёт, если буфер полон; `v, ok := <-ch` даёт `ok == false`, когда канал закрыт и пуст; `close(ch)` закрывает; `select` ждёт сразу на нескольких каналах. В стандартной библиотеке C++ каналов нет. Есть кирпичики (mutex, condition_variable) и готовые каналы в библиотеках. Короткий ответ на собеседовании: \"канал - это bounded blocking queue с close\"."}, {"type": "p", "text": "`Channel<T>`: `send` ждёт места и возвращает false после закрытия (в Go - паника); `recv` возвращает `std::optional<T>`: `nullopt` - канал закрыт и всё прочитано; `close` будит всех; `try_recv` не ждёт."}, {"type": "code", "code": "#include <condition_variable>\n#include <cstddef>\n#include <deque>\n#include <iostream>\n#include <mutex>\n#include <optional>\n#include <thread>\n#include <utility>\n\ntemplate <class T>\nclass Channel {\npublic:\n    explicit Channel(std::size_t cap) : cap_(cap) {}  // cap >= 1\n\n    bool send(T v) {  // ждёт места; false - канал закрыт\n        std::unique_lock lk(m_);\n        not_full_.wait(lk, [&] {\n            return closed_ || buf_.size() < cap_;\n        });\n        if (closed_) return false;\n        buf_.push_back(std::move(v));\n        lk.unlock();\n        not_empty_.notify_one();\n        return true;\n    }\n\n    std::optional<T> recv() {  // nullopt - закрыт и пуст\n        std::unique_lock lk(m_);\n        not_empty_.wait(lk, [&] {\n            return closed_ || !buf_.empty();\n        });\n        return take(lk);\n    }\n\n    std::optional<T> try_recv() {  // не ждёт\n        std::unique_lock lk(m_);\n        return take(lk);\n    }\n\n    void close() {  // повторный close безопасен\n        {\n            std::lock_guard lk(m_);\n            closed_ = true;\n        }\n        not_full_.notify_all();\n        not_empty_.notify_all();\n    }\n\nprivate:\n    std::optional<T> take(std::unique_lock<std::mutex>& lk) {\n        if (buf_.empty()) return std::nullopt;\n        T v = std::move(buf_.front());\n        buf_.pop_front();\n        lk.unlock();\n        not_full_.notify_one();\n        return v;\n    }\n\n    std::mutex m_;\n    std::condition_variable not_full_, not_empty_;\n    std::deque<T> buf_;      // guarded by m_\n    const std::size_t cap_;\n    bool closed_ = false;    // guarded by m_\n};\n\nint main() {\n    Channel<int> ch(2);\n    std::thread producer([&] {\n        for (int i = 1; i <= 5; ++i) ch.send(i);  // ждёт места\n        ch.close();  // закрывает отправитель\n    });\n    // как `for v := range ch` в Go\n    while (auto v = ch.recv()) std::cout << *v << ' ';\n    std::cout << '\\n';\n    producer.join();\n    std::cout << \"send after close: \" << ch.send(6) << '\\n';\n    std::cout << \"try_recv: \" << ch.try_recv().has_value() << '\\n';\n}\n", "mode": "tsan", "expect": "1 2 3 4 5\nsend after close: 0\ntry_recv: 0"}, {"type": "list", "items": ["Закрывает отправитель, никогда получатель. Получатель узнаёт о конце потока данных по `nullopt`.", "Буфер ограничен - это backpressure: быстрый производитель ждёт медленного потребителя, а не съедает память.", "Небуферизованный канал Go (`make(chan T)`) - рандеву: `send` возвращается, только когда получатель забрал значение. Здесь `cap >= 1`; для рандеву `send` после `push_back` ещё ждёт, пока элемент заберут (второй cv или счётчик забранных)."]}, {"type": "p", "text": "Конвейер: генератор -> стадия -> потребитель. Стадия распараллелена на три воркера (fan-out: все читают общий вход), результаты сходятся в один канал (fan-in: все пишут в общий выход). Выход закрывает последний закончивший воркер - аналог `WaitGroup` + `close` в Go."}, {"type": "code", "code": "#include <condition_variable>\n#include <cstddef>\n#include <deque>\n#include <iostream>\n#include <mutex>\n#include <optional>\n#include <thread>\n#include <utility>\n#include <atomic>\n#include <vector>\n\ntemplate <class T>\nclass Channel {  // как выше, без try_recv\npublic:\n    explicit Channel(std::size_t cap) : cap_(cap) {}\n    bool send(T v) {\n        std::unique_lock lk(m_);\n        not_full_.wait(lk, [&] {\n            return closed_ || buf_.size() < cap_;\n        });\n        if (closed_) return false;\n        buf_.push_back(std::move(v));\n        lk.unlock();\n        not_empty_.notify_one();\n        return true;\n    }\n    std::optional<T> recv() {\n        std::unique_lock lk(m_);\n        not_empty_.wait(lk, [&] {\n            return closed_ || !buf_.empty();\n        });\n        if (buf_.empty()) return std::nullopt;\n        T v = std::move(buf_.front());\n        buf_.pop_front();\n        lk.unlock();\n        not_full_.notify_one();\n        return v;\n    }\n    void close() {\n        {\n            std::lock_guard lk(m_);\n            closed_ = true;\n        }\n        not_full_.notify_all();\n        not_empty_.notify_all();\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable not_full_, not_empty_;\n    std::deque<T> buf_;\n    const std::size_t cap_;\n    bool closed_ = false;\n};\n\nint main() {\n    Channel<int> nums(4), squares(4);\n\n    std::jthread gen([&] {           // стадия 1: генератор\n        for (int i = 1; i <= 100; ++i) nums.send(i);\n        nums.close();\n    });\n\n    const int n = 3;                 // стадия 2: fan-out\n    std::atomic<int> alive{n};\n    std::vector<std::jthread> workers;\n    for (int w = 0; w < n; ++w)\n        workers.emplace_back([&] {\n            while (auto v = nums.recv())   // общий вход\n                squares.send(*v * *v);     // fan-in: общий выход\n            if (--alive == 0) squares.close();  // последний\n        });\n\n    long sum = 0;                    // стадия 3: потребитель\n    while (auto v = squares.recv()) sum += *v;\n    std::cout << sum << '\\n';        // 1^2 + ... + 100^2\n}\n", "mode": "tsan", "expect": "338350"}, {"type": "warn", "text": "Если каждый воркер закроет выход сам, первый закончивший закроет его, а `send` остальных вернёт false - результаты потеряются. Если не закроет никто - потребитель ждёт вечно. Поэтому счётчик живых (atomic) или join всех воркеров и затем `close`. Join в том же потоке, что читает выход, - дедлок: воркеры ждут места в буфере, а читать некому."}, {"type": "p", "text": "`select` в C++ нет: нельзя одним вызовом ждать на нескольких cv. Как обходят:"}, {"type": "list", "items": ["Один канал вместо нескольких: сообщения разных видов как `std::variant`, разбор через `std::visit`. Самый частый и простой вариант.", "Опрос: по кругу `try_recv` у каждого канала, между проходами короткий сон. Работает, но это busy-wait: задержка или сожжённый CPU.", "Общий \"звонок\": все каналы при `send` будят одну общую cv или семафор, на которой ждёт читатель, а потом он проверяет каналы через `try_recv`. Это самодельный select.", "Таймаут как в `select` с `time.After` - `recv_for(timeout)` через `cv.wait_for`."]}, {"type": "code", "code": "#include <condition_variable>\n#include <cstddef>\n#include <deque>\n#include <iostream>\n#include <mutex>\n#include <optional>\n#include <thread>\n#include <utility>\n#include <atomic>\n#include <string>\n#include <variant>\n#include <vector>\n\ntemplate <class T>\nclass Channel {  // как выше, без try_recv\npublic:\n    explicit Channel(std::size_t cap) : cap_(cap) {}\n    bool send(T v) {\n        std::unique_lock lk(m_);\n        not_full_.wait(lk, [&] {\n            return closed_ || buf_.size() < cap_;\n        });\n        if (closed_) return false;\n        buf_.push_back(std::move(v));\n        lk.unlock();\n        not_empty_.notify_one();\n        return true;\n    }\n    std::optional<T> recv() {\n        std::unique_lock lk(m_);\n        not_empty_.wait(lk, [&] {\n            return closed_ || !buf_.empty();\n        });\n        if (buf_.empty()) return std::nullopt;\n        T v = std::move(buf_.front());\n        buf_.pop_front();\n        lk.unlock();\n        not_full_.notify_one();\n        return v;\n    }\n    void close() {\n        {\n            std::lock_guard lk(m_);\n            closed_ = true;\n        }\n        not_full_.notify_all();\n        not_empty_.notify_all();\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable not_full_, not_empty_;\n    std::deque<T> buf_;\n    const std::size_t cap_;\n    bool closed_ = false;\n};\n\nstruct Tick {};  // сообщения разных \"каналов\"\nstruct Job { int id; };\nstruct Log { std::string text; };\nusing Msg = std::variant<Tick, Job, Log>;\n\ntemplate <class... F> struct overloaded : F... {\n    using F::operator()...;\n};\n\nint main() {\n    Channel<Msg> inbox(2);  // один вход вместо select\n    std::atomic<int> alive{2};\n    auto done = [&] { if (--alive == 0) inbox.close(); };\n    std::jthread timer([&] {\n        for (int i = 0; i < 3; ++i) inbox.send(Tick{});\n        done();\n    });\n    std::jthread jobs([&] {\n        for (int i = 1; i <= 4; ++i) inbox.send(Job{i});\n        inbox.send(Log{\"jobs done\"});\n        done();\n    });\n\n    int ticks = 0, job_sum = 0;\n    std::string last_log;\n    while (auto m = inbox.recv())\n        std::visit(overloaded{\n            [&](Tick) { ++ticks; },\n            [&](Job j) { job_sum += j.id; },\n            [&](const Log& l) { last_log = l.text; },\n        }, *m);\n    std::cout << ticks << ' ' << job_sum << ' ' << last_log << '\\n';\n}\n", "mode": "tsan", "expect": "3 10 jobs done"}, {"type": "p", "text": "Готовые каналы:"}, {"type": "list", "items": ["Boost.Fiber: `boost::fibers::buffered_channel<T>` (ёмкость - степень двойки) и `unbounded_channel<T>`. `push`/`pop` возвращают `channel_op_status` (`success`, `closed`, ...), есть `close()`. Ждут файберы, а не потоки ОС.", "Boost.Asio: `experimental::channel` и потокобезопасный `experimental::concurrent_channel`; `async_send`/`async_receive`, удобно с `co_await`.", "userver (фреймворк Яндекса): очереди `concurrent::MpscQueue`, `SpscQueue`, `SpmcQueue`, `NonFifoMpmcQueue` с `GetProducer()` и `GetConsumer()`. Закрытие - через смерть producer'ов: `Pop` возвращает false, когда очередь пуста и живых producer'ов нет.", "В стандарте C++26 появились senders/receivers (`std::execution`), но это модель асинхронных цепочек, а не канал."]}, {"type": "tip", "text": "Вслух: \"В стандарте каналов нет. Канал - это bounded blocking queue с close: send ждёт места, recv возвращает optional, nullopt - закрыт и пуст. Закрывает тот, кто пишет последним. select эмулирую одной очередью variant-сообщений. В проде взял бы готовое: в userver - concurrent::MpscQueue\"."}]}, {"id": "mt-future", "title": "future, promise, packaged_task, async", "blocks": [{"type": "p", "text": "`std::future<T>` - \"получатель\" одноразового результата. Поставщики бывают трёх видов: `std::promise` (значение кладут вручную), `std::packaged_task` (обёртка над функцией), `std::async` (сразу запускает функцию). У всех общий \"shared state\", куда пишется значение или исключение."}, {"type": "code", "code": "#include <future>\n#include <iostream>\n#include <stdexcept>\n#include <string>\n\nint parse(const std::string& s) {\n    if (s.empty()) throw std::invalid_argument(\"empty\");\n    return std::stoi(s);\n}\n\nint main() {\n    auto a = std::async(std::launch::async, parse, \"42\");\n    auto b = std::async(std::launch::async, parse, \"\");\n    std::cout << a.get() << '\\n';\n    try {\n        b.get();                   // исключение из потока - здесь\n    } catch (const std::exception& e) {\n        std::cout << \"error: \" << e.what() << '\\n';\n    }\n}", "expect": "42\nerror: empty"}, {"type": "p", "text": "Политики запуска `std::async`:"}, {"type": "list", "items": ["`std::launch::async` - выполнить как будто в новом потоке.", "`std::launch::deferred` - ленивый вызов: функция выполнится в потоке, который позовёт `get()`/`wait()`. Если не позовёт - не выполнится никогда.", "По умолчанию (`async | deferred`) - на выбор реализации. Поэтому код с `wait_for` в цикле может зависнуть: для deferred-задачи `wait_for` сразу возвращает `future_status::deferred`."]}, {"type": "code", "code": "#include <chrono>\n#include <future>\n#include <iostream>\n\nusing namespace std::chrono_literals;\n\nint main() {\n    auto f = std::async(std::launch::deferred, [] { return 7; });\n    if (f.wait_for(0s) == std::future_status::deferred)\n        std::cout << \"not started\\n\";  // и не начнётся сам\n    std::cout << f.get() << '\\n';      // выполнится сейчас, здесь\n}", "expect": "not started\n7"}, {"type": "warn", "text": "Главная ловушка: деструктор future, полученного из `std::async`, блокируется до завершения задачи (если это последняя ссылка на shared state). Поэтому \"fire and forget\" через async не работает: временный future разрушится в конце строки и подождёт. Две строки подряд выполнятся последовательно. У future от `promise` и `packaged_task` деструктор не ждёт."}, {"type": "code", "code": "#include <chrono>\n#include <future>\n#include <iostream>\n#include <thread>\n\nusing namespace std::chrono;\n\nvoid slow() { std::this_thread::sleep_for(50ms); }\n\nint main() {\n    auto t0 = steady_clock::now();\n    std::async(std::launch::async, slow);  // ждёт в ~future\n    std::async(std::launch::async, slow);  // и этот тоже\n    auto ms = duration_cast<milliseconds>(steady_clock::now() - t0);\n    std::cout << \"sequential: \" << (ms >= 100ms) << '\\n';\n\n    t0 = steady_clock::now();\n    {\n        auto f1 = std::async(std::launch::async, slow);\n        auto f2 = std::async(std::launch::async, slow);\n    }   // оба работали параллельно, ждём в конце блока\n    ms = duration_cast<milliseconds>(steady_clock::now() - t0);\n    std::cout << \"parallel: \" << (ms < 100ms) << '\\n';\n}", "expect": "sequential: 1\nparallel: 1"}, {"type": "p", "text": "Компилятор, скорее всего, предупредит: `std::async` помечен `[[nodiscard]]`. Но `(void)std::async(...)` ведёт себя так же - блокируется."}, {"type": "p", "text": "`std::promise` - когда результат появляется не как возврат функции, а \"где-то по ходу\": в колбэке, в другом потоке, в обработчике сети. `promise<void>` - удобный одноразовый сигнал."}, {"type": "code", "code": "#include <future>\n#include <iostream>\n#include <thread>\n\nint main() {\n    std::promise<int> p;\n    std::future<int> f = p.get_future();  // взять future можно 1 раз\n\n    std::thread t([p = std::move(p)]() mutable {\n        try {\n            p.set_value(42);       // или p.set_exception(...)\n        } catch (...) {\n            p.set_exception(std::current_exception());\n        }\n    });\n    std::cout << f.get() << '\\n';\n    t.join();\n\n    std::future<int> orphan;\n    {\n        std::promise<int> dead;\n        orphan = dead.get_future();\n    }   // promise умер без значения\n    try {\n        orphan.get();\n    } catch (const std::future_error& e) {\n        std::cout << (e.code() == std::future_errc::broken_promise)\n                  << '\\n';\n    }\n}", "expect": "42\n1"}, {"type": "p", "text": "`std::packaged_task<R(Args...)>` - функция + promise в одном объекте. Вызвали - результат или исключение ушли в future. Именно его кладут в очередь пула."}, {"type": "code", "code": "#include <future>\n#include <iostream>\n#include <thread>\n\nint main() {\n    std::packaged_task<int(int, int)> task(\n        [](int a, int b) { return a + b; });\n    std::future<int> f = task.get_future();\n\n    std::thread t(std::move(task), 2, 3);  // move-only\n    std::cout << f.get() << '\\n';\n    t.join();\n}", "expect": "5"}, {"type": "p", "text": "`future::get()` можно вызвать один раз: он забирает результат, и `valid()` становится false. Если результат нужен нескольким потокам - `std::shared_future` (через `f.share()`), у каждого потока своя копия. Пример: \"стартовый пистолет\" для нескольких потоков."}, {"type": "code", "code": "#include <future>\n#include <iostream>\n#include <mutex>\n#include <thread>\n#include <vector>\n\nint main() {\n    std::promise<void> go;\n    std::shared_future<void> start = go.get_future().share();\n    std::mutex out_m;\n    std::vector<std::thread> ts;\n\n    for (int i = 0; i < 3; ++i)\n        ts.emplace_back([start, i, &out_m] {  // копия в каждый поток\n            start.wait();                     // ждут все вместе\n            std::lock_guard lk(out_m);\n            std::cout << \"runner \" << i << '\\n';\n        });\n\n    go.set_value();  // старт\n    for (auto& t : ts) t.join();\n}"}, {"type": "list", "items": ["`set_value` дважды - `future_error` (promise_already_satisfied).", "`get_future()` дважды - `future_error` (future_already_retrieved).", "`get()` на future с `valid() == false` - UB по стандарту (libstdc++ бросает `future_error` no_state, libc++ может упасть).", "`wait_for` возвращает `ready`, `timeout` или `deferred`.", "Продолжений (`then`) в стандарте нет - это одна из причин писать свой пул или брать библиотеку."]}, {"type": "tip", "text": "Вслух: \"async без сохранения future - синхронный вызов. Для fire-and-forget у меня пул задач. Исключения возвращаю через future, чтобы вызывающий увидел их в get()\"."}]}, {"id": "mt-pool", "title": "Пул потоков с нуля (worker pool)", "blocks": [{"type": "p", "text": "Пул = очередь задач + N воркеров + флаг остановки. `submit` возвращает `std::future`, через который приходят результат или исключение. Это делает `std::packaged_task`: он ловит исключение задачи и кладёт его в shared state. Ниже пул целиком вместе с примером: результаты и исключения приходят через future."}, {"type": "code", "code": "#include <condition_variable>\n#include <cstddef>\n#include <functional>\n#include <future>\n#include <iostream>\n#include <memory>\n#include <mutex>\n#include <queue>\n#include <stdexcept>\n#include <thread>\n#include <type_traits>\n#include <vector>\n\nclass ThreadPool {\npublic:\n    explicit ThreadPool(std::size_t n) {\n        try {\n            for (std::size_t i = 0; i < n; ++i)\n                workers_.emplace_back([this] { loop(); });\n        } catch (...) {\n            shutdown();  // иначе joinable потоки -> terminate\n            throw;\n        }\n    }\n\n    ~ThreadPool() { shutdown(); }\n\n    ThreadPool(const ThreadPool&) = delete;\n    ThreadPool& operator=(const ThreadPool&) = delete;\n\n    template <class F>\n    auto submit(F f) -> std::future<std::invoke_result_t<F>> {\n        using R = std::invoke_result_t<F>;\n        // std::function требует копируемости, packaged_task - нет\n        auto task =\n            std::make_shared<std::packaged_task<R()>>(std::move(f));\n        std::future<R> fut = task->get_future();\n        {\n            std::lock_guard lk(m_);\n            if (stop_) throw std::runtime_error(\"pool is stopped\");\n            tasks_.emplace([task] { (*task)(); });\n        }\n        cv_.notify_one();\n        return fut;\n    }\n\nprivate:\n    void loop() {\n        while (true) {\n            std::function<void()> job;\n            {\n                std::unique_lock lk(m_);\n                cv_.wait(lk, [this] {\n                    return stop_ || !tasks_.empty();\n                });\n                if (stop_ && tasks_.empty()) return;  // всё доделали\n                job = std::move(tasks_.front());\n                tasks_.pop();\n            }\n            job();  // БЕЗ замка; исключения ловит packaged_task\n        }\n    }\n\n    void shutdown() {\n        {\n            std::lock_guard lk(m_);\n            if (stop_) return;\n            stop_ = true;\n        }\n        cv_.notify_all();\n        for (auto& t : workers_)\n            if (t.joinable()) t.join();\n    }\n\n    std::mutex m_;\n    std::condition_variable cv_;\n    std::queue<std::function<void()>> tasks_;  // guarded by m_\n    bool stop_ = false;                        // guarded by m_\n    std::vector<std::thread> workers_;\n};\n\nint main() {\n    ThreadPool pool(4);\n    std::vector<std::future<int>> fs;\n    for (int i = 0; i < 8; ++i)\n        fs.push_back(pool.submit([i] { return i * i; }));\n\n    auto bad = pool.submit([]() -> int {\n        throw std::runtime_error(\"boom\");\n    });\n\n    int sum = 0;\n    for (auto& f : fs) sum += f.get();\n    std::cout << sum << '\\n';\n\n    try {\n        bad.get();  // исключение задачи пробрасывается сюда\n    } catch (const std::exception& e) {\n        std::cout << \"caught: \" << e.what() << '\\n';\n    }\n}   // ~ThreadPool: дождётся всех задач и потоков", "expect": "140\ncaught: boom"}, {"type": "p", "text": "Разбор решений, которые стоит проговорить:"}, {"type": "list", "items": ["`job()` вызывается без замка. Если вызывать под замком, пул выполняет задачи строго по одной, а задача, которая сама вызывает `submit`, задедлочит воркер.", "Graceful shutdown: воркер выходит, только когда `stop_` и очередь пуста - уже принятые задачи выполнятся. Новые после остановки отклоняются исключением.", "Если бы shutdown выбрасывал задачи из очереди, `packaged_task` разрушились бы без вызова, и `get()` у их future бросил бы `std::future_error` с кодом `broken_promise`. Это корректно, но надо сказать вслух.", "`shared_ptr<packaged_task>` нужен, потому что `std::function` требует копируемый callable. В C++23 можно хранить `std::move_only_function<void()>` и обойтись без shared_ptr.", "Конструктор: если создание k-го потока бросило, уже созданные потоки joinable - без catch их деструкторы вызвали бы terminate."]}, {"type": "warn", "text": "Задача, которая ждёт future другой задачи того же пула, может задедлочить пул: все воркеры заняты ожиданием, а задачи, которых они ждут, лежат в очереди. Лечится: не блокироваться внутри задач, продолжения (continuations), отдельный пул для зависимых задач."}, {"type": "p", "text": "Вариант `submit` с аргументами, если попросят: упаковать функцию и аргументы в лямбду без параметров и отдать её в обычный `submit`. В примере вместо пула задачу выполняет `packaged_task` в отдельном потоке - так её и запустит воркер."}, {"type": "code", "code": "#include <future>\n#include <iostream>\n#include <string>\n#include <thread>\n#include <utility>\n\n// Упаковать f и аргументы в callable без параметров.\n// submit_args(pool, f, args...) == pool.submit(pack(f, args...))\ntemplate <class F, class... Args>\nauto pack(F f, Args... args) {\n    return [f = std::move(f), ... args = std::move(args)]() mutable {\n        return f(std::move(args)...);\n    };\n}\n\nint main() {\n    auto job = pack([](int a, std::string s) {\n        return s + std::to_string(a);\n    }, 5, std::string(\"x\"));\n\n    // так задачу и выполнит воркер пула\n    std::packaged_task<std::string()> task(std::move(job));\n    auto fut = task.get_future();\n    std::thread(std::move(task)).join();\n    std::cout << fut.get() << '\\n';\n}", "expect": "x5"}, {"type": "tip", "text": "Вслух: \"Воркер: ждёт под замком, забирает задачу, отпускает замок, выполняет. Исключения изолированы packaged_task. Shutdown: флаг под замком, notify_all, join всех. Принятые задачи доделываются\"."}]}, {"id": "mt-atomic", "title": "std::atomic: операции, CAS, спинлок", "blocks": [{"type": "p", "text": "`std::atomic<T>` делает каждую отдельную операцию неделимой и убирает гонку данных. T должен быть trivially copyable. Для целых и указателей есть арифметика (`fetch_add`, `++`), для всех - `load`, `store`, `exchange`, `compare_exchange_*`."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n\nint main() {\n    std::atomic<int> x{10};\n    x.store(20);\n    int old = x.fetch_add(5);      // вернёт старое значение\n    int now = ++x;                 // атомарный RMW, вернёт новое\n    int prev = x.exchange(100);    // вернёт старое, запишет 100\n    std::cout << old << ' ' << now << ' ' << prev << ' '\n              << x.load() << '\\n';\n    std::cout << std::atomic<int>::is_always_lock_free << '\\n';\n}", "expect": "20 26 26 100\n1"}, {"type": "warn", "text": "`x = x + 1` для atomic - это отдельные `load` и `store`. Гонки данных (UB) нет, но инкременты теряются, как с обычным int. Атомарны только `++x`, `x += 1`, `fetch_add`. Аналогично `if (x == 0) x = 1;` - это check-then-act, нужен CAS."}, {"type": "p", "text": "Compare-and-swap: `a.compare_exchange_weak(expected, desired)`. Если текущее значение равно `expected` - записать `desired`, вернуть true. Иначе записать текущее значение в `expected` и вернуть false. Обратите внимание: `expected` передаётся по ссылке и меняется."}, {"type": "list", "items": ["`weak` может вернуть false, даже если значения равны (spurious failure, на ARM это LL/SC). Поэтому его всегда зовут в цикле - и в цикле он дешевле.", "`strong` ложно не падает. Нужен, когда попытка одна и ложная неудача изменила бы логику."]}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <thread>\n#include <vector>\n\n// атомарный максимум: классический CAS-цикл\nvoid update_max(std::atomic<int>& mx, int v) {\n    int cur = mx.load();\n    while (cur < v && !mx.compare_exchange_weak(cur, v)) {\n        // неудача: cur уже содержит свежее значение, проверяем снова\n    }\n}\n\nint main() {\n    std::atomic<int> mx{0};\n    std::vector<std::thread> ts;\n    for (int t = 0; t < 4; ++t)\n        ts.emplace_back([&, t] {\n            for (int i = 0; i < 10000; ++i) update_max(mx, i * 4 + t);\n        });\n    for (auto& th : ts) th.join();\n    std::cout << mx << '\\n';\n\n    std::atomic<int> a{5};\n    int expected = 3;\n    bool ok = a.compare_exchange_strong(expected, 10);\n    std::cout << ok << ' ' << a << ' ' << expected << '\\n';\n}", "expect": "39999\n0 5 5"}, {"type": "p", "text": "Lock-free стек Треибера: push - простой CAS-цикл по голове. Pop сделать правильно намного сложнее (ABA и безопасное освобождение памяти: hazard pointers, epoch-based reclamation). На собеседовании честно скажите это и предложите сначала версию с мьютексом."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <thread>\n\ntemplate <class T>\nclass LockFreeStack {\npublic:\n    void push(T v) {\n        Node* n = new Node{std::move(v), head_.load()};\n        // если голова сменилась, n->next обновится и повторим\n        while (!head_.compare_exchange_weak(n->next, n)) {\n        }\n    }\n    ~LockFreeStack() {  // вызывается, когда потоков уже нет\n        Node* n = head_.load();\n        while (n) {\n            Node* next = n->next;\n            delete n;\n            n = next;\n        }\n    }\n    int size_unsafe() const {\n        int s = 0;\n        for (Node* n = head_.load(); n; n = n->next) ++s;\n        return s;\n    }\n\nprivate:\n    struct Node {\n        T value;\n        Node* next;\n    };\n    std::atomic<Node*> head_{nullptr};\n};\n\nint main() {\n    LockFreeStack<int> s;\n    std::thread a([&] { for (int i = 0; i < 1000; ++i) s.push(i); });\n    std::thread b([&] { for (int i = 0; i < 1000; ++i) s.push(i); });\n    a.join();\n    b.join();\n    std::cout << s.size_unsafe() << '\\n';\n}", "expect": "2000"}, {"type": "p", "text": "Спинлок на `std::atomic_flag` - единственный тип, гарантированно lock-free. Вариант test-and-test-and-set: крутимся на обычном чтении, чтобы не долбить кэш-линию записями."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nclass SpinLock {\npublic:\n    void lock() {\n        while (flag_.test_and_set(std::memory_order_acquire)) {\n            while (flag_.test(std::memory_order_relaxed)) {\n                // C++20: test(); можно ещё flag_.wait(true)\n            }\n        }\n    }\n    void unlock() { flag_.clear(std::memory_order_release); }\n\nprivate:\n    std::atomic_flag flag_;  // C++20: инициализирован как clear\n};\n\nSpinLock spin;\nlong counter = 0;  // guarded by spin\n\nint main() {\n    auto work = [] {\n        for (int i = 0; i < 100000; ++i) {\n            std::lock_guard lk(spin);  // SpinLock - BasicLockable\n            ++counter;\n        }\n    };\n    std::thread a(work), b(work);\n    a.join();\n    b.join();\n    std::cout << counter << '\\n';\n}", "expect": "200000"}, {"type": "warn", "text": "Спинлок в пользовательском коде почти всегда хуже `std::mutex`: современный mutex сам немного крутится перед сном, а спинлок при вытеснении владельца жжёт CPU целый квант. Оправдан для очень коротких секций без системных вызовов и когда потоков не больше ядер."}, {"type": "p", "text": "`is_lock_free()` отвечает, реализован ли atomic без внутреннего замка. `std::atomic<BigStruct>` скомпилируется, но будет с замком. `std::atomic<std::string>` не скомпилируется: тип не trivially copyable. C++20 добавил `std::atomic<double>::fetch_add` и `std::atomic<std::shared_ptr<T>>`."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <memory>\n#include <string>\n#include <thread>\n\nstruct Settings {\n    std::string mode;\n};\n\nstd::atomic<std::shared_ptr<const Settings>> current{\n    std::make_shared<const Settings>(Settings{\"safe\"})};\n\nvoid reload() {  // писатель: собирает новый объект целиком\n    current.store(std::make_shared<const Settings>(Settings{\"fast\"}));\n}\n\nstd::string handle_request() {  // читатель: снапшот без мьютекса\n    std::shared_ptr<const Settings> s = current.load();\n    return s->mode;  // s держит объект, даже если его заменят\n}\n\nint main() {\n    std::thread w(reload);\n    std::string m = handle_request();  // \"safe\" или \"fast\"\n    w.join();\n    std::cout << handle_request() << '\\n';\n    (void)m;\n}", "expect": "fast"}, {"type": "p", "text": "`std::atomic<std::shared_ptr>` обычно не lock-free (внутри спинлок), но для read-mostly конфигов это удобно. До C++20 то же делали свободными функциями `std::atomic_load(&sp)` / `std::atomic_store(&sp, v)`, сейчас они deprecated."}, {"type": "list", "items": ["`std::atomic` не копируется и не перемещается. `vector<atomic<int>> v(n)` создать можно, а `push_back` и `resize` с ростом - нет.", "C++20: `a.wait(old)` / `a.notify_one()` - ждать изменения значения без cv и без спина.", "Соседние атомики, которые пишут разные потоки, лучше разнести по кэш-линиям: `alignas(64)` (false sharing)."]}, {"type": "tip", "text": "Вслух: \"Атомики - для одиночных переменных: счётчики, флаги, указатель на снапшот. Как только инвариант связывает две переменные, беру мьютекс. Lock-free структуры пишу, только если попросят, и сразу называю проблемы ABA и освобождения памяти\"."}]}, {"id": "mt-memory", "title": "Модель памяти: happens-before и memory_order", "blocks": [{"type": "p", "text": "Без синхронизации ни компилятор, ни процессор не обязаны показывать другому потоку записи в том порядке, в каком они в коде. Модель памяти C++ говорит, когда порядок гарантирован."}, {"type": "list", "items": ["sequenced-before: порядок внутри одного потока (грубо - порядок выражений в коде).", "synchronizes-with: связь между потоками. Release-запись в atomic и acquire-чтение, которое увидело это значение. `unlock` мьютекса и следующий `lock` того же мьютекса. Конструктор `std::thread` и начало функции потока. Завершение потока и возврат из `join`. `set_value` у promise и `get` у future.", "happens-before: транзитивное замыкание этих двух. Если запись happens-before чтения - чтение её увидит, и гонки данных нет."]}, {"type": "p", "text": "Порядки памяти (`std::memory_order`):"}, {"type": "list", "items": ["`seq_cst` - по умолчанию. Acquire/release плюс единый глобальный порядок всех seq_cst-операций. Самый понятный и чуть дороже: например, seq_cst-store на x86 - это `xchg` с полным барьером.", "`acquire` (для load): чтения и записи после него не переедут выше.", "`release` (для store): чтения и записи до него не переедут ниже.", "`acq_rel` - для RMW (`fetch_add`, CAS), которые и читают, и пишут.", "`relaxed` - только атомарность и единый порядок изменений одной переменной. Никакой синхронизации с другими данными.", "`consume` - не используйте: компиляторы трактуют его как acquire, а в C++26 он объявлен deprecated."]}, {"type": "p", "text": "Главный пример - публикация данных через флаг. Release-запись \"публикует\" всё, что было записано до неё; acquire-чтение, увидевшее true, видит всё опубликованное."}, {"type": "code", "code": "#include <atomic>\n#include <cassert>\n#include <iostream>\n#include <string>\n#include <thread>\n\nstd::string data;               // обычные данные\nstd::atomic<bool> ready{false};\n\nvoid producer() {\n    data = \"payload\";                              // (1)\n    ready.store(true, std::memory_order_release);  // (2) публикуем\n}\n\nvoid consumer() {\n    while (!ready.load(std::memory_order_acquire)) {  // (3)\n    }\n    assert(data == \"payload\");  // (4) гарантировано: 1 -> 2 -> 3 -> 4\n    std::cout << data << '\\n';\n}\n\nint main() {\n    std::thread c(consumer), p(producer);\n    p.join();\n    c.join();\n}", "expect": "payload"}, {"type": "p", "text": "Если поставить `relaxed` в (2) и (3), между (1) и (4) нет happens-before: это гонка данных на `data`, UB. На ARM (Apple M, Graviton) на практике можно увидеть пустую строку. На x86 обычно \"работает\" - поэтому такие баги живут годами."}, {"type": "code", "code": "#include <atomic>\n#include <thread>\n\n#include <iostream>\n\nint data = 0;\nstd::atomic<bool> ready{false};\n\nint main() {\n    std::thread p([] {\n        data = 42;\n        ready.store(true, std::memory_order_relaxed);  // БАГ\n    });\n    std::thread c([] {\n        while (!ready.load(std::memory_order_relaxed)) {}\n        std::cout << data << '\\n';  // гонка: нет happens-before\n    });\n    p.join();\n    c.join();\n}", "mode": "tsan"}, {"type": "p", "text": "Когда relaxed - нормально: счётчик статистики. Нам важно только итоговое число, а читаем его после `join` (join сам даёт happens-before) или для метрик, где неточность \"на лету\" допустима."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <thread>\n#include <vector>\n\nstd::atomic<long> requests{0};\n\nint main() {\n    std::vector<std::thread> ts;\n    for (int t = 0; t < 4; ++t)\n        ts.emplace_back([] {\n            for (int i = 0; i < 100000; ++i)\n                requests.fetch_add(1, std::memory_order_relaxed);\n        });\n    for (auto& th : ts) th.join();  // join синхронизирует\n    std::cout << requests.load(std::memory_order_relaxed) << '\\n';\n}", "expect": "400000"}, {"type": "p", "text": "Где acquire/release недостаточно - store buffering (алгоритм Деккера). Каждый поток пишет свой флаг и читает чужой. Только если все четыре операции seq_cst, исход \"оба прочитали 0\" запрещён. С acquire/release он разрешён - и реально наблюдается даже на x86, из-за буфера записи. Программа ниже прогоняет тест 20000 раз: для seq_cst счётчик всегда 0, для release/acquire число зависит от машины и запуска."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <thread>\n\nstd::atomic<int> x{0}, y{0};\nstd::atomic<int> arrived{0};\nint r1, r2;\n\nvoid sync_point(int n) {  // простой спин-барьер на 2 потока\n    arrived.fetch_add(1);\n    for (int k = 0; arrived.load() < n; ++k)\n        if (k > 1000) std::this_thread::yield();\n}\n\n// Store buffering: в скольких раундах r1 == 0 && r2 == 0\ntemplate <std::memory_order St, std::memory_order Ld>\nint both_zero(int runs) {\n    arrived = 0;\n    std::thread t([runs] {\n        for (int i = 1; i <= runs; ++i) {\n            sync_point(4 * i - 2);  // старт раунда\n            y.store(1, St);\n            r2 = x.load(Ld);\n            sync_point(4 * i);      // конец раунда\n        }\n    });\n    int hits = 0;\n    for (int i = 1; i <= runs; ++i) {\n        x = 0;\n        y = 0;\n        sync_point(4 * i - 2);\n        x.store(1, St);\n        r1 = y.load(Ld);\n        sync_point(4 * i);\n        hits += (r1 == 0 && r2 == 0);\n    }\n    t.join();\n    return hits;\n}\n\nint main() {\n    using std::memory_order;\n    std::cout << \"seq_cst: \"\n              << both_zero<memory_order::seq_cst,\n                           memory_order::seq_cst>(20000)\n              << '\\n';  // всегда 0\n    std::cout << \"release/acquire: \"\n              << both_zero<memory_order::release,\n                           memory_order::acquire>(20000)\n              << '\\n';  // обычно > 0, зависит от машины\n}"}, {"type": "warn", "text": "`volatile` не имеет отношения к потокам. Он запрещает компилятору выкидывать обращения (для MMIO, setjmp, сигналов), но не даёт ни атомарности, ни упорядочивания между потоками. Гонка на volatile переменной - всё равно UB. `volatile` из Java - это ближе к `std::atomic` с seq_cst."}, {"type": "p", "text": "Практическое правило для собеседования: пишу без аргументов (seq_cst). Если спросят про оптимизацию - relaxed для счётчиков и флагов, которые ничего не публикуют; release/acquire для пары \"данные + флаг готовности\". Каждую ослабленную операцию объясняю вслух: что она публикует и кто это читает."}, {"type": "tip", "text": "Вслух: \"Здесь release-store публикует запись в data, а acquire-load в потребителе её забирает: запись data happens-before чтения. Счётчик - relaxed, читаю его после join\"."}]}, {"id": "mt-once", "title": "call_once, статические локальные, thread_local", "blocks": [{"type": "p", "text": "Ленивая инициализация \"ровно один раз\" - три инструмента."}, {"type": "p", "text": "1. Статическая локальная переменная (Meyers singleton). С C++11 инициализация потокобезопасна: если два потока одновременно вошли в функцию, один инициализирует, второй ждёт. Это самый простой и правильный способ."}, {"type": "code", "code": "#include <iostream>\n#include <mutex>\n#include <string>\n#include <thread>\n\nclass Logger {\npublic:\n    static Logger& instance() {\n        static Logger inst;  // ровно один раз, потокобезопасно\n        return inst;\n    }\n    void log(const std::string& s) {\n        std::lock_guard lk(m_);  // а это - уже наша забота\n        ++lines_;\n        (void)s;\n    }\n    int lines() {\n        std::lock_guard lk(m_);\n        return lines_;\n    }\n\nprivate:\n    Logger() = default;\n    std::mutex m_;\n    int lines_ = 0;\n};\n\nint main() {\n    std::thread a([] { Logger::instance().log(\"a\"); });\n    std::thread b([] { Logger::instance().log(\"b\"); });\n    a.join();\n    b.join();\n    std::cout << Logger::instance().lines() << '\\n';\n}", "expect": "2"}, {"type": "warn", "text": "Потокобезопасна только инициализация. Методы объекта по-прежнему нужно синхронизировать самим."}, {"type": "p", "text": "2. `std::call_once` + `std::once_flag` - когда инициализация привязана к объекту, а не к функции (например, ленивое подключение у каждого клиента). Если функция бросила исключение, флаг не выставляется, и следующий вызов попробует снова."}, {"type": "code", "code": "#include <iostream>\n#include <mutex>\n#include <stdexcept>\n\nclass Connection {\npublic:\n    void send(const char* msg) {\n        std::call_once(opened_, [this] { open(); });\n        std::cout << \"send \" << msg << '\\n';\n    }\n\nprivate:\n    void open() {\n        if (attempts_++ == 0) throw std::runtime_error(\"refused\");\n        std::cout << \"opened\\n\";\n    }\n    std::once_flag opened_;\n    int attempts_ = 0;  // меняется только внутри call_once\n};\n\nint main() {\n    Connection c;\n    try {\n        c.send(\"a\");\n    } catch (const std::exception& e) {\n        std::cout << \"error: \" << e.what() << '\\n';\n    }\n    c.send(\"b\");  // повторная попытка open()\n    c.send(\"c\");  // open() больше не вызывается\n}", "expect": "error: refused\nopened\nsend b\nsend c"}, {"type": "warn", "text": "Повтор после исключения - по стандарту. Но в части версий libstdc++ (GCC bug 66146) такой повторный вызов мог зависнуть. Не стройте логику ретраев на call_once: ретраи лучше делать явно."}, {"type": "p", "text": "3. Double-checked locking. Классическая версия с обычным указателем сломана: первое чтение `instance` - без синхронизации, это гонка данных; другой поток может увидеть указатель раньше, чем полностью сконструированный объект. Рабочая версия - через atomic с acquire/release. Но на собеседовании лучше сразу сказать \"static local\". Запустите пример: TSan найдёт гонку в `get_bad`, а `get` пройдёт чисто."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nstruct Widget {\n    int value = 42;\n};\n\n// СЛОМАНО: гонка на instance_bad\nWidget* instance_bad = nullptr;\nstd::mutex m;\nWidget* get_bad() {\n    if (!instance_bad) {            // чтение без синхронизации\n        std::lock_guard lk(m);\n        if (!instance_bad) instance_bad = new Widget;\n    }\n    return instance_bad;\n}\n\n// ПРАВИЛЬНО\nstd::atomic<Widget*> instance{nullptr};\nWidget* get() {\n    Widget* w = instance.load(std::memory_order_acquire);\n    if (!w) {\n        std::lock_guard lk(m);\n        w = instance.load(std::memory_order_relaxed);  // под замком\n        if (!w) {\n            w = new Widget;\n            instance.store(w, std::memory_order_release);\n        }\n    }\n    return w;\n}\n\nint main() {\n    Widget *a, *b, *c, *d;\n    std::thread t1([&] { a = get(); }), t2([&] { b = get(); });\n    t1.join();\n    t2.join();\n    std::cout << (a == b) << ' ' << a->value << '\\n';  // чисто\n\n    std::thread t3([&] { c = get_bad(); });\n    std::thread t4([&] { d = get_bad(); });\n    t3.join();\n    t4.join();\n    std::cout << (c == d) << ' ' << c->value << '\\n';  // TSan: race\n}", "mode": "tsan", "expect": "1 42\n1 42"}, {"type": "p", "text": "`thread_local` - у каждого потока своя копия переменной. Инициализируется при первом использовании в этом потоке, уничтожается при его завершении. Применение: генератор случайных чисел, буферы, локальные счётчики без синхронизации."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <random>\n#include <thread>\n#include <vector>\n\nint roll() {\n    // у каждого потока свой генератор: без замков и без гонок\n    thread_local std::mt19937 rng{std::random_device{}()};\n    std::uniform_int_distribution<int> d(1, 6);\n    return d(rng);\n}\n\nthread_local int calls = 0;  // своя копия в каждом потоке\nstd::atomic<int> total{0};\n\nvoid work() {\n    for (int i = 0; i < 1000; ++i) {\n        ++calls;\n        (void)roll();\n    }\n    total += calls;  // каждый поток прибавит свою 1000\n}\n\nint main() {\n    std::vector<std::thread> ts;\n    for (int i = 0; i < 4; ++i) ts.emplace_back(work);\n    for (auto& t : ts) t.join();\n    std::cout << total << ' ' << calls << '\\n';  // у main своя calls\n}", "expect": "4000 0"}, {"type": "warn", "text": "В пуле потоков `thread_local` живёт дольше задачи: следующая задача на том же воркере увидит \"грязное\" состояние. А корутина может продолжиться на другом потоке и увидеть чужую копию."}, {"type": "tip", "text": "Вслух: \"Синглтон - через static local, это потокобезопасно с C++11. Для инициализации на объект - call_once. DCLP руками писать не буду, а если надо - только через atomic с acquire/release\"."}]}, {"id": "mt-tasks-sync", "title": "Задачи: порядок потоков и параллельный расчёт", "blocks": [{"type": "p", "text": "Задача 1. Print in order. Три метода `first`, `second`, `third` вызываются из трёх потоков в произвольном порядке. Нужно, чтобы печать всегда шла first, second, third. Состояние - номер текущего этапа под мьютексом; каждый ждёт свой этап."}, {"type": "code", "code": "#include <condition_variable>\n#include <functional>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nclass InOrder {\npublic:\n    void first(const std::function<void()>& f) { run(0, f); }\n    void second(const std::function<void()>& f) { run(1, f); }\n    void third(const std::function<void()>& f) { run(2, f); }\n\nprivate:\n    void run(int my, const std::function<void()>& f) {\n        {\n            std::unique_lock lk(m_);\n            cv_.wait(lk, [&] { return stage_ == my; });\n        }\n        f();  // без замка: пока stage_ == my, никто не войдёт\n        {\n            std::lock_guard lk(m_);\n            ++stage_;\n        }\n        cv_.notify_all();  // ждут разные предикаты -> all\n    }\n\n    std::mutex m_;\n    std::condition_variable cv_;\n    int stage_ = 0;  // guarded by m_\n};\n\nint main() {\n    InOrder o;\n    std::thread c([&] { o.third([] { std::cout << \"third\\n\"; }); });\n    std::thread b([&] { o.second([] { std::cout << \"second\\n\"; }); });\n    std::thread a([&] { o.first([] { std::cout << \"first\\n\"; }); });\n    a.join();\n    b.join();\n    c.join();\n}", "expect": "first\nsecond\nthird"}, {"type": "warn", "text": "`notify_one` здесь - ошибка: на одной cv ждут потоки с разными предикатами. Разбуженный может оказаться \"не тем\", он проверит предикат, уснёт снова, и нужный поток не проснётся никогда."}, {"type": "p", "text": "Задача 2. N потоков печатают по кругу: T0 T1 T2 T0 T1 T2 ... Та же идея: общий `turn`, каждый ждёт своей очереди."}, {"type": "code", "code": "#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <thread>\n#include <vector>\n\nint main() {\n    const int kThreads = 3;\n    const int kRounds = 3;\n    std::mutex m;\n    std::condition_variable cv;\n    int turn = 0;  // guarded by m\n\n    std::vector<std::thread> ts;\n    for (int id = 0; id < kThreads; ++id)\n        ts.emplace_back([&, id] {\n            for (int r = 0; r < kRounds; ++r) {\n                std::unique_lock lk(m);\n                cv.wait(lk, [&] { return turn == id; });\n                std::cout << 'T' << id << ' ';\n                turn = (turn + 1) % kThreads;\n                lk.unlock();\n                cv.notify_all();\n            }\n        });\n    for (auto& t : ts) t.join();\n    std::cout << '\\n';\n}", "expect": "T0 T1 T2 T0 T1 T2 T0 T1 T2"}, {"type": "p", "text": "Если потоков много, `notify_all` будит всех ради одного. Улучшение: у каждого потока свой cv (`std::vector<std::condition_variable>`) и точечный `cvs[next].notify_one()`. Ещё вариант - семафоры C++20. Пинг-понг двух потоков:"}, {"type": "code", "code": "#include <iostream>\n#include <semaphore>\n#include <thread>\n\nint main() {\n    std::binary_semaphore ping_turn{1}, pong_turn{0};\n\n    std::thread ping([&] {\n        for (int i = 0; i < 3; ++i) {\n            ping_turn.acquire();\n            std::cout << \"ping \";\n            pong_turn.release();  // передали ход\n        }\n    });\n    std::thread pong([&] {\n        for (int i = 0; i < 3; ++i) {\n            pong_turn.acquire();\n            std::cout << \"pong \";\n            ping_turn.release();\n        }\n    });\n    ping.join();\n    pong.join();\n    std::cout << '\\n';\n}", "expect": "ping pong ping pong ping pong"}, {"type": "p", "text": "Задача 3. Параллельная сумма. Делим массив на куски, каждый кусок считает своя задача, результаты собираем через future. Данные только читаются - синхронизация не нужна; результаты возвращаются через future - гонки на общей сумме нет."}, {"type": "code", "code": "#include <algorithm>\n#include <cstddef>\n#include <future>\n#include <iostream>\n#include <numeric>\n#include <thread>\n#include <vector>\n\nlong long parallel_sum(const std::vector<int>& v, std::size_t n) {\n    if (n == 0) n = 1;\n    std::size_t chunk = (v.size() + n - 1) / n;\n    std::vector<std::future<long long>> parts;\n    for (std::size_t b = 0; b < v.size(); b += chunk) {\n        std::size_t e = std::min(b + chunk, v.size());\n        parts.push_back(std::async(std::launch::async, [&v, b, e] {\n            return std::accumulate(v.begin() + b, v.begin() + e, 0LL);\n        }));\n    }\n    long long total = 0;\n    for (auto& f : parts) total += f.get();  // и исключения тоже\n    return total;\n}\n\nint main() {\n    std::vector<int> v(1'000'000);\n    std::iota(v.begin(), v.end(), 1);\n    unsigned hc = std::thread::hardware_concurrency();\n    std::cout << parallel_sum(v, hc ? hc : 4) << '\\n';\n}", "expect": "500000500000"}, {"type": "p", "text": "То же на голых потоках: каждый пишет в свою ячейку вектора результатов. Разные элементы `vector<long long>` - разные ячейки памяти, гонки нет. `join` даёт happens-before для чтения результатов."}, {"type": "code", "code": "#include <cstddef>\n#include <iostream>\n#include <numeric>\n#include <thread>\n#include <vector>\n\nlong long sum_threads(const std::vector<int>& v, std::size_t n) {\n    std::vector<long long> partial(n, 0);\n    std::vector<std::thread> ts;\n    for (std::size_t t = 0; t < n; ++t)\n        ts.emplace_back([&, t] {\n            long long local = 0;          // копим в локальной\n            for (std::size_t i = t; i < v.size(); i += n)\n                local += v[i];\n            partial[t] = local;           // одна запись в конце\n        });\n    for (auto& th : ts) th.join();\n    return std::accumulate(partial.begin(), partial.end(), 0LL);\n}\n\nint main() {\n    std::vector<int> v(100000, 1);\n    std::cout << sum_threads(v, 4) << '\\n';\n}", "expect": "100000"}, {"type": "warn", "text": "Если потоки в цикле пишут прямо в `partial[t] += v[i]`, гонки нет, но будет false sharing: соседние элементы лежат в одной кэш-линии, и ядра будут отбирать её друг у друга. Копите в локальной переменной и пишите один раз."}, {"type": "tip", "text": "Вслух: \"Делю на куски по числу ядер, каждый кусок независим. Результаты - через future, исключения тоже придут через get. Для продакшена взял бы пул, а не async на каждый кусок\"."}]}, {"id": "mt-tasks-service", "title": "Задачи: LRU-кэш, rate limiter, шардированная мапа", "blocks": [{"type": "p", "text": "Задача 4. Потокобезопасный LRU-кэш. Структура: двусвязный список (порядок использования) + хеш-таблица ключ -> итератор в списке. `std::list::splice` переносит узел в начало за O(1) и не инвалидирует итераторы. Один мьютекс на весь кэш."}, {"type": "code", "code": "#include <cstddef>\n#include <iostream>\n#include <list>\n#include <mutex>\n#include <optional>\n#include <string>\n#include <thread>\n#include <unordered_map>\n#include <utility>\n#include <vector>\n\ntemplate <class K, class V>\nclass LruCache {\npublic:\n    explicit LruCache(std::size_t capacity) : cap_(capacity) {}\n\n    std::optional<V> get(const K& key) {\n        std::lock_guard lk(m_);\n        auto it = index_.find(key);\n        if (it == index_.end()) return std::nullopt;\n        items_.splice(items_.begin(), items_, it->second);\n        return it->second->second;  // копия под замком\n    }\n\n    void put(const K& key, V value) {\n        std::lock_guard lk(m_);\n        if (auto it = index_.find(key); it != index_.end()) {\n            it->second->second = std::move(value);\n            items_.splice(items_.begin(), items_, it->second);\n            return;\n        }\n        items_.emplace_front(key, std::move(value));\n        index_[key] = items_.begin();\n        if (items_.size() > cap_) {\n            index_.erase(items_.back().first);\n            items_.pop_back();\n        }\n    }\n\nprivate:\n    using Item = std::pair<K, V>;\n    using Iter = typename std::list<Item>::iterator;\n\n    std::mutex m_;\n    std::list<Item> items_;  // начало - самый свежий\n    std::unordered_map<K, Iter> index_;\n    const std::size_t cap_;\n};\n\nint main() {\n    LruCache<std::string, int> c(2);\n    c.put(\"a\", 1);\n    c.put(\"b\", 2);\n    (void)c.get(\"a\");     // a стал свежим\n    c.put(\"c\", 3);        // вытесняет b\n    std::cout << c.get(\"a\").has_value() << c.get(\"b\").has_value()\n              << c.get(\"c\").has_value() << '\\n';\n\n    LruCache<int, int> shared(100);\n    std::vector<std::thread> ts;\n    for (int t = 0; t < 4; ++t)\n        ts.emplace_back([&, t] {\n            for (int i = 0; i < 1000; ++i) {\n                shared.put(i % 150, t);\n                (void)shared.get(i % 70);\n            }\n        });\n    for (auto& th : ts) th.join();\n}", "expect": "101"}, {"type": "warn", "text": "`get` в LRU - это запись: он переставляет элемент в списке. Поэтому `shared_mutex` с `shared_lock` в `get` здесь неверен - два читателя одновременно сделают splice и порвут список."}, {"type": "p", "text": "Что сказать про масштабирование: один мьютекс на горячем кэше - узкое место. Варианты: шардировать (N независимых LRU по хешу ключа, вытеснение становится приблизительным); не двигать элемент при каждом чтении (CLOCK / \"обновлять не чаще раза в X мс\"); возвращать `shared_ptr<const V>`, чтобы не копировать большие значения под замком."}, {"type": "p", "text": "Задача 5. Rate limiter, token bucket. В ведре до `burst` токенов, пополняется со скоростью `rate` в секунду. Запрос забирает токен или получает отказ. Пополнение считаем лениво при каждом вызове."}, {"type": "code", "code": "#include <algorithm>\n#include <chrono>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nclass TokenBucket {\npublic:\n    using Clock = std::chrono::steady_clock;  // не system_clock!\n\n    TokenBucket(double rate_per_sec, double burst)\n        : rate_(rate_per_sec), burst_(burst), tokens_(burst),\n          last_(Clock::now()) {}\n\n    bool try_acquire(double n = 1.0) {\n        std::lock_guard lk(m_);\n        refill(Clock::now());\n        if (tokens_ < n) return false;\n        tokens_ -= n;\n        return true;\n    }\n\nprivate:\n    void refill(Clock::time_point now) {  // вызывать под m_\n        std::chrono::duration<double> dt = now - last_;\n        tokens_ = std::min(burst_, tokens_ + dt.count() * rate_);\n        last_ = now;\n    }\n\n    std::mutex m_;\n    const double rate_;\n    const double burst_;\n    double tokens_;            // guarded by m_\n    Clock::time_point last_;   // guarded by m_\n};\n\nint main() {\n    using namespace std::chrono_literals;\n    TokenBucket tb(10.0, 5.0);  // 10 rps, всплеск до 5\n    int ok = 0;\n    for (int i = 0; i < 20; ++i) ok += tb.try_acquire();\n    std::cout << ok << '\\n';    // сожгли весь всплеск\n    std::this_thread::sleep_for(200ms);\n    ok = 0;\n    for (int i = 0; i < 20; ++i) ok += tb.try_acquire();\n    std::cout << (ok >= 1 && ok <= 3) << '\\n';  // ~2 за 200 мс\n}", "expect": "5\n1"}, {"type": "list", "items": ["`steady_clock`, потому что системное время может прыгнуть (NTP, ручная правка) - тогда `dt` станет отрицательным или огромным.", "Лимит на пользователя: `unordered_map<UserId, TokenBucket>` с шардированием (см. ниже) и вытеснением неактивных.", "Блокирующий `acquire`: посчитать под замком, сколько ждать до токена, и спать уже без замка.", "Альтернативы: fixed window (проще, но всплеск на границе окна), sliding window log (точнее, но память), распределённый лимит - через Redis/общий сервис."]}, {"type": "p", "text": "Задача 6. Счётчики по ключу на 1M RPS - lock striping. Один мьютекс на всю мапу - все ядра стоят в очереди к одной кэш-линии. Делим на N шардов, у каждого свой мьютекс и своя мапа; ключ попадает в шард по хешу. Конкуренция падает примерно в N раз."}, {"type": "code", "code": "#include <array>\n#include <cstddef>\n#include <functional>\n#include <iostream>\n#include <mutex>\n#include <string>\n#include <thread>\n#include <unordered_map>\n#include <vector>\n\nclass ShardedCounter {\npublic:\n    void add(const std::string& key, long delta = 1) {\n        Shard& s = shard_for(key);\n        std::lock_guard lk(s.m);\n        s.map[key] += delta;\n    }\n\n    long get(const std::string& key) const {\n        const Shard& s = shard_for(key);\n        std::lock_guard lk(s.m);\n        auto it = s.map.find(key);\n        return it == s.map.end() ? 0 : it->second;\n    }\n\n    // Согласован внутри шарда, но не атомарен целиком\n    std::unordered_map<std::string, long> snapshot() const {\n        std::unordered_map<std::string, long> out;\n        for (const Shard& s : shards_) {\n            std::lock_guard lk(s.m);  // по одному шарду за раз\n            out.insert(s.map.begin(), s.map.end());\n        }\n        return out;\n    }\n\nprivate:\n    static constexpr std::size_t kShards = 64;  // степень двойки\n\n    struct alignas(64) Shard {  // свой кэш-лайн: нет false sharing\n        mutable std::mutex m;\n        std::unordered_map<std::string, long> map;\n    };\n\n    std::size_t index(const std::string& key) const {\n        return std::hash<std::string>{}(key) & (kShards - 1);\n    }\n    Shard& shard_for(const std::string& k) {\n        return shards_[index(k)];\n    }\n    const Shard& shard_for(const std::string& k) const {\n        return shards_[index(k)];\n    }\n\n    std::array<Shard, kShards> shards_;\n};\n\nint main() {\n    ShardedCounter c;\n    std::vector<std::thread> ts;\n    for (int t = 0; t < 8; ++t)\n        ts.emplace_back([&] {\n            for (int i = 0; i < 10000; ++i)\n                c.add(\"user\" + std::to_string(i % 10));\n        });\n    for (auto& th : ts) th.join();\n\n    long total = 0;\n    for (auto& [k, v] : c.snapshot()) total += v;\n    std::cout << total << ' ' << c.get(\"user3\") << '\\n';\n}", "expect": "80000 8000"}, {"type": "p", "text": "Что проговорить:"}, {"type": "list", "items": ["Выбор числа шардов: порядка 4-16 на ядро, степень двойки - чтобы брать индекс маской. Хеш должен хорошо перемешивать младшие биты.", "`snapshot` берёт шарды по одному: никогда не держим два замка - нет дедлока, но и нет глобальной атомарности. Если нужна атомарность - `std::scoped_lock` по всем шардам в фиксированном порядке (дорого).", "Горячий ключ всё равно бьёт в один шард. Дальше: `shared_mutex` на шард + `std::atomic<long>` в значениях (инкремент под shared_lock, вставка нового ключа под unique_lock), или per-thread счётчики (`thread_local`), которые периодически сливаются.", "`alignas(64)` - чтобы мьютексы соседних шардов не делили кэш-линию (false sharing). Есть `std::hardware_destructive_interference_size`, но не во всех стандартных библиотеках."]}, {"type": "tip", "text": "Вслух: \"Для 1M RPS один мьютекс - бутылочное горлышко. Шардирую по хешу ключа, шарды выравниваю по кэш-линии. Глобальные операции - по одному шарду за раз, это даёт согласованность только внутри шарда\"."}]}, {"id": "mt-primitives", "title": "Карта примитивов синхронизации", "blocks": [{"type": "p", "text": "Шпаргалка на вопрос \"что ещё есть в C++, кроме mutex\". Отвечайте группами: замки, ожидание, атомики, однократная инициализация, результаты задач, потоки и отмена."}, {"type": "p", "text": "Мьютексы (`<mutex>`, `<shared_mutex>`):"}, {"type": "list", "items": ["`mutex` - базовый. Повторный lock тем же потоком - UB.", "`timed_mutex` - плюс `try_lock_for` / `try_lock_until`.", "`recursive_mutex` - тот же поток может захватить повторно. Обычно признак плохого дизайна.", "`recursive_timed_mutex` - рекурсивный с таймаутами.", "`shared_mutex` (C++17) - читатели и писатель.", "`shared_timed_mutex` (C++14) - то же с таймаутами; появился раньше `shared_mutex`.", "`shared_recursive_mutex` в стандарте нет."]}, {"type": "p", "text": "RAII-замки:"}, {"type": "list", "items": ["`lock_guard` - захват на всю область, ничего лишнего.", "`unique_lock` - перемещаемый, `unlock()`/`lock()`, тэги `defer_lock`, `try_to_lock`, `adopt_lock`. Нужен для `condition_variable`.", "`scoped_lock` (C++17) - несколько мьютексов без дедлока.", "`shared_lock` - разделяемый захват `shared_mutex`.", "Свободные функции `std::lock(a, b, ...)` и `std::try_lock(...)`."]}, {"type": "p", "text": "Ожидание:"}, {"type": "list", "items": ["`condition_variable` - только с `unique_lock<mutex>`.", "`condition_variable_any` - с любым замком; умеет ждать с `stop_token`.", "`latch`, `barrier`, `counting_semaphore`, `binary_semaphore` (C++20).", "`atomic<T>::wait` / `notify_one` / `notify_all`, то же у `atomic_flag` (C++20)."]}, {"type": "p", "text": "Атомики (`<atomic>`):"}, {"type": "list", "items": ["`atomic<T>` - load/store/exchange/CAS/fetch_add, порядки памяти.", "`atomic_flag` - единственный тип, гарантированно lock-free.", "`atomic_ref<T>` (C++20) - атомарные операции над обычным объектом. Пока по объекту работают через atomic_ref, обычный доступ из других потоков - гонка.", "`atomic<shared_ptr<T>>` (C++20), `atomic_thread_fence`."]}, {"type": "p", "text": "Однократная инициализация и данные потока:"}, {"type": "list", "items": ["`call_once` + `once_flag`.", "Статическая локальная переменная - потокобезопасная инициализация с C++11.", "`thread_local` - у каждого потока своя копия."]}, {"type": "p", "text": "Результаты задач (`<future>`):"}, {"type": "list", "items": ["`promise` / `future` - одно значение или исключение, `get()` один раз.", "`shared_future` - много ждущих, у каждого своя копия.", "`packaged_task` - callable + future; основа пула потоков.", "`async` - запустить и получить future (осторожно с деструктором)."]}, {"type": "p", "text": "Потоки, отмена, вывод:"}, {"type": "list", "items": ["`thread`, `jthread` (C++20, join в деструкторе).", "`stop_source` / `stop_token` / `stop_callback` - кооперативная отмена.", "`osyncstream` (`<syncstream>`, C++20) - копит вывод и выдаёт целиком в деструкторе: строки разных потоков не перемешиваются. Порядок строк между потоками не гарантирует.", "`hardware_destructive_interference_size` - размер для `alignas` против false sharing."]}, {"type": "p", "text": "C++26: `<hazard_pointer>` и `<rcu>` - безопасное освобождение памяти в lock-free структурах. В gcc 14 их ещё нет."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <syncstream>\n#include <thread>\n#include <vector>\n\nint main() {\n    int hits = 0;  // обычный int, например поле чужой структуры\n    {\n        std::vector<std::jthread> ts;\n        for (int i = 0; i < 4; ++i)\n            ts.emplace_back([&hits] {\n                std::atomic_ref<int> r(hits);  // C++20\n                for (int j = 0; j < 1000; ++j) r.fetch_add(1);\n                // строка выйдет целиком, не вперемешку\n                std::osyncstream(std::cout)\n                    << \"added \" << 1000 << '\\n';\n            });\n    }   // join: дальше снова можно читать hits напрямую\n    std::cout << hits << '\\n';\n}\n", "mode": "tsan", "expect": "added 1000\nadded 1000\nadded 1000\nadded 1000\n4000"}, {"type": "p", "text": "Что выбрать:"}, {"type": "list", "items": ["Общие данные из нескольких полей - `mutex` + `lock_guard` / `scoped_lock`.", "Один счётчик или флаг - `atomic`.", "Ждать условия - `condition_variable` с предикатом; один флаг - `atomic::wait`.", "Чтений много, записей мало - `shared_mutex` или снапшот через `shared_ptr`.", "Лимит параллелизма - `counting_semaphore`.", "Дождаться N - `latch`; фазы - `barrier`.", "Ленивая инициализация - статическая локальная или `call_once`.", "Результат одной задачи - `future`; много задач - пул + `future`.", "Данные между этапами - bounded queue / канал.", "Отмена - `jthread` + `stop_token`.", "Лучше всего - ничего не делить: `thread_local`, шарды и слияние в конце."]}, {"type": "tip", "text": "На вопрос \"что есть кроме mutex\": \"Замки - mutex, timed, recursive, shared и RAII-обёртки. Ожидание - condition_variable, а с C++20 latch, barrier, семафоры, atomic wait. Атомики, включая atomic_ref. call_once и magic statics. future/promise. jthread и stop_token\". Дальше - что из этого выбрали бы для задачи и почему."}]}, {"id": "mt-checklist", "title": "Чек-лист на собеседовании", "blocks": [{"type": "p", "text": "Секция идёт в редакторе без компилятора, и думать нужно вслух. Вот порядок, который хорошо работает."}, {"type": "list", "items": ["1. Уточнить семантику. Блокирующие операции или try? Таймауты? Ограничен ли размер? Сколько производителей и потребителей? Что делать при shutdown: дочитать или выбросить? Нужна ли справедливость?", "2. Назвать состояние и инварианты. \"Здесь очередь и флаг closed, оба под одним мьютексом. Инвариант: size <= cap; после closed новых элементов нет\".", "3. Выбрать примитивы и объяснить почему: mutex + cv для ожидания, atomic для одиночного счётчика, shared_mutex - только для read-mostly.", "4. Написать код. Сначала простой и правильный, потом оптимизировать.", "5. Прогнать сценарии вслух: два производителя одновременно; close, пока кто-то ждёт; исключение в задаче; деструктор во время работы.", "6. Сказать про масштабирование: шардирование, батчинг, lock-free только при необходимости. Тестирование: стресс-тест под TSan."]}, {"type": "p", "text": "Скелет класса, который подходит почти к любой задаче секции:"}, {"type": "code", "code": "#include <condition_variable>\n#include <iostream>\n#include <mutex>\n\nclass Thing {\npublic:\n    bool op(int x) {\n        std::unique_lock lk(m_);\n        cv_.wait(lk, [this] { return closed_ || ready_locked(); });\n        if (closed_) return false;\n        apply_locked(x);           // инварианты восстановлены\n        lk.unlock();\n        cv_.notify_one();          // звоним без замка\n        // колбэки, логи, I/O - только здесь, без замка\n        return true;\n    }\n    void close() {\n        {\n            std::lock_guard lk(m_);\n            closed_ = true;\n        }\n        cv_.notify_all();          // shutdown - будим всех\n    }\n\nprivate:\n    bool ready_locked() const { return value_ < 100; }  // под m_\n    void apply_locked(int x) { value_ += x; }           // под m_\n\n    std::mutex m_;                 // guards: всё ниже\n    std::condition_variable cv_;\n    int value_ = 0;\n    bool closed_ = false;\n};\n\nint main() {\n    Thing t;\n    std::cout << t.op(1) << ' ';\n    t.close();\n    std::cout << t.op(1) << '\\n';  // после close - отказ\n}", "expect": "1 0"}, {"type": "p", "text": "Что говорить вслух (интервьюер ставит за это баллы):"}, {"type": "list", "items": ["Кто владеет данными и потоками; где создаются и где join.", "Какой мьютекс что защищает; какие инварианты.", "Все замки - RAII, никаких ручных `lock/unlock`.", "Под замком - только изменение структуры. Никаких пользовательских колбэков, I/O, `future.get()`, `join`, сна.", "Критическая секция маленькая, но составная операция атомарна целиком (не empty()+pop()).", "Порядок захвата нескольких замков фиксирован или `scoped_lock`.", "Ожидание - только с предикатом; предикат учитывает shutdown.", "Исключения: где могут вылететь, что останется в каком состоянии, как дойдут до вызывающего (future).", "Shutdown: что будет с ждущими, с недоделанными задачами, с потоками."]}, {"type": "p", "text": "Самопроверка перед тем, как сказать \"готово\":"}, {"type": "list", "items": ["`cv.wait` без предиката или через `if`.", "Состояние для cv меняется без мьютекса.", "`notify_one` там, где разные предикаты или shutdown.", "Забыт notify в `close()`/деструкторе.", "Ссылка/итератор на защищённые данные возвращается наружу.", "Check-then-act через два отдельных захвата.", "Joinable `std::thread` разрушается; `detach` с захватом по ссылке.", "Лямбда в цикле захватывает счётчик по ссылке `[&]`.", "Результат `std::async` не сохранён.", "Повторный lock того же мьютекса через вызов публичного метода.", "Флаг `bool` без atomic; `vector<bool>` из разных потоков.", "Попытка апгрейда `shared_lock` до `unique_lock`.", "Члены класса: поток объявлен раньше данных, которые использует.", "Busy-wait без сна там, где нужен cv."]}, {"type": "p", "text": "Тренировка для секции \"доработай код\": найдите все проблемы до того, как читать разбор. Потом запустите: TSan и `std::terminate` подтвердят часть ответов."}, {"type": "code", "code": "#include <chrono>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nclass Ticker {  // найдите баги\npublic:\n    void start() {\n        t_ = std::thread([&] { while (!stop_) tick(); });\n    }\n    void stop() { stop_ = true; }\n    int value() { return n_; }\n    ~Ticker() {}\n\nprivate:\n    void tick() {\n        std::lock_guard lk(m_);\n        ++n_;\n    }\n    std::thread t_;\n    std::mutex m_;\n    bool stop_ = false;\n    int n_ = 0;\n};\n\nTicker ticker;\n\nint main() {\n    ticker.start();\n    std::this_thread::sleep_for(std::chrono::milliseconds(5));\n    std::cout << (ticker.value() > 0) << std::endl;\n    ticker.stop();\n}   // запустите: что напишет TSan и чем кончится ~Ticker?", "mode": "tsan"}, {"type": "list", "items": ["`stop_` - обычный bool, его пишут и читают разные потоки: гонка данных, цикл может не остановиться.", "`value()` читает `n_` без мьютекса: гонка данных.", "Деструктор не делает join: если `start()` был вызван, `~thread` на joinable потоке вызовет `std::terminate`.", "Повторный `start()` присваивает в joinable `t_` - тоже terminate.", "Если заменить на `jthread` \"в лоб\", он объявлен первым и разрушится последним - уже после `m_` и `n_`, которые использует поток."]}, {"type": "code", "code": "#include <atomic>\n#include <chrono>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nclass Ticker {\npublic:\n    void start() {\n        std::lock_guard lk(m_);\n        if (t_.joinable()) return;  // уже запущен\n        t_ = std::jthread([this](std::stop_token st) {\n            while (!st.stop_requested()) tick();\n        });\n    }\n    int value() const {\n        std::lock_guard lk(m_);\n        return n_;\n    }\n\nprivate:\n    void tick() {\n        std::lock_guard lk(m_);\n        ++n_;\n    }\n    mutable std::mutex m_;\n    int n_ = 0;        // guarded by m_\n    std::jthread t_;   // последним: остановится первым\n};\n\nint main() {\n    Ticker t;\n    t.start();\n    std::this_thread::sleep_for(std::chrono::milliseconds(5));\n    std::cout << (t.value() > 0) << '\\n';\n}   // ~jthread: request_stop + join", "expect": "1"}, {"type": "p", "text": "Обратите внимание на тонкость в исправлении: `start()` присваивает `t_` под `m_`, а поток в `tick()` берёт тот же `m_`. Дедлока нет: присваивание в не-joinable `t_` не ждёт поток. Но если бы `stop()` делал join под `m_` - был бы дедлок. Такие места и стоит проговаривать."}, {"type": "tip", "text": "Финальная фраза: \"Проверю себя: все ожидания с предикатом, shutdown будит всех, под замком нет чужого кода, исключения не теряются, все потоки присоединяются. В проде - стресс-тест под TSan\"."}]}], "quiz": [{"id": "mt-q1", "lesson": "mt-thread", "q": "Что произойдёт при вызове `f()`?", "code": "void f() {\n    std::thread t([] { std::puts(\"hi\"); });\n}   // конец функции", "options": ["`std::terminate`: разрушается joinable `std::thread`", "Деструктор сам вызовет `join()` и дождётся печати", "Деструктор вызовет `detach()`, поток допечатает в фоне", "Ничего плохого: поток короткий и успеет завершиться", "Ошибка компиляции: поток не сохранён и не присоединён"], "answer": 0, "explain": "Деструктор `std::thread` на joinable объекте вызывает `std::terminate`, независимо от того, успел ли поток отработать. Неявного join или detach нет (неявный join есть только у `std::jthread`)."}, {"id": "mt-q2", "lesson": "mt-thread", "q": "Что будет с этим кодом?", "code": "void inc(int& x) { ++x; }\n\nint main() {\n    int n = 0;\n    std::thread t(inc, n);\n    t.join();\n    std::cout << n;\n}", "options": ["Выведет 0: поток увеличил свою копию", "Не скомпилируется: аргумент копируется и передаётся как rvalue, `int&` к нему не привяжется", "Выведет 1: аргумент передан по ссылке", "UB: ссылка на `n` висит после `join`"], "answer": 1, "explain": "`std::thread` делает decay-copy аргументов и вызывает функцию с rvalue. Неконстантная lvalue-ссылка к rvalue не привязывается - ошибка компиляции где-то в недрах `<thread>`. Нужно `std::ref(n)`. Вариант \"0\" был бы верен для параметра по значению или `const int&`."}, {"id": "mt-q3", "lesson": "mt-thread", "q": "Что напечатает этот код?", "code": "std::vector<std::thread> ts;\nfor (int i = 0; i < 3; ++i)\n    ts.emplace_back([&] { std::cout << i; });\nfor (auto& t : ts) t.join();", "options": ["Всегда 012", "0, 1, 2 в произвольном порядке", "Ничего определённого: `i` захвачена по ссылке, цикл её меняет и она умирает раньше потоков - гонка и UB", "Всегда 333", "Не скомпилируется: `i` нельзя захватить по ссылке"], "answer": 2, "explain": "Все лямбды держат ссылку на одну переменную `i`. Главный поток пишет её (`++i`) одновременно с чтением в потоках - гонка данных, а после выхода из цикла `i` вообще не существует. Правильно - `[i]` (захват по значению)."}, {"id": "mt-q4", "lesson": "mt-thread", "q": "Что верно после `t.detach()`?", "options": ["`main` не завершится, пока detached-поток не закончит", "Позже можно вызвать `t.join()`, чтобы всё-таки дождаться", "Поток остановится при разрушении объекта `t`", "Поток работает дальше сам по себе, `t.joinable() == false`; при выходе из `main` процесс завершится, не дожидаясь его", "Поток получает копии всех локальных переменных, поэтому захват по ссылке безопасен"], "answer": 3, "explain": "detach разрывает связь объекта с потоком. Дождаться его больше нельзя никак (join на не-joinable объекте бросит `std::system_error`). При возврате из `main` вызываются деструкторы статиков и процесс завершается - detached-поток обрывается посреди работы."}, {"id": "mt-q5", "lesson": "mt-thread", "q": "Что не так с этой функцией?", "code": "void f(int id, const std::string& s);\n\nvoid oops(int x) {\n    char buf[32];\n    std::snprintf(buf, sizeof buf, \"%d\", x);\n    std::thread t(f, 1, buf);\n    t.detach();\n}", "options": ["Всё безопасно: `std::thread` копирует аргументы, и `f` получит свою копию строки", "Безопасно: `const std::string&` продлевает жизнь временной строки", "Не скомпилируется: `char[32]` не приводится к `std::string`", "Гонка данных: новый поток читает `buf`, пока `oops` ещё пишет в него `snprintf`", "Висячий указатель: в поток копируется только адрес `buf` (`char*`), а `std::string` из него строится уже в новом потоке - когда `oops` мог вернуться и `buf` уже нет"], "answer": 4, "explain": "`std::thread` копирует аргументы как есть. Массив `buf` при передаче превращается в указатель `char*`, и копируется только этот адрес, а не символы. Строка `std::string` создаётся позже, при вызове `f` уже в новом потоке. После `detach` функция `oops` может вернуться раньше, и `buf` на стеке исчезнет - поток прочитает мусор. Гонки с `snprintf` нет: он заканчивается до создания потока. С `join` всё было бы корректно: `buf` жил бы до конца потока. Лечение: `std::thread t(f, 1, std::string(buf));` - тогда в поток копируется готовая строка."}, {"id": "mt-q6", "lesson": "mt-thread", "q": "Исключение вылетает из функции потока. Что увидит этот код?", "code": "std::thread t([] { throw std::runtime_error(\"x\"); });\ntry {\n    t.join();\n} catch (...) {\n    std::puts(\"caught\");\n}", "options": ["Ничего: вызовется `std::terminate` ещё в потоке", "Напечатает caught: `join` пробрасывает исключение", "Напечатает caught: исключение придёт как `std::system_error`", "Исключение молча проглотится, поток
