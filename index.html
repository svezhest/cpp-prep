 точки — 0).", "prefix": "#include <iostream>\n#include <variant>\n#include <vector>\n\nstruct Square { int side; };\nstruct Rect { int w; int h; };\nstruct Dot {};\n\nusing Shape = std::variant<Square, Rect, Dot>;\n\ntemplate <class... Fs>\nstruct Overloaded : Fs... {\n    using Fs::operator()...;\n};", "code": "int Area(const Shape& s) {\n    return std::visit(Overloaded{\n        [](const Square& q) { return q.side * q.side; },\n        // TODO: Rect и Dot\n    }, s);\n}", "check": "int main() {\n    std::vector<Shape> shapes{\n        Square{3}, Rect{2, 3}, Dot{}, Rect{4, 1}};\n    std::vector<int> got;\n    for (const auto& s : shapes) {\n        got.push_back(Area(s));\n        std::cout << got.back() << ' ';\n    }\n    std::cout << '\\n';\n    bool ok = got == std::vector<int>{9, 6, 0, 4};\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "9 6 0 4\nOK", "hint": "`std::visit` требует, чтобы visitor вызывался для каждой альтернативы. Добавь две лямбды в `Overloaded{...}`.", "solution": "int Area(const Shape& s) {\n    return std::visit(Overloaded{\n        [](const Square& q) { return q.side * q.side; },\n        [](const Rect& r) { return r.w * r.h; },\n        [](const Dot&) { return 0; },\n    }, s);\n}"}, {"id": "modern-t16", "lesson": "modern-vocab", "title": "std::expected для ошибок парсинга", "task": "Напиши `ParsePort`: порт 1..65535 или текст ошибки. Ошибка — штатный исход, исключения не бросай: проверка их ловит и считает провалом.", "prefix": "#include <charconv>\n#include <expected>\n#include <iostream>\n#include <string>\n#include <string_view>", "code": "// Порт 1..65535. Ошибки: \"empty\", \"not a number\", \"out of range\".\nstd::expected<int, std::string> ParsePort(std::string_view s) {\n    // TODO\n    return 0;\n}", "check": "std::string Show(std::string_view s) {\n    auto port = ParsePort(s);\n    return port ? \"ok \" + std::to_string(*port)\n                : \"error: \" + port.error();\n}\n\nint main() {\n    struct Case { std::string_view in, want; };\n    const Case cases[] = {\n        {\"8080\", \"ok 8080\"},\n        {\"\", \"error: empty\"},\n        {\"80x\", \"error: not a number\"},\n        {\"x80\", \"error: not a number\"},\n        {\"70000\", \"error: out of range\"},\n        {\"0\", \"error: out of range\"},\n        {\"65535\", \"ok 65535\"},\n        {\"99999999999\", \"error: out of range\"},\n    };\n    bool ok = true;\n    try {\n        for (const auto& c : cases) {\n            std::string got = Show(c.in);\n            std::cout << got << '\\n';\n            ok = ok && got == c.want;\n        }\n    } catch (...) {\n        std::cout << \"exception\\n\";\n        ok = false;\n    }\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "ok 8080\nerror: empty\nerror: not a number\nerror: not a number\nerror: out of range\nerror: out of range\nok 65535\nerror: out of range\nOK", "hint": "`std::from_chars` возвращает `{ptr, ec}`. Хвост после числа — `ptr != end`. Ошибку верни через `std::unexpected(\"...\")`.", "solution": "// Порт 1..65535. Ошибки: \"empty\", \"not a number\", \"out of range\".\nstd::expected<int, std::string> ParsePort(std::string_view s) {\n    if (s.empty()) {\n        return std::unexpected(\"empty\");\n    }\n    int value = 0;\n    const char* end = s.data() + s.size();\n    auto [ptr, ec] = std::from_chars(s.data(), end, value);\n    if (ec == std::errc::result_out_of_range) {\n        return std::unexpected(\"out of range\");\n    }\n    if (ec != std::errc{} || ptr != end) {\n        return std::unexpected(\"not a number\");\n    }\n    if (value < 1 || value > 65535) {\n        return std::unexpected(\"out of range\");\n    }\n    return value;\n}"}, {"id": "modern-t17", "lesson": "modern-syntax", "title": "if constexpr", "task": "`Describe` не компилируется для `std::string`, хотя ветка с `to_string` для неё не выполняется. Почини двумя словами.", "prefix": "#include <iostream>\n#include <string>\n#include <type_traits>\n#include <vector>", "code": "template <typename T>\nstd::string Describe(const T& value) {\n    if (std::is_integral_v<T>) {\n        return \"int:\" + std::to_string(value);\n    } else if (std::is_same_v<T, std::string>) {\n        return \"str:\" + value;\n    } else {\n        return \"other\";\n    }\n}", "check": "int main() {\n    std::string got[] = {Describe(42), Describe(std::string(\"hi\")),\n                         Describe(std::vector<int>{}), Describe(7L)};\n    for (const auto& s : got) {\n        std::cout << s << '\\n';\n    }\n    bool ok = got[0] == \"int:42\" && got[1] == \"str:hi\" &&\n              got[2] == \"other\" && got[3] == \"int:7\";\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "int:42\nstr:hi\nother\nint:7\nOK", "hint": "Обычный `if` компилирует обе ветки для каждого `T`. Ветки `if constexpr` в шаблоне для неподходящего `T` отбрасываются.", "solution": "template <typename T>\nstd::string Describe(const T& value) {\n    if constexpr (std::is_integral_v<T>) {\n        return \"int:\" + std::to_string(value);\n    } else if constexpr (std::is_same_v<T, std::string>) {\n        return \"str:\" + value;\n    } else {\n        return \"other\";\n    }\n}"}, {"id": "modern-t18", "lesson": "modern-lambda", "title": "Счётчик в замыкании", "task": "Заполни захват: каждый `MakeCounter()` даёт свой независимый счётчик, который живёт внутри лямбды.", "prefix": "#include <functional>\n#include <iostream>", "code": "// Каждый вызов MakeCounter() — новый независимый счётчик.\nstd::function<int()> MakeCounter() {\n    return [____]() mutable { return ++count; };\n}", "check": "int main() {\n    auto a = MakeCounter();\n    auto b = MakeCounter();\n    a();\n    int a2 = a();\n    int b1 = b();\n    auto c = MakeCounter();\n    c();\n    c();\n    int a3 = a();\n    std::cout << a2 << ' ' << b1 << ' ' << a3 << '\\n';\n    bool ok = a2 == 2 && b1 == 1 && a3 == 3;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "2 1 3\nOK", "hint": "Захват по ссылке на локальную переменную повиснет. Нужен init-capture со своим полем: `[count = 0]`.", "solution": "// Каждый вызов MakeCounter() — новый независимый счётчик.\nstd::function<int()> MakeCounter() {\n    return [count = 0]() mutable { return ++count; };\n}"}, {"id": "modern-t19", "lesson": "modern-algo", "title": "Стабильная сортировка с компаратором", "task": "Допиши `SortByScore`: по убыванию `score`, игроки с равным счётом остаются в порядке регистрации. Проверка гоняет и маленький, и большой список.", "prefix": "#include <algorithm>\n#include <iostream>\n#include <string>\n#include <vector>\n\nstruct Player {\n    std::string name;\n    int score;\n};", "code": "// По убыванию score; при равенстве — порядок регистрации,\n// то есть исходный порядок в v.\nvoid SortByScore(std::vector<Player>& v) {\n    std::____(v.begin(), v.end(), ____);\n}", "check": "std::string Names(const std::vector<Player>& v) {\n    std::string s;\n    for (const auto& p : v) {\n        s += p.name + ' ';\n    }\n    return s;\n}\n\nint main() {\n    std::vector<Player> v{\n        {\"ann\", 50}, {\"bob\", 70}, {\"cid\", 50}, {\"dan\", 70}};\n    SortByScore(v);\n    std::cout << Names(v) << '\\n';\n    bool ok = Names(v) == \"bob dan ann cid \";\n\n    // 300 игроков со счётом 0..4: равные сохраняют исходный порядок\n    std::vector<Player> big, want;\n    for (int i = 0; i < 300; ++i) {\n        big.push_back({std::to_string(i), i * 7 % 5});\n    }\n    for (int s = 4; s >= 0; --s) {\n        for (const auto& p : big) {\n            if (p.score == s) want.push_back(p);\n        }\n    }\n    SortByScore(big);\n    bool big_ok = Names(big) == Names(want);\n    std::cout << \"300 players \" << (big_ok ? \"ok\" : \"wrong\") << '\\n';\n    ok = ok && big_ok;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "bob dan ann cid\n300 players ok\nOK", "hint": "`std::sort` не гарантирует порядок равных (на маленьком массиве это не видно) — нужен `std::stable_sort`. Компаратор строгий: `a.score > b.score`, не `>=`.", "solution": "// По убыванию score; при равенстве — порядок регистрации,\n// то есть исходный порядок в v.\nvoid SortByScore(std::vector<Player>& v) {\n    std::stable_sort(v.begin(), v.end(),\n                     [](const Player& a, const Player& b) {\n                         return a.score > b.score;\n                     });\n}"}, {"id": "modern-t20", "lesson": "modern-algo", "title": "lower_bound на отсортированном векторе", "task": "Допиши `CountInRange`: сколько элементов в полуинтервале `[lo, hi)`. Вектор отсортирован, нужен O(log n).", "prefix": "#include <algorithm>\n#include <iostream>\n#include <vector>", "code": "// v отсортирован. Сколько элементов в [lo, hi)? За O(log n).\nlong CountInRange(const std::vector<int>& v, int lo, int hi) {\n    // TODO\n    return 0;\n}", "check": "int main() {\n    std::vector<int> v{1, 3, 3, 5, 8, 8, 8, 13};\n    long got[] = {CountInRange(v, 3, 8), CountInRange(v, 20, 30),\n                  CountInRange(v, 0, 100), CountInRange(v, 8, 9),\n                  CountInRange(v, 4, 4), CountInRange({}, 0, 9)};\n    long want[] = {3, 0, 8, 3, 0, 0};\n    bool ok = true;\n    for (int i = 0; i < 6; ++i) {\n        std::cout << got[i] << ' ';\n        ok = ok && got[i] == want[i];\n    }\n    std::cout << '\\n';\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "3 0 8 3 0 0\nOK", "hint": "Два `std::lower_bound`: для `lo` и для `hi`. Разность итераторов — ответ.", "solution": "// v отсортирован. Сколько элементов в [lo, hi)? За O(log n).\nlong CountInRange(const std::vector<int>& v, int lo, int hi) {\n    auto first = std::lower_bound(v.begin(), v.end(), lo);\n    auto last = std::lower_bound(first, v.end(), hi);\n    return last - first;\n}"}, {"id": "modern-t21", "lesson": "modern-ranges", "title": "views::filter | views::transform", "task": "Заполни пропуски в `OddSquares`: оставь нечётные, возведи в квадрат, результат собери в вектор (C++23 `ranges::to`).", "prefix": "#include <iostream>\n#include <ranges>\n#include <vector>", "code": "// Квадраты нечётных из v, собранные в новый вектор.\nstd::vector<int> OddSquares(const std::vector<int>& v) {\n    return v\n        | ____\n        | ____\n        | std::ranges::to<std::vector>();\n}", "check": "bool Test(const std::vector<int>& in, const std::vector<int>& want) {\n    std::vector<int> got = OddSquares(in);\n    std::cout << '[';\n    for (int x : got) {\n        std::cout << ' ' << x;\n    }\n    std::cout << \" ]\\n\";\n    return got == want;\n}\n\nint main() {\n    bool ok = Test({1, 2, 3, 4, 5, 6, 7}, {1, 9, 25, 49});\n    ok = Test({2, 4}, {}) && ok;\n    ok = Test({-3, 0}, {9}) && ok;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "[ 1 9 25 49 ]\n[ ]\n[ 9 ]\nOK", "hint": "`std::views::filter(pred)` и `std::views::transform(fn)` склеиваются через `|`. Порядок важен: сначала фильтр.", "solution": "// Квадраты нечётных из v, собранные в новый вектор.\nstd::vector<int> OddSquares(const std::vector<int>& v) {\n    return v\n        | std::views::filter([](int x) { return x % 2 != 0; })\n        | std::views::transform([](int x) { return x * x; })\n        | std::ranges::to<std::vector>();\n}"}, {"id": "modern-t22", "lesson": "modern-concepts", "title": "Ограничь шаблон концептом", "task": "Сейчас `Twice` принимает что угодно, и `static_assert` в проверке падают. Ограничь шаблон так, чтобы подходили только целые типы.", "prefix": "#include <concepts>\n#include <iostream>\n#include <string>", "code": "// TODO: ограничь шаблон так, чтобы он принимал только целые.\ntemplate <typename T>\nT Twice(T x) {\n    return x + x;\n}", "check": "template <typename T>\nconcept CanTwice = requires(T x) { Twice(x); };\n\nstatic_assert(CanTwice<int>);\nstatic_assert(CanTwice<long>);\nstatic_assert(!CanTwice<double>);\nstatic_assert(!CanTwice<std::string>);\n\nint main() {\n    std::cout << Twice(21) << ' ' << Twice(20L) << '\\n';\n    bool ok = Twice(21) == 42 && Twice(20L) == 40L;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "42 40\nOK", "hint": "Замени `typename` на стандартный концепт `std::integral`. Тогда для `double` и `std::string` выражение `Twice(x)` станет невалидным.", "solution": "// Только целые: остальные типы отсекаются при компиляции.\ntemplate <std::integral T>\nT Twice(T x) {\n    return x + x;\n}"}, {"id": "modern-t23", "lesson": "modern-misc", "title": "constexpr функция", "task": "`static_assert` в проверке не компилируется: `Factorial` считается только в runtime. Почини одним словом.", "prefix": "#include <iostream>", "code": "// Должна считаться при компиляции: см. static_assert.\nlong long Factorial(int n) {\n    long long result = 1;\n    for (int i = 2; i <= n; ++i) {\n        result *= i;\n    }\n    return result;\n}", "check": "static_assert(Factorial(5) == 120);\nstatic_assert(Factorial(0) == 1);\n\nint main() {\n    constexpr long long kF10 = Factorial(10);\n    long long f20 = Factorial(20);\n    std::cout << kF10 << ' ' << f20 << '\\n';\n    bool ok = kF10 == 3628800 && f20 == 2432902008176640000;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "3628800 2432902008176640000\nOK", "hint": "С C++14 в `constexpr` функции можно писать циклы и локальные переменные.", "solution": "// Должна считаться при компиляции: см. static_assert.\nconstexpr long long Factorial(int n) {\n    long long result = 1;\n    for (int i = 2; i <= n; ++i) {\n        result *= i;\n    }\n    return result;\n}"}, {"id": "modern-t24", "lesson": "modern-review2", "title": "RAII-гард", "task": "Допиши `ScopeGuard`: действие выполняется при выходе из области видимости, в том числе при исключении. Копирование запрети: проверка это видит.", "prefix": "#include <functional>\n#include <iostream>\n#include <stdexcept>\n#include <string>\n#include <type_traits>\n#include <utility>", "code": "// Выполняет действие при выходе из области видимости,\n// в том числе при исключении.\nclass ScopeGuard {\npublic:\n    explicit ScopeGuard(std::function<void()> action)\n        : action_(std::move(action)) {}\n    // TODO: деструктор; копирование запретить\n\nprivate:\n    std::function<void()> action_;\n};", "check": "std::string g_log;\n\nvoid Work(bool fail) {\n    ScopeGuard guard([] { g_log += \"unlock \"; });\n    g_log += \"work \";\n    if (fail) {\n        throw std::runtime_error(\"boom\");\n    }\n}\n\nint main() {\n    Work(false);\n    try {\n        Work(true);\n    } catch (const std::exception& e) {\n        g_log += e.what();\n    }\n    std::cout << g_log << '\\n';\n    bool ok = g_log == \"work unlock work unlock boom\" &&\n              !std::is_copy_constructible_v<ScopeGuard> &&\n              !std::is_copy_assignable_v<ScopeGuard>;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "work unlock work unlock boom\nOK", "hint": "Деструктор вызывается при раскрутке стека. Вызови `action_()` в `~ScopeGuard()`, а copy-конструктор и copy-присваивание объяви `= delete`.", "solution": "// Выполняет действие при выходе из области видимости,\n// в том числе при исключении.\nclass ScopeGuard {\npublic:\n    explicit ScopeGuard(std::function<void()> action)\n        : action_(std::move(action)) {}\n    ~ScopeGuard() { action_(); }\n    ScopeGuard(const ScopeGuard&) = delete;\n    ScopeGuard& operator=(const ScopeGuard&) = delete;\n\nprivate:\n    std::function<void()> action_;\n};"}]}]};
const store = {
  get(k, d){ try{ const v = localStorage.getItem('cppbook:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('cppbook:'+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl = s => esc(s).replace(/`([^`]+)`/g, '<code class="i">$1</code>');
function codeBlock(src){
  let html = esc(src);
  try{ if(window.hljs) html = hljs.highlight(src, {language:'cpp', ignoreIllegals:true}).value; }catch(e){}
  return '<pre class="code"><code>' + html + '</code></pre>';
}

// ---------- running code on Compiler Explorer ----------
const PAGES_URL = 'https://svezhest.github.io/cpp-prep/';
const MODES = {
  gcc:   {c:'g141',      a:'-std=c++23 -O1 -pthread', l:[], label:'gcc 14 · C++23'},
  tsan:  {c:'clang1810', a:'-std=c++2b -O1 -g -fsanitize=thread -pthread', l:[], label:'clang 18 · TSan'},
  gtest: {c:'g141',      a:'-std=c++23 -O1 -pthread', l:[{id:'googletest',version:'trunk'}], label:'gcc 14 · gtest'}
};
const GTEST_MAIN = '\nint main(int argc, char** argv) {\n    ::testing::InitGoogleTest(&argc, argv);\n    return RUN_ALL_TESTS();\n}\n';
const apiBase = () => (store.get('api','https://godbolt.org')||'https://godbolt.org').replace(/\/+$/,'');
const defMode = code => /\bTEST(_F|_P)?\s*\(/.test(code) ? 'gtest' : 'gcc';
const noAnsi = s => s.replace(/\x1b\[[0-9;]*[A-Za-z]/g,'');
const lines = arr => noAnsi((arr||[]).map(x=>x.text).join('\n'));
async function runCode(src, mode){
  const m = MODES[mode];
  if(mode==='gtest' && !/\bmain\s*\(/.test(src)) src += GTEST_MAIN;
  const body = {source:src, lang:'c++', allowStoreCodeDebug:false, bypassCache:2, options:{userArguments:m.a, libraries:m.l, tools:[],
    executeParameters:{args:[],stdin:''}, compilerOptions:{executorRequest:true}, filters:{execute:true}}};
  const t0 = performance.now();
  const r = await fetch(apiBase()+'/api/compiler/'+m.c+'/compile', {method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d = await r.json();
  const b = d.buildResult || {};
  const out = lines(d.stdout), err = lines(d.stderr);
  return {build_ok:b.code===0, exit:d.code, stdout:out, stderr:err, build_err:lines(b.stderr),
    tsan:/ThreadSanitizer/.test(err), gtest_ok: d.code===0 && /\[  PASSED  \]/.test(out),
    ms: Math.round(performance.now()-t0)};
}
const norm = s => String(s).replace(/[ \t]+$/gm,'').replace(/\s+$/,'');
function verdict(res, mode, expect){
  if(!res.build_ok) return {pass:false, why:'Не скомпилировалось'};
  if(mode==='tsan' && res.tsan) return {pass:false, why:'ThreadSanitizer нашёл гонку'};
  if(mode==='gtest' && !res.gtest_ok) return {pass:false, why:'Тесты не прошли'};
  if(res.exit!==0) return {pass:false, why:'Код возврата '+res.exit};
  if(expect!=null && norm(res.stdout)!==norm(expect)) return {pass:false, why:'Вывод не совпал'};
  return {pass:true, why:'Верно'};
}
const W = [];   // widget registry
const draftKey = t => 'draft:'+t.id+(t.prefix||t.check ? ':v2' : '');
// task = prefix (fixed, above) + user code + check (fixed, below)
// gtest tasks always get the page's own main: a user-written main() is then a compile error
const assemble = (t, cur, prefix) => {
  const parts = [prefix ?? (t && t.prefix), cur, t && t.check];
  if(t && t.mode==='gtest' && !/\bmain\s*\(/.test((t.prefix||'')+(t.check||''))) parts.push(GTEST_MAIN);
  return parts.filter(x => x).join('\n');
};
function runnable(code, o){
  const i = W.length;
  W.push({orig:code, cur:code, mode:o.mode||defMode(code), expect:o.expect, task:o.task||null, editing:!!o.edit});
  const w = W[i];
  const tsanBtn = w.mode!=='gtest' && !w.task ? `<button class="rbtn" data-a="tsan" aria-pressed="${w.mode==='tsan'}">TSan</button>` : '';
  return `<div class="runbox" data-w="${i}">
    <div class="view"></div>
    <div class="runbar">
      <button class="rbtn go" data-a="run">${w.task?'▶ Проверить':'▶ Запустить'}</button>
      <button class="rbtn" data-a="edit" ${w.editing?'hidden':''}>Править</button>
      <button class="rbtn" data-a="reset" ${w.task?'':'hidden'}>Сброс</button>
      ${tsanBtn}<span class="rmode">${MODES[w.mode].label}</span>
    </div>
    <pre class="out" hidden></pre>
  </div>`;
}
function fitTA(ta){ ta.rows = Math.min(40, Math.max(6, ta.value.split('\n').length+1)); }
function paintView(box){
  const w = W[+box.dataset.w], v = box.querySelector('.view');
  if(w.editing){
    v.innerHTML = '<textarea class="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>';
    const ta = v.querySelector('textarea'); ta.value = w.cur; fitTA(ta);
    ta.addEventListener('input', () => { w.cur = ta.value; if(w.task) store.set(draftKey(w.task), w.cur); });
    ta.addEventListener('keydown', e => { if(e.key==='Tab'){ e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); w.cur=ta.value; } });
  } else v.innerHTML = codeBlock(w.cur);
}
function initRunnables(root){
  root.querySelectorAll('.runbox:not([data-init])').forEach(box => {
    box.dataset.init = 1; paintView(box);
    const w = W[+box.dataset.w], out = box.querySelector('.out');
    box.querySelectorAll('[data-a]').forEach(btn => btn.onclick = async () => {
      const a = btn.dataset.a;
      if(a==='edit'){ w.editing = true; btn.hidden = true; box.querySelector('[data-a="reset"]').hidden = false; paintView(box); box.querySelector('textarea').focus(); }
      if(a==='reset'){ w.cur = w.orig; if(w.task){ store.set(draftKey(w.task), null); } else { w.editing=false; btn.hidden=true; box.querySelector('[data-a="edit"]').hidden=false; } paintView(box); out.hidden = true; }
      if(a==='tsan'){ w.mode = w.mode==='tsan' ? 'gcc' : 'tsan'; btn.setAttribute('aria-pressed', w.mode==='tsan'); box.querySelector('.rmode').textContent = MODES[w.mode].label; }
      if(a==='run'){
        btn.disabled = true; out.hidden = false; out.className = 'out busy';
        out.innerHTML = '<span class="h">Компилирую…</span>';
        try{
          const t = w.task;
          const res = await runCode(assemble(t, w.cur), w.mode);
          let over = null;
          if(t && t.mutants && verdict(res, w.mode, w.expect).pass){
            for(let k=0; k<t.mutants.length; k++){
              out.innerHTML = `<span class="h">На верной реализации прошло. Проверяю, ловят ли тесты ошибку ${k+1}/${t.mutants.length}…</span>`;
              const m = t.mutants[k], r2 = await runCode(assemble(t, w.cur, m.code), w.mode);
              if(!r2.build_ok){ over = {why:'Со сломанной реализацией №'+(k+1)+' не собралось', body:r2.build_err.split('\n').slice(0,40).join('\n')}; break; }
              if(verdict(r2, w.mode, w.expect).pass){ over = {why:'Тесты не поймали ошибку №'+(k+1), body:'Сломано: '+m.why+'\n\nВсе тесты прошли и на ней. Добавьте проверку, которая это заметит.'}; break; }
            }
            if(!over) over = {pass:true, why:'Тесты проходят и ловят все '+t.mutants.length+' сломанные реализации', body:res.stdout};
          }
          showResult(out, res, w, over);
        }catch(e){
          out.className = 'out bad';
          out.innerHTML = `<span class="h">Сервер компиляции недоступен</span>${esc(String(e.message||e))}\n\n` +
            (location.hostname.endsWith('github.io') ? 'Проверьте интернет и попробуйте ещё раз.' :
             `Здесь запуск может быть заблокирован. Откройте версию с запуском: ${esc(PAGES_URL)}`);
        }
        btn.disabled = false;
      }
    });
  });
}
function showResult(out, res, w, over){
  const v = over ? {pass:!!over.pass, why:over.why} : verdict(res, w.mode, w.expect);
  const hasCheck = w.task || w.expect!=null;
  let head, cls;
  if(hasCheck){ head = (v.pass?'✅ ':'❌ ')+v.why; cls = v.pass?'ok':'bad'; }
  else if(!res.build_ok){ head = 'Ошибка компиляции'; cls = 'bad'; }
  else if(res.tsan){ head = 'ThreadSanitizer: гонка'; cls = 'bad'; }
  else { head = 'Вывод · exit '+res.exit; cls = res.exit===0 ? '' : 'bad'; }
  let body = '';
  if(over) body = over.body || '';
  else if(!res.build_ok) body = res.build_err.split('\n').slice(0,60).join('\n');
  else {
    if(hasCheck && !v.pass && v.why==='Вывод не совпал') body = 'Ожидалось:\n'+w.expect+'\n\nПолучено:\n'+res.stdout;
    else body = res.stdout + (res.stderr ? (res.stdout?'\n':'')+res.stderr : '');
    if(!body.trim()) body = '(пустой вывод)';
  }
  out.className = 'out '+cls;
  out.innerHTML = `<span class="h">${esc(head)} · ${(res.ms/1000).toFixed(1)} с</span>${esc(body)}`;
  if(w.task && v.pass){ solved.add(w.task.id); store.set('solved',[...solved]);
    const card = out.closest('details[data-tid]'); if(card){ const bd=card.querySelector('.tstate'); if(bd){ bd.className='badge ok tstate'; bd.textContent='решено'; } } }
}

function block(b){
  if(b.type==='p') return `<p>${inl(b.text)}</p>`;
  if(b.type==='code') return b.run===false ? codeBlock(b.code) : runnable(b.code, {mode:b.mode, expect:b.expect});
  if(b.type==='list') return `<ul>${b.items.map(i=>`<li>${inl(i)}</li>`).join('')}</ul>`;
  if(b.type==='warn') return `<div class="callout warn"><b>Ловушка</b>${inl(b.text)}</div>`;
  if(b.type==='tip') return `<div class="callout tip"><b>Сказать вслух</b>${inl(b.text)}</div>`;
  return '';
}

let readSet = new Set(store.get('read', []));
let qright = new Set(store.get('qright', []));
let skipSet = new Set(store.get('skip', []));
function saveProgress(){ store.set('read',[...readSet]); store.set('qright',[...qright]); store.set('skip',[...skipSet]); store.set('solved',[...solved]); store.set('wrongs',[...wrongs]); }
function lessonProg(ch, id){
  const qs = ch.quiz.filter(q => q.lesson===id), ts = (ch.tasks||[]).filter(t => t.lesson===id);
  const p = {read: readSet.has(id)?1:0, q: qs.filter(q => qright.has(q.id)).length, qn: qs.length,
             t: ts.filter(t => solved.has(t.id)).length, tn: ts.length, skip: skipSet.has(id)};
  p.done = p.read + p.q + p.t; p.total = 1 + p.qn + p.tn;
  p.status = p.skip ? 'skip' : p.done===p.total ? 'ok' : p.done>0 ? 'part' : 'none';
  return p;
}
function chapProg(ch){
  const r = {done:0,total:0,read:0,readN:0,q:0,qn:0,t:0,tn:0,lessons:0,lessonsOk:0,skipped:0};
  for(const l of ch.lessons){
    const p = lessonProg(ch, l.id);
    if(p.skip){ r.skipped++; continue; }
    r.done+=p.done; r.total+=p.total; r.read+=p.read; r.readN++; r.q+=p.q; r.qn+=p.qn; r.t+=p.t; r.tn+=p.tn;
    r.lessons++; if(p.status==='ok') r.lessonsOk++;
  }
  return r;
}
function bookProg(){
  const r = {done:0,total:0,read:0,readN:0,q:0,qn:0,t:0,tn:0,lessons:0,lessonsOk:0,skipped:0};
  for(const ch of BOOK.chapters){ const c = chapProg(ch); for(const k in r) r[k]+=c[k]; }
  return r;
}
function lessonMeta(ch, id){
  const p = lessonProg(ch, id);
  if(p.status==='skip') return ['skip','пропуск'];
  if(p.status==='ok') return ['ok','✓ готово'];
  return [p.status==='part'?'part':'', p.done+'/'+p.total];
}
function donut(r){
  const R=58, C=2*Math.PI*R, f = r.total ? r.done/r.total : 0;
  const pct = Math.round(f*100);
  return `<svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Сделано ${pct}%">
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="18"/>
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--ok)" stroke-width="18" stroke-linecap="${f>0&&f<1?'round':'butt'}"
      stroke-dasharray="${(C*f).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 75 75)"/>
    <text x="75" y="78" text-anchor="middle" font-size="30" font-weight="700">${pct}%</text>
    <text x="75" y="100" text-anchor="middle" font-size="11" style="fill:var(--muted)">${r.done} из ${r.total}</text>
  </svg>`;
}
let mapSel = null;

  main.innerHTML = `<h1>Прогресс</h1>
    <div class="dash">${donut(b)}
      <div class="legend">
        <div class="r"><i class="sw" style="background:var(--ok)"></i>Сделано<span class="n">${b.done}</span></div>

        return `<button class="node ${p.status} ${mapSel===l.id?'sel':''}" data-n="${l.id}" title="${esc(l.title)}">
          <span>${esc((ROAD[l.id]||[l.title])[0])}</span><span class="nb"><i style="width:${(100*p.done/p.total).toFixed(0)}%"></i></span><span class="nc">${p.done}/${p.total}</span></button>`; }).join('')}</div>`).join('')}
    </div>
    <div class="lfoot" style="margin-top:8px"><button class="btn" id="p-reset">Сбросить прогресс</button></div>

  main.querySelectorAll('.cbar').forEach(x => x.onclick = () => { state.chap = x.dataset.c; store.set('chap', state.chap); mapSel=null; render(); });
  main.querySelectorAll('.node').forEach(x => x.onclick = () => { mapSel = x.dataset.n; main.querySelectorAll('.node').forEach(n=>n.classList.toggle('sel', n===x)); openSheet(ch, mapSel); });
  const rb = document.getElementById('p-reset');
  rb.onclick = () => {
    if(rb.dataset.arm){ readSet.clear(); qright.clear(); skipSet.clear(); solved.clear(); wrongs.clear(); saveProgress(); render(); return; }
    rb.dataset.arm = 1; rb.textContent = 'Точно сбросить? Нажмите ещё раз'; rb.classList.add('danger');
    setTimeout(() => { if(rb.isConnected){ delete rb.dataset.arm; rb.textContent='Сбросить прогресс'; rb.classList.remove('danger'); } }, 4000);
  };
  drawEdges(ch);
  if(mapSel) openSheet(ch, mapSel);
}
function drawEdges(ch){
  const g = document.getElementById('graph'), svg = document.getElementById('edges');
  if(!g) return;
  const gb = g.getBoundingClientRect(), pos = {};
  g.querySelectorAll('.node').forEach(n => { const r = n.getBoundingClientRect(); pos[n.dataset.n] = {x:r.left-gb.left+r.width/2, top:r.top-gb.top, bot:r.bottom-gb.top}; });
  let paths = '';
  for(const l of ch.lessons){
    for(const d of (ROAD[l.id]||['',[]])[1]){
      const a = pos[d], b = pos[l.id]; if(!a || !b) continue;
      const my = (a.bot + b.top)/2, done = lessonProg(ch, d).status==='ok';
      paths += `<path class="${done?'done':''}" d="M${a.x.toFixed(1)} ${a.bot.toFixed(1)} C${a.x.toFixed(1)} ${my.toFixed(1)} ${b.x.toFixed(1)} ${my.toFixed(1)} ${b.x.toFixed(1)} ${b.top.toFixed(1)}"/>`;
    }
  }
  svg.innerHTML = paths;
}
window.addEventListener('resize', () => { if(state.mode==='map'){ const ch = BOOK.chapters.find(c => c.id===state.chap) || BOOK.chapters[0]; drawEdges(ch); } });

  const ch = BOOK.chapters.find(c => c.lessons.some(l => l.id===lid));
  state.mode='learn'; state.chap=ch.id; store.set('mode','learn'); store.set('chap',ch.id); render();
  const d = document.querySelector(`details.lesson[data-id="${lid}"]`); if(d){ d.open=true; d.scrollIntoView({block:'start'}); }
}

    </div></div>`;
  const on = (i,f) => { const e=document.getElementById(i); if(e) e.onclick=f; };

  on('sh-open', () => { mapSel=null; goLesson(id); });
  on('sh-quiz', () => { mapSel=null; state.mode='quiz'; store.set('mode','quiz'); startQuiz({chap:ch.id, lesson:id}); render(); window.scrollTo({top:0}); });
  on('sh-task', () => { mapSel=null; state.mode='task'; store.set('mode','task'); taskLesson=id; render(); window.scrollTo({top:0}); });
  on('sh-read', () => { readSet.has(id)?readSet.delete(id):readSet.add(id); saveProgress(); renderMap(); });
  on('sh-skip', () => { skipSet.has(id)?skipSet.delete(id):skipSet.add(id); saveProgress(); renderMap(); });
}

function pool(opts){
  let qs = [];
  for(const c of BOOK.chapters) if(opts.chap==='all' || c.id===opts.chap) qs.push(...c.quiz.map(q=>({...q, chap:c.title})));
  if(opts.lesson) qs = qs.filter(q => q.lesson===opts.lesson);
  if(opts.onlyWrong) qs = qs.filter(q => wrongs.has(q.id));
  for(let i=qs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [qs[i],qs[j]]=[qs[j],qs[i]]; }
  return qs;
}
function startQuiz(opts){
  const qs = pool(opts);
  quiz = {opts, qs, i:0, right:0, answered:false, pick:null};
}
function lessonTitle(id){
  for(const c of BOOK.chapters){ const l = c.lessons.find(l=>l.id===id); if(l) return l.title; }
  return '';
}
function renderQuiz(){
  const main = document.getElementById('main');
  if(!quiz || (quiz.opts.chap!==state.chap && !quiz.opts.lesson)) startQuiz({chap:state.chap});
  const q = quiz.qs[quiz.i];
  if(q && quiz.shownId!==q.id){ quiz.shownId = q.id; quiz.shownAt = Date.now(); }
  const nWrong = pool({chap:state.chap, onlyWrong:true}).length;
  const scope = quiz.opts.lesson ? 'Урок: '+lessonTitle(quiz.opts.lesson) : (quiz.opts.onlyWrong ? 'Только ошибки' : (state.chap==='all'?'Все главы вперемешку':(BOOK.chapters.find(c=>c.id===state.chap)||{}).title));
  const head = `<div class="qbar"><span class="stat">${quiz.qs.length ? Math.min(quiz.i+1,quiz.qs.length)+' / '+quiz.qs.length+' · верно '+quiz.right : '0 вопросов'}</span>
    <button class="btn" id="q-wrong" ${nWrong?'':'disabled'}>Мои ошибки · ${nWrong}</button>
    <button class="btn" id="q-restart">Заново</button></div>
    <div class="prog"><i style="width:${quiz.qs.length?100*quiz.i/quiz.qs.length:0}%"></i></div>`;
  let body;
  if(!quiz.qs.length){
    body = `<div class="qcard"><p class="empty">${quiz.opts.onlyWrong?'Ошибок нет.':'Вопросов пока нет.'}</p></div>`;
  } else if(quiz.i >= quiz.qs.length){
    body = `<div class="qcard done"><div class="qtag">${esc(scope)}</div><div class="big">${quiz.right}/${quiz.qs.length}</div>
      <div class="qnav"><button class="btn primary" id="q-again">Ещё раз</button></div></div>`;
  } else {
    const letters='ABCDEF';
    body = `<div class="qcard">
      <div class="qtag">${esc(q.chap)} · ${inl(lessonTitle(q.lesson))}</div>
      <p class="qtext">${inl(q.q)}</p>
      ${q.code?codeBlock(q.code):''}
      <div class="opts">${q.options.map((o,k)=>{
        let cls='opt'; if(quiz.answered){ if(k===q.answer) cls+=' right'; else if(k===quiz.pick) cls+=' wrong'; }
        return `<button class="${cls}" data-k="${k}" ${quiz.answered?'disabled':''}><span class="k">${letters[k]}</span><span>${inl(o)}</span></button>`;
      }).join('')}</div>
      ${quiz.answered?`<div class="explain"><b>${quiz.pick===q.answer?'Верно':'Неверно'}</b>${inl(q.explain)}</div>
        <div class="qnav"><button class="qlink" id="q-lesson">Открыть урок</button><button class="btn primary" id="q-next">Дальше</button></div>`:''}
    </div>`;
  }
  main.innerHTML = `<h1>${esc(scope)}</h1>` + head + body;
  main.querySelectorAll('.opt[data-k]').forEach(b => b.onclick = () => {
    if(quiz.answered) return;
    quiz.pick = +b.dataset.k; quiz.answered = true;
    if(quiz.pick===q.answer){ quiz.right++; wrongs.delete(q.id); qright.add(q.id); } else { wrongs.add(q.id); qright.delete(q.id); }
    saveProgress(); renderQuiz();
  });
  const on = (id,f) => { const e=document.getElementById(id); if(e) e.onclick=f; };
  on('q-next', () => { quiz.i++; quiz.answered=false; quiz.pick=null; renderQuiz(); window.scrollTo({top:0}); });
  on('q-restart', () => { startQuiz({chap:state.chap}); renderQuiz(); });
  on('q-again', () => { startQuiz(quiz.opts); renderQuiz(); });
  on('q-wrong', () => { startQuiz({chap:state.chap, onlyWrong:true}); renderQuiz(); });
  on('q-lesson', () => {
    const lid=q.lesson; const ch=BOOK.chapters.find(c=>c.lessons.some(l=>l.id===lid));
    state.mode='learn'; state.chap=ch.id; store.set('mode','learn'); store.set('chap',ch.id); render();
    const d=document.querySelector(`details.lesson[data-id="${lid}"]`); if(d){ d.open=true; d.scrollIntoView({block:'start'}); }
  });
}

        <div class="lbody"></div>
      </details>`).join('') : '<p class="empty">Заданий пока нет.</p>'}</div>
    <div class="sett"><label for="api">Сервер компиляции (по умолчанию godbolt.org)</label>

  const allb = document.getElementById('t-all'); if(allb) allb.onclick = () => { taskLesson = null; renderTasks(); };
  const api = document.getElementById('api'); api.onchange = () => store.set('api', api.value.trim() || 'https://godbolt.org');
  main.querySelectorAll('details[data-tid]').forEach(d => d.addEventListener('toggle', () => {
    const body = d.querySelector('.lbody');
    if(!d.open || body.dataset.done) return;
    const t = ts.find(x => x.id===d.dataset.tid);
    const draft = store.get(draftKey(t), null);
    body.innerHTML = `<div class="tcard ${solved.has(t.id)?'solved':''}" style="border:0;padding:0">
      <p style="margin:0">${inl(t.task)}</p>
      ${t.expect!=null ? `<details><summary class="qlink">Ожидаемый вывод</summary><pre class="expect">${esc(t.expect)}</pre></details>` : ''}
      ${t.prefix ? `<div class="fixed"><div class="fixl">Дано · не меняется</div>${codeBlock(t.prefix)}</div>` : ''}
      ${t.prefix||t.check ? '<div class="fixl">Ваш код</div>' : ''}
      ${runnable(t.code, {mode:t.mode, expect:t.expect, task:t, edit:true})}
      ${t.check ? `<details class="fixed"><summary class="fixl">Проверка · не меняется, допишется после вашего кода</summary>${codeBlock(t.check)}</details>` : ''}
      ${t.mutants ? `<p class="fixn">Засчитывается, только если тесты проходят на верной реализации и падают на ${t.mutants.length} сломанных.</p>` : ''}
      <div class="lfoot"><button class="btn" data-x="hint">Подсказка</button><button class="btn" data-x="sol">Решение</button>
        <button class="qlink" data-x="lesson">Открыть урок</button></div>
      <div class="hint" hidden>${inl(t.hint||'')}</div>
      <div class="sol" hidden></div>
    </div>`;
    body.dataset.done = 1;
    const box = body.querySelector('.runbox');
    if(draft){ W[+box.dataset.w].cur = draft; }
    initRunnables(body);
    body.querySelector('[data-x="hint"]').onclick = () => { const h = body.querySelector('.hint'); h.hidden = !h.hidden; };
    body.querySelector('[data-x="sol"]').onclick = () => { const s2 = body.querySelector('.sol'); if(!s2.innerHTML) s2.innerHTML = codeBlock(t.solution); s2.hidden = !s2.hidden; };
    body.querySelector('[data-x="lesson"]').onclick = () => {
      state.mode='learn'; store.set('mode','learn'); render();
      const dl=document.querySelector(`details.lesson[data-id="${t.lesson}"]`); if(dl){ dl.open=true; dl.scrollIntoView({block:'start'}); }
    };
  }));
}
function render(){ renderChips(); if(state.mode==='learn') renderLearn(); else if(state.mode==='task') renderTasks(); else if(state.mode==='map') renderMap(); else renderQuiz(); }
document.getElementById('m-learn').onclick = () => { state.mode='learn'; store.set('mode','learn'); render(); };

document.getElementById('m-task').onclick = () => { state.mode='task'; store.set('mode','task'); taskLesson=null; render(); };

const TIRED_BY_MODE = {
  learn: ['Сделай самую маленькую следующую вещь: прочитай один абзац.', 'Пять минут. Один урок. Потом перерыв.',
          'Не понял абзац - запусти пример под ним и посмотри, что выведет.'],

const TIRED_DYN = [
  p => `Уже сделано ${p.pct}%. Осталось меньше, чем кажется.`,
  p => `Сделано ${p.done} из ${p.total}. Каждый следующий шаг легче.`,
  (p, n) => n >= 10 ? `Это ${n}-е нажатие. Признаю: тема правда тяжёлая. Продолжай.` : null,
  (p, n, today) => today >= 3 ? `Сегодня уже ${today} раз. Может, перерыв на 15 минут?` : null,

let tiredLog = store.get('tired', []);
const pageT0 = Date.now(), openedAt = {};   // когда открыт урок/задание
document.addEventListener('toggle', e => { const d = e.target; if(d.open && d.dataset){ const k = d.dataset.tid || d.dataset.id; if(k) openedAt[k] = Date.now(); } }, true);
let tiredLast = -1;
function tiredWhere(){
  const vis = el => { const r = el.getBoundingClientRect(); return r.bottom > 80 && r.top < innerHeight; };
  if(state.mode==='quiz' && quiz && quiz.qs[quiz.i]){ const q = quiz.qs[quiz.i]; return {kind:'quiz', id:q.id, lesson:q.lesson, since:quiz.shownAt, answered:quiz.answered}; }
  if(state.mode==='task'){ const d = [...document.querySelectorAll('details[data-tid][open]')].find(vis); if(d){ const ch = BOOK.chapters.find(c=>c.id===state.chap); const t = (ch.tasks||[]).find(x=>x.id===d.dataset.tid); return {kind:'task', id:d.dataset.tid, lesson:t&&t.lesson, since:openedAt[d.dataset.tid]}; } }
  if(state.mode==='learn'){ const d = [...document.querySelectorAll('details.lesson[data-id][open]')].find(vis); if(d) return {kind:'lesson', id:d.dataset.id, lesson:d.dataset.id, since:openedAt[d.dataset.id]}; }
  return {kind:state.mode, id:null, lesson:typeof mapSel==='string'?mapSel:null};
}
function tiredStats(){
  const el = document.getElementById('tstat');
  if(!tiredLog.length){ el.innerHTML = ''; return; }
  const day = new Date().toDateString();
  const today = tiredLog.filter(e => new Date(e.t).toDateString()===day).length;
  const by = {};
  for(const e of tiredLog) if(e.lesson) by[e.lesson] = (by[e.lesson]||0)+1;
  const top = Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
  el.innerHTML = `<span>Нажато ${tiredLog.length} · сегодня ${today}</span>` +
    (top.length ? `<span>Чаще всего на уроках:</span><ol>${top.map(([id,n])=>`<li>${inl(lessonTitle(id))} - ${n}</li>`).join('')}</ol>` : '') +
    `<button id="tcopy">Скопировать данные</button>`;
  document.getElementById('tcopy').onclick = () => {
    const txt = JSON.stringify(tiredLog);
    const done = () => { document.getElementById('tcopy').textContent = 'Скопировано'; };
    try{ navigator.clipboard.writeText(txt).then(done, () => tiredMsg(txt)); }catch(e){ tiredMsg(txt); }
  };
}
function tiredMsg(t){ document.getElementById('tmsg').textContent = t; }
document.getElementById('tbtn').onclick = () => {
  const w = tiredWhere();
  const now = Date.now(), prev = tiredLog[tiredLog.length-1];
  tiredLog.push({t:now, tz:-new Date().getTimezoneOffset(), mode:state.mode, chap:state.chap, kind:w.kind, id:w.id, lesson:w.lesson,
    onItemSec: w.since ? Math.round((now-w.since)/1000) : null,     // сколько сидел на этом вопросе/задании/уроке
    answered: w.answered ?? null,                                    // тест: уже ответил на вопрос или ещё нет
    sessionMin: Math.round((now-pageT0)/60000),                      // сколько минут открыта страница
    sincePrevMin: prev ? Math.round((now-prev.t)/60000) : null});
  if(tiredLog.length > 5000) tiredLog = tiredLog.slice(-5000);
  store.set('tired', tiredLog);
  const day = new Date().toDateString();
  const today = tiredLog.filter(e => new Date(e.t).toDateString()===day).length;
  const b = bookProg(), p = {done:b.done, total:b.total, pct:b.total?Math.round(100*b.done/b.total):0};
  let line = null;
  if(Math.random() < 0.3){ const f = TIRED_DYN[Math.floor(Math.random()*TIRED_DYN.length)]; line = f(p, tiredLog.length, today); }

    let k; do{ k = Math.floor(Math.random()*pool.length); }while(pool[k]===tiredLast && pool.length>1); tiredLast = pool[k]; line = pool[k]; }
  tiredMsg(line);
