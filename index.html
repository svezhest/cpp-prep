tsAre;\nusing ::testing::IsEmpty;\nusing ::testing::Not;\nusing ::testing::Pair;\nusing ::testing::SizeIs;\nusing ::testing::StartsWith;\nusing ::testing::UnorderedElementsAre;\n\nTEST(ScopesTest, ContainerMatchers) {\n  const std::vector<std::string> scopes = {\"login:email\",\n                                           \"login:info\"};\n  // порядок и размер важны\n  EXPECT_THAT(scopes, ElementsAre(\"login:email\", \"login:info\"));\n  // порядок не важен, размер важен\n  EXPECT_THAT(scopes,\n              UnorderedElementsAre(\"login:info\", \"login:email\"));\n  EXPECT_THAT(scopes, Contains(\"login:info\"));\n  EXPECT_THAT(scopes, Not(Contains(\"admin\")));\n  EXPECT_THAT(scopes, SizeIs(2));\n  EXPECT_THAT(scopes, Each(StartsWith(\"login:\")));\n  EXPECT_THAT(std::vector<int>{}, IsEmpty());\n\n  const std::map<std::string, int> quota = {{\"alex\", 3}};\n  EXPECT_THAT(quota, Contains(Pair(\"alex\", 3)));\n}", "mode": "gtest"}, {"type": "code", "code": "#include <optional>\n#include <string>\n#include <vector>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing ::testing::_;\nusing ::testing::AllOf;\nusing ::testing::AnyOf;\nusing ::testing::ElementsAre;\nusing ::testing::Field;\nusing ::testing::Ge;\nusing ::testing::Gt;\nusing ::testing::HasSubstr;\nusing ::testing::Le;\nusing ::testing::Optional;\nusing ::testing::Property;\n\nstruct User {\n  long id = 0;\n  std::string login;\n  // Property требует const-метод\n  const std::string& Login() const { return login; }\n};\n\nTEST(MatchersTest, Values) {\n  const std::string error = \"token expired at 12:00\";\n  EXPECT_THAT(error, HasSubstr(\"expired\"));\n\n  const int status = 403;\n  EXPECT_THAT(status, AnyOf(401, 403));\n\n  const int ttl = 3600;\n  EXPECT_THAT(ttl, AllOf(Gt(0), Le(86400)));\n}\n\nTEST(MatchersTest, Structs) {\n  const User u{42, \"alex\"};\n  EXPECT_THAT(u, Field(&User::id, 42));\n  EXPECT_THAT(u, Property(&User::Login, \"alex\"));\n\n  const std::vector<User> users = {{1, \"alex\"}, {2, \"bob\"}};\n  EXPECT_THAT(users, ElementsAre(Field(&User::login, \"alex\"),\n                                 Field(&User::id, Ge(2))));\n}\n\nTEST(MatchersTest, Optional) {\n  const std::optional<User> found = User{42, \"alex\"};\n  // проверяет, что значение есть, и матчит его\n  EXPECT_THAT(found, Optional(Field(&User::id, 42)));\n\n  const std::optional<User> missing;\n  EXPECT_EQ(missing, std::nullopt);\n  EXPECT_THAT(missing, ::testing::Eq(std::nullopt));\n  (void)_;\n}", "mode": "gtest"}, {"type": "p", "text": "Как выглядит провал `ElementsAre` при перепутанном порядке. Тест падает намеренно: запусти и посмотри вывод."}, {"type": "code", "code": "#include <string>\n#include <vector>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nTEST(ScopesTest, ShowsWhy) {\n  const std::vector<std::string> scopes = {\"login:info\",\n                                           \"login:email\"};\n  EXPECT_THAT(scopes,\n              ::testing::ElementsAre(\"login:email\", \"login:info\"));\n}", "mode": "gtest"}, {"type": "code", "code": "example.cpp:10: Failure\nValue of: scopes\nExpected: has 2 elements where\nelement #0 is equal to \"login:email\",\nelement #1 is equal to \"login:info\"\n  Actual: { \"login:info\", \"login:email\" },\n  whose element #0 (\"login:info\") isn't equal to \"login:email\"", "run": false}, {"type": "list", "items": ["Сравнения: `Eq`, `Ne`, `Lt`, `Le`, `Gt`, `Ge`, `_` (что угодно), `IsNull`, `NotNull`.", "Строки: `HasSubstr`, `StartsWith`, `EndsWith`, `StrCaseEq`, `MatchesRegex` (вся строка), `ContainsRegex` (подстрока).", "Контейнеры: `ElementsAre`, `ElementsAreArray`, `UnorderedElementsAre`, `Contains`, `Each`, `SizeIs`, `IsEmpty`, `Pair` (для map).", "Структуры: `Field(&T::member, m)`, `Property(&T::Getter, m)`.", "Комбинаторы: `AllOf`, `AnyOf`, `Not`.", "optional и указатели: `Optional(m)`, `Pointee(m)`. Числа: `DoubleEq`, `DoubleNear(x, eps)`.", "Голое значение вместо матчера означает `Eq(значение)`: `Field(&User::id, 42)`."]}, {"type": "warn", "text": "`ElementsAre` проверяет и размер, и порядок. Для `unordered_set`/`unordered_map` порядок не определён — только `UnorderedElementsAre`. `Optional(_)` на пустом optional — провал. Пустоту optional проверяют через `EXPECT_EQ(opt, std::nullopt)`; `IsEmpty()` на optional не скомпилируется (нет `.empty()`). `Property` требует const-метод, на неконстантном — ошибка компиляции."}, {"type": "tip", "text": "Вслух: «Через матчер провал покажет весь контейнер и какой элемент не совпал. Это быстрее разбирать, чем пачку EXPECT_EQ по индексам»."}]}, {"id": "tests-mocks", "title": "Моки: gmock", "blocks": [{"type": "p", "text": "Мок заменяет зависимость и проверяет взаимодействие: сервис позвал хранилище с нужными аргументами, записал аудит, не пошёл в базу на пустом токене. Чтобы подменить зависимость, код должен это позволять."}, {"type": "list", "items": ["Зависимость — интерфейс: чисто виртуальные методы и виртуальный деструктор.", "Внедрение через конструктор (DI): ссылка, `std::unique_ptr` или `std::shared_ptr` на интерфейс.", "Внутри класса нет `new RealStorage`, синглтонов и статических вызовов вроде `Db::Instance().Query()`.", "Альтернатива без виртуальных вызовов — зависимость как параметр шаблона. Тогда мок — любой класс с теми же методами."]}, {"type": "p", "text": "Ниже всё одним файлом: интерфейсы и сервис (`auth_service.h`), моки (`mocks.h`), тесты."}, {"type": "code", "code": "// ---- auth_service.h ----\n#include <cstdint>\n#include <optional>\n#include <string>\n\n// 1. Зависимость — интерфейс (чисто виртуальный класс)\nclass TokenStorage {\n public:\n  virtual ~TokenStorage() = default;\n  virtual bool Save(const std::string& token, std::int64_t uid) = 0;\n  virtual std::optional<std::int64_t> Find(\n      const std::string& token) const = 0;\n  virtual void Remove(const std::string& token) = 0;\n};\n\nclass AuditLog {\n public:\n  virtual ~AuditLog() = default;\n  virtual void Write(const std::string& event, std::int64_t uid) = 0;\n};\n\n// 2. Сервис получает зависимости через конструктор (DI),\n//    а не создаёт их сам\nclass AuthService {\n public:\n  AuthService(TokenStorage& storage, AuditLog& audit)\n      : storage_(storage), audit_(audit) {}\n\n  std::optional<std::int64_t> Authenticate(\n      const std::string& token) const {\n    if (token.empty()) return std::nullopt;  // в storage не ходим\n    return storage_.Find(token);\n  }\n\n  bool Logout(const std::string& token) {\n    const auto uid = storage_.Find(token);\n    if (!uid) return false;\n    storage_.Remove(token);\n    audit_.Write(\"logout\", *uid);\n    return true;\n  }\n\n private:\n  TokenStorage& storage_;\n  AuditLog& audit_;\n};\n\n// ---- mocks.h ----\n#include <gmock/gmock.h>\n\nclass MockTokenStorage : public TokenStorage {\n public:\n  // MOCK_METHOD(тип, Имя, (аргументы), (спецификаторы));\n  MOCK_METHOD(bool, Save,\n              (const std::string& token, std::int64_t uid),\n              (override));\n  MOCK_METHOD(std::optional<std::int64_t>, Find,\n              (const std::string& token), (const, override));\n  MOCK_METHOD(void, Remove, (const std::string& token),\n              (override));\n};\n\nclass MockAuditLog : public AuditLog {\n public:\n  MOCK_METHOD(void, Write,\n              (const std::string& event, std::int64_t uid),\n              (override));\n};\n\n// ---- auth_service_test.cpp ----\n#include <gtest/gtest.h>\n\nusing ::testing::_;\nusing ::testing::NiceMock;\nusing ::testing::Return;\nusing ::testing::StrictMock;\n\nTEST(AuthServiceTest, ReturnsUidForKnownToken) {\n  NiceMock<MockTokenStorage> storage;\n  NiceMock<MockAuditLog> audit;\n  // ожидание ставим ДО вызова кода под тестом\n  EXPECT_CALL(storage, Find(\"tok\"))\n      .WillOnce(Return(std::optional<std::int64_t>(42)));\n\n  AuthService auth(storage, audit);\n\n  EXPECT_EQ(auth.Authenticate(\"tok\"), 42);\n}\n\nTEST(AuthServiceTest, EmptyTokenDoesNotTouchStorage) {\n  // StrictMock: любой вызов без EXPECT_CALL — провал\n  StrictMock<MockTokenStorage> storage;\n  StrictMock<MockAuditLog> audit;\n  AuthService auth(storage, audit);\n\n  EXPECT_EQ(auth.Authenticate(\"\"), std::nullopt);\n}\n\nTEST(AuthServiceTest, LogoutRemovesTokenAndWritesAudit) {\n  NiceMock<MockTokenStorage> storage;\n  MockAuditLog audit;\n  EXPECT_CALL(storage, Find(\"tok\"))\n      .WillOnce(Return(std::optional<std::int64_t>(7)));\n  EXPECT_CALL(storage, Remove(\"tok\")).Times(1);\n  EXPECT_CALL(audit, Write(\"logout\", 7));  // Times(1) по умолчанию\n\n  AuthService auth(storage, audit);\n\n  EXPECT_TRUE(auth.Logout(\"tok\"));\n}\n\nTEST(AuthServiceTest, LogoutUnknownTokenWritesNothing) {\n  NiceMock<MockTokenStorage> storage;  // Find -> nullopt\n  MockAuditLog audit;\n  EXPECT_CALL(audit, Write(_, _)).Times(0);\n  EXPECT_CALL(storage, Remove(_)).Times(0);\n\n  AuthService auth(storage, audit);\n\n  EXPECT_FALSE(auth.Logout(\"nope\"));\n}\n", "mode": "gtest"}, {"type": "list", "items": ["`MOCK_METHOD(Тип, Имя, (аргументы), (спецификаторы));` — 4 аргумента, у метода без спецификаторов можно 3.", "Аргументы всегда в скобках, даже один: `(const std::string& token)`. Пустой список: `()`.", "Спецификаторы в скобках через запятую: `(override)`, `(const, override)`, `(const, noexcept, override)`. `const` обязан совпадать с интерфейсом, иначе override не сойдётся.", "Тип с запятой (`std::map<K, V>`, `std::pair<A, B>`) — в дополнительных скобках или через `using`.", "Старые макросы `MOCK_METHOD1`, `MOCK_CONST_METHOD2` — легаси. В новом коде только `MOCK_METHOD`."]}, {"type": "p", "text": "Три вида мока и два вида «лишних» вызовов:"}, {"type": "list", "items": ["Uninteresting call — вызов метода, на который НЕТ ни одного `EXPECT_CALL`. Обычный мок: warning, тест проходит. `NiceMock`: молча. `StrictMock`: провал теста (вызов вернёт значение по умолчанию, тест доработает, но будет красным).", "Unexpected call — `EXPECT_CALL` на метод есть, но аргументы не подошли или лимит вызовов исчерпан. Это провал для любого мока, включая `NiceMock`."]}, {"type": "p", "text": "ON_CALL против EXPECT_CALL:"}, {"type": "list", "items": ["`ON_CALL(mock, M(...)).WillByDefault(action)` — что вернуть, если позовут. Не проверка: не позвали — тест не упадёт.", "`EXPECT_CALL(mock, M(...))` — проверка: метод ДОЛЖЕН быть вызван нужное число раз. Плюс можно задать действие через `WillOnce`/`WillRepeatedly`.", "Хороший стиль: поведение по умолчанию — `ON_CALL` в фикстуре; `EXPECT_CALL` — только там, где вызов и есть проверяемое поведение."]}, {"type": "code", "code": "#include <cstdint>\n#include <optional>\n#include <string>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\n// ---- из примера выше: интерфейсы, сервис, моки ----\nclass TokenStorage {\n public:\n  virtual ~TokenStorage() = default;\n  virtual bool Save(const std::string& t, std::int64_t uid) = 0;\n  virtual std::optional<std::int64_t> Find(\n      const std::string& t) const = 0;\n  virtual void Remove(const std::string& t) = 0;\n};\n\nclass AuditLog {\n public:\n  virtual ~AuditLog() = default;\n  virtual void Write(const std::string& ev, std::int64_t uid) = 0;\n};\n\nclass AuthService {\n public:\n  AuthService(TokenStorage& s, AuditLog& a)\n      : storage_(s), audit_(a) {}\n  std::optional<std::int64_t> Authenticate(\n      const std::string& token) const {\n    if (token.empty()) return std::nullopt;\n    return storage_.Find(token);\n  }\n  bool Logout(const std::string& token) {\n    const auto uid = storage_.Find(token);\n    if (!uid) return false;\n    storage_.Remove(token);\n    audit_.Write(\"logout\", *uid);\n    return true;\n  }\n\n private:\n  TokenStorage& storage_;\n  AuditLog& audit_;\n};\n\nclass MockTokenStorage : public TokenStorage {\n public:\n  MOCK_METHOD(bool, Save, (const std::string&, std::int64_t),\n              (override));\n  MOCK_METHOD(std::optional<std::int64_t>, Find,\n              (const std::string&), (const, override));\n  MOCK_METHOD(void, Remove, (const std::string&), (override));\n};\n\nclass MockAuditLog : public AuditLog {\n public:\n  MOCK_METHOD(void, Write, (const std::string&, std::int64_t),\n              (override));\n};\n\n// ---- тесты ----\nusing ::testing::_;\nusing ::testing::NiceMock;\nusing ::testing::Return;\n\nclass AuthServiceTest : public ::testing::Test {\n protected:\n  AuthServiceTest() {\n    // ON_CALL — поведение по умолчанию, НЕ проверка.\n    // Не вызвали — тест не упадёт.\n    ON_CALL(storage_, Find(_))\n        .WillByDefault(Return(std::nullopt));\n    ON_CALL(storage_, Find(\"good\"))\n        .WillByDefault(Return(std::optional<std::int64_t>(1)));\n  }\n\n  NiceMock<MockTokenStorage> storage_;\n  NiceMock<MockAuditLog> audit_;\n  AuthService auth_{storage_, audit_};\n};\n\nTEST_F(AuthServiceTest, KnownToken) {\n  EXPECT_EQ(auth_.Authenticate(\"good\"), 1);\n}\n\nTEST_F(AuthServiceTest, UnknownToken) {\n  EXPECT_EQ(auth_.Authenticate(\"bad\"), std::nullopt);\n}\n\n// EXPECT_CALL — только там, где взаимодействие и есть\n// проверяемое поведение\nTEST_F(AuthServiceTest, LogoutWritesAudit) {\n  EXPECT_CALL(audit_, Write(\"logout\", 1));\n  EXPECT_TRUE(auth_.Logout(\"good\"));\n}\n", "mode": "gtest"}, {"type": "p", "text": "Действия, матчеры аргументов, количество вызовов:"}, {"type": "code", "code": "#include <cstdint>\n#include <optional>\n#include <stdexcept>\n#include <string>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\n// ---- TokenStorage и его мок — из примера выше ----\nclass TokenStorage {\n public:\n  virtual ~TokenStorage() = default;\n  virtual bool Save(const std::string& t, std::int64_t uid) = 0;\n  virtual std::optional<std::int64_t> Find(\n      const std::string& t) const = 0;\n  virtual void Remove(const std::string& t) = 0;\n};\n\nclass MockTokenStorage : public TokenStorage {\n public:\n  MOCK_METHOD(bool, Save, (const std::string&, std::int64_t),\n              (override));\n  MOCK_METHOD(std::optional<std::int64_t>, Find,\n              (const std::string&), (const, override));\n  MOCK_METHOD(void, Remove, (const std::string&), (override));\n};\n\n// ---- тесты ----\nusing ::testing::_;\nusing ::testing::AtLeast;\nusing ::testing::DoAll;\nusing ::testing::Gt;\nusing ::testing::HasSubstr;\nusing ::testing::Return;\nusing ::testing::SaveArg;\nusing ::testing::StartsWith;\nusing ::testing::Throw;\n\nTEST(ActionsTest, Sequence) {\n  MockTokenStorage storage;\n  // 1-й вызов -> 1, 2-й -> 2, дальше всегда nullopt\n  EXPECT_CALL(storage, Find(_))\n      .WillOnce(Return(std::optional<std::int64_t>(1)))\n      .WillOnce(Return(std::optional<std::int64_t>(2)))\n      .WillRepeatedly(Return(std::nullopt));\n  EXPECT_EQ(storage.Find(\"a\"), 1);\n  EXPECT_EQ(storage.Find(\"a\"), 2);\n  EXPECT_EQ(storage.Find(\"a\"), std::nullopt);\n  EXPECT_EQ(storage.Find(\"a\"), std::nullopt);\n}\n\nTEST(ActionsTest, ArgMatchersAndCapture) {\n  MockTokenStorage storage;\n  std::string saved;\n  // матчеры аргументов: _, Eq(x) или просто x, Gt, StartsWith...\n  EXPECT_CALL(storage, Save(StartsWith(\"s_\"), Gt(0)))\n      .WillOnce(DoAll(SaveArg<0>(&saved), Return(true)));\n  EXPECT_TRUE(storage.Save(\"s_abc\", 42));\n  EXPECT_EQ(saved, \"s_abc\");\n}\n\nTEST(ActionsTest, ThrowAndLambda) {\n  MockTokenStorage storage;\n  EXPECT_CALL(storage, Save(_, _))\n      .WillOnce(Throw(std::runtime_error(\"db is down\")))\n      // любой callable с совместимой сигнатурой\n      .WillOnce([](const std::string& t, std::int64_t) {\n        return t.size() > 3;\n      });\n  EXPECT_THROW(storage.Save(\"tok1\", 1), std::runtime_error);\n  EXPECT_TRUE(storage.Save(\"tok1\", 1));\n}\n\nTEST(ActionsTest, Cardinalities) {\n  MockTokenStorage storage;\n  EXPECT_CALL(storage, Remove(HasSubstr(\"old\")))\n      .Times(AtLeast(2));\n  // также: Times(n), AtMost(n), Between(a, b), AnyNumber()\n  storage.Remove(\"old-1\");\n  storage.Remove(\"old-2\");\n}\n", "mode": "gtest"}, {"type": "list", "items": ["Нет `Times` и нет `WillOnce` — `Times(1)`.", "N раз `WillOnce`, без `WillRepeatedly` — `Times(N)`. (N+1)-й вызов — провал «called more times than expected».", "N раз `WillOnce` и `WillRepeatedly` — `Times(AtLeast(N))`.", "Только `WillRepeatedly` — `Times(AnyNumber())`.", "Без действия мок возвращает значение по умолчанию: `0`, `false`, пустую строку, `std::nullopt`, объект по умолчанию."]}, {"type": "p", "text": "Порядок вызовов проверяют через `InSequence`:"}, {"type": "code", "code": "#include <cstdint>\n#include <optional>\n#include <string>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\n// ---- сокращённо из примера выше ----\nclass TokenStorage {\n public:\n  virtual ~TokenStorage() = default;\n  virtual std::optional<std::int64_t> Find(\n      const std::string& t) const = 0;\n  virtual void Remove(const std::string& t) = 0;\n};\n\nclass AuditLog {\n public:\n  virtual ~AuditLog() = default;\n  virtual void Write(const std::string& ev, std::int64_t uid) = 0;\n};\n\nclass AuthService {\n public:\n  AuthService(TokenStorage& s, AuditLog& a)\n      : storage_(s), audit_(a) {}\n  bool Logout(const std::string& token) {\n    const auto uid = storage_.Find(token);\n    if (!uid) return false;\n    storage_.Remove(token);\n    audit_.Write(\"logout\", *uid);\n    return true;\n  }\n\n private:\n  TokenStorage& storage_;\n  AuditLog& audit_;\n};\n\nclass MockTokenStorage : public TokenStorage {\n public:\n  MOCK_METHOD(std::optional<std::int64_t>, Find,\n              (const std::string&), (const, override));\n  MOCK_METHOD(void, Remove, (const std::string&), (override));\n};\n\nclass MockAuditLog : public AuditLog {\n public:\n  MOCK_METHOD(void, Write, (const std::string&, std::int64_t),\n              (override));\n};\n\n// ---- тест ----\nusing ::testing::InSequence;\nusing ::testing::Return;\n\nTEST(AuthServiceTest, LogoutOrder) {\n  MockTokenStorage storage;\n  MockAuditLog audit;\n  {\n    InSequence seq;  // ожидания ниже — строго в этом порядке\n    EXPECT_CALL(storage, Find(\"tok\"))\n        .WillOnce(Return(std::optional<std::int64_t>(7)));\n    EXPECT_CALL(storage, Remove(\"tok\"));\n    EXPECT_CALL(audit, Write(\"logout\", 7));\n  }\n  AuthService auth(storage, audit);\n  EXPECT_TRUE(auth.Logout(\"tok\"));\n}\n", "mode": "gtest"}, {"type": "code", "code": "#include <map>\n#include <string>\n#include <utility>\n\n#include <gmock/gmock.h>\n\nclass Registry {\n public:\n  virtual ~Registry() = default;\n  virtual std::map<std::string, int> GetAll() const = 0;\n  virtual std::pair<bool, int> TryGet(std::string key) = 0;\n};\n\nclass MockRegistry : public Registry {\n public:\n  // запятая в типе ломает макрос — оборачиваем в скобки\n  MOCK_METHOD((std::map<std::string, int>), GetAll, (),\n              (const, override));\n  MOCK_METHOD((std::pair<bool, int>), TryGet, (std::string key),\n              (override));\n};\n\nTEST(MockRegistryTest, Compiles) {\n  MockRegistry r;\n  EXPECT_CALL(r, GetAll())\n      .WillOnce(::testing::Return(std::map<std::string, int>{\n          {\"a\", 1}}));\n  EXPECT_EQ(r.GetAll().size(), 1u);\n}", "mode": "gtest"}, {"type": "warn", "text": "Ловушки gmock. 1) `EXPECT_CALL` ставится ДО вызова кода под тестом; ставить после — неопределённое поведение по документации gmock. 2) Из нескольких подходящих ожиданий срабатывает ПОСЛЕДНЕЕ объявленное: общее (`_`) пиши первым, частное — после. 3) `Return(x)` копирует `x` в момент `EXPECT_CALL`; изменения переменной потом не видны — для живого значения `ReturnRef` или лямбда. 4) Невиртуальный метод не мокается: через ссылку на базу вызовется настоящий метод, ожидание останется невыполненным. 5) Ожидания проверяются в деструкторе мока; утёкший мок (new без delete) не проверится."}, {"type": "tip", "text": "Не мокай всё подряд. Хранилище часто проще заменить фейком (in-memory реализацией), а мок оставить для взаимодействий, которые и есть поведение: отправили событие, записали аудит. Тест с десятком EXPECT_CALL ломается от любого рефакторинга — это overspecification."}, {"type": "tip", "text": "Вслух: «Чтобы протестировать AuthService без базы, выделю интерфейс TokenStorage и передам его в конструктор. В тесте на пустой токен — StrictMock: сервис не должен ходить в хранилище вообще»."}]}, {"id": "tests-time", "title": "Время и случайность", "blocks": [{"type": "p", "text": "Код, который сам зовёт `std::chrono::system_clock::now()`, нельзя нормально протестировать: чтобы проверить истечение TTL, придётся спать час или полагаться на удачу. Решение — время как зависимость: интерфейс Clock, в проде настоящие часы, в тесте — часы, которые двигаешь руками."}, {"type": "code", "code": "// ---- clock.h ----\n#include <chrono>\n\nclass Clock {\n public:\n  using TimePoint = std::chrono::system_clock::time_point;\n  virtual ~Clock() = default;\n  virtual TimePoint Now() const = 0;\n};\n\n// прод-реализация\nclass SystemClock final : public Clock {\n public:\n  TimePoint Now() const override {\n    return std::chrono::system_clock::now();\n  }\n};\n\n// тестовая реализация: время двигаем руками\nclass FakeClock final : public Clock {\n public:\n  explicit FakeClock(TimePoint start = TimePoint{}) : now_(start) {}\n  TimePoint Now() const override { return now_; }\n  void Advance(std::chrono::seconds d) { now_ += d; }\n\n private:\n  TimePoint now_;\n};\n\n// ---- access_token_test.cpp ----\n#include <gtest/gtest.h>\n\nusing namespace std::chrono_literals;\n\n// код под тестом НЕ зовёт system_clock::now() сам\nclass AccessToken {\n public:\n  AccessToken(const Clock& clock, std::chrono::seconds ttl)\n      : clock_(clock), expires_at_(clock.Now() + ttl) {}\n\n  bool IsExpired() const { return clock_.Now() >= expires_at_; }\n\n private:\n  const Clock& clock_;\n  Clock::TimePoint expires_at_;\n};\n\nTEST(AccessTokenTest, FreshTokenIsNotExpired) {\n  FakeClock clock;\n  const AccessToken token(clock, 1h);\n  EXPECT_FALSE(token.IsExpired());\n}\n\nTEST(AccessTokenTest, ValidOneSecondBeforeTtl) {\n  FakeClock clock;\n  const AccessToken token(clock, 1h);\n  clock.Advance(1h - 1s);\n  EXPECT_FALSE(token.IsExpired());\n}\n\nTEST(AccessTokenTest, ExpiresExactlyAtTtl) {\n  FakeClock clock;\n  const AccessToken token(clock, 1h);\n  clock.Advance(1h);  // мгновенно, без sleep\n  EXPECT_TRUE(token.IsExpired());\n}\n", "mode": "gtest"}, {"type": "list", "items": ["`steady_clock` — для TTL в памяти, таймаутов, измерения интервалов. Монотонные: NTP и ручная смена времени на них не влияют.", "`system_clock` — для отметок, которые видны снаружи: `exp` в JWT, колонка `expires_at` в БД, логи."]}, {"type": "warn", "text": "TTL в памяти на `system_clock`: NTP перевёл часы назад на 10 минут — сессия живёт на 10 минут дольше; вперёд — сессии массово протухают раньше времени. Для интервалов — `steady_clock`."}, {"type": "p", "text": "Варианты инъекции часов:"}, {"type": "list", "items": ["Интерфейс с виртуальным `Now()` — как выше. Просто, понятно, цена — виртуальный вызов.", "Параметр шаблона — без виртуальных вызовов, пример ниже.", "`std::function<TimePoint()>` в конструкторе — когда нужна одна функция, а не иерархия.", "В userver время берут через `utils::datetime::Now()`; в юнит-тестах его подменяют `utils::datetime::MockNowSet(...)`, а в testsuite — маркером `@pytest.mark.now(...)` и фикстурой `mocked_time`."]}, {"type": "code", "code": "#include <chrono>\n\n#include <gtest/gtest.h>\n\nusing namespace std::chrono_literals;\n\n// вариант без виртуальных вызовов: часы — параметр шаблона\ntemplate <typename ClockT = std::chrono::steady_clock>\nclass RateWindow {\n public:\n  explicit RateWindow(std::chrono::seconds len) : len_(len) {}\n  bool Expired(typename ClockT::time_point start) const {\n    return ClockT::now() - start >= len_;\n  }\n\n private:\n  std::chrono::seconds len_;\n};\n\nstruct ManualClock {\n  using duration = std::chrono::nanoseconds;\n  using rep = duration::rep;\n  using period = duration::period;\n  static constexpr bool is_steady = false;\n  using time_point =\n      std::chrono::time_point<ManualClock, duration>;\n  static inline time_point current{};\n  static time_point now() { return current; }\n};\n\nTEST(RateWindowTest, ExpiresAfterLength) {\n  ManualClock::current = {};\n  const RateWindow<ManualClock> w(10s);\n  const auto start = ManualClock::now();\n  ManualClock::current += 9s;\n  EXPECT_FALSE(w.Expired(start));\n  ManualClock::current += 1s;\n  EXPECT_TRUE(w.Expired(start));\n}", "mode": "gtest"}, {"type": "p", "text": "Случайность — так же. Генератор токенов — зависимость: в тестах SessionStore его мокают и возвращают фиксированные токены. А сам генератор тестируют по свойствам: длина, алфавит, уникальность, с фиксированным сидом."}, {"type": "code", "code": "#include <cstdint>\n#include <random>\n#include <string>\n#include <unordered_set>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nclass TokenGenerator {\n public:\n  virtual ~TokenGenerator() = default;\n  virtual std::string Next() = 0;\n};\n\n// в проде — криптостойкий источник; mt19937 тут для примера\nclass RandomTokenGenerator final : public TokenGenerator {\n public:\n  explicit RandomTokenGenerator(std::uint64_t seed) : rng_(seed) {}\n  std::string Next() override {\n    static constexpr char kHex[] = \"0123456789abcdef\";\n    std::string s(32, '0');\n    for (char& c : s) c = kHex[rng_() % 16];\n    return s;\n  }\n\n private:\n  std::mt19937_64 rng_;\n};\n\n// проверяем СВОЙСТВА, а не конкретные значения\nTEST(RandomTokenGeneratorTest, Has32HexChars) {\n  RandomTokenGenerator gen(/*seed=*/42);\n  const std::string t = gen.Next();\n  EXPECT_EQ(t.size(), 32u);\n  EXPECT_THAT(t, ::testing::Each(::testing::AnyOfArray(\n                     std::string(\"0123456789abcdef\"))));\n}\n\nTEST(RandomTokenGeneratorTest, TokensAreUnique) {\n  RandomTokenGenerator gen(/*seed=*/42);\n  std::unordered_set<std::string> seen;\n  for (int i = 0; i < 10'000; ++i) {\n    EXPECT_TRUE(seen.insert(gen.Next()).second) << \"i=\" << i;\n  }\n}", "mode": "gtest"}, {"type": "warn", "text": "Фиксированный сид фиксирует последовательность ДВИЖКА: `std::mt19937` везде выдаёт одни и те же числа, алгоритм задан стандартом. Но не распределения: алгоритм `std::uniform_int_distribution` и других — на усмотрение реализации, libstdc++ и libc++ дают разные числа. Тест с захардкоженными «случайными» значениями сломается при смене компилятора."}, {"type": "tip", "text": "Вслух: «Время — внешняя зависимость, как база. Инжектирую Clock, в тесте FakeClock, проверяю границу: ttl минус секунда — валиден, ровно ttl — уже нет. Без sleep: тест детерминированный и мгновенный»."}]}, {"id": "tests-mt", "title": "Тесты многопоточного кода", "blocks": [{"type": "p", "text": "Тест не докажет отсутствие гонки: расписание потоков каждый раз разное. Что реально можно сделать:"}, {"type": "list", "items": ["Проверить инварианты ПОСЛЕ `join`: сумма сошлась, лимит не превышен, ничего не потерялось.", "Нагрузить код: много потоков, много итераций, одновременный старт — чтобы гонка проявилась.", "Прогнать под ThreadSanitizer: он ловит data race по факту доступа, даже если результат случайно верный.", "Нельзя: утверждать, в каком порядке выполнились потоки, и полагаться на `sleep` для синхронизации."]}, {"type": "code", "code": "// ---- rate_limiter.h ----\n#include <atomic>\n\nclass RateLimiter {\n public:\n  explicit RateLimiter(int limit) : left_(limit) {}\n\n  bool TryAcquire() {\n    int cur = left_.load();\n    // CAS-цикл: \"проверить и уменьшить\" одной операцией\n    while (cur > 0) {\n      if (left_.compare_exchange_weak(cur, cur - 1)) return true;\n    }\n    return false;\n  }\n\n private:\n  std::atomic<int> left_;\n};\n\n// ---- rate_limiter_test.cpp ----\n#include <latch>\n#include <thread>\n#include <vector>\n\n#include <gtest/gtest.h>\n\nTEST(RateLimiterTest, ConcurrentAcquireNeverExceedsLimit) {\n  constexpr int kLimit = 100;\n  constexpr int kThreads = 8;\n  constexpr int kAttemptsPerThread = 1000;\n  RateLimiter limiter(kLimit);\n  std::atomic<int> granted{0};\n  // стартовые ворота: все потоки стартуют одновременно,\n  // а не по очереди, пока создаются\n  std::latch start(kThreads);\n\n  std::vector<std::thread> threads;\n  threads.reserve(kThreads);\n  for (int i = 0; i < kThreads; ++i) {\n    threads.emplace_back([&] {\n      start.arrive_and_wait();\n      for (int j = 0; j < kAttemptsPerThread; ++j) {\n        if (limiter.TryAcquire()) granted.fetch_add(1);\n      }\n    });\n  }\n  for (auto& t : threads) t.join();\n\n  // проверяем инвариант ПОСЛЕ join, а не порядок событий\n  EXPECT_EQ(granted.load(), kLimit);\n}\n", "mode": "gtest"}, {"type": "list", "items": ["`std::latch` (C++20, `<latch>`) — одноразовый счётчик. `arrive_and_wait()` уменьшает и ждёт нуля. Без него первые потоки успевают всё сделать, пока создаются остальные, и конкуренции нет.", "`std::barrier` (C++20) — многоразовый: для тестов по фазам («все сделали шаг 1, потом все шаг 2»).", "`--gtest_repeat=1000` — прогнать много раз, чтобы поймать редкую гонку.", "Счётчики результатов из потоков — `std::atomic` или под mutex, иначе гонка в самом тесте."]}, {"type": "p", "text": "ThreadSanitizer — флаг компилятора. Тест с гонкой:"}, {"type": "code", "code": "#include <thread>\n\n#include <gtest/gtest.h>\n\n// гонка: ++ на обычном int из двух потоков — UB\nTEST(CounterTest, RacyIncrement) {\n  int counter = 0;\n  auto inc = [&] {\n    for (int i = 0; i < 100000; ++i) ++counter;\n  };\n  std::thread a(inc);\n  std::thread b(inc);\n  a.join();\n  b.join();\n  EXPECT_EQ(counter, 200000);  // может и пройти\n}\n", "mode": "gtest"}, {"type": "p", "text": "Без санитайзера такой тест ненадёжен. Здесь (gcc, `-O1`) он проходит: гонка — UB, и оптимизатор вправе переписать цикл так, что потоки почти не пересекаются. С `-O0` такой тест падал. Тот же код под ThreadSanitizer (режим tsan, без gtest):"}, {"type": "code", "code": "// тот же код без gtest, режим tsan:\n// clang -fsanitize=thread (gtest в этом режиме недоступен)\n#include <cstdio>\n#include <thread>\n\nint main() {\n  int counter = 0;\n  auto inc = [&] {\n    for (int i = 0; i < 100000; ++i) ++counter;\n  };\n  std::thread a(inc);\n  std::thread b(inc);\n  a.join();\n  b.join();\n  std::printf(\"counter=%d\\n\", counter);\n}\n", "mode": "tsan"}, {"type": "p", "text": "TSan сообщает `WARNING: ThreadSanitizer: data race` и печатает стеки обоих конфликтующих доступов, даже когда итоговое число сошлось. Сборка с TSan у себя:"}, {"type": "code", "code": "# Linux, gtest установлен в систему\nclang++ -std=c++20 -g -O1 -fsanitize=thread \\\n  counter_test.cpp -lgtest_main -lgtest -pthread \\\n  -o counter_test\n./counter_test\n\n# CMake: отдельная сборочная директория под TSan\ncmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug \\\n  -DCMAKE_CXX_FLAGS=\"-fsanitize=thread -g -O1\" \\\n  -DCMAKE_EXE_LINKER_FLAGS=\"-fsanitize=thread\"\ncmake --build build-tsan -j\nctest --test-dir build-tsan --output-on-failure", "run": false}, {"type": "warn", "text": "TSan нельзя совмещать с ASan в одной сборке — делай отдельные сборки. TSan замедляет код примерно в 5–15 раз и ест в 5–10 раз больше памяти: стресс-тесты под ним делай короче."}, {"type": "p", "text": "Асинхронный код: ждём событие, а не время."}, {"type": "code", "code": "#include <chrono>\n#include <functional>\n#include <future>\n#include <thread>\n\n#include <gtest/gtest.h>\n\nusing namespace std::chrono_literals;\n\n// асинхронный код: результат приходит в callback из другого потока\nclass Worker {\n public:\n  void Submit(int x, std::function<void(int)> on_done) {\n    thread_ = std::thread([x, cb = std::move(on_done)] {\n      cb(x * 2);\n    });\n  }\n  ~Worker() {\n    if (thread_.joinable()) thread_.join();\n  }\n\n private:\n  std::thread thread_;\n};\n\nTEST(WorkerTest, CallsBackWithResult) {\n  Worker worker;\n  std::promise<int> done;\n  std::future<int> result = done.get_future();\n\n  worker.Submit(21, [&done](int r) { done.set_value(r); });\n\n  // НЕ sleep_for(100ms): ждём событие. Таймаут — только\n  // страховка от зависания, в норме ждём микросекунды\n  ASSERT_EQ(result.wait_for(5s), std::future_status::ready);\n  EXPECT_EQ(result.get(), 42);\n}", "mode": "gtest"}, {"type": "warn", "text": "`sleep_for(100ms)` «чтобы поток успел» — главный источник flaky-тестов: на загруженном CI 100 мс не хватит, а на быстрой машине тест зря тратит время. Синхронизируйся по событию: `future`, `latch`, `condition_variable`. Таймаут — только страховка от вечного зависания."}, {"type": "warn", "text": "`ASSERT_*` внутри лямбды потока делает `return` из лямбды, а не из теста. Тест будет помечен упавшим, но основной поток пойдёт дальше. Проверки делай в основном потоке после `join`, из потоков собирай результаты."}, {"type": "p", "text": "Дедлок в тесте — это зависание. Ставь лимит времени в ctest: `gtest_discover_tests(t PROPERTIES TIMEOUT 30)`, иначе CI будет висеть до глобального таймаута."}, {"type": "tip", "text": "Вслух: «Порядок потоков не проверяю — он недетерминирован. Проверяю инвариант после join: выдано ровно limit. Старт через latch, чтобы потоки реально конкурировали. И обязательно прогон под TSan в CI»."}]}, {"id": "tests-integration", "title": "Юнит, интеграционные и e2e", "blocks": [{"type": "list", "items": ["Юнит: один класс или функция. Зависимости — фейки и моки. Нет сети, диска, БД. Миллисекунды.", "Интеграционный: наш код плюс настоящая инфраструктура — PostgreSQL или Redis в контейнере, настоящие SQL-запросы, миграции, драйвер. Проверяет то, что мок проверить не может: синтаксис SQL, индексы и constraints, транзакции, сериализацию.", "E2E (функциональный): сервис целиком, запросы по HTTP/gRPC как от клиента. Внешние сервисы подменены на уровне сети."]}, {"type": "p", "text": "Пирамида: много юнитов, меньше интеграционных, мало e2e. Чем выше уровень — тем медленнее, дороже и чаще flaky, но тем ближе к правде."}, {"type": "p", "text": "Интеграционный тест на чистом gtest. БД поднимается снаружи (docker в CI или локально), адрес — через переменную окружения. Без неё тесты пропускаются, а не падают. В примере ниже настоящие `db::Connection` и `UserRepo` заменены объявленными заглушками: на этой странице Postgres нет, и прогон покажет `[  SKIPPED ]`."}, {"type": "code", "code": "docker run -d --rm --name pg-test -p 5432:5432 \\\n  -e POSTGRES_PASSWORD=test postgres:16\n\nexport TEST_PG_DSN=\\\n\"postgresql://postgres:test@localhost:5432/postgres\"\n\nctest --test-dir build -L integration --output-on-failure", "run": false}, {"type": "code", "code": "// user_repo_it.cpp — интеграционный тест репозитория.\n// В проекте: #include \"db/connection.h\" и \"user_repo.h\".\n// Здесь вместо них объявленные заглушки, чтобы файл собрался.\n// TEST_PG_DSN не задан, поэтому тесты скипаются.\n#include <cstdint>\n#include <cstdlib>\n#include <memory>\n#include <optional>\n#include <stdexcept>\n#include <string>\n\n#include <gtest/gtest.h>\n\n// ---- ЗАГЛУШКИ (в проекте — обёртка над libpq/pqxx) ----\nnamespace db {\nstruct UniqueViolation : std::runtime_error {\n  using std::runtime_error::runtime_error;\n};\nclass Connection {\n public:\n  explicit Connection(const std::string&) {\n    throw std::runtime_error(\"stub: нужен настоящий Postgres\");\n  }\n  void Execute(const std::string&) {}\n};\n}  // namespace db\n\nstruct User {\n  std::int64_t id = 0;\n  std::string login;\n  std::string email;\n};\n\nclass UserRepo {  // ЗАГЛУШКА: настоящий ходит в БД через SQL\n public:\n  explicit UserRepo(db::Connection&) {}\n  std::int64_t Insert(const User&) { return 0; }\n  std::optional<User> FindByLogin(const std::string&) {\n    return std::nullopt;\n  }\n};\n\nstd::string ReadFile(const std::string&) { return \"\"; }\n\n// ---- сам тест ----\nclass UserRepoIT : public ::testing::Test {\n protected:\n  static void SetUpTestSuite() {\n    // БД поднята снаружи: docker / CI-сервис\n    const char* dsn = std::getenv(\"TEST_PG_DSN\");\n    if (dsn == nullptr) return;  // тесты скипнутся в SetUp\n    conn_ = std::make_unique<db::Connection>(dsn);\n    conn_->Execute(ReadFile(\"migrations/001_users.sql\"));\n  }\n  static void TearDownTestSuite() { conn_.reset(); }\n\n  void SetUp() override {\n    if (!conn_) GTEST_SKIP() << \"TEST_PG_DSN is not set\";\n    conn_->Execute(\"BEGIN\");  // каждый тест — в транзакции\n  }\n  void TearDown() override {\n    if (conn_) conn_->Execute(\"ROLLBACK\");  // и всё откатываем\n  }\n\n  static inline std::unique_ptr<db::Connection> conn_;\n};\n\nTEST_F(UserRepoIT, InsertThenFindByLogin) {\n  UserRepo repo(*conn_);\n  const auto id = repo.Insert({.login = \"alex\", .email = \"a@x.ru\"});\n\n  const auto user = repo.FindByLogin(\"alex\");\n\n  ASSERT_TRUE(user.has_value());\n  EXPECT_EQ(user->id, id);\n}\n\n// проверяем то, что юнит-тест с моком проверить НЕ может:\n// реальный UNIQUE-индекс в схеме\nTEST_F(UserRepoIT, DuplicateLoginIsRejected) {\n  UserRepo repo(*conn_);\n  repo.Insert({.login = \"alex\", .email = \"a@x.ru\"});\n\n  EXPECT_THROW(repo.Insert({.login = \"alex\", .email = \"b@x.ru\"}),\n               db::UniqueViolation);\n}\n", "mode": "gtest"}, {"type": "code", "code": "add_executable(user_repo_it test/user_repo_it.cpp)\ntarget_link_libraries(user_repo_it PRIVATE auth GTest::gtest_main)\ngtest_discover_tests(user_repo_it\n  PROPERTIES LABELS integration TIMEOUT 60)\n\n# ctest -L integration    — только интеграционные\n# ctest -LE integration   — всё, кроме них (быстрый прогон)", "run": false}, {"type": "p", "text": "Как изолировать тесты друг от друга:"}, {"type": "list", "items": ["Транзакция на тест: `BEGIN` в SetUp, `ROLLBACK` в TearDown. Быстро. Ломается, если код под тестом сам делает `COMMIT`, открывает свои транзакции или берёт другое соединение из пула: его данные не откатятся и утекут в следующие тесты.", "`TRUNCATE` нужных таблиц в SetUp. Медленнее, зато честно.", "Отдельная БД или схема на suite (или на воркер при параллельном запуске).", "Уникальные данные в каждом тесте (логин с суффиксом), если чистить нельзя.", "Подготовка данных (seeding): SQL-файлы с фикстурами или хелперы вроде `InsertUser(conn, \"alex\")`."]}, {"type": "p", "text": "В Go, Java и Python контейнеры часто поднимают прямо из теста библиотекой testcontainers. В C++ их обычно поднимают снаружи: docker compose в CI или скрипт перед ctest."}, {"type": "p", "text": "userver. Функциональные и интеграционные тесты сервиса в userver пишут на Python через testsuite (на базе pytest). Фреймворк поднимает сервис и базы. Фикстура `service_client` шлёт запросы в сервис, `mockserver` подменяет внешние HTTP-сервисы, `pgsql` даёт доступ к настоящей БД. Между тестами таблицы очищаются, данные для теста — маркером `@pytest.mark.pgsql(..., files=[...])`. Пути и коды ответа ниже — условные."}, {"type": "code", "code": "# tests/test_sessions.py — userver testsuite (pytest)\nimport pytest\n\n\n@pytest.mark.pgsql('auth', files=['users.sql'])\nasync def test_create_session(service_client, pgsql):\n    response = await service_client.post(\n        '/v1/sessions', json={'login': 'alex'},\n    )\n    assert response.status == 200\n    token = response.json()['token']\n\n    # проверяем состояние настоящей БД напрямую\n    cursor = pgsql['auth'].cursor()\n    cursor.execute(\n        'SELECT uid FROM sessions WHERE token = %s', (token,),\n    )\n    assert len(cursor.fetchall()) == 1\n\n\nasync def test_profile_upstream_down(service_client, mockserver):\n    # внешний HTTP-сервис подменён mockserver'ом\n    @mockserver.json_handler('/profile/v1/info')\n    def _profile(request):\n        return mockserver.make_response(status=500)\n\n    response = await service_client.get('/v1/me')\n    assert response.status == 503\n    assert _profile.times_called >= 1", "run": false}, {"type": "p", "text": "Юнит-тесты в userver — тот же gtest. Для кода на корутинах userver есть свои макросы: тело теста запускается внутри движка корутин."}, {"type": "code", "code": "#include <userver/utest/utest.hpp>\n\n// как TEST, но тело выполняется внутри движка корутин:\n// можно engine::Mutex, utils::Async, ожидания и т.п.\nUTEST(SessionCacheTest, WorksInsideCoroutine) {\n  EXPECT_TRUE(true);\n}\n\n// то же, но движок на 4 рабочих потоках\nUTEST_MT(SessionCacheTest, Concurrent, 4) {\n  EXPECT_TRUE(true);\n}\n\n// есть и UTEST_F, UTEST_P — аналоги TEST_F, TEST_P", "run": false}, {"type": "warn", "text": "Не придумывай детали userver, в которых не уверен. Безопасная формулировка: «функциональные тесты — testsuite на pytest, внешние сервисы — mockserver, база настоящая и поднимается фреймворком; юнит-тесты — gtest, для корутин — UTEST»."}, {"type": "tip", "text": "Вслух: «Мок TokenStorage не проверит, что UNIQUE-индекс на логине реально есть и SQL валиден. Поэтому репозиторий тестирую интеграционно на настоящем Postgres в контейнере, каждый тест в транзакции с откатом. А логику сервиса — юнитами с моками»."}]}, {"id": "tests-example", "title": "Разбор: SessionStore и его тесты", "blocks": [{"type": "p", "text": "Задача уровня доски. Хранилище сессий: `Create(uid)` возвращает токен, `Validate(token)` — uid или `nullopt`, `Revoke(token)` удаляет сессию. Сессия живёт ttl. Время и генерация токенов — внешние зависимости, их инжектируем."}, {"type": "code", "code": "// ---- session_store.h ----\n#include <chrono>\n#include <cstddef>\n#include <cstdint>\n#include <mutex>\n#include <optional>\n#include <stdexcept>\n#include <string>\n#include <unordered_map>\n\nclass Clock {\n public:\n  using TimePoint = std::chrono::steady_clock::time_point;\n  virtual ~Clock() = default;\n  virtual TimePoint Now() const = 0;\n};\n\nclass TokenGenerator {\n public:\n  virtual ~TokenGenerator() = default;\n  virtual std::string Next() = 0;\n};\n\nclass SessionStore {\n public:\n  SessionStore(const Clock& clock, TokenGenerator& gen,\n               std::chrono::seconds ttl)\n      : clock_(clock), gen_(gen), ttl_(ttl) {}\n\n  std::string Create(std::int64_t uid) {\n    std::lock_guard lock(mu_);\n    std::string token = gen_.Next();\n    const auto [it, inserted] = sessions_.try_emplace(\n        token, Session{uid, clock_.Now() + ttl_});\n    if (!inserted) throw std::runtime_error(\"token collision\");\n    return token;\n  }\n\n  std::optional<std::int64_t> Validate(\n      const std::string& token) const {\n    std::lock_guard lock(mu_);\n    const auto it = sessions_.find(token);\n    if (it == sessions_.end()) return std::nullopt;\n    if (clock_.Now() >= it->second.expires_at) return std::nullopt;\n    return it->second.uid;\n  }\n\n  bool Revoke(const std::string& token) {\n    std::lock_guard lock(mu_);\n    return sessions_.erase(token) > 0;\n  }\n\n  // удаляет протухшие, возвращает сколько удалено\n  std::size_t PurgeExpired() {\n    std::lock_guard lock(mu_);\n    const auto now = clock_.Now();\n    return std::erase_if(sessions_, [now](const auto& kv) {\n      return now >= kv.second.expires_at;\n    });\n  }\n\n private:\n  struct Session {\n    std::int64_t uid;\n    Clock::TimePoint expires_at;\n  };\n\n  const Clock& clock_;\n  TokenGenerator& gen_;\n  const std::chrono::seconds ttl_;\n  mutable std::mutex mu_;\n  std::unordered_map<std::string, Session> sessions_;\n};\n\n// ---- session_store_test.cpp ----\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing namespace std::chrono_literals;\nusing ::testing::NiceMock;\nusing ::testing::Return;\n\nclass FakeClock : public Clock {\n public:\n  TimePoint Now() const override { return now_; }\n  void Advance(std::chrono::seconds d) { now_ += d; }\n\n private:\n  TimePoint now_{};\n};\n\nclass MockTokenGenerator : public TokenGenerator {\n public:\n  MOCK_METHOD(std::string, Next, (), (override));\n};\n\nclass SessionStoreTest : public ::testing::Test {\n protected:\n  static constexpr std::chrono::seconds kTtl = 1h;\n\n  SessionStoreTest() {\n    ON_CALL(gen_, Next()).WillByDefault(Return(\"tok-1\"));\n  }\n\n  // порядок объявления = порядок инициализации:\n  // clock_ и gen_ должны быть ДО store_\n  FakeClock clock_;\n  NiceMock<MockTokenGenerator> gen_;\n  SessionStore store_{clock_, gen_, kTtl};\n};\n\nTEST_F(SessionStoreTest, CreatedSessionIsValid) {\n  const std::string token = store_.Create(42);\n  EXPECT_EQ(store_.Validate(token), 42);\n}\n\nTEST_F(SessionStoreTest, UnknownTokenIsInvalid) {\n  EXPECT_EQ(store_.Validate(\"nope\"), std::nullopt);\n}\n\nTEST_F(SessionStoreTest, RevokedSessionIsInvalid) {\n  const std::string token = store_.Create(42);\n\n  EXPECT_TRUE(store_.Revoke(token));\n\n  EXPECT_EQ(store_.Validate(token), std::nullopt);\n}\n\nTEST_F(SessionStoreTest, RevokeUnknownTokenReturnsFalse) {\n  EXPECT_FALSE(store_.Revoke(\"nope\"));\n}\n\nTEST_F(SessionStoreTest, TokenCollisionThrows) {\n  EXPECT_CALL(gen_, Next())\n      .WillOnce(Return(\"dup\"))\n      .WillOnce(Return(\"dup\"));\n  store_.Create(1);\n  EXPECT_THROW(store_.Create(2), std::runtime_error);\n  EXPECT_EQ(store_.Validate(\"dup\"), 1);  // старая не затёрта\n}\n\nTEST_F(SessionStoreTest, PurgeRemovesOnlyExpired) {\n  EXPECT_CALL(gen_, Next())\n      .WillOnce(Return(\"old\"))\n      .WillOnce(Return(\"new\"));\n  store_.Create(1);\n  clock_.Advance(30min);\n  store_.Create(2);\n  clock_.Advance(30min);  // \"old\" ровно на границе TTL\n\n  EXPECT_EQ(store_.PurgeExpired(), 1u);\n  EXPECT_EQ(store_.Validate(\"new\"), 2);\n}\n\n// параметризация поверх существующей фикстуры\nstruct TtlCase {\n  const char* name;\n  std::chrono::seconds elapsed;\n  bool valid;\n};\n\nclass SessionTtlTest\n    : public SessionStoreTest,\n      public ::testing::WithParamInterface<TtlCase> {};\n\nTEST_P(SessionTtlTest, ValidityDependsOnElapsedTime) {\n  const std::string token = store_.Create(42);\n\n  clock_.Advance(GetParam().elapsed);\n\n  EXPECT_EQ(store_.Validate(token).has_value(),\n            GetParam().valid);\n}\n\nINSTANTIATE_TEST_SUITE_P(\n    Boundaries, SessionTtlTest,\n    ::testing::Values(TtlCase{\"Fresh\", 0s, true},\n                      TtlCase{\"OneSecondLeft\", 1h - 1s, true},\n                      TtlCase{\"ExactlyTtl\", 1h, false},\n                      TtlCase{\"LongAfter\", 24h, false}),\n    [](const ::testing::TestParamInfo<TtlCase>& info) {\n      return std::string(info.param.name);\n    });\n", "mode": "gtest"}, {"type": "list", "items": ["`steady_clock`: TTL в памяти не должен зависеть от перевода часов.", "`try_emplace` + исключение: при коллизии токенов старая сессия не затирается молча.", "`mutable std::mutex`: `Validate` — const-метод, но ему нужен lock.", "`std::erase_if` для `unordered_map` — C++20, возвращает число удалённых.", "Генератор зовём под lock — просто и безопасно, если генератор не потокобезопасен. Если он медленный — генерируй вне lock и повторяй при коллизии."]}, {"type": "list", "items": ["Обычный путь: созданная сессия валидна.", "Ошибки: неизвестный токен, отзыв неизвестного токена.", "Состояние: после Revoke сессия невалидна.", "Зависимость ведёт себя плохо: генератор вернул дубликат — мок с двумя `WillOnce`.", "Граница TTL с обеих сторон — табличный TEST_P поверх той же фикстуры.", "Очистка: PurgeExpired удаляет ровно протухшие, включая сессию ровно на границе."]}, {"type": "warn", "text": "Порядок полей фикстуры важен: поля инициализируются в порядке объявления, а не в порядке списка инициализации. Если `store_` объявить раньше `clock_`, а конструктор SessionStore вызовет `clock.Now()` — это вызов метода у ещё не созданного объекта, UB. В проверочном прогоне такой код упал с segfault, а компилятор не предупредил."}, {"type": "p", "text": "Дополнительные условия, которые может добавить интервьюер, и как меняются тесты:"}, {"type": "list", "items": ["Сессий слишком много — PurgeExpired или ленивое удаление в Validate. Тест: после purge протухшие удалены, живые на месте.", "Продление сессии при каждом Validate (sliding TTL). Тест: Advance(50min), Validate, Advance(50min) — всё ещё валидна.", "Потокобезопасность. Стресс-тест: N потоков через latch делают Create/Validate/Revoke, в конце инварианты; прогон под TSan.", "Лимит сессий на пользователя. Новый TEST_F: при превышении вытесняется самая старая."]}, {"type": "tip", "text": "На доске порядок такой: интерфейсы зависимостей (Clock, TokenGenerator), потом класс, потом СЛОВАМИ список кейсов, потом тесты. Список кейсов интервьюер хочет услышать больше всего — по нему видно, как ты думаешь о границах и ошибках."}]}, {"id": "tests-checklist", "title": "Чеклист хорошего теста и Catch2", "blocks": [{"type": "list", "items": ["Одно поведение на тест. Имя — спецификация: `ExpiredTokenIsRejected`, а не `Test1`.", "Никакой логики в тесте: без if и циклов, которые вычисляют ожидаемое. Ожидаемое — константа. Если пересчитать его тем же алгоритмом, тест повторит баг.", "Детерминированный: без sleep, реального времени, случайности без сида, зависимости от порядка тестов.", "Быстрый: юнит — миллисекунды. Медленное — в отдельный бинарник или с меткой.", "Независимый: свежая фикстура, без глобального состояния. Проходит с `--gtest_shuffle`.", "Через публичный интерфейс. Приватное не тестируют; `FRIEND_TEST` — крайняя мера.", "Понятный провал: матчеры, контекст через `<<`, `SCOPED_TRACE`.", "Границы и ошибки: пусто, 0, 1, максимум, ровно на границе TTL, исключения, повторный вызов (идемпотентность Revoke)."]}, {"type": "p", "text": "Частые причины flaky-тестов:"}, {"type": "list", "items": ["Синхронизация через sleep.", "Реальное время: полночь, смена дня, таймзона, перевод часов.", "Порядок обхода `unordered_map`/`unordered_set` в ожиданиях.", "Общее состояние между тестами: static, общая БД без очистки, файлы.", "Гонки в коде или в самом тесте.", "Сеть и внешние сервисы в юнит-тестах.", "Неинициализированная память: работает «случайно»."]}, {"type": "p", "text": "Если задача — изменить существующий код: сначала зафиксируй его текущее поведение тестом (characterization test), потом меняй. Тест должен остаться зелёным, если поведение не должно было измениться."}, {"type": "p", "text": "Что говорить вслух, по порядку:"}, {"type": "list", "items": ["Какие кейсы: обычный путь, границы, ошибки, конкурентность.", "Что подменяю и почему: время, генератор, хранилище — фейк или мок.", "Какие проверки: где ASSERT, где EXPECT, какие матчеры.", "Что оставляю интеграционным тестам: SQL, индексы, транзакции."]}, {"type": "p", "text": "Если увидишь Catch2. Вторая популярная библиотека, синтаксис другой, идеи те же:"}, {"type": "code", "code": "#include <catch2/catch_approx.hpp>\n#include <catch2/catch_test_macros.hpp>\n#include <catch2/matchers/catch_matchers_string.hpp>\n\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n// имя теста — строка, теги в [] для фильтрации\nTEST_CASE(\"token list operations\", \"[tokens]\") {\n  std::vector<std::string> tokens = {\"a\", \"b\"};  // общий setup\n\n  // каждая SECTION — отдельный прогон TEST_CASE с начала\n  SECTION(\"push adds a token\") {\n    tokens.push_back(\"c\");\n    REQUIRE(tokens.size() == 3);   // как ASSERT_\n  }\n  SECTION(\"clear empties the list\") {\n    tokens.clear();\n    CHECK(tokens.empty());         // как EXPECT_\n  }\n}\n\nTEST_CASE(\"misc assertions\", \"[misc]\") {\n  CHECK(0.1 + 0.2 == Catch::Approx(0.3));\n  CHECK_THAT(std::string(\"token expired\"),\n             Catch::Matchers::ContainsSubstring(\"expired\"));\n  CHECK_THROWS_AS(throw std::out_of_range(\"x\"), std::logic_error);\n  CHECK_NOTHROW(std::stoi(\"42\"));\n}", "run": false}, {"type": "list", "items": ["`REQUIRE` — как `ASSERT_`, `CHECK` — как `EXPECT_`. Внутри обычное выражение: `REQUIRE(a == b)`, Catch2 сам разберёт и напечатает обе стороны.", "`TEST_CASE(\"имя строкой\", \"[теги]\")`; фильтрация по тегам: `./tests \"[tokens]\"`.", "`SECTION`: TEST_CASE прогоняется с начала для КАЖДОЙ секции. Общий setup перед секциями выполнится столько раз, сколько секций. Это замена фикстур.", "`Catch::Approx` для float, `CHECK_THAT` с матчерами, `CHECK_THROWS_AS(expr, Type)`, `GENERATE(...)` для параметризации.", "Моков в Catch2 нет: их берут из gmock или trompeloeil."]}, {"type": "code", "code": "FetchContent_Declare(Catch2\n  GIT_REPOSITORY https://github.com/catchorg/Catch2.git\n  GIT_TAG v3.8.1)\nFetchContent_MakeAvailable(Catch2)\n\ntarget_link_libraries(tests PRIVATE Catch2::Catch2WithMain)\ninclude(Catch)\ncatch_discover_tests(tests)", "run": false}, {"type": "tip", "text": "Финальная фраза на собеседовании: «Тесты детерминированные: время и случайность инжектированы, sleep нет. Каждый тест проверяет одно поведение, имена читаются как спецификация. Многопоточность — стресс плюс TSan, работа с БД — интеграционно на настоящем Postgres»."}]}], "quiz": [{"id": "tests-q1", "lesson": "tests-assert", "q": "Что произойдёт при запуске теста?", "code": "struct User { long id; std::string login; };\n\nvoid CheckUser(const User& u) {\n  ASSERT_FALSE(u.login.empty());\n  EXPECT_GT(u.id, 0);\n}\n\nTEST(UserTest, Valid) {\n  User u{0, \"\"};\n  CheckUser(u);\n  std::puts(\"after helper\");\n  EXPECT_EQ(u.id, 1);\n}", "options": ["Тест упадёт на `ASSERT_FALSE` и прервётся целиком: `after helper` не напечатается", "Тест упадёт. `EXPECT_GT` в хелпере не выполнится, но `after helper` напечатается и `EXPECT_EQ(u.id, 1)` тоже проверится", "Не скомпилируется: `ASSERT_*` можно использовать только в теле `TEST`", "ASSERT в хелпере бросает исключение, gtest ловит его на уровне теста, тест прерывается", "Вне тела теста ASSERT работает как EXPECT: выполнятся обе проверки хелпера и всё остальное"], "answer": 1, "explain": "`ASSERT_*` при провале делает `return;` из текущей функции, то есть из `CheckUser`. Исключений нет. Тест продолжается: печатается `after helper`, проверяется `EXPECT_EQ`. Так и было в проверочном прогоне: два провала (строки ASSERT и EXPECT_EQ), `EXPECT_GT` не выполнялся."}, {"id": "tests-q2", "lesson": "tests-assert", "q": "Как остановить тест сразу после фатального провала внутри хелпера `CheckUser(u)` из прошлого вопроса?", "options": ["Заменить в хелпере `ASSERT_FALSE(x)` на `ASSERT_TRUE(!x)`", "Объявить хелпер `[[noreturn]]`", "Обернуть вызов: `ASSERT_NO_FATAL_FAILURE(CheckUser(u));`", "Обернуть вызов в `EXPECT_NO_THROW(CheckUser(u));`", "Объявить хелпер `static`, тогда gtest считает его частью теста"], "answer": 2, "explain": "`ASSERT_NO_FATAL_FAILURE(stmt)` проверяет, не было ли фатального провала внутри `stmt`, и если был — сам делает `return` из теста. Альтернатива — `if (HasFatalFailure()) return;` после вызова. `EXPECT_NO_THROW` не поможет: ASSERT не бросает исключений. `[[noreturn]]` для функции, которая возвращается, — UB."}, {"id": "tests-q3", "lesson": "tests-assert", "q": "Что будет с этим хелпером?", "code": "int ParseOrFail(const std::string& s) {\n  ASSERT_FALSE(s.empty());\n  return std::stoi(s);\n}", "options": ["Скомпилируется; при пустой строке вернёт 0", "Скомпилируется; при пустой строке бросит исключение, и тест упадёт", "Скомпилируется; при пустой строке процесс завершится через abort", "Не скомпилируется: при провале ASSERT делает `return;`, а функция возвращает `int`", "Скомпилируется с warning о пропущенном return"], "answer": 3, "explain": "Фатальные проверки разворачиваются в `return;` без значения, поэтому годятся только в функциях, возвращающих void. Clang пишет «cannot initialize return object of type 'int' with an rvalue of type 'void'». Решение — void-хелпер с out-параметром или EXPECT."}, {"id": "tests-q4", "lesson": "tests-assert", "q": "Что произойдёт?", "code": "char buf[16];\nstd::strcpy(buf, \"alex\");\nconst char* login = \"alex\";\nEXPECT_EQ(buf, login);", "options": ["Проходит: gtest распознаёт `char*` и сравнивает содержимое", "Не скомпилируется: `char[16]` и `const char*` — разные типы", "Проходит: компилятор склеивает одинаковые строки в один адрес", "Неопределённое поведение: `EXPECT_EQ` читает за границей `buf`", "Провал: сравниваются адреса, а не содержимое строк"], "answer": 4, "explain": "`EXPECT_EQ` вызывает `operator==`, а для указателей это сравнение адресов. gtest печатает «Which is: 0x16fa9a578» и «Which is: 0x1003b7b43». Для C-строк есть `EXPECT_STREQ`. Склейка литералов возможна только для двух литералов, а `buf` — массив на стеке."}, {"id": "tests-q5", "lesson": "tests-assert", "q": "`std::string s = \"alex\";` Какая проверка корректна?", "options": ["`EXPECT_EQ(s, \"alex\");`", "`EXPECT_STREQ(s, \"alex\");`", "`EXPECT_EQ(s.c_str(), \"alex\");`", "`EXPECT_TRUE(s.c_str() == \"alex\");`", "`EXPECT_STREQ(&s, \"alex\");`"], "answer": 0, "explain": "`std::string` сравнивается с `const char*` через свой `operator==` — по содержимому. `EXPECT_STREQ` принимает только C-строки: с `std::string` не компилируется (no matching function for `CmpHelperSTREQ`). `s.c_str() == \"alex\"` — снова сравнение указателей."}, {"id": "tests-q6", "lesson": "tests-assert", "q": "Какая из проверок упадёт?", "options": ["`EXPECT_DOUBLE_EQ(0.1 + 0.2, 0.3);`", "`EXPECT_EQ(0.1 + 0.2, 0.3);`", "`EXPECT_NEAR(0.1 + 0.2, 0.3, 1e-9);`", "`EXPECT_FLOAT_EQ(0.1f + 0.2f, 0.3f);`", "`EXPECT_LE(std::abs(0.1 + 0.2 - 0.3), 1e-12);`"], "answer": 1, "explain": "`0.1 + 0.2` в double — `0.30000000000000004`, точное `==` с `0.3` ложно. `DOUBLE_EQ`/`FLOAT_EQ` допускают 4 ULP, `NEAR` — явный допуск, разница около `5.5e-17` меньше `1e-12`. Все остальные проходят, проверено."}, {"id": "tests-q7", "lesson": "tests-assert", "q": "Результат `EXPECT_DOUBLE_EQ(1e-20, 0.0);`?", "options": ["Проходит: разница меньше `DBL_EPSILON`", "Проходит: `DOUBLE_EQ` сравнивает с допуском `1e-9`", "Провал: числа далеко друг от друга в ULP, рядом с нулём нужен `EXPECT_NEAR`", "Не скомпилируется: литерал `0.0` нужно писать как `0.0L`", "Проходит только в release-сборке"], "answer": 2, "explain": "`DOUBLE_EQ` — относительное сравнение: не больше 4 единиц в последнем разряде. Между `1e-20` и `0.0` огромное число представимых double, поэтому провал. Абсолютный допуск задаётся только через `EXPECT_NEAR(1e-20, 0.0, eps)`."}, {"id": "tests-q8", "lesson": "tests-assert", "q": "Что будет с двумя проверками?", "code": "EXPECT_THROW(throw std::out_of_range(\"x\"), std::logic_error);\nEXPECT_THROW(throw 42, std::runtime_error);", "options": ["Обе падают: тип исключения должен совпадать точно", "Обе проходят: `EXPECT_THROW` проверяет только сам факт исключения", "Первая падает, вторая проходит", "Первая проходит, вторая падает: «it throws a different type»", "Вторая не компилируется: бросать можно только наследников `std::exception`"], "answer": 3, "explain": "`EXPECT_THROW` ловит по типу через `catch (const Type&)`, поэтому наследник подходит: `out_of_range` — наследник `logic_error`. `int` — не `runtime_error`: провал «Actual: it throws a different type». Бросить `int` в C++ можно."}, {"id": "tests-q9", "lesson": "tests-assert", "q": "`Expensive()` — дорогая функция, увеличивает счётчик вызовов. Сколько раз она вызовется?", "code": "EXPECT_EQ(1, 1) << Expensive();\nEXPECT_EQ(1, 2) << Expensive();", "options": ["Два раза — `<<` вычисляется всегда", "Ни разу — сообщение вычисляется только для ASSERT", "Два раза, но строка печатается только один раз", "Ни разу, если не передан флаг `--gtest_print_messages`", "Один раз — только для провалившейся проверки"], "answer": 4, "explain": "Макрос разворачивается в `if (успех) ; else <сообщение> << ...`, поэтому выражение справа от `<<` вычисляется только при провале. В проверочном прогоне счётчик после первой проверки был 0, после второй — 1. Такого флага не существует."}, {"id": "tests-q10", "lesson": "tests-assert", "q": "Проверка упала. Что gtest напечатает в качестве значений?", "code": "struct Token {\n  std::string value;\n  long uid = 0;\n  bool operator==(const Token&) const = default;\n};\n\nEXPECT_EQ((Token{\"abc\", 1}), (Token{\"abd\", 1}));", "options": ["Байтовый дамп вида `32-byte object <61-62 63-00 ...>`: нет `operator<<` и `PrintTo`", "`Token{abc, 1}` — gtest печатает поля агрегатов через рефлексию", "Ничего: без `operator<<` такой код не скомпилируется", "Только `Expected equality` без значений", "Адреса объектов, как для указателей"], "answer": 0, "explain": "Для сравнения нужен только `operator==`. Для печати gtest ищет `operator<<` или `PrintTo`; если их нет — печатает байты объекта. Рефлексии в C++ нет. Добавь `operator<<` — и в отчёте будет читаемое значение."}, {"id": "tests-q11", "lesson": "tests-fixtures", "q": "Фикстура логирует все методы, в suite два теста A и B. Какой порядок вызовов?", "options": ["ctor, SetUpTestSuite, SetUp, A, B, TearDown, TearDownTestSuite, dtor", "SetUpTestSuite, ctor, SetUp, A, TearDown, dtor, ctor, SetUp, B, TearDown, dtor, TearDownTestSuite", "SetUpTestSuite, ctor, SetUp, A, B, TearDown, dtor, TearDownTestSuite", "ctor, SetUp, SetUpTestSuite, A, TearDown, SetUp, B, TearDown, TearDownTestSuite, dtor", "SetUpTestSuite, SetUp, ctor, A, dtor, TearDown, SetUp, ctor, B, dtor, TearDown, TearDownTestSuite"], "answer": 1, "explain": "SetUpTestSuite — один раз до первого теста suite. Для каждого теста — новый объект: конструктор, SetUp, тело, TearDown, деструктор. В конце TearDownTestSuite. Именно это напечатал проверочный пример."}, {"id": "tests-q12", "lesson": "tests-fixtures", "q": "Тесты запускаются в порядке объявления. Пройдёт ли B?", "code": "class CounterTest : public ::testing::Test {\n protected:\n  static inline int calls_ = 0;\n  int local_ = 0;\n  void SetUp() override { ++calls_; ++local_; }\n};\n\nTEST_F(CounterTest, A) { SUCCEED(); }\nTEST_F(CounterTest, B) {\n  EXPECT_EQ(local_, 1);\n  EXPECT_EQ(calls_, 2);\n}", "options": ["Упадёт: `local_` будет 2, объект фикстуры общий на suite", "Упадёт: `calls_` будет 1, static-поля сбрасываются между тестами", "Пройдёт: `local_` у нового объекта снова 1, а static `calls_` общий и равен 2", "Упадёт на обеих проверках", "Не скомпилируется: в фикстуре нельзя static-поля"], "answer": 2, "explain": "Каждый TEST_F получает свежий объект фикстуры, поэтому нестатические поля начинаются заново. Static-поле живёт весь процесс — это и есть общее состояние между тестами. С `--gtest_shuffle` B может пойти первым, и `calls_` будет 1: так статик порождает зависимость от порядка."}, {"id": "tests-q13", "lesson": "tests-fixtures", "q": "Что будет?", "code": "class SessionTest : public ::testing::Test {};\n\nTEST_F(SessionTest, A) { SUCCEED(); }\nTEST(SessionTest, B) { SUCCEED(); }", "options": ["Ошибка компиляции: повторное определение класса `SessionTest`", "Оба теста проходят: `TEST` просто не использует фикстуру", "B молча пропускается", "Компилируется, но при запуске B падает: в одном suite все тесты должны использовать один класс фикстуры", "Ошибка линковки: дублируется символ `SessionTest`"], "answer": 3, "explain": "Классы тестов разные (`SessionTest_A_Test` и `SessionTest_B_Test`), поэтому компиляция проходит. При запуске gtest видит один suite с разными фикстурами и валит тест: «All tests in the same test suite must use the same test fixture class, so mixing TEST_F and TEST in the same test suite is illegal»."}, {"id": "tests-q14", "lesson": "tests-fixtures", "q": "В `SetUp()` сработал `ASSERT_TRUE(false)`. Что будет дальше?", "options": ["Тело теста выполняется, тест красный", "Пропускаются и тело, и `TearDown()`, вызывается только деструктор", "Падает весь suite, остальные тесты не запускаются", "Тест помечается как SKIPPED", "Тело теста пропускается, `TearDown()` и деструктор вызываются, тест красный"], "answer": 4, "explain": "Фатальный провал в SetUp делает `return` из SetUp, и gtest не запускает тело. Очистка гарантирована: TearDown и деструктор отрабатывают — в проверочном прогоне напечатались `TearDown` и `dtor`. Другие тесты suite не затронуты."}, {"id": "tests-q15", "lesson": "tests-fixtures", "q": "Какое объявление внутри фикстуры скомпилируется и будет вызвано один раз на suite?", "options": ["`static void SetUpTestSuite() { ... }`", "`void SetUpTestSuite() override { ... }`", "`virtual void SetUpTestSuite() { ... }`", "`static void SetUpTestSuite() override { ... }`", "`void SetUpTestSuite() { ... }`"], "answer": 0, "explain": "`SetUpTestSuite` — статическая функция, gtest берёт её адрес как `void(*)()`. `override` у не-виртуальной функции — ошибка. Нестатические варианты не подходят под ожидаемый тип — ошибка компиляции внутри gtest. Проверены все пять."}, {"id": "tests-q16", "lesson": "tests-fixtures", "q": "В фикстуре написали `void Setup() { db_.Connect(); }` (маленькая `u`, без override). Что будет?", "options": ["Компилируется, `Setup` молча не вызывается, тесты падают на неподключённой БД", "Ошибка компиляции: gtest специально объявляет виртуальный `Setup()` с типом `Setup_should_be_spelled_SetUp*`", "Компилируется и работает: gtest вызывает и `Setup`, и `SetUp`", "Компилируется с warning, gtest вызывает `Setup` вместо `SetUp`", "Ошибка линковки"], "answer": 1, "explain": "Опечатка частая, поэтому в `::testing::Test` есть ловушка: виртуальный `Setup()`, который возвращает `Setup_should_be_spelled_SetUp*`. Твой `void Setup()` пытается его переопределить с другим типом возврата — ошибка компиляции с подсказкой в тексте. Другие опечатки (`setUp`) так не ловятся — поэтому пиши `override`."}, {"id": "tests-q17", "lesson": "tests-param", "q": "`class LoginTest : public ::testing::TestWithParam<std::string> {};` Какой вариант скомпилируется?", "options": ["`INSTANTIATE_TEST_SUITE_P(LoginTest, ::testing::Values(\"a\", \"b\"));`", "`INSTANTIATE_TEST_P(Logins, LoginTest, ::testing::Values(\"a\", \"b\"));`", "`INSTANTIATE_TEST_SUITE_P(Logins, LoginTest, ::testing::Values(\"a\", \"b\"));`", "`INSTANTIATE_TEST_SUITE_P(Logins, LoginTest, {\"a\", \"b\"});`", "`INSTANTIATE_TEST_SUITE_P(Logins, LoginTest, std::vector<std::string>{\"a\", \"b\"});`"], "answer": 2, "explain": "Сигнатура: префикс, имя фикстуры, генератор (опционально генератор имён). Без префикса — ошибка. Макроса `INSTANTIATE_TEST_P` нет. Фигурные скобки с запятой разбивают аргументы макроса, а контейнер — не генератор: нужно `ValuesIn(vec)`. `const char*` из `Values` сам конвертируется в `std::string`."}, {"id": "tests-q18", "lesson": "tests-param", "q": "Сколько тестов создаст `INSTANTIATE` и какой тип у `GetParam()`?", "code": "class RetryTest : public ::testing::TestWithParam<\n                      std::tuple<int, bool>> {};\nTEST_P(RetryTest, Works) { /* ... */ }\nINSTANTIATE_TEST_SUITE_P(\n    Grid, RetryTest,\n    ::testing::Combine(::testing::Values(1, 2, 5),\n                       ::testing::Bool()));", "options": ["5 тестов, `std::tuple<int, bool>`", "6 тестов, `std::pair<int, bool>`", "3 теста, `int` (Bool игнорируется для int-параметра)", "6 тестов, `std::tuple<int, bool>`", "2 теста, `std::vector<int>`"], "answer": 3, "explain": "Combine — декартово произведение: 3 значения × 2 (`false`, `true`) = 6. Параметр — `std::tuple`, распаковывается через `std::get` или structured bindings. В `--gtest_list_tests` видно `(1, false)`, `(1, true)`, ... — шесть строк."}, {"id": "tests-q19", "lesson": "tests-param", "q": "Генератор имён возвращает `\"case-\" + std::to_string(info.param)`. Что будет?", "options": ["Дефисы заменятся на `_` автоматически", "Ошибка компиляции: лямбда должна возвращать `const char*`", "Тесты запустятся, но `--gtest_filter` по ним работать не будет", "gtest проигнорирует генератор и использует индексы `/0`, `/1`", "Бинарник аварийно завершится при старте: имя с дефисом недопустимо"], "answer": 4, "explain": "Имя параметризованного кейса — только буквы, цифры и `_`. gtest проверяет это при регистрации и падает: «[ FATAL ] ... Parameterized test name 'case-1' is invalid». Проверено, процесс завершился через abort."}, {"id": "tests-q20", "lesson": "tests-param", "q": "Написали TEST_P, но забыли INSTANTIATE_TEST_SUITE_P. Что покажет современный gtest?", "options": ["Падающий тест `GoogleTestVerification.UninstantiatedParameterizedTestSuite<X>`", "Ничего: тесты молча не запустятся, прогон зелёный", "Ошибка компиляции: TEST_P без инстанцирования", "Ошибка линковки: не найден генератор параметров", "TEST_P запустится один раз с параметром по умолчанию"], "answer": 0, "explain": "Раньше такой TEST_P молча терялся. Теперь gtest добавляет проверочный тест, который падает с объяснением. Если это намеренно (тест в библиотеке), его глушат макросом `GTEST_ALLOW_UNINSTANTIATED_PARAMETERIZED_TEST(X)`."}, {"id": "tests-q21", "lesson": "tests-param", "q": "Есть фикстура `SessionStoreTest : public ::testing::Test`. Как сделать параметризованный тест на её основе?", "options": ["`class X : public SessionStoreTest, public ::testing::TestWithParam<Case> {};`", "`class X : public SessionStoreTest, public ::testing::WithParamInterface<Case> {};`", "`TEST_P(SessionStoreTest, Name)` — TEST_P работает с любой фикстурой", "`class X : public ::testing::TestWithParam<SessionStoreTest> {};`", "Никак: параметризованный тест не может наследоваться от фикстуры"], "answer": 1, "explain": "`TestWithParam<T>` сам наследует `::testing::Test`. Вместе с вашей фикстурой получается ромб, и gtest не скомпилируется: «ambiguous conversion ... to base class Test». `WithParamInterface<T>` даёт только `GetParam()` без второй копии `Test`. TEST_P требует `GetParam()`, у простой фикстуры его нет."}, {"id": "tests-q22", "lesson": "tests-matchers", "q": "`std::vector<int> v{3, 1, 2};` Какая проверка пройдёт?", "options": ["`EXPECT_THAT(v, ElementsAre(1, 2, 3));`", "`EXPECT_THAT(v, ElementsAre(3, 1));`", "`EXPECT_THAT(v, UnorderedElementsAre(1, 2, 3));`", "`EXPECT_THAT(v, UnorderedElementsAre(1, 2));`", "`EXPECT_THAT(v, SizeIs(2));`"], "answer": 2, "explain": "`ElementsAre` проверяет порядок и размер. `UnorderedElementsAre` — только набор и размер, поэтому `(1, 2)` не подходит: элементов три. Проверено: проходит только вариант с `UnorderedElementsAre(1, 2, 3)`."}, {"id": "tests-q23", "lesson": "tests-matchers", "q": "`std::optional<int> o;` (пустой). Какая проверка пройдёт?", "options": ["`EXPECT_THAT(o, Optional(_));`", "`EXPECT_THAT(o, Optional(0));`", "`EXPECT_FALSE(o == std::nullopt);`", "`EXPECT_EQ(o, std::nullopt);`", "`EXPECT_THAT(o, IsEmpty());`"], "answer": 3, "explain": "`Optional(m)` сначала требует, чтобы значение было, — на пустом это провал даже с `_`. `IsEmpty()` вызывает `.empty()`, у optional его нет — не скомпилируется. Пустоту проверяют сравнением с `std::nullopt`."}, {"id": "tests-q24", "lesson": "tests-matchers", "q": "Почему не компилируется проверка?", "code": "struct User {\n  std::string login;\n  const std::string& Login() { return login; }\n};\n\nEXPECT_THAT(u, ::testing::Property(&User::Login, \"alex\"));", "options": ["`Property` работает только с полями, для методов нужен `Field`", "Строковый литерал нельзя передать как матчер, нужно `Eq(\"alex\")`", "`Property` требует, чтобы метод возвращал значение, а не ссылку", "Нужно писать `&User::Login()` со скобками", "`Property` принимает только const-методы, а `Login()` не const"], "answer": 4, "explain": "Матчер вызывает метод у константного объекта, поэтому требует `T (Class::*)() const`. Clang: «no matching function for call to 'Property'». Ссылки и голые значения (неявный `Eq`) допустимы. `Field` — для полей, не для методов."}, {"id": "tests-q25", "lesson": "tests-mocks", "q": "В интерфейсе: `virtual std::optional<int64_t> Find(const std::string& t) const = 0;` Какой мок скомпилируется?", "options": ["`MOCK_METHOD(std::optional<int64_t>, Find, (const std::string& t), (const, override));`", "`MOCK_METHOD(std::optional<int64_t>, Find, (const std::string& t), (override));`", "`MOCK_METHOD(std::optional<int64_t>, Find, const std::string& t, (const, override));`", "`MOCK_METHOD(Find, std::optional<int64_t>, (const std::string& t), (const, override));`", "`MOCK_METHOD(std::optional<int64_t>, Find, (const std::string& t), const, override);`"], "answer": 0, "explain": "Порядок: тип, имя, аргументы в скобках, спецификаторы в скобках через запятую. Без `const` метод не переопределяет const-метод интерфейса, `override` даёт ошибку. Аргументы без скобок — static_assert «should be enclosed in parentheses». Спецификаторы без скобок — 5 аргументов макроса, тоже static_assert. Все варианты проверены компилятором."}, {"id": "tests-q26", "lesson": "tests-mocks", "q": "Метод интерфейса: `virtual std::map<std::string, int> GetAll() const = 0;` Какой вариант НЕ скомпилируется?", "options": ["`MOCK_METHOD((std::map<std::string, int>), GetAll, (), (const, override));`", "`using Map = std::map<std::string, int>;` и `MOCK_METHOD(Map, GetAll, (), (const, override));`", "`MOCK_METHOD(std::map<std::string, int>, GetAll, (), (const, override));`", "Скомпилируются все три"], "answer": 2, "explain": "Препроцессор не знает про шаблоны: запятая внутри `std::map<std::string, int>` делит аргументы, их становится пять — static_assert «If _Ret is a type with unprotected commas, it must also be enclosed in parentheses». Лечится скобками вокруг типа или алиасом."}, {"id": "tests-q27", "lesson": "tests-mocks", "q": "Что произойдёт?", "code": "StrictMock<MockTokenStorage> storage;\n// ни одного EXPECT_CALL\nstorage.Find(\"tok\");", "options": ["Будет warning «Uninteresting mock function call», тест пройдёт", "Вызов молча вернёт значение по умолчанию, тест пройдёт", "В код под тестом будет брошено исключение", "Тест упадёт: для StrictMock любой вызов без ожидания — ошибка", "Ошибка компиляции: у StrictMock нельзя вызывать методы без EXPECT_CALL"], "answer": 3, "explain": "Вызов метода без единого EXPECT_CALL — uninteresting call. Обычный (naggy) мок пишет warning, NiceMock молчит, StrictMock превращает его в провал теста. Вызов при этом вернёт значение по умолчанию, и тест доработает до конца, но будет красным."}, {"id": "tests-q28", "lesson": "tests-mocks", "q": "Чем закончится тест?", "code": "NiceMock<MockScorer> m;\nEXPECT_CALL(m, Score(\"a\")).WillOnce(Return(1));\nm.Score(\"a\");\nm.Score(\"b\");", "options": ["Пройдёт: NiceMock молча вернёт 0 на `\"b\"`", "Пройдёт с warning", "Провал: ожидание с `\"a\"` не выполнено", "Ошибка компиляции: NiceMock нельзя использовать вместе с EXPECT_CALL", "Провал: вызов с `\"b\"` — unexpected call, NiceMock его не прощает"], "answer": 4, "explain": "NiceMock глушит только uninteresting calls — вызовы методов, на которые нет EXPECT_CALL совсем. Здесь на `Score` ожидание есть, но аргумент `\"b\"` не подходит. Это unexpected call: провал для любого мока. gmock пишет «Unexpected mock function call ... Expected arg #0: is equal to \"a\"»."}, {"id": "tests-q29", "lesson": "tests-mocks", "q": "Код под тестом НИ РАЗУ не вызывает `Score`. Что верно?", "code": "// вариант 1\nON_CALL(m, Score(_)).WillByDefault(Return(42));\n// вариант 2\nEXPECT_CALL(m, Score(_)).WillOnce(Return(42));", "options": ["С ON_CALL тест пройдёт, с EXPECT_CALL упадёт: «never called - unsatisfied»", "Оба варианта упадут: метод не вызван", "Оба пройдут: без вызова проверять нечего", "С ON_CALL упадёт, с EXPECT_CALL пройдёт", "С EXPECT_CALL будет только warning"], "answer": 0, "explain": "ON_CALL задаёт только поведение по умолчанию и ничего не проверяет. EXPECT_CALL с одним WillOnce — это `Times(1)`; при разрушении мока gmock проверяет счётчик и валит тест: «Expected: to be called once. Actual: never called»."}, {"id": "tests-q30", "lesson": "tests-mocks", "q": "Код зовёт `Next()` три раза. Что будет?", "code": "EXPECT_CALL(gen, Next())\n    .WillOnce(Return(\"a\"))\n    .WillOnce(Return(\"b\"));", "options": ["Третий вызов вернёт `\"b\"` ещё раз, тест пройдёт", "Тест упадёт: выведено `Times(2)`, третий вызов лишний и вернёт пустую строку", "Третий вызов вернёт пустую строку, тест пройдёт", "Выводится `Times(AtLeast(2))`, тест пройдёт", "Третий вызов бросит исключение из gmock"], "answer": 1, "explain": "Без `Times` и `WillRepeatedly` число вызовов выводится из числа `WillOnce`: здесь `Times(2)`. Третий вызов — «called more times than expected - over-saturated», возвращается значение по умолчанию (`\"\"`). `AtLeast(2)` было бы с добавленным `WillRepeatedly`."}, {"id": "tests-q31", "lesson": "tests-mocks", "q": "Что вернёт `m.Score(\"a\")`?", "code": "EXPECT_CALL(m, Score(\"a\")).WillRepeatedly(Return(1));\nEXPECT_CALL(m, Score(_)).WillRepeatedly(Return(2));\nint r = m.Score(\"a\");", "options": ["1", "2", "0 — значение по умолчанию", "Тест упадёт: вызов подходит под два ожидания", "1 при первом вызове, 2 при следующих"], "answer": 1, "explain": "gmock перебирает ожидания с конца: срабатывает последнее подходящее, а `Score(_)` подходит под любой аргумент. Поэтому общее ожидание пишут первым, частное — после. Первое ожидание с `WillRepeatedly` означает `AnyNumber()`, так что его невыполнение не роняет тест. Проверено: `prec=2`."}, {"id": "tests-q32", "lesson": "tests-mocks", "q": "Метод `bool Save(const std::string&, int64_t)`. Что в `ok`?", "code": "EXPECT_CALL(storage, Save(_, _));   // без WillOnce\nbool ok = storage.Save(\"t\", 1);", "options": ["`true`, тест проходит", "Тест падает: у EXPECT_CALL нет действия", "`false`, тест проходит", "Неопределённое значение, это UB", "Ошибка компиляции: для не-void метода действие обязательно"], "answer": 2, "explain": "Без действия мок возвращает значение по умолчанию для типа: `false`, `0`, пустую строку, `std::nullopt`, объект по умолчанию. Ожидание `Times(1)` выполнено, тест зелёный."}, {"id": "tests-q33", "lesson": "tests-mocks", "q": "Что вернёт `m.Score(\"x\")`?", "code": "int value = 1;\nEXPECT_CALL(m, Score(_)).WillRepeatedly(Return(value));\nvalue = 2;\nint r = m.Score(\"x\");", "options": ["2 — `Return` хранит ссылку на `value`", "Неопределённое поведение: `value` изменён после EXPECT_CALL", "0 — значение по умолчанию", "1 — `Return` скопировал значение при создании ожидания", "Ошибка компиляции: `Return` требует константу"], "answer": 3, "explain": "`Return(x)` сохраняет копию в момент создания действия. Чтобы отдавать текущее значение, нужен `ReturnRef(value)`, `ReturnPointee(&value)` или лямбда `[&] { return value; }`. Проверено: `copy=1`."}, {"id": "tests-q34", "lesson": "tests-mocks", "q": "Почему тест падает с «never called», хотя `Register` вызывает `Save`?", "code": "class Storage {\n public:\n  bool Save(const std::string&);  // не virtual\n};\nclass MockStorage : public Storage {\n public:\n  MOCK_METHOD(bool, Save, (const std::string& t), ());\n};\nbool Register(Storage& s) { return s.Save(\"tok\"); }\n\nMockStorage m;\nEXPECT_CALL(m, Save(\"tok\")).WillOnce(Return(false));\nEXPECT_FALSE(Register(m));", "options": ["Не хватает спецификатора `(override)` в MOCK_METHOD", "EXPECT_CALL нужно ставить после вызова `Register`", "Аргумент `\"tok\"` не матчится со `std::string` без `Eq`", "MockStorage нужно передавать по указателю, а не по ссылке", "`Save` не виртуальный: через `Storage&` вызывается настоящий метод базы, мок не участвует"], "answer": 4, "explain": "Без `virtual` вызов через ссылку на базу связывается статически с `Storage::Save`. В прогоне напечаталось `real Save`, проверка вернула `true`, ожидание осталось невыполненным. Добавить `override` нельзя: переопределять нечего. Решение — интерфейс с виртуальными методами или зависимость через шаблон."}, {"id": "tests-q35", "lesson": "tests-mocks", "q": "Ожидания объявлены внутри `InSequence`: сначала `Score(\"a\")`, потом `Next()`. Код вызывает `Next()`, затем `Score(\"a\")`. Итог?", "options": ["Провал: `Next()` вызван раньше, чем выполнено предыдущее ожидание", "Пройдёт: InSequence влияет только на вывод", "Пройдёт: оба метода вызваны по одному разу", "Ошибка компиляции: InSequence работает только для одного метода", "Пройдёт с warning о порядке"], "answer": 0, "explain": "В `InSequence` каждое ожидание требует, чтобы предыдущие были выполнены. Вызов `Next()` первым — unexpected call («pre-requisites are not satisfied»), а потом ожидание `Next()` остаётся невыполненным. В прогоне — два сообщения о провале."}, {"id": "tests-q36", "lesson": "tests-time", "q": "`IsExpired()` возвращает `clock_.Now() >= expires_at_`. Что проверка?", "code": "FakeClock clock;\nconst AccessToken token(clock, 1h);  // expires_at = now + 1h\nclock.Advance(1h);\nEXPECT_TRUE(token.IsExpired());", "options": ["Падает: на границе токен ещё валиден", "Проходит: ровно на границе TTL токен уже истёк", "Падает: FakeClock не влияет на уже созданный токен", "Результат зависит от скорости машины", "Не скомпилируется: `1h` нельзя сложить с `time_point`"], "answer": 1, "explain": "`expires_at = start + 1h`, после `Advance(
