просто завершится"], "answer": 0, "explain": "Исключение, покинувшее функцию верхнего уровня потока, приводит к `std::terminate`. `join` ничего не пробрасывает. Чтобы передать исключение вызывающему, используют `std::promise::set_exception`, `packaged_task` или `std::async` - и получают его в `future::get()`."}, {"id": "mt-q7", "lesson": "mt-jthread", "q": "Чем закончится программа?", "code": "int main() {\n    std::jthread t([] {\n        while (true) std::this_thread::sleep_for(10ms);\n    });\n}", "options": ["`std::terminate`, как у `std::thread`", "Зависнет навсегда: `~jthread` делает `request_stop` и `join`, а лямбда токен не проверяет", "`request_stop` прервёт `sleep_for`, поток завершится", "Поток будет отсоединён и убит при выходе из `main`", "Ошибка компиляции: лямбда обязана принимать `std::stop_token`"], "answer": 1, "explain": "jthread не убивает поток. Деструктор просит остановиться и ждёт. Лямбда без параметра `std::stop_token` вообще не видит запроса. Принимать токен не обязательно - jthread передаёт его, только если функция может его принять."}, {"id": "mt-q8", "lesson": "mt-jthread", "q": "Что не так с классом?", "code": "class Svc {\npublic:\n    Svc() : worker_([this](std::stop_token st) { loop(st); }) {}\nprivate:\n    void loop(std::stop_token st);  // использует m_ и q_\n    std::jthread worker_;\n    std::mutex m_;\n    std::queue<int> q_;\n};", "options": ["Всё корректно: jthread сам остановит поток в деструкторе", "Нельзя захватывать `this` в списке инициализации - ошибка компиляции", "Поток стартует до создания `m_` и `q_` и останавливается после их разрушения: `worker_` надо объявить последним", "Проблема только при разрушении, старт безопасен", "Нужно вызвать `worker_.detach()` в деструкторе"], "answer": 2, "explain": "Члены инициализируются в порядке объявления, а разрушаются в обратном. `worker_` объявлен первым: поток запускается, пока `m_` и `q_` ещё не сконструированы, и `~jthread` (join) выполнится последним - после того как `m_` и `q_` уже уничтожены. Оба момента - UB. Объявите поток последним полем."}, {"id": "mt-q9", "lesson": "mt-jthread", "q": "Что делает `jthread::request_stop()`?", "options": ["Бросает в целевом потоке исключение, которое раскручивает его стек", "Посылает потоку сигнал ОС и будит его из `sleep_for`", "Выставляет флаг и делает `join()`", "Выставляет флаг в общем stop-state и синхронно вызывает зарегистрированные `stop_callback`; поток должен сам проверять токен", "Отсоединяет поток, как `detach()`"], "answer": 3, "explain": "Отмена в C++20 кооперативная. `request_stop` возвращает true, если запрос сделан впервые, и вызывает колбэки в потоке, который его сделал. Прервать ожидание можно через `condition_variable_any::wait` с токеном или через свой `stop_callback`."}, {"id": "mt-q10", "lesson": "mt-jthread", "q": "Остановка уже запрошена, очередь пуста. Что сделает этот вызов?", "code": "std::unique_lock lk(m);\nbool ok = cv.wait(lk, st, [&] { return !q.empty(); });\n// cv - std::condition_variable_any, st - stop_token", "options": ["Будет ждать notify, а потом вернёт `false`", "Бросит исключение `std::stop_requested`", "Вернёт `true`: ожидание прервано успешно", "Зависнет: токен проверяется только при notify", "Сразу вернёт `false`, не дожидаясь notify"], "answer": 4, "explain": "Перегрузка с `stop_token` возвращает значение предиката. Если остановка уже запрошена, ожидание не начинается; предикат false - результат false. Если бы в очереди что-то было, вернулось бы true даже при запрошенной остановке."}, {"id": "mt-q11", "lesson": "mt-race", "q": "Что можно сказать об этой программе?", "code": "bool done = false;\n\nvoid worker() { while (!done) {} }\n\nint main() {\n    std::thread t(worker);\n    done = true;\n    t.join();\n}", "options": ["Гонка данных - UB; с оптимизациями цикл может стать бесконечным", "Корректно: запись `bool` атомарна на всех платформах", "Корректно: `join` синхронизирует потоки", "Корректно, если объявить `done` как `volatile bool`", "Корректно только на x86"], "answer": 0, "explain": "Неатомарная запись в одном потоке и чтение в другом без happens-before - гонка данных. Компилятор вправе считать, что внутри цикла `done` не меняется, и прочитать его один раз. `join` ставит порядок только после завершения потока - а поток не завершится. `volatile` не решает проблему. Нужен `std::atomic<bool>`."}, {"id": "mt-q12", "lesson": "mt-race", "q": "Есть ли здесь гонка данных?", "code": "std::vector<bool> flags(2);\nstd::thread a([&] { flags[0] = true; });\nstd::thread b([&] { flags[1] = true; });\na.join();\nb.join();", "options": ["Нет: разные индексы - разные объекты", "Да: `vector<bool>` упакован в биты, оба элемента - одна ячейка памяти", "Нет: `flags[i]` возвращает прокси, и запись атомарна", "Да, но только потому что `vector` вообще не потокобезопасен для любых T", "Не скомпилируется: `flags[0]` не lvalue"], "answer": 1, "explain": "Стандарт гарантирует, что разные элементы контейнера можно менять из разных потоков, - с исключением для `vector<bool>`. Его элементы - биты одного слова, и запись бита - это чтение-изменение- запись всего слова. С `vector<char>` гонки не было бы."}, {"id": "mt-q13", "lesson": "mt-race", "q": "Какое утверждение верно?", "options": ["Data race и race condition - синонимы", "Если в программе нет data race, она корректна", "Код, где каждая операция под мьютексом, может содержать race condition, но не data race", "Data race - это когда два потока одновременно читают одну переменную", "Race condition по стандарту всегда UB"], "answer": 2, "explain": "Data race - формальное понятие (конфликтующие неатомарные доступы без happens-before), всегда UB. Race condition - логическая ошибка порядка: например, check-then-act через два отдельных захвата. Она не UB, но даёт неверный результат. Одновременное чтение - не гонка."}, {"id": "mt-q14", "lesson": "mt-race", "q": "Глобальный `std::shared_ptr<Config> g`. Поток A делает `g = std::make_shared<Config>();`, поток B - `auto local = g;`. Есть ли гонка?", "options": ["Нет: `shared_ptr` потокобезопасен", "Нет: счётчик ссылок атомарный, этого достаточно", "Только если `Config` не const", "Да: атомарен только счётчик ссылок, а сам объект `g` один поток пишет, а другой читает", "Только если оба потока пишут в `g`"], "answer": 3, "explain": "Гарантия `shared_ptr`: разные объекты shared_ptr, указывающие на одно, можно копировать и разрушать из разных потоков. Но один и тот же объект shared_ptr подчиняется обычным правилам: запись + чтение - гонка. Решение: мьютекс или `std::atomic<std::shared_ptr<T>>` (C++20)."}, {"id": "mt-q15", "lesson": "mt-race", "q": "`std::map<std::string, int> m` заполнен заранее, писателей нет. Несколько потоков одновременно читают его. Какой способ чтения формально небезопасен?", "options": ["`m.find(key)`", "`m.at(key)`", "`m.count(key)`", "Обход `for (const auto& [k, v] : m)`", "`m[key]`"], "answer": 4, "explain": "Одновременные вызовы const-методов стандартных контейнеров не дают гонок. `operator[]` у `map` не const: он вставляет отсутствующий ключ, и стандарт явно не включает его в список \"считать const\" для ассоциативных контейнеров. Даже если ключ есть, это неопределённо по стандарту; если ключа нет - вставка и гонка точно."}, {"id": "mt-q16", "lesson": "mt-race", "q": "Что выведет код с атомиком?", "code": "std::atomic<int> x{0};\n\nvoid add() {\n    for (int i = 0; i < 1'000'000; ++i)\n        x = x + 1;\n}\n// два потока выполняют add(), потом join, потом cout << x", "options": ["Скорее всего меньше 2000000, но UB нет", "Ровно 2000000: `x` атомарный", "UB: гонка данных на `x`", "Не скомпилируется: у atomic нет `operator+`", "Ровно 1000000"], "answer": 0, "explain": "`x + 1` - это атомарный load, а `x = ...` - отдельный атомарный store. Каждая операция атомарна, гонки данных нет, но между ними другой поток успевает записать - инкременты теряются. Нужно `++x`, `x += 1` или `fetch_add(1)`."}, {"id": "mt-q17", "lesson": "mt-mutex", "q": "Что не так?", "code": "std::mutex m;\nint x = 0;\n\nvoid f() {\n    std::lock_guard<std::mutex>{m};\n    ++x;\n}", "options": ["Всё корректно: lock_guard держит замок до конца функции", "Замок снимается в конце той же строки: это временный объект, `++x` без защиты", "Ошибка компиляции: у lock_guard нет имени", "Дедлок при втором вызове `f`", "Замок не снимется никогда"], "answer": 1, "explain": "Безымянный объект - временный, он разрушается в конце полного выражения. Компилятор, возможно, предупредит (конструктор помечен nodiscard), но код скомпилируется. Замку всегда нужно имя: `std::lock_guard lk(m);`."}, {"id": "mt-q18", "lesson": "mt-mutex", "q": "`m` - глобальный `std::mutex`. Что делает первая строка функции?", "code": "void g() {\n    std::unique_lock<std::mutex>(m);\n    shared_data.push_back(1);\n}", "options": ["Захватывает глобальный `m` до конца функции", "Создаёт временный замок, который сразу снимается", "Объявляет локальную переменную `m` типа `unique_lock` (без мьютекса) - ничего не лочится", "Ошибка компиляции: нельзя создать `unique_lock` без имени", "Захватывает `m` и отпускает в начале следующей строки"], "answer": 2, "explain": "Это most vexing parse: `T(m);` - объявление переменной `m` типа T (скобки вокруг имени лишние). `unique_lock` имеет конструктор по умолчанию, поэтому всё компилируется, а глобальный мьютекс не трогается. Clang предупреждает -Wvexing-parse."}, {"id": "mt-q19", "lesson": "mt-mutex", "q": "Что не так с классом?", "code": "class Users {\npublic:\n    const std::vector<std::string>& all() const {\n        std::lock_guard lk(m_);\n        return users_;\n    }\n    void add(std::string u) {\n        std::lock_guard lk(m_);\n        users_.push_back(std::move(u));\n    }\nprivate:\n    mutable std::mutex m_;\n    std::vector<std::string> users_;\n};", "options": ["Ничего: чтение в `all()` защищено", "Ошибка компиляции: нельзя лочить мьютекс в const-методе", "Нужен `recursive_mutex`", "Ссылка уходит из-под замка: вызывающий читает `users_` без мьютекса, пока другой поток делает `add`", "Проблема только в производительности"], "answer": 3, "explain": "Замок снимается при выходе из `all()`, а ссылка продолжает жить. Вызывающий итерирует вектор, параллельный `add` делает реаллокацию - гонка и висячие ссылки. Возвращайте копию (снапшот) или выполняйте работу внутри класса. `mutable` как раз и позволяет лочить в const-методе."}, {"id": "mt-q20", "lesson": "mt-condvar", "q": "Почему в `std::condition_variable::wait` нельзя передать `std::lock_guard`?", "options": ["lock_guard не перемещаемый, а wait забирает замок по значению", "lock_guard медленнее unique_lock", "Можно: в C++17 добавили такую перегрузку", "lock_guard не является RAII-объектом", "wait должен отпустить мьютекс на время сна и захватить снова, а lock_guard не умеет unlock/lock; принимается только `unique_lock<std::mutex>`"], "answer": 4, "explain": "`wait(unique_lock<mutex>&)` принимает замок по ссылке, внутри атомарно отпускает мьютекс и засыпает, а перед возвратом снова захватывает. lock_guard не даёт такого интерфейса. Для других типов замков есть `condition_variable_any`."}, {"id": "mt-q21", "lesson": "mt-mutex", "q": "Что произойдёт при вызове `f()`?", "code": "std::mutex m;\n\nvoid g() { std::lock_guard lk(m); /* ... */ }\nvoid f() { std::lock_guard lk(m); g(); }", "options": ["UB: повторный lock нерекурсивного мьютекса тем же потоком; на практике обычно вечное зависание", "Работает: поток уже владеет мьютексом", "Гарантированно бросит `std::system_error` (resource_deadlock_would_occur)", "Ошибка компиляции", "Второй lock_guard ничего не сделает"], "answer": 0, "explain": "`std::mutex` нерекурсивный. Стандарт: lock() потоком-владельцем - UB. Реализация может бросить исключение, но не обязана; на Linux и macOS обычно просто зависает. Лечение - не recursive_mutex, а приватный `g_locked()` без захвата."}, {"id": "mt-q22", "lesson": "mt-mutex", "q": "Что делает `std::scoped_lock lk(m1, m2);`?", "options": ["Захватывает строго в порядке аргументов: сначала m1, потом m2", "Захватывает оба мьютекса алгоритмом без дедлока (как `std::lock`) и отпускает оба в деструкторе", "Работает только ровно с двумя мьютексами", "Не отпускает мьютексы при исключении", "Эквивалентен двум вложенным `lock_guard`"], "answer": 1, "explain": "`scoped_lock` (C++17) - вариадический RAII-замок. Для нескольких мьютексов использует `std::lock`: если второй не взялся, первый отпускается и попытка повторяется, поэтому встречный `scoped_lock(m2, m1)` не задедлочит. Два вложенных lock_guard как раз дедлок допускают."}, {"id": "mt-q23", "lesson": "mt-deadlock", "q": "Два потока одновременно вызывают `transfer(a, b, 10)` и `transfer(b, a, 20)`. Что может случиться?", "code": "void transfer(Account& from, Account& to, long sum) {\n    std::lock_guard l1(from.m);\n    std::lock_guard l2(to.m);\n    from.balance -= sum;\n    to.balance += sum;\n}", "options": ["Гонка данных на балансах", "Ничего: мьютексы разные", "Дедлок: каждый держит свой первый мьютекс и ждёт второй", "Дедлок, только если `a` и `b` - один и тот же объект", "Потеря одного из переводов"], "answer": 2, "explain": "Классическое циклическое ожидание. Лечение: `std::scoped_lock lk(from.m, to.m);` или захват в глобальном порядке (по id счёта). TSan такое находит как lock-order-inversion, даже если зависания в прогоне не было."}, {"id": "mt-q24", "lesson": "mt-deadlock", "q": "Что из этого НЕ входит в четыре необходимых условия дедлока (Коффман)?", "options": ["Взаимное исключение", "Удержание и ожидание", "Отсутствие вытеснения", "Голодание (starvation) потоков", "Циклическое ожидание"], "answer": 3, "explain": "Условия Коффмана: mutual exclusion, hold and wait, no preemption, circular wait. Если сломать любое - дедлока нет. Голодание - отдельная проблема живучести: поток может бесконечно не получать ресурс и без дедлока."}, {"id": "mt-q25", "lesson": "mt-deadlock", "q": "Функция с `scoped_lock` вызвана как `transfer(a, a, 5)`. Что будет?", "code": "void transfer(Account& from, Account& to, long sum) {\n    std::scoped_lock lk(from.m, to.m);\n    from.balance -= sum;\n    to.balance += sum;\n}", "options": ["`scoped_lock` заметит дубликат и захватит один раз", "Ничего страшного: перевод самому себе даёт ноль", "Гарантированно бросит `std::system_error`", "Ошибка компиляции", "UB: один мьютекс захватывается дважды; на практике зависание"], "answer": 4, "explain": "`std::lock` для одного и того же мьютекса дважды - UB. Типичная реализация берёт его, потом `try_lock` на нём же не проходит, отпускает и крутится бесконечно. Нужна явная проверка `if (&from == &to) return;`."}, {"id": "mt-q26", "lesson": "mt-deadlock", "q": "Обработчик события вызывает `bus.subscribe(...)`. Что произойдёт и как правильно исправить?", "code": "void Bus::publish(const Event& e) {\n    std::lock_guard lk(m_);\n    for (auto& h : handlers_) h(e);\n}\nvoid Bus::subscribe(Handler h) {\n    std::lock_guard lk(m_);\n    handlers_.push_back(std::move(h));\n}", "options": ["Самодедлок; правильно - скопировать список под замком и вызывать обработчики без замка", "Самодедлок; правильно - заменить `mutex` на `recursive_mutex`", "Всё работает: тот же поток уже владеет мьютексом", "Гонка данных, но не дедлок", "Дедлок; правильно - вызывать `subscribe` через `std::async`"], "answer": 0, "explain": "Повторный захват `m_` тем же потоком - UB и обычно зависание. `recursive_mutex` уберёт зависание, но `push_back` внутри range-for по тому же вектору инвалидирует итераторы - новый UB. Правило: под замком не вызывать чужой код. Копия списка и вызов вне замка решают обе проблемы."}, {"id": "mt-q27", "lesson": "mt-pool", "q": "Пул из 1 потока. Задача A делает `auto f = pool.submit(B); return f.get();`. Что будет?", "options": ["B выполнится в потоке A: `packaged_task` так умеет", "Дедлок: единственный воркер занят задачей A, которая ждёт B, а B лежит в очереди", "`f.get()` бросит `future_error`", "Всё отработает, просто медленнее", "Дедлок возможен, только если очередь ограничена"], "answer": 1, "explain": "Это thread starvation deadlock. Увеличение пула лишь отодвигает проблему: при N одновременно ждущих задачах всё снова встанет. Лечение: не блокироваться внутри задач, строить цепочки продолжений, разделять пулы."}, {"id": "mt-q28", "lesson": "mt-deadlock", "q": "Почему `recursive_mutex` считается запахом?", "options": ["Он примерно в 10 раз медленнее и это единственная причина", "Он не работает с `lock_guard`", "Он позволяет войти в публичный метод изнутри другого, когда инвариант может быть временно нарушен; лучше выделить приватные `*_locked` методы", "Он не освобождается при исключении", "Он не пускает другие потоки вообще никогда"], "answer": 2, "explain": "Технически recursive_mutex работает и с lock_guard, и с исключениями. Проблема в дизайне: непонятно, какие инварианты держатся в момент повторного входа, и кто сколько раз захватил. Чёткое разделение \"публичный метод берёт замок, приватный требует его\" делает код проверяемым."}, {"id": "mt-q29", "lesson": "mt-shared", "q": "Что произойдёт в одном потоке?", "code": "std::shared_mutex m;\n\nstd::shared_lock r(m);\nif (!cache.contains(key)) {\n    std::unique_lock w(m);\n    cache[key] = load(key);\n}", "options": ["`shared_mutex` автоматически апгрейдит замок", "Гонка между проверкой и записью, но без зависания", "Всё корректно: `unique_lock` дождётся других читателей", "Дедлок (UB): поток держит shared и ждёт exclusive, которое ждёт ухода всех читателей, включая его самого", "Ошибка компиляции: нельзя два замка на одном мьютексе"], "answer": 3, "explain": "Апгрейда в `std::shared_mutex` нет. Правильно: отпустить shared_lock, взять unique_lock и перепроверить условие - другой поток мог успеть вставить ключ."}, {"id": "mt-q30", "lesson": "mt-shared", "q": "Можно ли в LRU-кэше (list + unordered_map) брать `shared_lock` в методе `get`?", "options": ["Да: `get` только читает", "Да: `list::splice` потокобезопасен", "Нет: `shared_lock` нельзя использовать в методах, возвращающих значение", "Да, если сделать поля `mutable`", "Нет: `get` переставляет элемент в начало списка (splice) - это модификация"], "answer": 4, "explain": "Логически get - чтение, но физически он меняет порядок в списке. Два одновременных splice под shared_lock разрушат связи узлов. `mutable` лишь обманывает компилятор, не потоки. Варианты: обычный mutex, шардирование, или приблизительный LRU без перестановки при каждом чтении."}, {"id": "mt-q31", "lesson": "mt-shared", "q": "В каком случае `shared_mutex` скорее всего проиграет обычному `mutex`?", "options": ["Секция чтения - одна загрузка int, много потоков: счётчик читателей - общая кэш-линия, которую все пишут", "Чтений в 100 раз больше записей, чтение - поиск в большой хеш-таблице", "Читатели держат замок по миллисекунде, писатель - раз в минуту", "Много ядер, данные - большой read-only индекс, редкие обновления"], "answer": 0, "explain": "shared_lock - это атомарная запись в состояние мьютекса. На микросекции накладные расходы и пинг-понг кэш-линии больше, чем выигрыш от параллельного чтения. shared_mutex окупается, когда чтения долгие и их много. Для крошечных данных - atomic или снапшот."}, {"id": "mt-q32", "lesson": "mt-condvar", "q": "Что не так с потребителем?", "code": "std::unique_lock lk(m);\nif (q.empty())\n    cv.wait(lk);\nauto x = q.front();\nq.pop();", "options": ["Всё верно: `wait` возвращается только после notify", "После spurious wakeup или если другой потребитель успел первым, `front()` вызовется на пустой очереди: нужен цикл/предикат", "Проблема только в производительности", "Достаточно заменить `notify_one` на `notify_all` у производителя", "Надо использовать `lock_guard` вместо `unique_lock`"], "answer": 1, "explain": "`wait` без предиката может вернуться ложно (spurious wakeup), а между notify и захватом мьютекса другой потребитель может забрать элемент. Всегда `cv.wait(lk, [&] { return !q.empty(); });` - это цикл `while (!pred()) wait(lk);`."}, {"id": "mt-q33", "lesson": "mt-condvar", "q": "Флаг атомарный. Что может пойти не так?", "code": "std::atomic<bool> ready{false};\n\n// поток 1\nstd::unique_lock lk(m);\ncv.wait(lk, [] { return ready.load(); });\n\n// поток 2\nready = true;\ncv.notify_one();", "options": ["Ничего: `ready` атомарный", "Гонка данных на `ready`", "Lost wakeup: поток 2 может записать и уведомить между проверкой предиката и засыпанием потока 1 - тот уснёт навсегда", "Ничего: предикат защищает от всех проблем", "Дедлок: поток 2 не может уведомить, пока поток 1 держит `m`"], "answer": 2, "explain": "Мьютекс нужен не ради атомарности флага, а чтобы \"проверить предикат и уснуть\" было атомарно относительно \"изменить и уведомить\". Поток 1 проверил (false), ещё не уснул; поток 2 записал и вызвал notify (никто не ждёт); поток 1 засыпает. Лечение: менять `ready` под `m` (хотя бы пустой lock/unlock между записью и notify)."}, {"id": "mt-q34", "lesson": "mt-condvar", "q": "Где вызывать `notify_one`: под мьютексом или после unlock?", "options": ["Только под мьютексом, иначе UB", "Только после unlock, иначе дедлок", "Под мьютексом уведомление теряется", "Оба варианта корректны; после unlock обычно эффективнее, но под замком нужно, если cv может быть уничтожена сразу после пробуждения ждущего", "Под мьютексом `notify_one` будит всех"], "answer": 3, "explain": "Корректность обеспечивает то, что состояние изменено под мьютексом. Сам notify можно звать где угодно. Notify после unlock избавляет разбуженного от немедленной блокировки на мьютексе. Notify под замком нужен, когда объект с cv может быть разрушен ждущим сразу после выхода из wait (latch, одноразовое событие на стеке)."}, {"id": "mt-q35", "lesson": "mt-condvar", "q": "Bounded queue с ОДНОЙ условной переменной для производителей и потребителей. Чем опасен `notify_one`?", "options": ["Ничем: notify_one всегда будит того, кто ждёт дольше всех", "Будет гонка данных на очереди", "notify_one нельзя использовать вместе с предикатом", "Будет spurious wakeup, который предикат не обработает", "Может разбудить потоки не того типа (производителя вместо потребителя); тот снова уснёт, сигнал потерян - возможно зависание"], "answer": 4, "explain": "На одной cv ждут разные предикаты (\"не полна\" и \"не пуста\"). notify_one будит случайного ждущего. Решения: две cv (`not_full`, `not_empty`) с notify_one в каждую, либо одна cv и `notify_all`."}, {"id": "mt-q36", "lesson": "mt-condvar", "q": "Что означает `ok == false`?", "code": "std::unique_lock lk(m);\nbool ok = cv.wait_for(lk, 100ms, [&] { return ready; });", "options": ["Время вышло, и предикат на момент выхода всё ещё false", "Был spurious wakeup", "Пришёл notify, но мьютекс был занят", "Время вышло, даже если `ready` уже стал true", "Ошибка ожидания, нужно смотреть errno"], "answer": 0, "explain": "Версия с предикатом возвращает результат предиката после выхода из ожидания. Ложные пробуждения она поглощает сама. Если `ready` стал true в последний момент, вернётся true. Без предиката возвращается `std::cv_status::timeout`/`no_timeout`."}, {"id": "mt-q37", "lesson": "mt-condvar", "q": "В bounded-очереди `close()` выставляет `closed_ = true` под мьютексом и вызывает `not_empty_.notify_one()`. В чём проблема?", "options": ["Проблемы нет: каждый проснувшийся разбудит следующего", "Проснётся максимум один ждущий потребитель, остальные (и все ждущие производители) спят вечно: нужен `notify_all` на обе cv", "Нужно вызывать notify под мьютексом, иначе сигнал теряется", "Проблема только с производителями, потребители проснутся все"], "answer": 1, "explain": "Закрытие - изменение, важное всем ждущим. notify_one будит одного. Ничто в коде pop не будит следующего потребителя при закрытии. Поэтому `close()` = флаг под замком + `notify_all` на все cv, а предикаты ожидания учитывают `closed_`."}, {"id": "mt-q38", "lesson": "mt-queue", "q": "Каждый метод \"потокобезопасной\" очереди берёт мьютекс. Что не так с использованием?", "code": "if (!queue.empty()) {\n    auto v = queue.front();\n    queue.pop();\n    process(v);\n}", "options": ["Ничего: все методы защищены мьютексом", "Будет дедлок: мьютекс берётся трижды подряд", "Каждый вызов атомарен, но связка нет: между `empty()` и `front()` другой поток может забрать элемент", "Проблема только в лишних захватах мьютекса", "Нужно сделать мьютекс рекурсивным"], "answer": 2, "explain": "Race condition без data race. Интерфейс должен давать операцию целиком: `std::optional<T> try_pop()` или блокирующий `pop()`. Именно поэтому в потокобезопасной очереди нет `empty()`+`front()` как основного API."}, {"id": "mt-q39", "lesson": "mt-queue", "q": "Почему `std::stack::pop()` возвращает `void`, а не значение?", "options": ["Для производительности: лишнее копирование", "Чтобы `pop()` можно было вызвать на пустом стеке", "Это ограничение ABI старых компиляторов", "Если копирование возвращаемого значения бросит после удаления элемента, элемент потерян; `top()`+`pop()` дают строгую гарантию", "Чтобы `stack` был потокобезопасным"], "answer": 3, "explain": "Классическая история про exception safety. В потокобезопасной очереди разделить на `front()`+`pop()` нельзя (гонка), поэтому выбирают: `bool pop(T& out)`, возврат `optional<T>` с требованием noexcept move, или `shared_ptr<T>`."}, {"id": "mt-q40", "lesson": "mt-queue", "q": "Потребитель bounded-очереди ждёт так. Что сломается при `close()`?", "code": "std::optional<T> pop() {\n    std::unique_lock lk(m_);\n    not_empty_.wait(lk, [this] { return !q_.empty(); });\n    if (closed_ && q_.empty()) return std::nullopt;\n    ...\n}", "options": ["Ничего: `close()` вызывает `notify_all`", "pop после close вернёт мусор", "Будет гонка на `closed_`", "Проблема только с производителями", "Потребители, ждущие на пустой очереди, не проснутся никогда: предикат не учитывает `closed_`"], "answer": 4, "explain": "notify_all разбудит потребителя, но `wait` с предикатом сразу проверит `!q_.empty()` (false) и уснёт снова. Предикат обязан включать условие выхода: `closed_ || !q_.empty()`. Проверка после wait уже не поможет."}, {"id": "mt-q41", "lesson": "mt-queue", "q": "Какую семантику `close()` у bounded-очереди обычно ожидают по умолчанию (graceful)?", "options": ["push после close возвращает false; pop дочитывает остаток и возвращает `nullopt`, только когда очередь закрыта и пуста", "push и pop сразу начинают бросать исключение", "Очередь очищается, pop сразу возвращает `nullopt`", "close ждёт, пока потребители всё дочитают, и только потом возвращается", "close запрещён, пока в очереди есть элементы"], "answer": 0, "explain": "Graceful shutdown не теряет уже принятые элементы. Вариант \"drop\" (очистить очередь) тоже бывает, но его нужно оговорить вслух. Важно, чтобы close будил всех: и производителей на `not_full`, и потребителей на `not_empty`."}, {"id": "mt-q42", "lesson": "mt-pool", "q": "Зачем в пуле `std::make_shared<std::packaged_task<R()>>` и лямбда `[task] { (*task)(); }`?", "options": ["Чтобы задача жила после разрушения пула", "`std::function` требует копируемый callable, а `packaged_task` только перемещаемый", "Чтобы future стал `shared_future`", "Иначе исключения из задачи не дойдут до future", "Ради потокобезопасного счётчика ссылок на задачу"], "answer": 1, "explain": "packaged_task move-only, и `std::function<void()>` его не примет. shared_ptr делает лямбду копируемой. В C++23 есть `std::move_only_function`, тогда обёртка не нужна. Исключения пробрасывает сам packaged_task, shared_ptr тут ни при чём."}, {"id": "mt-q43", "lesson": "mt-pool", "q": "Воркер выполняет `job()`, не отпустив мьютекс очереди. Что плохого?", "options": ["Ничего: так даже безопаснее", "Исключения из задач перестанут доходить до future", "Задачи выполняются строго по одной, а задача, которая сама вызывает `submit`, задедлочит воркер", "Только лишняя задержка на один захват", "Гонка данных на очереди задач"], "answer": 2, "explain": "Под замком - только извлечение задачи. Выполнение под замком сериализует весь пул (другие воркеры не могут взять следующую задачу), а реентерабельный submit попробует захватить тот же мьютекс."}, {"id": "mt-q44", "lesson": "mt-pool", "q": "Пул при остановке выбрасывает невыполненные задачи (`packaged_task` разрушаются без вызова). Что получит владелец future такой задачи?", "options": ["`get()` будет ждать вечно", "`get()` вернёт `T{}`", "Вызовется `std::terminate`", "`get()` бросит `std::future_error` с кодом `broken_promise`", "UB"], "answer": 3, "explain": "Разрушение promise/packaged_task без результата кладёт в shared state исключение `future_error(broken_promise)`. Это хорошо: ожидающий не зависнет. Но поведение надо проговорить на интервью."}, {"id": "mt-q45", "lesson": "mt-pool", "q": "В деструкторе пула: `stop_ = true;` под мьютексом, затем `cv_.notify_one();` и `join` всех воркеров. Что будет при 4 воркерах, ждущих на пустой очереди?", "options": ["Все четыре выйдут: каждый вышедший будит следующего", "Все выйдут, потому что join будит поток", "std::terminate из-за joinable потоков", "Работает, но медленнее, чем с notify_all", "Проснётся один воркер и выйдет; остальные три спят вечно, деструктор зависнет на join"], "answer": 4, "explain": "Остановка важна всем воркерам - `notify_all`. Предикат `stop_ || !tasks_.empty()` тут правильный, но без пробуждения его никто не перепроверит. join ничего не будит."}, {"id": "mt-q46", "lesson": "mt-future", "q": "Сколько примерно займёт `handle()`, если `slow_log` работает 1 секунду, а `respond` - мгновенно?", "code": "void handle() {\n    std::async(std::launch::async, slow_log);  // \"в фоне\"\n    respond();\n}", "options": ["Около секунды: деструктор временного future от `std::async` ждёт завершения задачи до вызова `respond()`", "Мгновенно: `slow_log` выполняется в фоне", "Мгновенно, но `slow_log` может не выполниться вовсе", "Около секунды, но `respond()` выполнится параллельно со `slow_log`", "Ошибка компиляции: результат `std::async` нельзя игнорировать"], "answer": 0, "explain": "Future из `std::async` - особенный: его деструктор блокируется, пока задача не закончится. Временный future разрушается в конце строки, то есть до `respond()`. `[[nodiscard]]` даёт только предупреждение. Для fire-and-forget нужен пул или сохранённый future."}, {"id": "mt-q47", "lesson": "mt-future", "q": "Какой future блокируется в своём деструкторе, если результат ещё не готов?", "options": ["Любой `std::future`", "Только последний future, ссылающийся на shared state, созданный `std::async`", "Future, полученный из `packaged_task`", "Только `std::shared_future`", "Никакой: деструктор future никогда не ждёт"], "answer": 1, "explain": "Это особое правило для `std::async`, чтобы запущенный поток не пережил future. Future от promise и packaged_task в деструкторе просто отпускают shared state."}, {"id": "mt-q48", "lesson": "mt-future", "q": "Чем опасен этот код?", "code": "auto f = std::async(compute);  // политика по умолчанию\nwhile (f.wait_for(10ms) != std::future_status::ready) {\n    update_progress_bar();\n}", "options": ["Ничем: wait_for корректно ждёт готовности", "Гонкой данных на `f`", "Может зависнуть: при deferred-политике `wait_for` всегда возвращает `deferred`, задача сама не запустится", "`wait_for` бросит исключение для deferred-задачи", "Задача запустится дважды"], "answer": 2, "explain": "Политика по умолчанию - `async | deferred`, выбор за реализацией. Deferred-задача запускается только в `get()`/`wait()`. Либо указывайте `std::launch::async` явно, либо проверяйте статус `deferred`."}, {"id": "mt-q49", "lesson": "mt-future", "q": "Что произойдёт на второй строке с `get()`?", "code": "auto f = std::async(std::launch::async, [] { return 1; });\nint a = f.get();\nint b = f.get();", "options": ["Вернёт 1 повторно", "Заблокируется навсегда", "Вернёт 0", "UB: после первого `get()` у future `valid() == false`; одни реализации бросают `future_error` (no_state), другие просто падают", "Перезапустит задачу"], "answer": 3, "explain": "`future::get()` забирает результат (move) и делает `valid() == false`. Повторный вызов на невалидном future - UB. libstdc++ бросает `std::future_error` с кодом `no_state`, libc++ может упасть с segfault. Полагаться нельзя. Для многократного чтения - `shared_future`."}, {"id": "mt-q50", "lesson": "mt-future", "q": "Что выведет программа?", "code": "std::future<int> f;\n{\n    std::promise<int> p;\n    f = p.get_future();\n}\ntry {\n    std::cout << f.get();\n} catch (const std::future_error&) {\n    std::cout << \"broken\";\n}", "options": ["0", "Зависнет навсегда", "UB: promise уже уничтожен", "Ошибка компиляции", "broken"], "answer": 4, "explain": "Promise, разрушенный без `set_value`/`set_exception`, кладёт в shared state `future_error(broken_promise)`. Shared state живёт, пока на него ссылается future, поэтому UB нет."}, {"id": "mt-q51", "lesson": "mt-future", "q": "Несколько потоков должны дождаться одного и того же результата. Как правильно?", "options": ["Сделать `shared_future` через `f.share()` и передать каждому потоку свою копию; каждый вызывает `get()`", "Передать один `std::future` по ссылке во все потоки, все вызывают `get()`", "Скопировать `std::future` в каждый поток", "Вызвать `get()` в главном потоке и раздать значение через глобальную переменную без синхронизации", "Запустить задачу с `std::launch::deferred`"], "answer": 0, "explain": "`std::future` move-only и одноразовый. `shared_future` копируемый, `get()` возвращает const-ссылку и может вызываться многократно. Обращаться к одному объекту shared_future из нескольких потоков без синхронизации нельзя - отсюда \"своя копия в каждом потоке\"."}, {"id": "mt-q52", "lesson": "mt-atomic", "q": "Что выведет код?", "code": "std::atomic<int> a{5};\nint expected = 3;\nbool ok = a.compare_exchange_strong(expected, 10);\nstd::cout << ok << ' ' << a << ' ' << expected;", "options": ["0 5 3", "0 5 5", "1 10 3", "0 10 5", "1 10 5"], "answer": 1, "explain": "Текущее 5 не равно expected 3 - обмен не выполнен, ok = false, а в `expected` записано текущее значение 5. Именно поэтому в CAS-цикле не нужно перечитывать atomic вручную."}, {"id": "mt-q53", "lesson": "mt-atomic", "q": "Когда `compare_exchange_weak` может вернуть false?", "options": ["Только когда значение не равно expected", "Только при конкуренции нескольких потоков", "Когда значение не равно expected, а также ложно - даже при равенстве; поэтому его вызывают в цикле", "Никогда: weak отличается от strong только порядком памяти", "Когда тип не lock-free"], "answer": 2, "explain": "На архитектурах с LL/SC (ARM) store-conditional может не пройти из-за прерывания или чужой записи в ту же кэш-линию. weak это допускает и в цикле обходится дешевле. strong гарантирует, что false - только при реальном неравенстве."}, {"id": "mt-q54", "lesson": "mt-atomic", "q": "Что не так со спинлоком?", "code": "std::atomic_flag f;\nvoid lock() {\n    while (f.test_and_set(std::memory_order_relaxed)) {}\n}\nvoid unlock() { f.clear(std::memory_order_relaxed); }", "options": ["Всё правильно: atomic_flag всегда seq_cst", "Не скомпилируется: atomic_flag нужно инициализировать `ATOMIC_FLAG_INIT`", "Проблема только в производительности: нужен test-and-test-and-set", "Взаимное исключение есть, но нет happens-before между секциями: данные под замком - гонка; нужны acquire в lock и release в unlock", "Дедлок: `clear` с relaxed может не дойти до других ядер"], "answer": 3, "explain": "RMW-операции над флагом упорядочены, поэтому в секции один поток. Но relaxed не публикует записи, сделанные внутри секции: следующий владелец может их не увидеть. Замок обязан давать acquire при захвате и release при освобождении. В C++20 флаг по умолчанию очищен."}, {"id": "mt-q55", "lesson": "mt-atomic", "q": "Какая строка не скомпилируется?", "options": ["`std::atomic<double> d{0}; d.fetch_add(1.5);` (C++20)", "`std::atomic<int*> p{nullptr}; p.fetch_add(1);`", "`struct P { int x, y; }; std::atomic<P> a{};`", "`std::atomic<bool> b{false}; b.exchange(true);`", "`std::atomic<std::string> s;`"], "answer": 4, "explain": "`std::atomic<T>` требует trivially copyable T - `std::string` таким не является. `fetch_add` для floating-point добавили в C++20. Структура P тривиально копируема - atomic скомпилируется (может быть lock-free или нет, зависит от размера)."}, {"id": "mt-q56", "lesson": "mt-atomic", "q": "`struct Big { char buf[64]; }; std::atomic<Big> a;` Что верно?", "options": ["Скомпилируется, но почти наверняка не lock-free: внутри будет блокировка", "Не скомпилируется: atomic только для типов до 8 байт", "Скомпилируется и будет lock-free на любой 64-битной платформе", "Скомпилируется, но операции будут неатомарными", "Не скомпилируется без `-latomic`"], "answer": 0, "explain": "Для крупных T стандартная библиотека реализует atomic через внутренние замки (часто таблицу спинлоков по адресу). Атомарность сохраняется, lock-free - нет. Проверка: `is_lock_free()` или `is_always_lock_free`. На Linux с GCC иногда нужен `-latomic`, но это деталь сборки, а не ответ на вопрос."}, {"id": "mt-q57", "lesson": "mt-memory", "q": "Что можно сказать о коде?", "code": "int data = 0;\nstd::atomic<bool> ready{false};\n\n// поток 1\ndata = 42;\nready.store(true, std::memory_order_relaxed);\n\n// поток 2\nwhile (!ready.load(std::memory_order_relaxed)) {}\nstd::cout << data;", "options": ["Корректно на любой платформе: `ready` атомарный", "Гонка данных на `data` (UB): relaxed не создаёт happens-before; нужны release в store и acquire в load", "Корректно, потому что поток 2 крутится, пока не увидит true", "Ошибка только на x86, на ARM всё работает", "Достаточно сделать `data` volatile"], "answer": 1, "explain": "relaxed даёт атомарность самого флага, но не упорядочивает обычные записи вокруг него. Release-store + acquire-load, прочитавший true, создают synchronizes-with, и запись `data` становится видна. Как раз на ARM переупорядочивание реально наблюдается; на x86 баг обычно прячется."}, {"id": "mt-q58", "lesson": "mt-memory", "q": "Счётчик обработанных запросов: инкремент в каждом обработчике, читается после `join` всех потоков или раз в минуту для метрик. Какой порядок памяти достаточен для `fetch_add`?", "options": ["`memory_order_acquire`", "`memory_order_release`", "`memory_order_relaxed`", "`memory_order_acq_rel`", "Только `memory_order_seq_cst`"], "answer": 2, "explain": "Счётчик ничего не публикует: никто не читает другие данные, опираясь на его значение. relaxed гарантирует атомарность и единый порядок изменений самого счётчика - инкременты не потеряются. Финальное значение после join видно благодаря синхронизации join."}, {"id": "mt-q59", "lesson": "mt-memory", "q": "Поток 1: `x.store(1, release); r1 = y.load(acquire);`. Поток 2: `y.store(1, release); r2 = x.load(acquire);`. Изначально x = y = 0. Возможен ли исход r1 == 0 и r2 == 0?", "options": ["Нет: release/acquire гарантируют, что хотя бы один увидит 1", "Только на ARM, на x86 невозможно", "Нет, это была бы гонка данных", "Да: acquire/release этого не запрещают; запрещает только seq_cst на всех четырёх операциях", "Да, но только если компилятор переставит строки, процессор так не делает"], "answer": 3, "explain": "Это store buffering (алгоритм Деккера). Release упорядочивает предыдущие операции перед store, acquire - последующие после load, но store и последующий load другой переменной могут поменяться местами. На x86 это реально бывает из-за буфера записи. Гонки данных нет: все переменные атомарные."}, {"id": "mt-q60", "lesson": "mt-memory", "q": "Что гарантирует `volatile` в многопоточном коде?", "options": ["Атомарность для типов до 8 байт", "Видимость изменений другим потокам, как в Java", "Барьер памяти вокруг каждого доступа", "Запрет переупорядочивания с соседними обычными переменными", "Ничего полезного: ни атомарности, ни упорядочивания между потоками; гонка на volatile - всё равно UB"], "answer": 4, "explain": "volatile запрещает компилятору выбрасывать или объединять обращения к самой переменной - это для MMIO и обработчиков сигналов. Межпоточные гарантии дают только atomic, мьютексы и прочие примитивы синхронизации. Java volatile по смыслу ближе к `std::atomic` с seq_cst."}, {"id": "mt-q61", "lesson": "mt-memory", "q": "Что из этого НЕ создаёт happens-before между действиями двух потоков?", "options": ["`unlock` мьютекса и последующий `lock` того же мьютекса другим потоком", "Завершение потока и возврат из `join`", "Конструктор `std::thread` и начало функции потока", "Release-store и acquire-load, прочитавший это значение", "`set_value` у promise и возврат `get` у его future", "Relaxed-store в одном потоке и relaxed-load, прочитавший это значение, в другом"], "answer": 5, "explain": "Все перечисленные, кроме relaxed-пары, - это synchronizes-with. Relaxed гарантирует только, что load увидит какое-то значение из порядка изменений этой переменной, но не упорядочивает другие данные."}, {"id": "mt-q62", "lesson": "mt-once", "q": "Что гарантирует C++11 для этого кода?", "code": "Logger& instance() {\n    static Logger inst;\n    return inst;\n}", "options": ["Инициализация выполнится ровно один раз; потоки, пришедшие одновременно, подождут её окончания", "Ничего: нужен mutex вокруг инициализации", "Потокобезопасны и инициализация, и все вызовы методов `Logger`", "Потокобезопасно, только если `Logger` - POD", "Каждый поток получит свою копию `inst`"], "answer": 0, "explain": "\"Magic statics\" - гарантия стандарта с C++11: инициализация локальной статики потокобезопасна. Если конструктор бросил, следующий вход попробует снова. Методы объекта синхронизируйте сами. Своя копия на поток - это `thread_local`."}, {"id": "mt-q63", "lesson": "mt-once", "q": "Что не так с этим ленивым синглтоном?", "code": "Widget* instance = nullptr;\nstd::mutex m;\n\nWidget* get() {\n    if (!instance) {\n        std::lock_guard lk(m);\n        if (!instance) instance = new Widget;\n    }\n    return instance;\n}", "options": ["Ничего: двойная проверка решает проблему", "Первое чтение `instance` без синхронизации - гонка данных; поток может увидеть указатель раньше, чем сконструированный объект", "Дедлок при одновременном входе", "Утечка памяти - единственная проблема", "Объект может быть создан дважды"], "answer": 1, "explain": "Чтение вне замка конкурирует с записью под замком - это UB. Практически: запись указателя может стать видна раньше записей полей Widget. Лечение: `std::atomic<Widget*>` с acquire/release, `call_once` или просто static local. Дважды объект не создастся - вторая проверка под замком это ловит."}, {"id": "mt-q64", "lesson": "mt-once", "q": "Функция внутри `std::call_once(flag, f)` бросила исключение. Что дальше?", "options": ["Флаг выставлен, функция больше никогда не вызовется", "Вызывается `std::terminate`", "Исключение уходит вызвавшему, флаг не считается выставленным; следующий `call_once` с этим флагом снова вызовет функцию", "Исключение проглатывается, флаг выставлен", "Все последующие `call_once` с этим флагом бросают то же исключение"], "answer": 2, "explain": "Так называемый exceptional call: он не \"возвращающий\", поэтому флаг остаётся невыставленным. Это позволяет повторить инициализацию. Тот же принцип у magic statics."}, {"id": "mt-q65", "lesson": "mt-once", "q": "Что выведет программа?", "code": "thread_local int counter = 0;\n\nvoid work() {\n    for (int i = 0; i < 3; ++i) ++counter;\n}\n\nint main() {\n    std::thread a(work), b(work);\n    a.join();\n    b.join();\n    work();\n    std::cout << counter;\n}", "options": ["9", "6", "0", "3", "Не определено: гонка данных"], "answer": 3, "explain": "У каждого потока своя копия `counter`. Потоки a и b увеличили свои копии, которые умерли вместе с ними. Главный поток увеличил свою - 3. Гонки нет: копии разные."}, {"id": "mt-q66", "lesson": "mt-tasks-sync", "q": "Есть ли проблема в параллельной сумме?", "code": "long long total = 0;\nstd::vector<std::thread> ts;\nfor (int t = 0; t < 4; ++t)\n    ts.emplace_back([&, t] {\n        long long local = 0;\n        for (size_t i = t; i < v.size(); i += 4) local += v[i];\n        total += local;\n    });\nfor (auto& th : ts) th.join();", "options": ["Гонка на `v`: потоки читают его одновременно", "Гонка на `t`: захвачен по ссылке", "Всё корректно: каждый поток прибавляет лишь один раз", "Гонка на `local`", "Гонка данных на `total`: четыре потока делают неатомарный `+=`"], "answer": 4, "explain": "Одно сложение на поток - всё равно конфликтующая неатомарная запись. Варианты: `std::atomic<long long>`, мьютекс, свой слот в `vector` на поток или возврат через future. `t` захвачен по значению (`[&, t]`), а одновременное чтение `v` - не гонка."}, {"id": "mt-q67", "lesson": "mt-tasks-sync", "q": "Три потока ждут на одной cv разных значений `stage` (0, 1, 2). Что будет, если после `++stage` вызвать `notify_one` вместо `notify_all`?", "options": ["Может проснуться не тот поток; он снова уснёт, а нужный не проснётся - зависание", "Ничего: cv будит потоки в порядке их ожидания", "Сработает, но медленнее", "Гонка данных на `stage`", "Spurious wakeup спасёт - поток всё равно когда-нибудь проснётся"], "answer": 0, "explain": "notify_one будит произвольного ждущего. Если его предикат false, он засыпает обратно, и уведомление израсходовано впустую. На spurious wakeup полагаться нельзя. Решение: notify_all или своя cv на каждый поток с точечным notify."}, {"id": "mt-q68", "lesson": "mt-tasks-sync", "q": "Каждый из 8 потоков делает `partial[t] += v[i]` в цикле по своему куску, где `partial` - `std::vector<long long>(8)`. Что верно?", "options": ["Гонка данных: все потоки пишут в один вектор", "Гонки нет, но будет false sharing: соседние элементы в одной кэш-линии; лучше копить в локальной и записать один раз", "Гонка данных, если потоков больше, чем ядер", "Всё идеально: это самый быстрый вариант", "UB: `operator[]` вектора не потокобезопасен"], "answer": 1, "explain": "Разные элементы `vector<long long>` - разные ячейки памяти, гонки нет (в отличие от `vector<bool>`). Но 8 штук по 8 байт - одна кэш-линия 64 байта, и каждое ядро постоянно отбирает её себе. Локальная переменная или `alignas(64)` на слот решают проблему."}, {"id": "mt-q69", "lesson": "mt-tasks-service", "q": "Зачем `alignas(64)` у структуры шарда в шардированной мапе?", "options": ["Без этого `std::mutex` нельзя положить в `std::array`", "Чтобы хеш ключа равномерно распределялся по шардам", "Чтобы мьютексы и данные соседних шардов не делили кэш-линию (false sharing)", "Это требование `std::unordered_map`", "Чтобы операции с мьютексом стали атомарными"], "answer": 2, "explain": "Мьютекс - это несколько байт с атомарным состоянием. Если два мьютекса соседних шардов в одной кэш-линии, захват одного инвалидирует линию у ядра, работающего с другим. Выравнивание по 64 байтам (размер линии на x86 и большинстве ARM) убирает это."}, {"id": "mt-q70", "lesson": "mt-tasks-service", "q": "Token bucket считает пополнение через `std::chrono::system_clock`. В чём проблема?", "options": ["`system_clock` слишком медленный для вызова на каждом запросе", "`system_clock::now()` не потокобезопасен", "У `system_clock` точность только до секунды", "Системные часы могут прыгнуть (NTP, ручная правка): `dt` станет отрицательным или огромным; нужен `steady_clock`", "Проблемы нет"], "answer": 3, "explain": "steady_clock монотонный - для интервалов. system_clock - для \"настенного\" времени (логи, дедлайны в календаре). При прыжке назад ведро может уйти в минус или, наоборот, мгновенно наполниться."}, {"id": "mt-q71", "lesson": "mt-tasks-service", "q": "`snapshot()` шардированной мапы лочит шарды по одному и копирует. Что он гарантирует?", "options": ["Полностью атомарный снимок всей мапы", "Ничего: без глобального замка будет гонка данных", "Атомарный снимок, если шардов - степень двойки", "Дедлок, если в это время идут записи", "Каждый шард скопирован согласованно, но снимок целиком не атомарен: между шардами могли пройти обновления"], "answer": 4, "explain": "Гонки нет - каждый шард читается под своим замком. Дедлока нет - одновременно держим только один замок. Но значения разных шардов взяты в разные моменты. Для метрик это нормально. Нужен атомарный снимок - `scoped_lock` на все шарды (дорого) или версионирование."}, {"id": "mt-q72", "lesson": "mt-tasks-service", "q": "LRU-кэш: `get` возвращает `const V&` на значение внутри списка (после снятия замка). Чем это плохо?", "options": ["Другой поток может вытеснить или перезаписать элемент - ссылка висит или читается под гонкой", "Ничем: элементы `std::list` не перемещаются", "Только лишним копированием", "Ошибка компиляции: нельзя вернуть ссылку из-под lock_guard", "Это сломает порядок LRU"], "answer": 0, "explain": "Стабильность адресов list защищает от реаллокации, но не от `pop_back` при вытеснении и не от записи в `put`. Возвращайте копию (`optional<V>`) или `shared_ptr<const V>` - тогда большой объект не копируется и живёт, пока им пользуются."}, {"id": "mt-q73", "lesson": "mt-checklist", "q": "Что из этого допустимо делать, удерживая мьютекс?", "options": ["Вызов пользовательского колбэка", "Короткое изменение структуры данных, например `q_.push(std::move(x))`", "Сетевой запрос или запись в лог-файл", "`future.get()` от задачи из того же пула", "`join()` другого потока"], "answer": 1, "explain": "Под замком - только операции над защищаемыми данными. Чужой код может взять тот же замок (самодедлок) или работать долго. I/O держит замок миллисекундами. Ожидание future или join под замком - классика дедлока, если ожидаемому потоку нужен этот замок."}, {"id": "mt-q74", "lesson": "mt-checklist", "q": "Класс: `std::thread t_` - первое поле, `bool stop_` - флаг остановки, деструктор пустой. Какая правка неверна по существу (остальные - части правильного исправления)?", "options": ["Сделать `stop_` типом `std::atomic<bool>`", "В деструкторе выставить `stop_` и вызвать `t_.join()`, если joinable", "Заменить `std::thread` на `std::jthread`, оставив его первым полем", "Перенести `std::jthread t_` в конец класса и проверять `stop_token`"], "answer": 2, "explain": "jthread первым полем разрушится последним - после данных, которые использует поток, а деструктор класса к тому моменту уже отработал. Плюс поток продолжит крутиться, ведь он смотрит на `stop_`, а не на токен. Остальные правки - части правильного исправления."}, {"id": "mt-q75", "lesson": "mt-cpp20sync", "q": "Тот же `done` используется для второго раунда работы. Что будет во втором раунде?", "code": "std::latch done(2);\nauto round = [&] {\n    std::jthread a([&] { work(); done.count_down(); });\n    std::jthread b([&] { work(); done.count_down(); });\n    done.wait();\n};\nround();  // первый раунд\nround();  // второй раунд", "options": ["Работает так же: после нуля latch сам взводится обратно на 2", "`wait()` во втором раунде ждёт, пока оба потока снова вызовут `count_down`", "Ошибка компиляции: latch нельзя захватывать по ссылке", "`wait()` вернётся сразу, не дожидаясь работы, а `count_down` при нулевом счётчике - UB", "`count_down` при нулевом счётчике бросит `std::system_error`"], "answer": 3, "explain": "latch одноразовый. После первого раунда счётчик 0: `wait()` сразу возвращается, а `count_down(1)` с предусловием `n <= counter` нарушено - UB. Для повторяющихся раундов нужен `std::barrier` или новый latch на каждый раунд."}, {"id": "mt-q76", "lesson": "mt-cpp20sync", "q": "`std::barrier b(4, on_phase);` 4 потока по 3 раза зовут `b.arrive_and_wait()`. Сколько раз и где вызовется `on_phase`?", "options": ["12 раз: каждый поток вызывает его при каждом приходе", "3 раза, каждый раз в одном из потоков-участников, пока остальные ещё заблокированы", "3 раза во внутреннем служебном потоке барьера", "3 раза, параллельно с участниками, уже отпущенными в следующую фазу", "4 раза: по одному на участника, в конце всех фаз"], "answer": 1, "explain": "Completion выполняется один раз на фазу, в одном из потоков, пришедших на барьер, и до того, как кто-либо будет отпущен. Поэтому в нём можно без мьютекса читать и менять общие данные фазы: барьер даёт happens-before в обе стороны."}, {"id": "mt-q77", "lesson": "mt-cpp20sync", "q": "Корректен ли такой код?", "code": "std::binary_semaphore s{1};\nstd::thread a([&] { s.acquire(); });\na.join();\ns.release();  // из main, а не из a", "options": ["Нет, UB: отпускать может только поток, который делал `acquire`, как у мьютекса", "Нет: `binary_semaphore` нельзя отпускать после завершения потока", "Дедлок: `release` ждёт, пока поток `a` снова вызовет `acquire`", "Ошибка компиляции: у `binary_semaphore` нет `release`", "Да: у семафора нет владельца, `release` может вызвать любой поток"], "answer": 4, "explain": "Семафор - счётчик разрешений без владельца. Это его отличие от мьютекса: на этом построены сигналы между потоками (пинг-понг). Для `std::mutex` unlock из другого потока - UB. Ограничение у семафора одно: не превысить `max()` лишними `release`."}, {"id": "mt-q78", "lesson": "mt-cpp20sync", "q": "Поток B забыл `notify_one`. Что может случиться с потоком A?", "code": "std::atomic<int> x{0};\n// поток A\nx.wait(0);\nstd::puts(\"woke\");\n// поток B\nx.store(1);", "options": ["A может спать вечно: если он успел уснуть до store, будить его некому", "Ничего: `wait` периодически перечитывает значение и сам проснётся", "UB: гонка данных на `x`", "Ошибка компиляции: `wait` требует второй аргумент с memory_order", "A проснётся ложно и вернётся из `wait` при `x == 0`"], "answer": 0, "explain": "`wait` гарантирует пробуждение только по `notify_*` (или ложное, после которого он перепроверит значение). Если A проверил `x == 0` и уснул до store, без notify он может не проснуться никогда. Если store успел раньше проверки - A не уснёт вовсе. Гонки данных нет: `x` атомарный."}, {"id": "mt-q79", "lesson": "mt-cpp20sync", "q": "Нужно не больше 8 одновременных запросов к внешнему API, а если слот не освободился за 50 мс - отказать клиенту. Что подходит лучше всего?", "options": ["`std::latch slots(8)` и `wait()`", "`std::barrier slots(8)` и `arrive_and_wait()`", "`std::counting_semaphore<8> slots(8)` и `try_acquire_for(50ms)`", "`std::atomic<int>` счётчик и `wait()` с таймаутом", "`std::timed_mutex` и `try_lock_for(50ms)`"], "answer": 2, "explain": "Лимит параллелизма - это семафор, и у него есть ожидание с таймаутом. latch одноразовый, barrier ждёт, пока соберутся все N. У `atomic::wait` таймаута нет. `timed_mutex` пустит только одного, а не восемь."}, {"id": "mt-q80", "lesson": "mt-monitor", "q": "Два потока одновременно выполняют `s.set(s.get() + 1);`. Что не так?", "code": "class Stock {\npublic:\n    int get() { std::lock_guard lk(m_); return n_; }\n    void set(int v) { std::lock_guard lk(m_); n_ = v; }\nprivate:\n    std::mutex m_;\n    int n_ = 0;\n};", "options": ["Гонка данных на `n_`: TSan её покажет", "Дедлок: `set` вызывается, пока `get` держит замок", "Ничего: каждый метод под мьютексом", "Race condition без data race: можно потерять инкремент, нужен метод `add()` под одним замком", "UB: `get()` возвращает значение из-под замка"], "answer": 3, "explain": "Каждый вызов атомарен, но пара get + set - нет: оба потока прочитают 0 и оба запишут 1. Гонки данных нет, TSan промолчит. Монитор защищает инвариант, только если операции API - это целые операции предметной области: `add(1)`, `withdraw`, `try_pop`."}, {"id": "mt-q81", "lesson": "mt-monitor", "q": "`wlock()` возвращает объект, который держит замок и даёт `operator*`. Что не так?", "code": "Synchronized<std::vector<int>> v;\nauto& ref = *v.wlock();\nref.push_back(1);", "options": ["Ничего: замок держится до конца области видимости `ref`", "Ошибка компиляции: нельзя привязать ссылку к результату `operator*`", "Замок отпущен в конце первой строки, `push_back` идёт без замка - гонка", "Дедлок: второй вызов `wlock()` в этом потоке", "`push_back` у `std::vector` и так потокобезопасен"], "answer": 2, "explain": "Временный объект из `wlock()` живёт до конца полного выражения. Ссылка на данные пережила замок. Правильно: `auto p = v.wlock(); p->push_back(1);` или `v.with_lock([](auto& x) { x.push_back(1); });`."}, {"id": "mt-q82", "lesson": "mt-monitor", "q": "Баланс 0. Поток A ждёт `withdraw(70)`, поток B ждёт `withdraw(30)`. Кто-то вызывает `deposit(40)` с `notify_one`. Что может случиться?", "code": "void deposit(long s) {\n    { std::lock_guard lk(m_); balance_ += s; }\n    cv_.notify_one();\n}\nvoid withdraw(long s) {\n    std::unique_lock lk(m_);\n    cv_.wait(lk, [&] { return balance_ >= s; });\n    balance_ -= s;\n}", "options": ["Ничего плохого: предикат всё исправит", "`notify_one` всегда будит самого первого уснувшего, то есть A, и тот ждёт", "Дедлок на `m_`", "Гонка данных на `balance_`", "Проснётся A, проверит предикат и снова уснёт; B спит, хотя денег ему хватает"], "answer": 4, "explain": "Ждущие ждут разных условий на одной cv. `notify_one` может разбудить не того, кому изменение помогло, и сигнал пропадёт. Лечение: `notify_all` в `deposit` (или отдельная cv на каждый вид условия). Порядок пробуждения `notify_one` стандарт не гарантирует."}, {"id": "mt-q83", "lesson": "mt-monitor", "q": "Java-метод `synchronized void f()` в терминах C++ - это:", "options": ["Один глобальный мьютекс на все объекты класса", "Скрытый рекурсивный мьютекс в каждом объекте, захваченный на весь метод; `wait`/`notify` - cv на этом же мониторе", "Все поля объекта становятся `std::atomic`", "`std::shared_mutex`: синхронные методы читают параллельно", "Скрытый `std::mutex` в каждом объекте; вызов другого `synchronized`-метода из `f` - дедлок"], "answer": 1, "explain": "Монитор Java реентерабельный: поток, держащий монитор, может войти в другой `synchronized`-метод того же объекта. `std::mutex` - нет, повторный lock - UB. Поэтому в C++-мониторе общую логику выносят в приватные `*_locked()` методы. Глобальный замок на класс - это `static synchronized`."}, {"id": "mt-q84", "lesson": "mt-monitor", "q": "Какой главный риск в этом методе монитора?", "code": "void Registry::add(Item x) {\n    std::lock_guard lk(m_);\n    items_.push_back(x);\n    listener_(x);  // пользовательский колбэк\n}", "options": ["Дедлок, если колбэк вызовет метод `Registry` или возьмёт замки в обратном порядке; плюс замок держится сколько угодно долго", "Никакого: колбэк выполняется в том же потоке", "Гонка данных на `items_`", "Ошибка компиляции: под `lock_guard` нельзя вызывать `std::function`", "Колбэк не увидит добавленный элемент"], "answer": 0, "explain": "Под замком монитора нельзя вызывать чужой код. Колбэк может зайти обратно в `Registry` (повторный lock - UB), взять свои замки (обратный порядок - дедлок) или работать долго. Правильно: под замком изменить данные и скопировать что нужно, колбэк - после unlock."}, {"id": "mt-q85", "lesson": "mt-channel", "q": "`Channel` - как в уроке (`recv` возвращает `nullopt`, когда канал закрыт и пуст). Что произойдёт?", "code": "Channel<int> ch(4);\nstd::thread p([&] {\n    for (int i = 0; i < 3; ++i) ch.send(i);\n});\nwhile (auto v = ch.recv()) std::cout << *v;\np.join();", "options": ["Напечатает `012` и завершится", "Напечатает `0`, `1`, `2` в случайном порядке", "Напечатает `012` и зависнет: канал никто не закрыл, `recv` ждёт вечно", "Зависнет сразу: `send` ждёт получателя", "UB: `recv` вызывается до первого `send`"], "answer": 2, "explain": "Цикл `while (auto v = ch.recv())` кончается только на закрытом и пустом канале. Отправитель должен сказать \"больше не будет\": `ch.close()` после цикла отправки. Это правило Go: закрывает отправитель."}, {"id": "mt-q86", "lesson": "mt-channel", "q": "Fan-in: три воркера читают `in` и пишут в общий `out`. Что не так?", "code": "auto worker = [&] {\n    while (auto v = in.recv())\n        out.send(*v * *v);\n    out.close();\n};", "options": ["Ничего: повторный `close` безопасен", "Дедлок: `close` ждёт, пока все прочитают `out`", "UB: `close` из нескольких потоков", "Первый закончивший закроет `out`, `send` остальных вернёт false - часть результатов потеряется", "Потребитель `out` никогда не получит `nullopt`"], "answer": 3, "explain": "Закрывать общий выход должен последний писатель: счётчик живых воркеров (`if (--alive == 0) out.close();`) или координатор после join всех воркеров. В Go повторный `close` вообще паника; у нас он безопасен, но данные всё равно теряются."}, {"id": "mt-q87", "lesson": "mt-channel", "q": "Чем в C++ обычно заменяют Go-шный `select` по двум каналам?", "options": ["`std::select` из `<thread>`", "`std::when_any` из `<future>`", "`condition_variable::wait` сразу на двух cv", "`std::async` на каждый канал", "Один канал с сообщениями `std::variant<A, B>` и `std::visit`, или опрос `try_recv` по кругу"], "answer": 4, "explain": "Ждать сразу на нескольких cv нельзя. Обычно сливают входы в одну очередь variant-сообщений или делают общий \"звонок\" (cv/семафор) и `try_recv` по каналам. `when_any` был только в Concurrency TS (experimental) и в стандарт не вошёл."}, {"id": "mt-q88", "lesson": "mt-channel", "q": "Что выведет код? `Channel` - как в уроке: `close` не выбрасывает буфер.", "code": "Channel<int> ch(2);\nch.send(1);\nch.send(2);\nch.close();\nstd::cout << ch.send(3) << ' ';\nwhile (auto v = ch.recv()) std::cout << *v << ' ';\nstd::cout << ch.recv().has_value();", "options": ["`0 1 2 0`", "`1 1 2 3 0`", "`0 0`", "Зависнет на `send(3)`: буфер полон", "`0 1 2 1`"], "answer": 0, "explain": "После `close` новые `send` сразу возвращают false (не ждут места: предикат учитывает `closed_`). `recv` дочитывает 1 и 2 и только на пустом закрытом канале даёт `nullopt`, и так при каждом следующем вызове."}, {"id": "mt-q89", "lesson": "mt-channel", "q": "Что верно про каналы в C++?", "options": ["В C++23 появился `std::channel<T>`", "В стандарте каналов нет; готовые есть в Boost.Fiber (`buffered_channel`, `unbounded_channel`) и Boost.Asio (`experimental::channel`, `concurrent_channel`)", "`std::queue` потокобезопасен и работает как канал", "Каналы дают `std::jthread` через `stop_token`", "В C++26 каналы входят в `std::execution`"], "answer": 1, "explain": "Стандарт даёт только кирпичики. Канал пишут как bounded blocking queue с close или берут из библиотек; в userver для этого очереди `concurrent::MpscQueue` и родственные. `std::execution` (C++26) - senders/receivers, а не каналы."}, {"id": "mt-q90", "lesson": "mt-primitives", "q": "Какой мьютекс позволяет тому же потоку захватить себя повторно и умеет ждать с таймаутом?", "options": ["`std::timed_mutex`", "`std::recursive_mutex`", "`std::shared_timed_mutex`", "`std::recursive_timed_mutex`", "`std::mutex` с `try_lock_for`"], "answer": 3, "explain": "`recursive_timed_mutex` = рекурсивность + `try_lock_for`/`try_lock_until`. У `timed_mutex` таймауты есть, рекурсивности нет. У `recursive_mutex` наоборот. У `std::mutex` есть только `try_lock` без таймаута."}, {"id": "mt-q91", "lesson": "mt-primitives", "q": "Есть ли здесь гонка данных?", "code": "int x = 0;\nstd::thread t([&] {\n    std::atomic_ref<int>(x).fetch_add(1);\n});\n++x;  // main\nt.join();", "options": ["Нет: `atomic_ref` делает `x` атомарным навсегда", "Нет: `fetch_add` атомарен, а `++x` - одна инструкция", "Ошибка компиляции: `atomic_ref` нельзя создать от временного выражения", "Нет, если `x` выровнен по `alignof(std::atomic_ref<int>)`", "Да: пока с объектом работают через `atomic_ref`, обычный доступ к нему из другого потока - гонка"], "answer": 4, "explain": "`atomic_ref` не меняет объект, он делает атомарными только операции, выполненные через него. Все конкурентные обращения должны идти через `atomic_ref` (в main: `std::atomic_ref<int>(x).fetch_add(1)`). Обычный доступ - только когда других потоков уже нет (после join)."}, {"id": "mt-q92", "lesson": "mt-primitives", "q": "Что гарантирует `std::osyncstream(std::cout) << \"id \" << id << '\\n';` из нескольких потоков?", "options": ["Строки выводятся в порядке создания потоков", "Каждая такая строка выйдет целиком, не вперемешку с другими; порядок строк между потоками не задан", "Ничего: `std::cout` и так выводит строку целиком", "Вывод идёт сразу при каждом `<<`, но под глобальным мьютексом", "Без `std::flush` в конце строка не выведется"], "answer": 1, "explain": "`osyncstream` копит вывод в своём буфере и передаёт его целиком в деструкторе (или по `emit()`). Обычный `std::cout` безопасен от гонок данных (при синхронизации со stdio), но отдельные `<<` из разных потоков перемешиваются."}, {"id": "mt-q93", "lesson": "mt-primitives", "q": "Какого типа нет в стандартной библиотеке C++23?", "options": ["`std::shared_recursive_mutex`", "`std::shared_timed_mutex`", "`std::recursive_timed_mutex`", "`std::condition_variable_any`", "`std::atomic_ref`"], "answer": 0, "explain": "Рекурсивного shared-мьютекса в стандарте нет. Остальные есть: `shared_timed_mutex` с C++14, `recursive_timed_mutex` и `condition_variable_any` с C++11, `atomic_ref` с C++20."}], "tasks": [{"id": "mt-t1", "lesson": "mt-thread", "title": "Ссылка в поток", "task": "Аргументы `std::thread` копируются. Заполни пропуск в `run_inc`, чтобы `inc` в отдельном потоке изменил именно `n` вызывающего.", "prefix": "#include <functional>\n#include <iostream>\n#include <thread>\n\nconst auto main_id = std::this_thread::get_id();\nint inc_off_main = 0;  // вызовы inc не из main-потока\n\nvoid inc(int& x) {\n    if (std::this_thread::get_id() != main_id) ++inc_off_main;\n    ++x;\n}\n", "code": "// Запустить inc в отдельном потоке так,\n// чтобы он изменил именно n вызывающего\nvoid run_inc(int& n) {\n    std::thread t(inc, ____(n));\n    t.join();\n}\n", "check": "int main() {\n    int n = 0;\n    run_inc(n);\n    if (inc_off_main != 1) {\n        std::cout << \"FAIL: inc должен один раз \"\n                     \"выполниться в отдельном потоке\\n\";\n        return 1;\n    }\n    if (n != 1) {\n        std::cout << \"FAIL: n = \" << n << \", ждали 1\\n\";\n        return 1;\n    }\n    std::cout << n << '\\n';\n}\n", "mode": "gcc", "expect": "1", "hint": "Нужна обёртка из `<functional>`.", "solution": "// Запустить inc в отдельном потоке так,\n// чтобы он изменил именно n вызывающего\nvoid run_inc(int& n) {\n    std::thread t(inc, std::ref(n));\n    t.join();\n}\n"}, {"id": "mt-t2", "lesson": "mt-thread", "title": "Дождись всех потоков", "task": "Программа падает через `std::terminate`. Почему? Допиши `fill_squares`: вернуть управление можно только после завершения всех потоков.", "prefix": "#include <atomic>\n#include <chrono>\n#include <iostream>\n#include <thread>\n#include <vector>\n\nconst auto main_id = std::this_thread::get_id();\nstd::atomic<int> finished{0};  // готово не в main-потоке\n\n// Медленная работа: sq[i] = i * i\nvoid square(std::vector<int>& sq, int i) {\n    std::this_thread::sleep_for(std::chrono::milliseconds(10));\n    sq[i] = i * i;\n    if (std::this_thread::get_id() != main_id) ++finished;\n}\n", "code": "// Поток i считает square(sq, i). Вернуть управление\n// можно только когда все потоки закончили.\nvoid fill_squares(std::vector<int>& sq) {\n    std::vector<std::thread> ts;\n    for (int i = 0; i < int(sq.size()); ++i)\n        ts.emplace_back([&sq, i] { square(sq, i); });\n    // TODO: дождаться всех потоков\n}\n", "check": "int main() {\n    std::vector<int> sq(4);\n    fill_squares(sq);\n    int done = finished;  // сразу после возврата\n    if (done != 4) {\n        std::cout << \"FAIL: к возврату готово потоков: \"\n                  << done << \" из 4\\n\";\n        return 1;\n    }\n    int sum = 0;\n    for (int x : sq) sum += x;\n    if (sum != 14) {\n        std::cout << \"FAIL: sum = \" << sum << '\\n';\n        return 1;\n    }\n    std::cout << sum << '\\n';\n}\n", "mode": "gcc", "expect": "14", "hint": "Разрушение joinable `std::thread` - это terminate.", "solution": "// Поток i считает square(sq, i). Вернуть управление\n// можно только когда все потоки закончили.\nvoid fill_squares(std::vector<int>& sq) {\n    std::vector<std::thread> ts;\n    for (int i = 0; i < int(sq.size()); ++i)\n        ts.emplace_back([&sq, i] { square(sq, i); });\n    for (auto& t : ts) t.join();\n}\n"}, {"id": "mt-t3", "lesson": "mt-race", "title": "Почини счётчик", "task": "Запусти: TSan покажет гонку данных на `counter`. Поменяй объявление `counter` так, чтобы гонки не было. Самый дешёвый способ, без мьютекса.", "prefix": "#include <iostream>\n#include <thread>\n", "code": "int counter = 0;  // TODO: убрать гонку\n", "check": "void add() {\n    for (int i = 0; i < 100'000; ++i) ++counter;\n}\n\nint main() {\n    std::thread a(add), b(add);\n    a.join();\n    b.join();\n    if (counter != 200'000) {\n        std::cout << \"FAIL: counter = \" << counter << '\\n';\n        return 1;\n    }\n    std::cout << counter << '\\n';\n}\n", "mode": "tsan", "expect": "200000", "hint": "Одна переменная-счётчик - работа для `std::atomic`.", "solution": "#include <atomic>\n\nstd::atomic<int> counter{0};\n"}, {"id": "mt-t4", "lesson": "mt-race", "title": "Гонка без общих элементов", "task": "Каждый поток пишет только свой `done[i]`, но TSan ругается. Объясни почему и почини одной правкой типа `Flags`.", "prefix": "#include <iostream>\n#include <thread>\n#include <vector>\n", "code": "using Flags = std::vector<bool>;  // TODO: TSan видит гонку\n", "check": "int main() {\n    Flags done(8);\n    std::vector<std::thread> ts;\n    for (int i = 0; i < 8; ++i)\n        ts.emplace_back([&done, i] { done[i] = true; });\n    for (auto& t : ts) t.join();\n    int n = 0;\n    for (bool d : done) n += d;\n    if (n != 8) {\n        std::cout << \"FAIL: n = \" << n << '\\n';\n        return 1;\n    }\n    std::cout << n << '\\n';\n}\n", "mode": "tsan", "expect": "8", "hint": "`vector<bool>` хранит элементы битами: соседние элементы - одна ячейка памяти.", "solution": "using Flags = std::vector<char>;  // каждый - свой байт\n"}, {"id": "mt-t5", "lesson": "mt-mutex", "title": "Замок без имени", "task": "В `deposit` мьютекс вроде бы взят, но TSan видит гонку на `balance_`. Найди причину и почини.", "prefix": "#include <iostream>\n#include <mutex>\n#include <thread>\n", "code": "class Account {\npublic:\n    void deposit(long sum) {\n        std::lock_guard<std::mutex>{m_};  // TODO: TSan ругается\n        balance_ += sum;\n    }\n    long balance() {\n        std::lock_guard lk(m_);\n        return balance_;\n    }\n\nprivate:\n    std::mutex m_;\n    long balance_ = 0;  // guarded by m_\n};\n", "check": "int main() {\n    Account acc;\n    auto work = [&acc] {\n        for (int i = 0; i < 10000; ++i) acc.deposit(1);\n    };\n    std::thread a(work), b(work);\n    a.join();\n    b.join();\n    if (acc.balance() != 20000) {\n        std::cout << \"FAIL: balance = \" << acc.balance() << '\\n';\n        return 1;\n    }\n    std::cout << acc.balance() << '\\n';\n}\n", "mode": "tsan", "expect": "20000", "hint": "Сколько живёт временный объект?", "solution": "class Account {\npublic:\n    void deposit(long sum) {\n        std::lock_guard lk(m_);  // у замка есть имя\n        balance_ += sum;\n    }\n    long balance() {\n        std::lock_guard lk(m_);\n        return balance_;\n    }\n\nprivate:\n    std::mutex m_;\n    long balance_ = 0;  // guarded by m_\n};\n"}, {"id": "mt-t6", "lesson": "mt-mutex", "title": "unique_lock без ожидания", "task": "`try_work` должна попробовать взять мьютекс и сразу уйти, если он занят. Заполни тэг конструктора и проверку владения.", "prefix": "#include <iostream>\n#include <mutex>\n#include <thread>\n\nstd::mutex m;\nint works = 0;            // сколько раз работа сделана\nvoid work() { ++works; }  // звать только под m\n", "code": "// m занят - сразу вернуть false.\n// Взяли m - сделать work() под замком, вернуть true.\nbool try_work() {\n    std::unique_lock lk(m, std::____);  // не ждать\n    if (!lk.____()) return false;\n    work();\n    return true;\n}\n", "check": "// try_work в другом потоке, пока m держит main\nbool try_while_busy() {\n    std::lock_guard hold(m);\n    bool r = true;\n    std::thread([&r] { r = try_work(); }).join();\n    return r;\n}\n\nint main() {\n    bool busy1 = try_while_busy();\n    bool free1 = try_work();\n    bool free2 = try_work();\n    bool busy2 = try_while_busy();\n    if (busy1 || busy2) {\n        std::cout << \"FAIL: m занят, а try_work \"\n                     \"не вернул false\\n\";\n        return 1;\n    }\n    if (!free1 || !free2 || works != 2) {\n        std::cout << \"FAIL: m свободен, а работа \"\n                     \"не сделана\\n\";\n        return 1;\n    }\n    if (!m.try_lock()) {\n        std::cout << \"FAIL: try_work не отпустил m\\n\";\n        return 1;\n    }\n    m.unlock();\n    std::cout << \"busy\\ngot it\\n\";\n}\n", "mode": "gcc", "expect": "busy\ngot it", "hint": "Тэг `try_to_lock`, проверка - метод `owns_lock`.", "solution": "// m занят - сразу вернуть false.\n// Взяли m - сделать work() под замком, вернуть true.\nbool try_work() {\n    std::unique_lock lk(m, std::try_to_lock);  // не ждать\n    if (!lk.owns_lock()) return false;\n    work();\n    return true;\n}\n"}, {"id": "mt-t7", "lesson": "mt-deadlock", "title": "Перевод без дедлока", "task": "TSan сообщает lock-order-inversion: `transfer(a, b)` и `transfer(b, a)` одновременно задедлочатся. Перепиши захват замков. Перевод самому себе тоже не должен зависать.", "prefix": "#include <iostream>\n#include <mutex>\n#include <thread>\n\nstruct Account {\n    std::mutex m;\n    long balance = 1000;  // guarded by m\n};\n", "code": "void transfer(Account& from, Account& to, long sum) {\n    // TODO: замки берутся в порядке аргументов\n    std::lock_guard l1(from.m);\n    std::lock_guard l2(to.m);\n    from.balance -= sum;\n    to.balance += sum;\n}\n", "check": "int main() {\n    Account a, b;\n    // 1. Два потока одновременно: a -> b\n    auto ab = [&] {\n        for (int i = 0; i < 100; ++i) transfer(a, b, 1);\n    };\n    std::thread t1(ab), t2(ab);\n    t1.join();\n    t2.join();\n    // 2. Обратно b -> a. Поток идёт после первых,\n    // чтобы демо не зависло. TSan всё равно видит\n    // обратный порядок захвата.\n    std::thread t3([&] {\n        for (int i = 0; i < 100; ++i) transfer(b, a, 3);\n    });\n    t3.join();\n    // 3. Самому себе: ничего не меняет, не виснет\n    transfer(a, a, 5);\n    if (a.balance != 1100 || b.balance != 900) {\n        std::cout << \"FAIL: \" << a.balance << ' '\n                  << b.balance << \", ждали 1100 900\\n\";\n        return 1;\n    }\n    std::cout << a.balance << ' ' << b.balance << '\\n';\n}\n", "mode": "tsan", "expect": "1100 900", "hint": "Один `std::scoped_lock` на оба мьютекса. Не забудь случай `from == to`.", "solution": "void transfer(Account& from, Account& to, long sum) {\n    if (&from == &to) return;\n    std::scoped_lock lk(from.m, to.m);  // оба, без дедлока\n    from.balance -= sum;\n    to.balance += sum;\n}\n"}, {"id": "mt-t8", "lesson": "mt-shared", "title": "Читатели и писатели", "task": "Заполни три пропуска: тип мьютекса и два замка - разделяемый для чтения и эксклюзивный для записи.", "prefix": "#include <atomic>\n#include <iostream>\n#include <mutex>\n#include <shared_mutex>\n#include <string>\n#include <thread>\n#include <type_traits>\n#include <unordered_map>\n#include <vector>\n", "code": "class Config {\npublic:\n    using Mutex = std::____;  // тип мьютекса\n\n    std::string get(const std::string& key) const {\n        std::____ lk(m_);  // читатели параллельно\n        auto it = data_.find(key);\n        return it == data_.end() ? \"\" : it->second;\n    }\n    void set(const std::string& key, const std::string& v) {\n        std::____ lk(m_);  // писатель один\n        data_[key] = v;\n    }\n\nprivate:\n    mutable Mutex m_;\n    std::unordered_map<std::string, std::string> data_;\n};\n", "check": "static_assert(std::is_same_v<Config::Mutex, std::shared_mutex>,\n              \"читатели должны идти параллельно\");\n\nint main() {\n    Config cfg;\n    cfg.set(\"mode\", \"safe\");\n    std::atomic<int> bad{0};  // чтения мимо safe/fast\n    std::vector<std::thread> ts;\n    for (int i = 0; i < 4; ++i)\n        ts.emplace_back([&] {\n            for (int j = 0; j < 100; ++j) {\n                auto v = cfg.get(\"mode\");\n                if (v != \"safe\" && v != \"fast\") ++bad;\n            }\n        });\n    ts.emplace_back([&] { cfg.set(\"mode\", \"fast\"); });\n    for (auto& t : ts) t.join();\n    if (bad > 0 || cfg.get(\"mode\") != \"fast\") {\n        std::cout << \"FAIL: прочитано не то значение\\n\";\n        return 1;\n    }\n    std::cout << cfg.get(\"mode\") << '\\n';\n}\n", "mode": "tsan", "expect": "fast", "hint": "`shared_mutex`, `shared_lock`, `unique_lock`.", "solution": "class Config {\npublic:\n    using Mutex = std::shared_mutex;  // тип мьютекса\n\n    std::string get(const std::string& key) const {\n        std::shared_lock lk(m_);  // читатели параллельно\n        auto it = data_.find(key);\n        return it == data_.end() ? \"\" : it->second;\n    }\n    void set(const std::string& key, const std::string& v) {\n        std::unique_lock lk(m_);  // писатель один\n        data_[key] = v;\n    }\n\nprivate:\n    mutable Mutex m_;\n    std::unordered_map<std::string, std::string> data_;\n};\n"}, {"id": "mt-t9", "lesson": "mt-condvar", "title": "wait с предикатом", "task": "Допиши ожидание с предикатом в `consume` и сигнал в `produce`. Без предиката consumer может уснуть навсегда, если notify придёт раньше wait. Проверка ловит оба порядка.", "prefix": "#include <chrono>\n#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nstd::mutex m;\nstd::condition_variable cv;\nbool ready = false;  // guarded by m\nint value = 0;       // guarded by m\n", "code": "// Дождаться ready и вернуть value\nint consume() {\n    std::unique_lock lk(m);\n    cv.wait(lk, ____);  // ждать, пока ready\n    return value;\n}\n\n// Положить v, поднять ready, разбудить ждущего\nvoid produce(int v) {\n    {\n        std::lock_guard lk(m);\n        value = v;\n        ready = true;\n    }\n    cv.____();\n}\n", "check": "int main() {\n    // 1. consumer пришёл раньше данных\n    int got = 0;\n    std::thread consumer([&got] { got = consume(); });\n    std::this_thread::sleep_for(std::chrono::milliseconds(20));\n    produce(42);\n    consumer.join();\n    // 2. notify раньше wait: consumer опоздал\n    produce(7);\n    int late = 0;\n    std::thread([&late] { late = consume(); }).join();\n    if (got != 42 || late != 7) {\n        std::cout << \"FAIL: got \" << got << \", late \"\n                  << late << \", ждали 42 и 7\\n\";\n        return 1;\n    }\n    std::cout << \"got \" << got << '\\n';\n}\n", "mode": "gcc", "expect": "got 42", "hint": "Предикат - лямбда без захвата: `ready` глобальная.", "solution": "// Дождаться ready и вернуть value\nint consume() {\n    std::unique_lock lk(m);\n    cv.wait(lk, [] { return ready; });  // ждать, пока ready\n    return value;\n}\n\n// Положить v, поднять ready, разбудить ждущего\nvoid produce(int v) {\n    {\n        std::lock_guard lk(m);\n        value = v;\n        ready = true;\n    }\n    cv.notify_one();\n}\n"}, {"id": "mt-t10", "lesson": "mt-condvar", "title": "Напиши CountDownLatch", "task": "Реализуй `count_down` и `wait` на mutex + condition_variable. Проверка читает результаты сразу после `wait`, до `join` - TSan проверит, что latch это синхронизирует.", "prefix": "#include <chrono>\n#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <stdexcept>\n#include <thread>\n#include <vector>\n", "code": "class CountDownLatch {\npublic:\n    explicit CountDownLatch(int n) : count_(n) {}\n\n    void count_down() {\n        // TODO: минус один; на нуле разбудить всех\n        throw std::logic_error(\"TODO\");\n    }\n    void wait() {\n        // TODO: ждать, пока счётчик не станет 0\n        throw std::logic_error(\"TODO\");\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable cv_;\n    int count_;  // guarded by m_\n};\n", "check": "int main() {\n    const int n = 4;\n    CountDownLatch done(n);\n    std::vector<int> res(n);\n    std::vector<std::thread> ts;\n    for (int i = 0; i < n; ++i)\n        ts.emplace_back([&, i] {\n            auto pause = std::chrono::milliseconds(5 * i);\n            std::this_thread::sleep_for(pause);\n            res[i] = (i + 1) * 10;\n            done.count_down();\n        });\n    done.wait();  //
