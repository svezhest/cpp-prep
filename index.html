тация event loop: колбэки выполнятся позже.\nstd::vector<std::function<void()>> g_queue;\n\nclass Session : public std::enable_shared_from_this<Session> {\npublic:\n    ~Session() { std::cout << \"~Session\\n\"; }\n\n    void StartRead() {\n        // Колбэк держит Session живой, пока не выполнится.\n        g_queue.push_back([self = shared_from_this()] {\n            self->OnRead();\n        });\n    }\n\nprivate:\n    void OnRead() { std::cout << \"OnRead\\n\"; }\n};\n\nint main() {\n    {\n        auto session = std::make_shared<Session>();\n        session->StartRead();\n    }  // наш shared_ptr ушёл, объект жив внутри колбэка\n    std::cout << \"scope end\\n\";\n    for (auto& cb : g_queue) {\n        cb();\n    }\n    g_queue.clear();  // колбэк уничтожен — и Session вместе с ним\n\n    Session raw;  // объектом не владеет shared_ptr\n    try {\n        raw.StartRead();\n    } catch (const std::bad_weak_ptr&) {\n        std::cout << \"bad_weak_ptr\\n\";\n    }\n}\n", "expect": "scope end\nOnRead\n~Session\nbad_weak_ptr\n~Session"}, {"type": "warn", "text": "`shared_from_this()` работает, только если объектом уже владеет `shared_ptr`. Иначе с C++17 — исключение `std::bad_weak_ptr`. Поэтому нельзя вызывать его из конструктора."}, {"type": "list", "items": ["Как передавать (правило Саттера):", "`void f(const Widget&)` или `Widget*` — функция просто пользуется объектом. Это 90% случаев. Владение её не касается.", "`void f(std::unique_ptr<Widget>)` — функция забирает владение.", "`void f(std::shared_ptr<Widget>)` — функция сохранит себе копию (положит в член класса, в колбэк).", "`void f(const std::shared_ptr<Widget>&)` — может быть сохранит, может нет. Редко.", "`void f(std::unique_ptr<Widget>&)` — функция будет пересаживать указатель (reset). Редко."]}, {"type": "tip", "text": "Вслух: «по умолчанию `unique_ptr`. `shared_ptr` — только если владение реально общее, например объект нужен асинхронному колбэку. В функции, которые не владеют, передаю ссылку»."}]}, {"id": "modern-seq", "title": "vector, deque, list: сложности и инвалидация", "blocks": [{"type": "list", "items": ["`vector`: непрерывная память. `push_back` — амортизированно O(1), вставка и удаление в середине — O(n), доступ — O(1). Почти всегда лучший выбор из-за кэша.", "`deque`: блоки фиксированного размера. `push_front`/`push_back` O(1), доступ O(1), память не непрерывна.", "`list`: двусвязный список. Вставка и удаление по итератору O(1), `splice` O(1). Каждая нода — отдельная аллокация, кэш-промахи. Нужен редко: LRU-кэш, стабильные итераторы.", "`array`: фиксированный размер, лежит на стеке или внутри объекта."]}, {"type": "p", "text": "`reserve(n)` выделяет память, но размер не меняет. `resize(n)` создаёт элементы. Если размер известен заранее, `reserve` убирает лишние реаллокации и копирования."}, {"type": "list", "items": ["Инвалидация у `vector`:", "`push_back`/`emplace_back`/`insert`: если случилась реаллокация (новый размер больше `capacity()`), невалидно всё — итераторы, ссылки, указатели. Иначе — только `end()` и всё после точки вставки.", "`erase`: невалидны итераторы на удалённый элемент и после него.", "`deque::push_back`/`push_front`: итераторы невалидны, но ссылки на существующие элементы остаются валидны.", "`list`: вставка ничего не ломает, `erase` — только удалённый элемент."]}, {"type": "code", "code": "#include <iostream>\n#include <vector>\n\nvoid Bad(std::vector<int>& v) {\n    int& first = v[0];\n    v.push_back(42);              // возможна реаллокация\n    std::cout << first << '\\n';   // UB: висячая ссылка\n}\n\nvoid RemoveNegatives(std::vector<int>& v) {\n    // Ручной цикл: erase возвращает следующий валидный итератор.\n    // Но это O(n^2) — каждый erase сдвигает хвост.\n    for (auto it = v.begin(); it != v.end();) {\n        if (*it < 0) {\n            it = v.erase(it);\n        } else {\n            ++it;\n        }\n    }\n}\n\nint main() {\n    std::vector<int> one{7};  // capacity == 1: push_back перевыделит\n    Bad(one);\n\n    std::vector<int> v{3, -1, -2, 4};\n    RemoveNegatives(v);\n    for (int x : v) {\n        std::cout << x << ' ';\n    }\n    std::cout << '\\n';\n}\n"}, {"type": "p", "text": "Первая строка вывода — мусор: `first` смотрит в освобождённый буфер. Это UB, напечататься может что угодно, в том числе старое 7. Вторая строка — честный результат `RemoveNegatives`."}, {"type": "p", "text": "Правильный способ удалить по условию — за O(n):"}, {"type": "code", "code": "#include <algorithm>\n#include <cstddef>\n#include <iostream>\n#include <vector>\n\nvoid RemoveNegatives17(std::vector<int>& v) {\n    // erase-remove: remove_if сдвигает «хорошие» вперёд\n    // и возвращает новый конец; erase отрезает хвост.\n    v.erase(std::remove_if(v.begin(), v.end(),\n                           [](int x) { return x < 0; }),\n            v.end());\n}\n\nstd::size_t RemoveNegatives20(std::vector<int>& v) {\n    // C++20: одна строка, возвращает число удалённых\n    return std::erase_if(v, [](int x) { return x < 0; });\n}\n\nvoid Print(const std::vector<int>& v) {\n    for (int x : v) {\n        std::cout << x << ' ';\n    }\n    std::cout << \"(size \" << v.size() << \")\\n\";\n}\n\nint main() {\n    std::vector<int> a{3, -1, 4, -1, 5};\n    std::vector<int> b = a;\n    std::vector<int> c = a;\n\n    RemoveNegatives17(a);\n    Print(a);\n    std::cout << RemoveNegatives20(b) << \" removed\\n\";\n\n    // Без erase: размер прежний, в хвосте остатки\n    (void)std::remove_if(c.begin(), c.end(),\n                         [](int x) { return x < 0; });\n    Print(c);\n}\n", "expect": "3 4 5 (size 3)\n2 removed\n3 4 5 -1 5 (size 5)"}, {"type": "warn", "text": "`std::remove_if` сам ничего не удаляет: размер вектора не меняется, хвост содержит мусор (moved-from значения). Без `erase` это баг."}, {"type": "p", "text": "`emplace_back` против `push_back`. `emplace_back(args...)` строит элемент прямо в векторе из аргументов конструктора. `push_back(x)` копирует или перемещает готовый объект. Для готового объекта разницы нет."}, {"type": "code", "code": "#include <iostream>\n#include <memory>\n#include <string>\n#include <vector>\n\nint main() {\n    std::vector<std::string> names;\n    names.emplace_back(3, 'x');      // \"xxx\" без временного объекта\n    names.push_back(\"abc\");          // временный string + move\n\n    std::vector<std::vector<int>> rows;\n    rows.emplace_back(5);   // вектор из 5 нулей: explicit ctor\n    // rows.push_back(5);   // не скомпилируется: ctor explicit\n\n    std::vector<std::unique_ptr<int>> ptrs;\n    ptrs.push_back(std::make_unique<int>(1));  // безопасно\n    // ptrs.emplace_back(new int(1)); // утечка, если реаллокация\n                                      // бросит до создания ptr\n\n    std::cout << names[0] << ' ' << names[1] << ' '\n              << rows[0].size() << ' ' << *ptrs[0] << '\\n';\n}\n", "expect": "xxx abc 5 1"}, {"type": "warn", "text": "`std::vector<bool>` — не контейнер `bool`, а битовый прокси. Нельзя взять `bool&` на элемент, `auto x = v[0]` — прокси, а не `bool`. Если нужно — `std::vector<char>` или `std::bitset`."}, {"type": "p", "text": "Классика собеседований — LRU-кэш: `list` хранит порядок, `unordered_map` — ключ → итератор в списке. Итераторы `list` не ломаются при `splice`, поэтому всё O(1)."}, {"type": "code", "code": "#include <cstddef>\n#include <iostream>\n#include <list>\n#include <optional>\n#include <string>\n#include <unordered_map>\n#include <utility>\n\nclass LruCache {\npublic:\n    explicit LruCache(std::size_t capacity) : capacity_(capacity) {}\n\n    std::optional<std::string> Get(int key) {\n        auto it = index_.find(key);\n        if (it == index_.end()) {\n            return std::nullopt;\n        }\n        items_.splice(items_.begin(), items_, it->second);\n        return it->second->second;\n    }\n\n    void Put(int key, std::string value) {\n        if (capacity_ == 0) {\n            return;\n        }\n        if (auto it = index_.find(key); it != index_.end()) {\n            it->second->second = std::move(value);\n            items_.splice(items_.begin(), items_, it->second);\n            return;\n        }\n        if (items_.size() == capacity_) {\n            index_.erase(items_.back().first);\n            items_.pop_back();\n        }\n        items_.emplace_front(key, std::move(value));\n        index_[key] = items_.begin();\n    }\n\nprivate:\n    using Item = std::pair<int, std::string>;\n\n    std::size_t capacity_;\n    std::list<Item> items_;  // голова — самый свежий\n    std::unordered_map<int, std::list<Item>::iterator> index_;\n};\n\nint main() {\n    LruCache cache(2);\n    cache.Put(1, \"a\");\n    cache.Put(2, \"b\");\n    cache.Get(1);       // 1 стал свежим\n    cache.Put(3, \"c\");  // вытесняет самый старый — 2\n    for (int key : {1, 2, 3}) {\n        std::cout << key << '=' << cache.Get(key).value_or(\"-\")\n                  << ' ';\n    }\n    std::cout << '\\n';\n}\n", "expect": "1=a 2=- 3=c"}, {"type": "tip", "text": "Вслух про LRU: «Get и Put за O(1) в среднем. Отдельно проверю capacity 0 и обновление существующего ключа. Если нужна потокобезопасность — один mutex на кэш или шардирование»."}]}, {"id": "modern-assoc", "title": "map, set и unordered_*: ловушки", "blocks": [{"type": "list", "items": ["`map`/`set`: красно-чёрное дерево. Поиск, вставка, удаление — O(log n). Упорядочены, есть `lower_bound` и диапазоны. Итераторы стабильны: вставка ничего не инвалидирует, удаление — только удалённый элемент.", "`unordered_map`/`unordered_set`: хэш-таблица с цепочками. В среднем O(1), в худшем O(n) (плохой хэш, атака на хэш). Порядок обхода не определён.", "Rehash (при росте) инвалидирует итераторы, но не ссылки и указатели на элементы: ноды не переезжают. `reserve(n)` заранее убирает rehash.", "Оба вида — node-based: аллокация на каждый элемент. В нагруженных сервисах часто берут open addressing таблицы (flat hash map) из внутренних библиотек."]}, {"type": "p", "text": "`operator[]` вставляет значение по умолчанию, если ключа нет. Поэтому он не-const и не работает в const-методах. Для чтения — `find`, `contains` (C++20) или `at` (бросает `std::out_of_range`)."}, {"type": "code", "code": "#include <iostream>\n#include <map>\n#include <string>\n\nint main() {\n    std::map<std::string, int> limits;\n    if (limits[\"alice\"] > 10) {   // вставил {\"alice\", 0}\n        std::cout << \"blocked\\n\";\n    }\n    std::cout << limits.size() << '\\n';\n\n    if (auto it = limits.find(\"bob\"); it != limits.end()) {\n        std::cout << it->second << '\\n';\n    }\n    std::cout << limits.contains(\"bob\") << '\\n';  // без вставки\n}\n", "expect": "1\n0"}, {"type": "list", "items": ["Вставка — четыре разных поведения:", "`insert({k, v})` — если ключ есть, ничего не меняет. Возвращает `pair<iterator, bool>`.", "`emplace(k, v)` — то же, но может сконструировать пару даже при существующем ключе и выбросить её. Аргументы могут быть уже перемещены.", "`try_emplace(k, args...)` (C++17) — если ключ есть, аргументы не трогает. Для move-only и дорогих значений — лучший выбор.", "`insert_or_assign(k, v)` (C++17) — вставит или перезапишет. Явнее, чем `m[k] = v`, и не требует конструктора по умолчанию."]}, {"type": "code", "code": "#include <iostream>\n#include <map>\n#include <string>\n#include <utility>\n\nint main() {\n    std::map<int, std::string> m{{1, \"old\"}};\n    std::string s = \"new\";\n\n    // Ключ 1 уже есть: try_emplace не трогает s\n    auto [it, inserted] = m.try_emplace(1, std::move(s));\n    std::cout << inserted << ' ' << it->second << ' ' << s << '\\n';\n\n    m.insert_or_assign(1, s);\n    std::cout << m[1] << '\\n';\n}\n", "expect": "0 old new\nnew"}, {"type": "warn", "text": "Обход `for (const std::pair<std::string, int>& p : m)` копирует каждый элемент: `value_type` у map — `pair<const std::string, int>`, тип не совпадает, создаётся временный объект. Пиши `for (const auto& [key, value] : m)`."}, {"type": "p", "text": "Свой тип как ключ `unordered_map`: нужен хэш и `operator==`. Для `map` — `operator<` или компаратор."}, {"type": "code", "code": "#include <cstddef>\n#include <cstdint>\n#include <functional>\n#include <iostream>\n#include <unordered_map>\n\nstruct Point {\n    std::int32_t x = 0;\n    std::int32_t y = 0;\n    bool operator==(const Point&) const = default;\n};\n\nstruct PointHash {\n    std::size_t operator()(const Point& p) const noexcept {\n        auto ux = static_cast<std::uint32_t>(p.x);\n        auto uy = static_cast<std::uint32_t>(p.y);\n        std::uint64_t key = (std::uint64_t{ux} << 32) | uy;\n        return std::hash<std::uint64_t>{}(key);\n    }\n};\n\nint main() {\n    std::unordered_map<Point, int, PointHash> grid;\n    grid[{1, 2}] = 5;\n    grid[{1, 2}] += 1;\n    grid[{2, 1}] = 7;  // другой ключ: (x, y) не симметричны\n    std::cout << grid.size() << ' ' << grid.at({1, 2}) << '\\n';\n}\n", "expect": "2 6"}, {"type": "p", "text": "Heterogeneous lookup: искать по `string_view` без создания `std::string`. Для `map` достаточно `std::less<>`. Для `unordered_*` (C++20) нужен хэш с `is_transparent` и `std::equal_to<>`."}, {"type": "code", "code": "#include <functional>\n#include <iostream>\n#include <map>\n#include <string>\n#include <string_view>\n#include <unordered_set>\n\nstruct StringHash {\n    using is_transparent = void;\n    std::size_t operator()(std::string_view s) const noexcept {\n        return std::hash<std::string_view>{}(s);\n    }\n};\n\nclass Registry {\npublic:\n    bool IsBanned(std::string_view user) const {\n        return banned_.contains(user);   // без аллокации\n    }\n    int Limit(std::string_view user) const {\n        auto it = limits_.find(user);   // std::less<> прозрачен\n        return it == limits_.end() ? 0 : it->second;\n    }\n    void Ban(std::string user) { banned_.insert(std::move(user)); }\n    void SetLimit(std::string user, int limit) {\n        limits_.insert_or_assign(std::move(user), limit);\n    }\n\nprivate:\n    std::unordered_set<std::string, StringHash, std::equal_to<>>\n        banned_;\n    std::map<std::string, int, std::less<>> limits_;\n};\n\nint main() {\n    Registry r;\n    r.Ban(\"eve\");\n    r.SetLimit(\"bob\", 5);\n    std::string_view query = \"eve\";\n    std::cout << r.IsBanned(query) << r.IsBanned(\"bob\") << ' '\n              << r.Limit(\"bob\") << ' ' << r.Limit(\"zed\") << '\\n';\n}\n", "expect": "10 5 0"}, {"type": "p", "text": "Node handles (C++17): `extract` вынимает ноду без копирования и аллокации, ключ можно поменять, `insert` вставит ноду обратно или в другой контейнер. `merge` переносит ноды целиком."}, {"type": "code", "code": "#include <iostream>\n#include <map>\n#include <string>\n#include <utility>\n\nvoid Rename(std::map<std::string, int>& m,\n            const std::string& from, const std::string& to) {\n    auto node = m.extract(from);\n    if (node.empty()) {\n        return;\n    }\n    node.key() = to;           // у map ключ const, у ноды — нет\n    m.insert(std::move(node));\n}\n\nvoid Combine(std::map<std::string, int>& dst,\n             std::map<std::string, int>& src) {\n    dst.merge(src);  // совпавшие ключи остаются в src\n}\n\nvoid Print(const std::map<std::string, int>& m) {\n    for (const auto& [key, value] : m) {\n        std::cout << key << '=' << value << ' ';\n    }\n    std::cout << '\\n';\n}\n\nint main() {\n    std::map<std::string, int> m{{\"a\", 1}, {\"b\", 2}};\n    Rename(m, \"a\", \"z\");\n    std::map<std::string, int> src{{\"b\", 20}, {\"c\", 3}};\n    Combine(m, src);\n    Print(m);\n    Print(src);\n}\n", "expect": "b=2 c=3 z=1\nb=20"}, {"type": "warn", "text": "Удаление при обходе map: `it = m.erase(it);` в ветке удаления, `++it` — в остальных. Или C++20: `std::erase_if(m, [](const auto& kv) { return kv.second == 0; });`."}, {"type": "tip", "text": "Вслух при выборе: «порядок не нужен, нужен поиск по ключу — `unordered_map` с `reserve`. Нужны диапазоны или top по ключу — `map`. Для чтения не использую `operator[]`, чтобы не вставить мусор»."}]}, {"id": "modern-views", "title": "string_view и span: невладеющие представления", "blocks": [{"type": "p", "text": "`std::string_view` (C++17) — указатель плюс длина. Ничем не владеет, копируется дёшево — передавай по значению. Принимает литерал, `std::string`, кусок буфера без аллокации. `substr` и `remove_prefix` — O(1)."}, {"type": "p", "text": "`std::span<T>` (C++20) — то же для непрерывных массивов: `vector`, `array`, C-массив, кусок буфера. `std::span<const T>` — только чтение. Есть `first(n)`, `last(n)`, `subspan(off, n)`. Проверки границ в `operator[]` нет."}, {"type": "code", "code": "#include <cstdint>\n#include <iostream>\n#include <numeric>\n#include <span>\n#include <string_view>\n#include <vector>\n\nstd::vector<std::string_view> Split(std::string_view s, char sep) {\n    std::vector<std::string_view> parts;\n    while (true) {\n        auto pos = s.find(sep);\n        parts.push_back(s.substr(0, pos));\n        if (pos == std::string_view::npos) {\n            break;\n        }\n        s.remove_prefix(pos + 1);\n    }\n    return parts;\n}\n\nstd::int64_t Total(std::span<const std::int64_t> amounts) {\n    return std::accumulate(amounts.begin(), amounts.end(),\n                           std::int64_t{0});\n}\n\nint main() {\n    std::vector<std::int64_t> v{100, 200, 300};\n    std::int64_t raw[] = {1, 2};\n    std::cout << Total(v) << ' '                    // из vector\n              << Total(raw) << ' '                  // из C-массива\n              << Total(std::span(v).first(2)) << '\\n';  // первые два\n\n    for (auto part : Split(\"a,b,,c\", ',')) {\n        std::cout << '[' << part << ']';\n    }\n    std::cout << '\\n';\n}\n", "expect": "600 3 300\n[a][b][][c]"}, {"type": "list", "items": ["Соглашения по параметрам:", "Только читаю строку — `std::string_view`.", "Сохраню строку у себя — `std::string` по значению и `std::move` внутрь.", "Нужна C-строка с `\\0` для C API — `const std::string&` и `.c_str()`. `string_view::data()` не обязан заканчиваться нулём.", "Только читаю массив — `std::span<const T>`. Шаблон по контейнеру не нужен.", "`std::string` → `string_view` неявно. Обратно — только явно: `std::string(sv)`."]}, {"type": "warn", "text": "Висячий view — главная ловушка. View не продлевает жизнь временного объекта. Всё ниже компилируется, но каждый view смотрит в уже освобождённую память. Это UB: запусти — увидишь мусор вместо строк или случайно верный текст."}, {"type": "code", "code": "#include <iostream>\n#include <string>\n#include <string_view>\n\nstd::string GetName() {\n    return \"a-long-name-that-does-not-fit-into-sso\";\n}\n\nstd::string_view Broken(const std::string& prefix) {\n    std::string local = prefix + \"_suffix_long_enough_for_heap\";\n    return local;                // view на локальную переменную\n}\n\nint main() {\n    // Всё ниже — UB. Вывод: мусор, пустота или «случайно верно».\n    std::string_view a = std::string(\"ab\") + \"c\";  // временный умер\n    std::string_view b = GetName();                // то же самое\n    std::string_view c = Broken(\"x\");\n    std::cout << a << '\\n' << b << '\\n' << c << '\\n';\n}\n"}, {"type": "code", "code": "#include <iostream>\n#include <string>\n#include <string_view>\n\nclass Request {\npublic:\n    // Плохо: хранит view на аргумент, который может быть временным.\n    explicit Request(std::string_view path) : path_(path) {}\n    std::string_view Path() const { return path_; }\n\nprivate:\n    std::string_view path_;\n};\n\nclass SafeRequest {\npublic:\n    explicit SafeRequest(std::string path) : path_(std::move(path)) {}\n\n    // Нормально: view живёт, пока жив объект.\n    std::string_view Path() const { return path_; }\n\nprivate:\n    std::string path_;\n};\n\nint main() {\n    Request bad(std::string(\"/api/v1/users/12345/profile\"));\n    SafeRequest good(std::string(\"/api/v1/users/12345/profile\"));\n    std::cout << bad.Path() << '\\n';   // UB: строка уже умерла\n    std::cout << good.Path() << '\\n';\n}\n"}, {"type": "p", "text": "На godbolt `bad` обычно печатает верный путь: освобождённую память ещё никто не перезаписал. Это всё равно UB — в другой сборке или под нагрузкой будет мусор. AddressSanitizer ловит такое сразу: heap-use-after-free."}, {"type": "warn", "text": "`span` и `string_view` на `vector`/`string` инвалидируются так же, как итераторы: после `push_back` с реаллокацией view смотрит в освобождённую память."}, {"type": "tip", "text": "Вслух: «параметр делаю `string_view` — принимает и литерал, и строку без копии. Хранить view в поле не буду: не контролирую время жизни владельца»."}]}, {"id": "modern-vocab", "title": "optional, variant, any, expected", "blocks": [{"type": "p", "text": "`std::optional<T>` (C++17) — значение или ничего. Без кучи: место под `T` внутри. Естественный тип возврата для «найти»."}, {"type": "list", "items": ["`has_value()` / `if (opt)` — есть ли значение.", "`*opt`, `opt->` — без проверки, UB на пустом.", "`opt.value()` — с проверкой, бросает `std::bad_optional_access`.", "`opt.value_or(def)` — значение или дефолт.", "C++23: `and_then`, `transform`, `or_else` — цепочки без вложенных if.", "`optional<T&>` запрещён (до C++26). Для «может быть ссылка» — `T*`."]}, {"type": "warn", "text": "`std::optional<bool>` и `std::optional<int*>` в `if (opt)` проверяют наличие, а не значение. `std::optional<bool> f = false; if (f)` — true."}, {"type": "p", "text": "`std::variant<Ts...>` — типобезопасный union. Хранит ровно один из типов. По умолчанию конструирует первый. Если первый не конструируется по умолчанию — ставь первым `std::monostate`."}, {"type": "code", "code": "#include <iostream>\n#include <string>\n#include <variant>\n\nstruct Card { std::string pan_last4; };\nstruct Sbp { std::string phone; };\nstruct Cash {};\n\nusing Payment = std::variant<Card, Sbp, Cash>;\n\ntemplate <class... Fs>\nstruct Overloaded : Fs... {\n    using Fs::operator()...;\n};\n// В C++17 ещё нужна подсказка вывода:\n// template <class... Fs> Overloaded(Fs...) -> Overloaded<Fs...>;\n\nstd::string Describe(const Payment& p) {\n    return std::visit(Overloaded{\n        [](const Card& c) { return \"card *\" + c.pan_last4; },\n        [](const Sbp& s) { return \"sbp \" + s.phone; },\n        [](const Cash&) { return std::string(\"cash\"); },\n    }, p);\n}\n\nint main() {\n    Payment p = Sbp{\"+7900\"};\n    std::cout << Describe(p) << '\\n';\n    std::cout << p.index() << '\\n';\n    if (const auto* card = std::get_if<Card>(&p)) {\n        std::cout << card->pan_last4 << '\\n';\n    }\n    try {\n        std::get<Card>(p);\n    } catch (const std::bad_variant_access&) {\n        std::cout << \"not a card\\n\";\n    }\n}\n", "expect": "sbp +7900\n1\nnot a card"}, {"type": "p", "text": "Плюс `std::visit`: компилятор проверит, что обработаны все типы — забытая ветка не скомпилируется. Это лучше, чем `switch` по `index()`."}, {"type": "p", "text": "`std::any` — любой копируемый тип, стирание типа, большие объекты в куче. Достать — `std::any_cast<T>`. В прикладном коде почти не нужен: обычно `variant` или интерфейс лучше."}, {"type": "p", "text": "`std::expected<T, E>` (C++23) — значение или ошибка. Ошибка — часть сигнатуры, вызывающий не может её не заметить."}, {"type": "code", "code": "#include <charconv>\n#include <cstdint>\n#include <expected>\n#include <print>\n#include <string_view>\n\nenum class ParseError { kEmpty, kNotNumber, kOutOfRange };\n\nstd::expected<std::int64_t, ParseError> ParseAmount(\n    std::string_view s) {\n    if (s.empty()) {\n        return std::unexpected(ParseError::kEmpty);\n    }\n    std::int64_t value = 0;\n    const char* end = s.data() + s.size();\n    auto [ptr, ec] = std::from_chars(s.data(), end, value);\n    if (ec == std::errc::result_out_of_range) {\n        return std::unexpected(ParseError::kOutOfRange);\n    }\n    if (ec != std::errc{} || ptr != end) {\n        return std::unexpected(ParseError::kNotNumber);\n    }\n    return value;\n}\n\nint main() {\n    for (std::string_view s : {\"1500\", \"\", \"12abc\",\n                               \"99999999999999999999\"}) {\n        auto amount = ParseAmount(s);\n        if (amount) {\n            std::println(\"ok {}\", *amount);\n        } else {\n            std::println(\"error {}\",\n                         static_cast<int>(amount.error()));\n        }\n    }\n    // Монадический стиль: копейки -> рубли или 0\n    auto rub = ParseAmount(\"12345\")\n                   .transform([](std::int64_t k) { return k / 100; })\n                   .value_or(0);\n    std::println(\"{}\", rub);\n}\n", "expect": "ok 1500\nerror 0\nerror 1\nerror 2\n123"}, {"type": "list", "items": ["Доступ к `expected` — как у `optional`, плюс ошибка:", "`*e` без проверки — UB, если внутри ошибка.", "`e.value()` при ошибке бросает `std::bad_expected_access<E>`.", "`e.error()` — ошибка; UB, если внутри значение.", "`and_then`, `transform`, `or_else`, `transform_error` — цепочки."]}, {"type": "p", "text": "Исключения или коды ошибок? Исключения бесплатны на happy path, но сам `throw` дорогой: микросекунды на раскрутку стека. Если ошибка ожидаема и частая (невалидный токен, нет пользователя, кривой ввод), на 1M RPS её лучше возвращать через `expected`. Исключения оставь для действительно исключительного: нехватка памяти, нарушенный инвариант, недоступная зависимость при старте."}, {"type": "tip", "text": "Вслух: «ошибка парсинга тут штатная, поэтому верну `std::expected`, а не брошу исключение. Вызывающий обязан обработать оба исхода, и это видно из сигнатуры»."}]}, {"id": "modern-syntax", "title": "Structured bindings, if с инициализатором, CTAD, if constexpr", "blocks": [{"type": "p", "text": "Structured bindings (C++17) раскладывают pair, tuple, массив или структуру с публичными полями. Важно: `auto [a, b] = x;` создаёт скрытую копию всего `x`, а `a` и `b` — имена её полей. Нужны ссылки — пиши `auto&` или `const auto&`."}, {"type": "code", "code": "#include <iostream>\n#include <map>\n#include <string>\n\nstruct Limits { int rps; int burst; };\n\nint main() {\n    std::map<std::string, int> m{{\"a\", 1}};\n    for (auto& [key, value] : m) {\n        value *= 10;              // меняет элемент map\n    }\n    for (auto [key, value] : m) {\n        value += 1;               // меняет копию\n    }\n    std::cout << m[\"a\"] << '\\n';\n\n    Limits lim{100, 20};\n    const auto& [rps, burst] = lim;\n    std::cout << rps + burst << '\\n';\n}\n", "expect": "10\n120"}, {"type": "p", "text": "`if`/`switch` с инициализатором (C++17) — переменная видна только внутри условия и веток. Меньше мусора в области видимости."}, {"type": "code", "code": "#include <iostream>\n#include <map>\n#include <mutex>\n#include <string>\n\nstd::mutex mu;\nstd::map<std::string, int> balances{{\"u1\", 50}};\n\nint Get(const std::string& id) {\n    if (std::lock_guard lock(mu);\n        balances.contains(id)) {\n        return balances.at(id);\n    }\n    return 0;\n}\n\nenum class Code { kOk, kNotFound, kDenied };\nstruct Reply { Code code; std::string body; };\n\nReply Fetch(int id) {\n    if (id == 1) {\n        return {Code::kOk, \"alice\"};\n    }\n    return {id == 2 ? Code::kDenied : Code::kNotFound, \"\"};\n}\n\nstd::string Handle(int id) {\n    switch (auto reply = Fetch(id); reply.code) {\n        case Code::kOk:\n            return reply.body;\n        case Code::kNotFound:\n            return \"not found\";\n        case Code::kDenied:\n            return \"denied\";\n    }\n    return \"unknown\";\n}\n\nint main() {\n    std::cout << Get(\"u1\") << ' ' << Get(\"u2\") << '\\n';\n    std::cout << Handle(1) << \", \" << Handle(2) << \", \"\n              << Handle(3) << '\\n';\n}\n", "expect": "50 0\nalice, denied, not found"}, {"type": "p", "text": "CTAD — вывод аргументов шаблона класса из конструктора (C++17). Удобно, но с сюрпризами:"}, {"type": "code", "code": "#include <array>\n#include <iostream>\n#include <mutex>\n#include <optional>\n#include <type_traits>\n#include <utility>\n#include <vector>\n\nint main() {\n    std::vector v{1, 2, 3};      // vector<int>\n    std::vector w{v};            // vector<int> — копия, не вложенный!\n    std::vector n(3, 7);         // vector<int>{7, 7, 7}\n    std::vector s{\"a\", \"b\"};     // vector<const char*>, не string\n    std::pair p{1, 2.5};         // pair<int, double>\n    std::optional o{42};         // optional<int>\n    std::array a{1, 2, 3};       // array<int, 3>\n\n    static_assert(std::is_same_v<decltype(w), std::vector<int>>);\n    static_assert(std::is_same_v<decltype(s),\n                                 std::vector<const char*>>);\n\n    std::mutex m;\n    std::lock_guard lock(m);     // lock_guard<std::mutex>\n\n    std::cout << w.size() << ' ' << n[2] << ' ' << s[1] << ' '\n              << p.second << ' ' << *o << ' ' << a.size() << '\\n';\n}\n", "expect": "3 7 b 2.5 42 3"}, {"type": "warn", "text": "`std::vector w{v}` — частый вопрос. Для одного аргумента того же шаблона правило копирования приоритетнее: получаем копию `vector<int>`, а не `vector<vector<int>>`."}, {"type": "p", "text": "`if constexpr` (C++17) — ветка выбирается на этапе компиляции. Отброшенная ветка в шаблоне не инстанцируется, поэтому может содержать код, невалидный для этого `T`."}, {"type": "code", "code": "#include <iostream>\n#include <string>\n#include <type_traits>\n\ntemplate <typename T>\nstd::string ToText(const T& value) {\n    if constexpr (std::is_same_v<T, std::string>) {\n        return value;\n    } else if constexpr (std::is_arithmetic_v<T>) {\n        return std::to_string(value);\n    } else {\n        return value.ToString();  // нужен только для прочих T\n    }\n}\n\nstruct Money {\n    long long kopecks;\n    std::string ToString() const {\n        return std::to_string(kopecks / 100) + \" rub\";\n    }\n};\n\nint main() {\n    std::cout << ToText(std::string(\"hi\")) << \" | \" << ToText(42)\n              << \" | \" << ToText(Money{1500}) << '\\n';\n    // ToText(nullptr);  // ошибка: у nullptr_t нет ToString()\n}\n", "expect": "hi | 42 | 15 rub"}, {"type": "p", "text": "Fold expressions (C++17) — свёртка пакета параметров одним выражением. Порядок скобок важен для неассоциативных операций."}, {"type": "code", "code": "#include <iostream>\n\ntemplate <typename... Ts>\nauto Sum(Ts... xs) {\n    return (xs + ... + 0);         // правая свёртка с init: 0 для ()\n}\n\ntemplate <typename... Ts>\nvoid PrintAll(const Ts&... xs) {\n    ((std::cout << xs << ' '), ...);  // свёртка по запятой\n    std::cout << '\\n';\n}\n\ntemplate <typename... Ts>\nauto LeftSub(Ts... xs) { return (... - xs); }   // ((a - b) - c)\n\ntemplate <typename... Ts>\nauto RightSub(Ts... xs) { return (xs - ...); }  // (a - (b - c))\n\nint main() {\n    std::cout << Sum() << ' ' << Sum(1, 2, 3) << '\\n';\n    PrintAll(1, \"two\", 3.5);\n    std::cout << LeftSub(10, 3, 2) << ' '\n              << RightSub(10, 3, 2) << '\\n';\n}\n", "expect": "0 6\n1 two 3.5\n5 9"}, {"type": "tip", "text": "Вслух: «`const auto& [key, value]` — чтобы не копировать элементы. Итератор объявлю в `if` с инициализатором, чтобы он не жил дольше проверки»."}]}, {"id": "modern-lambda", "title": "Лямбды: захваты и ловушки", "blocks": [{"type": "p", "text": "Лямбда — объект безымянного класса с `operator()`. Захваченные переменные — его поля. Тип у каждой лямбды уникален, хранить — в `auto` или шаблонном параметре. `std::function` стирает тип, может аллоцировать и вызывает через косвенность: в горячем пути лучше шаблон."}, {"type": "list", "items": ["`[x]` — копия на момент создания лямбды.", "`[&x]` — ссылка. Лямбда не должна пережить `x`.", "`[=]`, `[&]` — захват всего используемого по умолчанию. В ревью лучше явный список.", "`[this]` — копия указателя, не объекта. Неявный захват `this` через `[=]` устарел в C++20.", "`[*this]` (C++17) — копия всего объекта.", "`[p = std::move(ptr)]`, `[&r = x]`, `[n = v.size()]` — init-capture (C++14): любое выражение, можно move-only типы.", "Глобальные и `static` переменные не захватываются — к ним обращаются напрямую."]}, {"type": "code", "code": "#include <iostream>\n\nint main() {\n    int x = 1;\n    int y = 1;\n    auto f = [x, &y] { return x * 10 + y; };\n    x = 2;\n    y = 2;\n    std::cout << f() << '\\n';   // x скопирован, y по ссылке\n\n    int calls = 0;\n    auto counter = [calls]() mutable { return ++calls; };\n    counter();\n    auto copy = counter;        // копирует и состояние\n    std::cout << counter() << ' ' << copy() << ' ' << calls << '\\n';\n}\n", "expect": "12\n2 2 0"}, {"type": "p", "text": "`mutable` разрешает менять захваченные копии: по умолчанию `operator()` у лямбды — `const`. Оригинальная переменная не меняется."}, {"type": "p", "text": "Generic лямбды (C++14) — `auto` в параметрах, это шаблонный `operator()`. Шаблонные лямбды (C++20) — когда нужен сам тип."}, {"type": "code", "code": "#include <algorithm>\n#include <iostream>\n#include <string>\n#include <vector>\n\nstruct User { std::string name; int age; };\n\nint main() {\n    std::vector<User> users{{\"ann\", 31}, {\"bob\", 17}, {\"cid\", 25}};\n    std::sort(users.begin(), users.end(),\n              [](const auto& a, const auto& b) {\n                  return a.age < b.age;\n              });\n    for (const auto& u : users) {\n        std::cout << u.name << ' ';\n    }\n    std::cout << '\\n';\n\n    auto first_or = []<typename T>(const std::vector<T>& v,\n                                   const T& fallback) {\n        return v.empty() ? fallback : v.front();\n    };\n    std::cout << first_or(std::vector<int>{}, -1) << ' '\n              << first_or(std::vector<int>{5}, -1) << '\\n';\n\n    int min_age = 18;\n    auto adults = std::count_if(users.begin(), users.end(),\n        [min_age](const User& u) { return u.age >= min_age; });\n    std::cout << adults << '\\n';\n}\n", "expect": "bob cid ann\n-1 5\n2"}, {"type": "p", "text": "Immediately invoked lambda — инициализация `const` переменной сложной логикой. Нет «объявить, потом присвоить в if»."}, {"type": "code", "code": "#include <cstdlib>\n#include <iostream>\n#include <string>\n\nstd::string Env(const char* name) {\n    const char* value = std::getenv(name);\n    return value != nullptr ? value : \"\";\n}\n\nint Configure(bool is_prod) {\n    const int timeout_ms = [&] {\n        if (is_prod) {\n            return 50;\n        }\n        auto custom = Env(\"TIMEOUT_MS\");\n        return custom.empty() ? 1000 : std::stoi(custom);\n    }();\n    return timeout_ms;\n}\n\nint main() {\n    std::cout << Configure(true) << ' ' << Configure(false) << '\\n';\n}\n", "expect": "50 1000"}, {"type": "warn", "text": "Висячие захваты. Лямбда со ссылкой на локальную переменную, возвращённая из функции или отданная в другой поток/очередь, — UB. Тоже касается `[this]` в асинхронном колбэке: объект могут удалить раньше, чем колбэк выполнится."}, {"type": "code", "code": "#include <functional>\n#include <iostream>\n#include <memory>\n\nstd::function<int()> MakeCounterBroken() {\n    int count = 0;\n    return [&count] { return ++count; };  // UB при вызове\n}\n\nstd::function<int()> MakeCounter() {\n    return [count = 0]() mutable { return ++count; };  // ок\n}\n\nclass Handler : public std::enable_shared_from_this<Handler> {\npublic:\n    std::function<void()> Callback() {\n        // weak: не продлеваем жизнь, но и не трогаем мёртвый объект\n        return [weak = weak_from_this()] {\n            if (auto self = weak.lock()) {\n                self->Done();\n            } else {\n                std::cout << \"gone\\n\";\n            }\n        };\n    }\n\nprivate:\n    void Done() { std::cout << \"done\\n\"; }\n};\n\nint main() {\n    auto counter = MakeCounter();\n    counter();\n    std::cout << counter() << '\\n';\n    // MakeCounterBroken() не вызываем: UB, может и упасть\n\n    auto handler = std::make_shared<Handler>();\n    auto cb = handler->Callback();\n    cb();\n    handler.reset();  // объект удалён раньше колбэка\n    cb();\n}\n", "expect": "2\ndone\ngone"}, {"type": "p", "text": "Рекурсивная лямбда. В C++23 есть deducing this: первый параметр `this auto self`. До C++23 — `std::function` или передать себя параметром."}, {"type": "code", "code": "#include <iostream>\n\nint main() {\n    auto fib = [](this auto self, int n) -> long long {\n        return n < 2 ? n : self(n - 1) + self(n - 2);\n    };\n    std::cout << fib(20) << '\\n';\n\n    // До C++23:\n    auto fib17 = [](auto& self, int n) -> long long {\n        return n < 2 ? n : self(self, n - 1) + self(self, n - 2);\n    };\n    std::cout << fib17(fib17, 20) << '\\n';\n}\n", "expect": "6765\n6765"}, {"type": "warn", "text": "Лямбда без захвата приводится к указателю на функцию — её можно отдать в C API. С захватом — нельзя."}, {"type": "tip", "text": "Вслух: «захватываю явно и по значению, потому что лямбда уйдёт в другой поток. Объект держу через `weak_ptr`, чтобы колбэк не обратился к удалённому»."}]}, {"id": "modern-algo", "title": "Алгоритмы STL и их сложность", "blocks": [{"type": "list", "items": ["`sort` — O(n log n), нестабильный (introsort). Нужен random access: для `list` — метод `list::sort`.", "`stable_sort` — O(n log n) с доп. памятью, иначе O(n log² n). Сохраняет порядок равных.", "`partial_sort(b, m, e)` — первые k = m − b отсортированы, O(n log k).", "`nth_element(b, nth, e)` — в среднем O(n): на месте `nth` окажется нужный элемент, слева не больше, справа не меньше.", "`lower_bound`/`upper_bound`/`equal_range`/`binary_search` — O(log n) сравнений на отсортированном диапазоне.", "`find`, `find_if`, `count_if`, `any_of`/`all_of`/`none_of`, `transform`, `accumulate` — O(n).", "`unique` — убирает только соседние дубли, O(n). Перед ним `sort`.", "`remove_if`/`unique` не удаляют, а возвращают новый логический конец. Дальше `erase`."]}, {"type": "warn", "text": "Компаратор обязан задавать strict weak ordering: `comp(a, a)` всегда `false`, транзитивность, транзитивность эквивалентности. `[](int a, int b) { return a <= b; }` нарушает это — UB в `sort`. На реальных реализациях бывает выход за границы массива и падение."}, {"type": "code", "code": "#include <algorithm>\n#include <iostream>\n#include <string>\n#include <tuple>\n#include <vector>\n\nstruct Tx {\n    std::string account;\n    long long amount;\n    int ts;\n};\n\nvoid SortTxs(std::vector<Tx>& txs) {\n    // По счёту, затем по убыванию суммы, затем по времени.\n    std::sort(txs.begin(), txs.end(),\n              [](const Tx& a, const Tx& b) {\n                  return std::tie(a.account, b.amount, a.ts) <\n                         std::tie(b.account, a.amount, b.ts);\n              });\n}\n\nint main() {\n    std::vector<Tx> txs{\n        {\"b\", 100, 1}, {\"a\", 50, 2}, {\"a\", 200, 3}, {\"a\", 50, 1}};\n    SortTxs(txs);\n    for (const auto& t : txs) {\n        std::cout << t.account << ' ' << t.amount << ' '\n                  << t.ts << '\\n';\n    }\n}\n", "expect": "a 200 3\na 50 1\na 50 2\nb 100 1"}, {"type": "p", "text": "Трюк с `std::tie`: лексикографическое сравнение кортежей ссылок без копий. Поменять `a` и `b` местами в одном поле — убывание по нему."}, {"type": "code", "code": "#include <algorithm>\n#include <functional>\n#include <iostream>\n#include <numeric>\n#include <vector>\n\nint main() {\n    std::vector<int> v{5, 1, 2, 2, 9, 2, 7};\n    std::sort(v.begin(), v.end());              // 1 2 2 2 5 7 9\n\n    auto lo = std::lower_bound(v.begin(), v.end(), 2);  // первый >= 2\n    auto hi = std::upper_bound(v.begin(), v.end(), 2);  // первый > 2\n    std::cout << lo - v.begin() << ' ' << hi - lo << '\\n';\n\n    v.erase(std::unique(v.begin(), v.end()), v.end());\n    for (int x : v) {\n        std::cout << x << ' ';\n    }\n    std::cout << '\\n';\n\n    std::vector<int> scores{40, 10, 90, 70, 20, 60};\n    std::nth_element(scores.begin(), scores.begin() + 2,\n                     scores.end(), std::greater<>{});\n    std::sort(scores.begin(), scores.begin() + 3,\n              std::greater<>{});                // top-3\n    std::cout << scores[0] << ' ' << scores[1] << ' '\n              << scores[2] << '\\n';\n\n    std::vector<double> prices{0.5, 0.5, 0.5};\n    auto wrong = std::accumulate(prices.begin(), prices.end(), 0);\n    auto right = std::accumulate(prices.begin(), prices.end(), 0.0);\n    std::cout << wrong << ' ' << right << '\\n';\n\n    bool all = std::all_of(v.end(), v.end(),\n                           [](int x) { return x > 100; });\n    std::cout << all << '\\n';                    // пустой диапазон\n}\n", "expect": "1 3\n1 2 5 7 9\n90 70 60\n0 1.5\n1"}, {"type": "warn", "text": "Тип результата `accumulate` — тип начального значения. `accumulate(..., 0)` над `double` считает в `int` и молча отбрасывает дробную часть на каждом шаге. Для сумм денег в `int64_t` — `std::int64_t{0}`, иначе переполнение `int`."}, {"type": "warn", "text": "`std::lower_bound` на итераторах `std::set`/`std::map` делает O(log n) сравнений, но O(n) шагов итератора: они не random access. Используй метод `s.lower_bound(x)` — честный O(log n). То же с `std::find` против `s.find`."}, {"type": "list", "items": ["Ещё полезное:", "`std::reduce` (C++17) — как `accumulate`, но может менять порядок и работать параллельно с execution policy. Для float результат может отличаться.", "`std::transform_reduce` — map + reduce за один проход.", "`std::min_element`, `max_element`, `minmax_element` — итератор, не значение.", "`std::clamp(x, lo, hi)`, `std::iota` — заполнить 0, 1, 2…", "`std::partition`, `std::stable_partition` — разделить по условию.", "Top-k потоком — `std::priority_queue` размера k: O(n log k) и O(k) памяти."]}, {"type": "tip", "text": "Вслух при выборе: «нужен top-10 из миллиона — `nth_element` за O(n) и сортировка десяти. Полная сортировка — лишние O(n log n)»."}]}, {"id": "modern-ranges", "title": "Ranges (C++20): алгоритмы, views, ленивость", "blocks": [{"type": "p", "text": "Две части. Первая — range-алгоритмы в `std::ranges::`: принимают контейнер целиком, ограничены концептами (понятные ошибки) и умеют проекции. Вторая — views: ленивые невладеющие представления, которые склеиваются через `|`."}, {"type": "code", "code": "#include <algorithm>\n#include <iostream>\n#include <string>\n#include <vector>\n\nstruct User {\n    std::string name;\n    int age = 0;\n    bool active = false;\n};\n\nint main() {\n    std::vector<User> users{\n        {\"ann\", 31, true}, {\"bob\", 25, false}, {\"cid\", 19, true}};\n\n    // Проекция: сортируем по полю, компаратор по умолчанию (<).\n    std::ranges::sort(users, {}, &User::age);\n    // По убыванию: компаратор std::greater{}, та же проекция.\n    std::ranges::sort(users, std::greater{}, &User::age);\n\n    auto oldest = std::ranges::max_element(users, {}, &User::age);\n    auto bob = std::ranges::find(users, \"bob\", &User::name);\n    std::cout << oldest->name << ' ' << bob->age << '\\n';\n\n    bool any_minor = std::ranges::any_of(\n        users, [](int age) { return age < 18; }, &User::age);\n    std::cout << any_minor << '\\n';\n}\n", "expect": "ann 25\n0"}, {"type": "p", "text": "Views. Ничего не вычисляют при создании. Работа происходит при обходе: каждый элемент протягивается через всю цепочку. Создание и копирование view — O(1)."}, {"type": "code", "code": "#include <iostream>\n#include <map>\n#include <ranges>\n#include <string>\n#include <string_view>\n#include <vector>\n\nint main() {\n    namespace views = std::views;\n    std::vector<int> v{1, 2, 3, 4, 5, 6, 7, 8};\n\n    auto evens_squared = v\n        | views::filter([](int x) { return x % 2 == 0; })\n        | views::transform([](int x) { return x * x; });\n    for (int x : evens_squared) {\n        std::cout << x << ' ';\n    }\n    std::cout << '\\n';\n\n    for (int i : views::iota(0, 10) | views::reverse\n                     | views::drop(1) | views::take(3)) {\n        std::cout << i << ' ';\n    }\n    std::cout << '\\n';\n\n    std::map<std::string, int> stock{{\"apple\", 3}, {\"pear\", 0}};\n    for (const auto& name : stock | views::keys) {\n        std::cout << name << ' ';\n    }\n    std::cout << '\\n';\n\n    std::string_view csv = \"id,amount,currency\";\n    for (auto part : csv | views::split(',')) {\n        std::string_view field(part.begin(), part.end());\n        std::cout << '[' << field << ']';\n    }\n    std::cout << '\\n';\n\n    // C++23: собрать view в контейнер\n    auto big = v | views::filter([](int x) { return x > 5; })\n                 | std::ranges::to<std::vector>();\n    std::cout << big.size() << '\\n';\n}\n", "expect": "4 16 36 64\n8 7 6\napple pear\n[id][amount][currency]\n3"}, {"type": "p", "text": "До C++23 `ranges::to` нет. Собрать вручную: `std::vector<int> out; std::ranges::copy(view, std::back_inserter(out));`."}, {"type": "p", "text": "Ленивость имеет цену: функция в `transform` вызывается при каждом разыменовании. Если после `transform` стоит `filter`, функция зовётся дважды для прошедших фильтр элементов."}, {"type": "code", "code": "#include <iostream>\n#include <ranges>\n#include <vector>\n\nint main() {\n    int calls = 0;\n    auto square = [&calls](int x) { ++calls; return x * x; };\n    std::vector<int> v{1, 2, 3, 4, 5, 6};\n\n    auto r = v | std::views::transform(square)\n               | std::views::filter([](int x) { return x % 2 == 0; });\n    std::cout << calls << '\\n';         // ничего не посчитано\n\n    for (int x : r) {\n        std::cout << x << ' ';\n    }\n    // 6 вызовов в фильтре + ещё 3 при *it для прошедших\n    std::cout << '\\n' << calls << '\\n';\n}\n", "expect": "0\n4 16 36\n9"}, {"type": "list", "items": ["Подводные камни views:", "`filter_view` кэширует `begin()`, поэтому не обходится через `const&`. Функция `void Print(const auto& r)` с filter внутри не скомпилируется — принимай `auto&&` или по значению.", "Если через filter-view поменять элемент так, что предикат станет ложным, — UB.", "View не владеет данными (кроме `owning_view` из rvalue-контейнера). View на локальный вектор, возвращённый из функции, висит.", "`views::iota(0, v.size())` не скомпилируется: `int` и `size_t` разной знаковости. Пиши `iota(0uz, v.size())` (C++23) или `iota(std::size_t{0}, v.size())`."]}, {"type": "p", "text": "Защита от висячих итераторов. Если range-алгоритм получил временный контейнер, вместо итератора он вернёт `std::ranges::dangling`. Разыменовать его нельзя — ошибка компиляции, а не UB."}, {"type": "code", "code": "#include <algorithm>\n#include <iostream>\n#include <vector>\n\nstd::vector<int> LoadIds() { return {7, 42, 9}; }\n\nint FindFirstBig() {\n    // auto it = std::ranges::find(LoadIds(), 42);\n    // return *it;  // ошибка: it имеет тип std::ranges::dangling\n\n    auto ids = LoadIds();                 // продлили жизнь\n    auto it = std::ranges::find(ids, 42);\n    return it == ids.end() ? -1 : *it;\n}\n\nint main() {\n    std::cout << FindFirstBig() << '\\n';\n}\n", "expect": "42"}, {"type": "warn", "text": "В горячем пути (5 мс p99) ranges не всегда бесплатны: в debug-сборке они в разы медленнее цикла, в release обычно равны, но `filter` + `reverse` или повторный обход пересчитывают функции. Компиляция тоже медленнее. Простой цикл с `reserve` — нормальный выбор, если он понятнее."}, {"type": "tip", "text": "Вслух: «range-алгоритм с проекцией: `std::ranges::sort(users, {}, &User::age)` — без лямбды-компаратора. View тут ленивый, один проход, без промежуточного вектора»."}]}, {"id": "modern-concepts", "title": "Concepts и requires", "blocks": [{"type": "p", "text": "Concept — именованный предикат над типами, проверяется при компиляции. Ограничивает шаблон и даёт ошибку «тип не удовлетворяет `std::integral`» вместо трёх экранов инстанцирования."}, {"type": "code", "code": "#include <concepts>\n#include <cstddef>\n#include <cstdint>\n#include <functional>\n#include <iostream>\n#include <ranges>\n#include <string>\n#include <utility>\n\n// 1. Концепт вместо typename\ntemplate <std::integral T>\nT Gcd(T a, T b) {\n    while (b != 0) {\n        a = std::exchange(b, a % b);\n    }\n    return a;\n}\n\n// 2. requires-clause\ntemplate <typename T>\n    requires std::floating_point<T>\nT Half(T x) {\n    return x / 2;\n}\n\n// 3. Сокращённый синтаксис\nvoid PrintAll(const std::ranges::range auto& items) {\n    for (const auto& item : items) {\n        std::cout << item << ' ';\n    }\n    std::cout << '\\n';\n}\n\n// 4. Свой концепт через requires-выражение\ntemplate <typename T>\nconcept Hashable = requires(const T& x) {\n    { std::hash<T>{}(x) } -> std::convertible_to<std::size_t>;\n};\n\ntemplate <typename T>\nconcept HasId = requires(const T& x) {\n    { x.Id() } -> std::same_as<std::int64_t>;\n};\n\nstruct Order {\n    std::int64_t Id() const { return 7; }\n};\n\ntemplate <HasId T>\nstd::string Key(const T& x) {\n    return \"id:\" + std::to_string(x.Id());\n}\n\nint main() {\n    std::cout << Gcd(12, 18) << ' ' << Half(3.0) << '\\n';\n    PrintAll(std::string(\"abc\"));\n    static_assert(Hashable<std::string>);\n    std::cout << Key(Order{}) << '\\n';\n    // Gcd(1.5, 2.5);  // ошибка: double не std::integral\n}\n", "expect": "6 1.5\na b c\nid:7"}, {"type": "p", "text": "Нарушение концепта — ошибка компиляции в точке вызова. Пример ниже не собирается намеренно: запусти и прочитай, какое ограничение не выполнено."}, {"type": "code", "code": "#include <concepts>\n#include <utility>\n\ntemplate <std::integral T>\nT Gcd(T a, T b) {\n    while (b != 0) {\n        a = std::exchange(b, a % b);\n    }\n    return a;\n}\n\nint main() {\n    return Gcd(1.5, 2.5);  // не скомпилируется: double не integral\n}\n"}, {"type": "list", "items": ["Стандартные концепты, которые стоит помнить:", "Типы: `std::integral`, `std::signed_integral`, `std::floating_point`, `std::same_as`, `std::convertible_to`, `std::derived_from`.", "Операции: `std::equality_comparable`, `std::totally_ordered`, `std::copyable`, `std::movable`, `std::regular`.", "Вызовы: `std::invocable<F, Args...>`, `std::predicate<F, T>`.", "Диапазоны: `std::ranges::range`, `sized_range`, `random_access_range`, `contiguous_range`."]}, {"type": "p", "text": "Перегрузка по ограничениям: если один концепт включает другой (subsumption), выбирается более строгий."}, {"type": "code", "code": "#include <concepts>\n#include <iostream>\n\ntemplate <std::integral T>\nconst char* Kind(T) { return \"integral\"; }\n\ntemplate <std::signed_integral T>   // = integral && signed\nconst char* Kind(T) { return \"signed\"; }\n\nint main() {\n    std::cout << Kind(5) << ' ' << Kind(5u) << '\\n';\n}\n", "expect": "signed integral"}, {"type": "warn", "text": "Subsumption работает только для именованных концептов, соединённых через `&&`. Два разных `requires` с одинаковым текстом выражения компилятор не считает связанными — получишь неоднозначность."}, {"type": "p", "text": "Было — SFINAE. Тот же `Gcd` до C++20:"}, {"type": "code", "code": "#include <iostream>\n#include <type_traits>\n#include <utility>\n\ntemplate <typename T,\n          std::enable_if_t<std::is_integral_v<T>, int> = 0>\nT GcdOld(T a, T b) {\n    while (b != 0) {\n        a = std::exchange(b, a % b);\n    }\n    return a;\n}\n\nint main() {\n    std::cout << GcdOld(12, 18) << '\\n';\n    // GcdOld(1.5, 2.5);  // ошибка, но текст — про enable_if\n}\n", "expect": "6"}, {"type": "p", "text": "`requires` внутри `if constexpr` — удобная проверка «есть ли метод» в обобщённом коде:"}, {"type": "code", "code": "#include <cstddef>\n#include <iostream>\n#include <list>\n#include <vector>\n\ntemplate <typename Container>\nvoid Prepare(Container& c, std::size_t n) {\n    if constexpr (requires { c.reserve(n); }) {\n        c.reserve(n);   // vector, string, unordered_map\n    }                   // list, map — просто пропускаем\n}\n\nint main() {\n    std::vector<int> v;\n    std::list<int> l;\n    Prepare(v, 100);\n    Prepare(l, 100);    // компилируется: ветка отброшена\n    std::cout << v.capacity() << ' ' << l.size() << '\\n';\n}\n", "expect": "100 0"}, {"type": "warn", "text": "Requires-выражение проверяет только, что выражение компилируется, а не его значение. `requires(T t) { t.size() > 0; }` истинно для любого типа с `size()`. Проверка значения — вложенное требование: `requires (sizeof(T) <= 16);`."}, {"type": "tip", "text": "Вслух: «шаблон ограничу концептом — сразу видно, что функция ждёт целое число, и ошибка у вызывающего будет читаемой»."}]}, {"id": "modern-misc", "title": "<=>, designated init, format, constexpr и атрибуты", "blocks": [{"type": "p", "text": "`operator<=>` (C++20). `= default` сравнивает поля по порядку объявления, лексикографически. Defaulted `<=>` неявно добавляет и `operator==`. `a != b` компилятор переписывает в `!(a == b)`, `a < b` — в `(a <=> b) < 0`."}, {"type": "code", "code": "#include <compare>\n#include <cstdint>\n#include <iostream>\n#include <set>\n#include <string>\n\nstruct Version {\n    int major = 0;\n    int minor = 0;\n    int patch = 0;\n    auto operator<=>(const Version&) const = default;\n};\n\nstruct Client {\n    std::int64_t id = 0;\n    std::string cached_name;  // в сравнении не участвует\n\n    std::strong_ordering operator<=>(const Client& o) const {\n        return id <=> o.id;\n    }\n    bool operator==(const Client& o) const {  // сам не появится\n        return id == o.id;\n    }\n};\n\nint main() {\n    Version a{1, 2, 3};\n    Version b{1, 10, 0};\n    std::cout << (a < b) << (a == b) << (a != b) << '\\n';\n\n    std::set<Client> clients{{2, \"x\"}, {1, \"y\"}};\n    std::cout << clients.begin()->id << '\\n';\n    std::cout << (Client{1, \"a\"} == Client{1, \"b\"}) << '\\n';\n}\n", "expect": "101\n1\n1"}, {"type": "warn", "text": "Если `<=>` написан руками (не `= default`), `==` не генерируется. `a == b` не скомпилируется, пока не напишешь `==` сам. Причина: равенство часто можно проверить быстрее (сначала длина)."}, {"type": "list", "items": ["Категории результата:", "`std::strong_ordering` — равные неразличимы (int, строки).", "`std::weak_ordering` — равные различимы (регистронезависимое сравнение).", "`std::partial_ordering` — бывают несравнимые: `double` с NaN."]}, {"type": "p", "text": "Designated initializers (C++20) — именованные поля в агрегатной инициализации. Порядок обязан совпадать с порядком объявления. Пропущенные поля берут инициализатор по умолчанию."}, {"type": "code", "code": "#include <iostream>\n\nstruct RetryPolicy {\n    int max_attempts = 3;\n    int base_delay_ms = 10;\n    bool jitter = true;\n};\n\nRetryPolicy Aggressive() {\n    return {.max_attempts = 5, .jitter = false};\n}\n// RetryPolicy{.jitter = false, .max_attempts = 5}  — ошибка порядка\n// RetryPolicy{5, .jitter = false}  — нельзя смешивать с позиционными\n\nint main() {\n    auto p = Aggressive();\n    std::cout << p.max_attempts << ' ' << p.base_delay_ms << ' '\n              << p.jitter << '\\n';\n}\n", "expect": "5 10 0"}, {"type": "p", "text": "`std::format` (C++20) — типобезопасное форматирование в стиле Python. Строка формата проверяется при компиляции. `std::print`/`std::println` (C++23) пишут сразу в stdout."}, {"type": "code", "code": "#include <format>\n#include <iostream>\n#include <print>\n#include <string>\n\nstruct Version { int major, minor, patch; };\n\ntemplate <>\nstruct std::formatter<Version> {\n    constexpr auto parse(std::format_parse_context& ctx) {\n        return ctx.begin();\n    }\n    auto format(const Version& v, std::format_context& ctx) const {\n        return std::format_to(ctx.out(), \"{}.{}.{}\",\n                              v.major, v.minor, v.patch);\n    }\n};\n\nint main() {\n    std::string s = std::format(\"{:>6}|{:<4}|{:08.3f}|{:#x}\",\n                                \"id\", 42, 3.14159, 255);\n    std::cout << s << '\\n';\n    std::println(\"v{} {}\", Version{1, 2, 3}, \"ok\");\n    // std::format(\"{:d}\", \"text\");  // ошибка компиляции\n}\n", "expect": "    id|42  |0003.142|0xff\nv1.2.3 ok"}, {"type": "warn", "text": "Строка формата должна быть константой. Формат из конфига — через `std::vformat(fmt, std::make_format_args(args...))`, и ошибка тогда — исключение `std::format_error` во время выполнения."}, {"type": "list", "items": ["Семейство constexpr:", "`constexpr` функция — может выполниться при компиляции, если аргументы константы, иначе в runtime.", "`consteval` (C++20) — только при компиляции. Вызов с runtime-аргументом — ошибка.", "`constinit` (C++20) — переменная со статическим временем жизни инициализируется при компиляции. Сама не `const`. Спасает от static initialization order fiasco.", "`if consteval` (C++23) — ветка для compile-time вычисления."]}, {"type": "code", "code": "#include <iostream>\n\nconstexpr int Square(int x) { return x * x; }\nconsteval int Kib(int n) { return n * 1024; }\n\nconstexpr int kBufferSize = Kib(4);      // при компиляции\nconstinit int g_requests = Square(3);    // 9, но можно менять\nstatic_assert(Square(3) == 9);\n\nint Runtime(int n) {\n    g_requests += 1;\n    return Square(n);       // ок: обычный вызов\n    // return Kib(n);       // ошибка: n не константа\n}\n\nint main() {\n    std::cout << kBufferSize << ' ' << Runtime(5) << ' '\n              << g_requests << '\\n';\n}\n", "expect": "4096 25 10"}, {"type": "list", "items": ["Атрибуты, которые стоит ставить:", "`[[nodiscard]]` — на функции, чей результат нельзя игнорировать: коды ошибок, `TryLock`, фабрики. C++20: с причиной `[[nodiscard(\"check error\")]]`. Игнор — предупреждение.", "`[[maybe_unused]]` — переменная только для `assert`.", "`[[fallthrough]]` — намеренный проход в следующий `case`.", "`[[likely]]`/`[[unlikely]]` (C++20) — подсказка о частой ветке. Ставь только по данным профилировщика.", "`[[no_unique_address]]` (C++20) — пустой член не занимает места.", "`[[deprecated(\"use Foo\")]]` — пометить старый API."]}, {"type": "code", "code": "#include <cstdint>\n#include <iostream>\n\nenum class Status { kOk, kRetry, kFatal };\n\n[[nodiscard]] Status Charge(std::int64_t kopecks) {\n    return kopecks > 0 ? Status::kOk : Status::kFatal;\n}\n\nint Handle(std::int64_t amount) {\n    Status st = Charge(amount);\n    switch (st) {\n        case Status::kRetry:\n            [[fallthrough]];\n        case Status::kFatal:\n            return 1;\n        case Status::kOk:\n            break;\n    }\n    if (amount > 1'000'000) [[unlikely]] {\n        return 2;\n    }\n    return 0;\n}\n\nint main() {\n    Charge(100);  // предупреждение компилятора: результат выброшен\n    std::cout << Handle(100) << ' ' << Handle(2'000'000) << ' '\n              << Handle(-1) << '\\n';\n}\n", "expect": "0 2 1"}]}, {"id": "modern-review1", "title": "Код-ревью, часть 1: копии, строки, map, erase", "blocks": [{"type": "p", "text": "Формат секции: дают фрагмент, просят найти проблемы, улучшить, потом добавляют условия. Ниже типичные фрагменты. Сначала попробуй найти всё сам, потом смотри разбор."}, {"type": "p", "text": "Фрагмент 1. Подсчёт активных пользователей."}, {"type": "code", "code": "#include <iostream>\n#include <string>\n#include <vector>\n\nclass User {\npublic:\n    User(std::string name, bool active)\n        : name_(std::move(name)), active_(active) {}\n    bool IsActive() const { return active_; }\n\nprivate:\n    std::string name_;\n    bool active_ = false;\n};\n\nint CountActive(std::vector<User> users) {\n    int count = 0;\n    for (int i = 0; i < users.size(); i++) {\n        if (users[i].IsActive() == true) {\n            count++;\n        }\n    }\n    return count;\n}\n\nint main() {\n    std::vector<User> users{{\"ann\", true}, {\"bob\", false},\n                            {\"cid\", true}};\n    std::cout << CountActive(users) << '\\n';\n}\n", "expect": "2"}, {"type": "list", "items": ["Вектор передаётся по значению: копия всех пользователей со строками на каждый вызов.", "`int i < users.size()` — сравнение знакового с беззнаковым, предупреждение и потенциальное переполнение `int`.", "`== true` — шум.", "Ручной цикл вместо алгоритма — намерение читается хуже."]}, {"type": "code", "code": "#include <algorithm>\n#include <cstddef>\n#include <iostream>\n#include <span>\n#include <string>\n#include <vector>\n\nclass User {\npublic:\n    User(std::string name, bool active)\n        : name_(std::move(name)), active_(active) {}\n    bool IsActive() const { return active_; }\n\nprivate:\n    std::string name_;\n    bool active_ = false;\n};\n\nstd::ptrdiff_t CountActive(std::span<const User> users) {\n    return std::ranges::count_if(users, &User::IsActive);\n}\n\nint main() {\n    std::vector<User> users{{\"ann\", true}, {\"bob\", false},\n                            {\"cid\", true}};\n    std::cout << CountActive(users) << '\\n';\n}\n", "expect": "2"}, {"type": "p", "text": "Фрагмент 2. Склейка строк."}, {"type": "code", "code": "#include <iostream>\n#include <string>\n#include <vector>\n\nstd::string Join(std::vector<std::string> parts, std::string sep) {\n    std::string result;\n    for (int i = 0; i < parts.size(); ++i) {\n        result = result + parts[i];\n        if (i + 1 < parts.size()) {\n            result = result + sep;\n        }\n    }\n    return result;\n}\n\nint main() {\n    std::cout << '[' << Join({\"a\", \"b\", \"c\"}, \", \") << \"]\\n\";\n    std::cout << '[' << Join({}, \", \") << \"]\\n\";\n}\n", "expect": "[a, b, c]\n[]"}, {"type": "list", "items": ["Оба параметра копируются.", "`result = result + x` создаёт новую строку и копирует всё накопленное: O(L²) по суммарной длине. Нужен `+=`.", "Нет `reserve`: итоговая длина известна заранее."]}, {"type": "code", "code": "#include <cstddef>\n#include <iostream>\n#include <span>\n#include <string>\n#include <string_view>\n#include <vector>\n\nstd::string Join(std::span<const std::string> parts,\n                 std::string_view sep) {\n    if (parts.empty()) {\n        return {};\n    }\n    std::size_t total = sep.size() * (parts.size() - 1);\n    for (const auto& part : parts) {\n        total += part.size();\n    }\n    std::string result;\n    result.reserve(total);\n    result += parts.front();\n    for (const auto& part : parts.subspan(1)) {\n        result += sep;\n        result += part;\n    }\n    return result;\n}\n\nint main() {\n    std::vector<std::string> parts{\"a\", \"b\", \"c\"};\n    std::cout << '[' << Join(parts, \", \") << \"]\\n\";\n    std::cout << '[' << Join({}, \", \") << \"]\\n\";\n}\n", "expect": "[a, b, c]\n[]"}, {"type": "p", "text": "Фрагмент 3. Проверка блокировки пользователя, 1M RPS."}, {"type": "code", "code": "#include <cstddef>\n#include <iostream>\n#include <string>\n#include <unordered_map>\n\nclass BanList {\npublic:\n    bool IsBanned(const std::string& user) {\n        return banned_[user];\n    }\n    void Ban(const std::string& user) { banned_[user] = true; }\n    std::size_t Size() const { return banned_.size(); }\n\nprivate:\n    std::unordered_map<std::string, bool> banned_;\n};\n\nint main() {\n    BanList list;\n    list.Ban(\"eve\");\n    for (int i = 0; i < 1000; ++i) {  // обычный трафик\n        list.IsBanned(\"user\" + std::to_string(i));\n    }\n    std::cout << list.IsBanned(\"eve\") << ' ' << list.Size() << '\\n';\n}\n", "expect": "1 1001"}, {"type": "list", "items": ["`operator[]` вставляет `false` для каждого нового пользователя. Память растёт от любого трафика — по сути утечка и вектор атаки.", "Из-за вставки метод не может быть `const`.", "Если читатели работают под `shared_lock`, `operator[]` — это запись: гонка данных и порча таблицы.", "`map<string, bool>` — по сути множество.", "`const std::string&` заставит вызывающего создать строку из `string_view` или литерала."]}, {"type": "code", "code": "#include <cstddef>\n#include <functional>\n#include <iostream>\n#include <string>\n#include <string_view>\n#include <unordered_set>\n\nclass BanList {\npublic:\n    bool IsBanned(std::string_view user) const {\n        return banned_.contains(user);\n    }\n    void Ban(std::string user) { banned_.insert(std::move(user)); }\n    std::size_t Size() const { return banned_.size(); }\n\nprivate:\n    struct Hash {\n        using is_transparent = void;\n        std::size_t operator()(std::string_view s) const noexcept {\n            return std::hash<std::string_view>{}(s);\n        }\n    };\n    std::unordered_set<std::string, Hash, std::equal_to<>> banned_;\n};\n\nint main() {\n    BanList list;\n    list.Ban(\"eve\");\n    for (int i = 0; i < 1000; ++i) {\n        list.IsBanned(\"user\" + std::to_string(i));\n    }\n    std::cout << list.IsBanned(\"eve\") << ' ' << list.Size() << '\\n';\n}\n", "expect": "1 1"}, {"type": "p", "text": "Фрагмент 4. Удаление истёкших сессий."}, {"type": "code", "code": "#include <cstdint>\n#include <iostream>\n#include <vector>\n\nstruct Session {\n    std::int64_t id;\n    std::int64_t expires_at;\n};\n\nvoid RemoveExpired(std::vector<Session>& sessions,\n                   std::int64_t now) {\n    for (auto it = sessions.begin(); it != sessions.end(); ++it) {\n        if (it->expires_at <= now) {\n            sessions.erase(it);\n        }\n    }\n}\n\nint main() {\n    // Оба первых истекли. Последний живой: иначе цикл уйдёт за end().\n    std::vector<Session> s{{1, 10}, {2, 20}, {3, 99}};\n    RemoveExpired(s, 50);\n    for (const auto& x : s) {\n        std::cout << x.id << ' ';\n    }\n    std::cout << '\\n';\n}\n"}, {"type": "list", "items": ["После `erase(it)` итератор `it` невалиден, `++it` — UB. На практике: пропуск соседнего элемента или выход за `end()`. Запусти: сессия 2 осталась — цикл её перепрыгнул.", "Даже с `it = erase(it)` это O(n²): каждый `erase` сдвигает хвост."]}, {"type": "code", "code": "#include <cstddef>\n#include <cstdint>\n#include <iostream>\n#include <vector>\n\nstruct Session {\n    std::int64_t id;\n    std::int64_t expires_at;\n};\n\nstd::size_t RemoveExpired(std::vector<Session>& sessions,\n                          std::int64_t now) {\n    return std::erase_if(sessions, [now](const Session& s) {\n        return s.expires_at <= now;\n    });\n}\n\nint main() {\n    std::vector<Session> s{{1, 10}, {2, 20}, {3, 99}};\n    std::cout << RemoveExpired(s, 50) << \" removed, left:\";\n    for (const auto& x : s) {\n        std::cout << ' ' << x.id;\n    }\n    std::cout << '\\n';\n}\n", "expect": "2 removed, left: 3"}, {"type": "tip", "text": "Вслух на каждом фрагменте: «сначала скажу, что вижу, по приоритету: корректность (UB, гонки), потом сложность, потом стиль. Поправлю и проговорю сложность до и после»."}]}, {"id": "modern-review2", "title": "Код-ревью, часть 2: владение, O(n²), исключения", "blocks": [{"type": "p", "text": "Фрагмент 5. Ручное управление памятью."}, {"type": "code", "code": "#include <cstring>\n#include <iostream>\n#include <stdexcept>\n#include <string>\n\nstruct Request { std::string host; std::string body; };\n\nclass Connection {\npublic:\n    explicit Connection(const std::string& host) { ++alive; }\n    ~Connection() { --alive; }\n    void Send(const Request& req, char* buf) {  // может бросить\n        if (req.body.empty()) {\n            throw std::runtime_error(\"empty body\");\n        }\n        std::memcpy(buf, req.body.data(), req.body.size());\n    }\n    static inline int alive = 0;\n};\n\nvoid Handle(const Request& req) {\n    Connection* conn = new Connection(req.host);\n    char* buf = new char[4096];\n    conn->Send(req, buf);\n    delete[] buf;\n    delete conn;\n}\n\nclass Parser {\npublic:\n    Parser() : buf_(new char[1024]) {}\n    ~Parser() { delete[] buf_; }\n\nprivate:\n    char* buf_;\n};\n\nint main() {\n    try {\n        Handle({\"bank\", \"\"});\n    } catch (const std::exception& e) {\n        std::cout << e.what() << '\\n';\n    }\n    std::cout << \"alive: \" << Connection::alive << '\\n';  // утечка\n    // Parser p; Parser q = p;  // двойной delete[], обычно abort\n}\n", "expect": "empty body\nalive: 1"}, {"type": "list", "items": ["Если `Send` бросит, `conn` и `buf` утекут.", "Объекту на время одной функции куча не нужна — хватит стека.", "`Parser` нарушает rule of 3: копия скопирует указатель, оба деструктора сделают `delete[]` — двойное освобождение."]}, {"type": "code", "code": "#include <array>\n#include <cstring>\n#include <iostream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\nstruct Request { std::string host; std::string body; };\n\nclass Connection {\npublic:\n    explicit Connection(const std::string& host) { ++alive; }\n    ~Connection() { --alive; }\n    void Send(const Request& req, char* buf) {\n        if (req.body.empty()) {\n            throw std::runtime_error(\"empty body\");\n        }\n        std::memcpy(buf, req.body.data(), req.body.size());\n    }\n    static inline int alive = 0;\n};\n\nvoid Handle(const Request& req) {\n    Connection conn(req.host);\n    std::vector<char> buf(4096);  // или std::array, если мало\n    conn.Send(req, buf.data());\n}   // всё освобождается и при исключении\n\nclass Parser {\npublic:\n    Parser() : buf_(1024) {}      // rule of 0: копия корректна\n\nprivate:\n    std::vector<char> buf_;\n};\n\nint main() {\n    try {\n        Handle({\"bank\", \"\"});\n    } catch (const std::exception& e) {\n        std::cout << e.what() << '\\n';\n    }\n    std::cout << \"alive: \" << Connection::alive << '\\n';\n    Parser p;\n    Parser q = p;  // теперь безопасно\n}\n", "expect": "empty body\nalive: 0"}, {"type": "p", "text": "Фрагмент 6. Поиск дубликатов идентификаторов."}, {"type": "code", "code": "#include <algorithm>\n#include <iostream>\n#include <vector>\n\nstd::vector<int> FindDuplicates(const std::vector<int>& ids) {\n    std::vector<int> result;\n    for (size_t i = 0; i < ids.size(); ++i) {\n        for (size_t j = i + 1; j < ids.size(); ++j) {\n            if (ids[i] == ids[j] &&\n                std::find(result.begin(), result.end(), ids[i]) ==\n                    result.end()) {\n                result.push_back(ids[i]);\n            }\n        }\n    }\n    return result;\n}\n\nint main() {\n    for (int id : FindDuplicates({3, 1, 3, 2, 1, 3})) {\n        std::cout << id << ' ';\n    }\n    std::cout << '\\n';\n}\n", "expect": "3 1"}, {"type": "list", "items": ["O(n²) сравнений и ещё `find` по результату. На 10⁵ элементов — миллиарды операций.", "Перед исправлением уточни контракт: важен ли порядок результата? Сейчас — порядок первого повтора. Можно ли менять вход?"]}, {"type": "code", "code": "#include <iostream>\n#include <unordered_map>\n#include <vector>\n\n// O(n) в среднем, порядок — по второму появлению.\nstd::vector<int> FindDuplicates(const std::vector<int>& ids) {\n    std::unordered_map<int, int> seen;\n    seen.reserve(ids.size());\n    std::vector<int> result;\n    for (int id : ids) {\n        if (++seen[id] == 2) {   // здесь [] — осознанно\n            result.push_back(id);\n        }\n    }\n    return result;\n}\n\nint main() {\n    for (int id : FindDuplicates({3, 1, 3, 2, 1, 3})) {\n        std::cout << id << ' ';\n    }\n    std::cout << '\\n';\n}\n", "expect": "3 1"}, {"type": "p", "text": "Если порядок не важен и вход можно копировать: `sort` + проход по соседям — O(n log n), без хэш-таблицы и аллокаций нод."}, {"type": "p", "text": "Фрагмент 7. Перевод денег между счетами."}, {"type": "code", "code": "#include <cstdint>\n#include <iostream>\n#include <vector>\n\nstruct Account {\n    std::int64_t balance = 0;\n    std::vector<std::int64_t> history;\n};\n\nvoid Transfer(Account& from, Account& to, std::int64_t amount) {\n    from.balance -= amount;\n    from.history.push_back(-amount);\n    to.balance += amount;\n    to.history.push_back(amount);   // bad_alloc?\n}\n\nint main() {\n    Account a{100, {}};\n    Account b;\n    Transfer(a, b, 30);\n    std::cout << a.balance << ' ' << b.balance << '\\n';\n    Transfer(a, b, -50);  // никто не проверил знак\n    std::cout << a.balance << ' ' << b.balance << '\\n';\n}\n", "expect": "70 30\n120 -20"}, {"type": "list", "items": ["Нет строгой гарантии: если второй `push_back` бросит, деньги списаны, но не зачислены.", "Нет проверок: `amount <= 0`, недостаточно средств, перевод самому себе, переполнение.", "Если вызывается из нескольких потоков — гонка. Блокировка двух мьютексов по очереди даст дедлок при встречных переводах."]}, {"type": "code", "code": "#include <cstdint>\n#include <expected>\n#include <iostream>\n#include <limits>\n#include <mutex>\n#include <vector>\n\nstruct Account {\n    std::mutex mu;\n    std::int64_t balance = 0;\n    std::vector<std::int64_t> history;\n};\n\nenum class TransferError {\n    kInvalidAmount, kSameAccount, kInsufficientFunds, kOverflow\n};\n\nstd::expected<void, TransferError> Transfer(\n    Account& from, Account& to, std::int64_t amount) {\n    if (amount <= 0) {\n        return std::unexpected(TransferError::kInvalidAmount);\n    }\n    if (&from == &to) {\n        return std::unexpected(TransferError::kSameAccount);\n    }\n    std::scoped_lock lock(from.mu, to.mu);  // без дедлока\n    if (from.balance < amount) {\n        return std::unexpected(TransferError::kInsufficientFunds);\n    }\n    constexpr auto kMax = std::numeric_limits<std::int64_t>::max();\n    if (to.balance > kMax - amount) {\n        return std::unexpected(TransferError::kOverflow);\n    }\n    // Всё, что может бросить, — до изменения состояния.\n    from.history.reserve(from.history.size() + 1);\n    to.history.reserve(to.history.size() + 1);\n    // Дальше ничего не бросает.\n    from.balance -= amount;\n    to.balance += amount;\n    from.history.push_back(-amount);\n    to.history.push_back(amount);\n    return {};\n}\n\nvoid Try(Account& from, Account& to, std::int64_t amount) {\n    if (auto r = Transfer(from, to, amount); r) {\n        std::cout << \"ok\\n\";\n    } else {\n        std::cout << \"error \" << static_cast<int>(r.error()) << '\\n';\n    }\n}\n\nint main() {\n    Account a;\n    Account b;\n    a.balance = 100;\n    Try(a, b, 30);\n    Try(a, b, -50);\n    Try(a, a, 1);\n    Try(a, b, 1000);\n    std::cout << a.balance << ' ' << b.balance << '\\n';\n}\n", "expect": "ok\nerror 0\nerror 1\nerror 2\n70 30"}, {"type": "tip", "text": "Приём для строгой гарантии: «сначала всё, что может бросить (аллокации), потом коммит из `noexcept` операций». Это стоит проговорить словами — для банковского кода это ключевой момент."}, {"type": "p", "text": "Фрагмент 8. Кэш имён."}, {"type": "code", "code": "#include <cstdint>\n#include <iostream>\n#include <memory>\n#include <string>\n#include <unordered_map>\n\nstruct User { std::int64_t id; };\n\nclass NameCache {\npublic:\n    const std::string& GetName(std::shared_ptr<User> user) {\n        auto it = names_.find(user->id);\n        if (it == names_.end()) {\n            return \"\";\n        }\n        return it->second;\n    }\n    void Put(std::int64_t id, std::string name) {\n        names_[id] = std::move(name);\n    }\n\nprivate:\n    std::unordered_map<std::int64_t, std::string> names_;\n};\n\nint main() {\n    NameCache cache;\n    cache.Put(1, \"alice\");\n    auto alice = std::make_shared<User>(User{1});\n    auto ghost = std::make_shared<User>(User{2});\n    std::cout << cache.GetName(alice) << '\\n';\n    std::cout << cache.GetName(ghost) << '\\n';  // UB: висячая ссылка\n}\n"}, {"type": "list", "items": ["`return \"\";` — создаёт временный `std::string` и возвращает ссылку на него. Висячая ссылка, UB у вызывающего. Запусти: на gcc 14 с `-O1` программа падает с segfault (код 139).", "`shared_ptr` по значению — два атомарных изменения счётчика на вызов, а владение функции не нужно. Нужен только id.", "Метод ничего не меняет — должен быть `const`.", "`user` может быть `nullptr` — не проверяется."]}, {"type": "code", "code": "#include <cstdint>\n#include <iostream>\n#include <string>\n#include <unordered_map>\n\nclass NameCache {\npublic:\n    // nullptr, если имени нет. Указатель валиден, пока запись\n    // не удалили; при конкурентных записях — вернуть копию.\n    const std::string* FindName(std::int64_t user_id) const {\n        auto it = names_.find(user_id);\n        return it == names_.end() ? nullptr : &it->second;\n    }\n    void Put(std::int64_t id, std::string name) {\n        names_[id] = std::move(name);\n    }\n\nprivate:\n    std::unordered_map<std::int64_t, std::string> names_;\n};\n\nint main() {\n    NameCache cache;\n    cache.Put(1, \"alice\");\n    for (std::int64_t id : {1, 2}) {\n        const std::string* name = cache.FindName(id);\n        std::cout << id << \": \" << (name ? *name : \"-\") << '\\n';\n    }\n}\n", "expect": "1: alice\n2: -"}, {"type": "warn", "text": "Если в кэш пишут из других потоков, возвращать указатель или ссылку внутрь контейнера нельзя даже под локом: лок отпустят, а ссылка останется. Возвращай `std::optional<std::string>` — копию, сделанную под локом."}]}, {"id": "modern-checklist", "title": "Чек-лист: как менять чужой код вслух", "blocks": [{"type": "p", "text": "В секции оценивают не только результат, но и ход мысли. Порядок действий, который хорошо смотрится со стороны:"}, {"type": "list", "items": ["1. Прочитай код вслух своими словами: что делает, какие входы, что возвращает.", "2. Уточни контракт: размеры данных, вызывается ли из нескольких потоков, кто владеет объектами, политика ошибок (исключения или коды), стандарт C++, важен ли порядок, бывают ли дубликаты.", "3. Назови проблемы по приоритету: UB и гонки → утечки и безопасность исключений → сложность → лишние копии и аллокации → стиль.", "4. Скажи сложность до и после: «было O(n²), станет O(n) в среднем, память O(n)».", "5. Меняй минимально и в стиле существующего кода. Не переписывай всё, если просили одну функцию.", "6. Назови тесты, которые написал бы."]}, {"type": "list", "items": ["Крайние случаи, которые стоит назвать:", "Пустой вход, один элемент, все одинаковые.", "Граничные числа: 0, отрицательные, `INT64_MAX`, переполнение суммы.", "Повторный вызов, повторный ключ, удаление несуществующего.", "Очень большой вход: влезет ли в память, нет ли рекурсии.", "Конкурентный доступ: два потока одновременно."]}, {"type": "list", "items": ["Быстрые проверки кода перед «готово»:", "Параметры: большие объекты по `const&`, строки — `string_view`, массивы — `span<const T>`, sink — по значению + `move`.", "`const` у методов, которые не меняют состояние.", "Нет `operator[]` там, где только чтение.", "Нет `erase` внутри range-for, нет ссылок в вектор через `push_back`.", "`reserve`, если размер известен.", "Нет голых `new`/`delete` — `make_unique`, контейнеры, rule of 0.", "Move-конструктор `noexcept`.", "Компаратор — строгий `<`, не `<=`.", "Ошибки, которые нельзя игнорировать, — `[[nodiscard]]` или `std::expected`."]}, {"type": "list", "items": ["Шпаргалка выбора:", "Поиск по ключу → `unordered_map` + `reserve`.", "Порядок, диапазоны, `lower_bound` → `map`/`set`.", "Top-k → `nth_element`, `partial_sort` или `priority_queue` размера k.", "Убрать дубликаты → `sort` + `unique` + `erase` или `unordered_set`.", "LRU → `list` + `unordered_map` итераторов.", "Очередь с двух концов → `deque`.", "Удаление по условию → `std::erase_if`."]}, {"type": "list", "items": ["Как проверить:", "Юнит-тесты на крайние случаи из списка выше.", "Санитайзеры: AddressSanitizer (висячие ссылки, выход за границы), UBSan (переполнение), ThreadSanitizer (гонки).", "Бенчмарк на реалистичных размерах, если меняли ради скорости."]}, {"type": "tip", "text": "Фразы, которые работают: «прежде чем менять — уточню: функция вызывается конкурентно?», «здесь UB, исправлю первым», «это O(n²), на ваших объёмах станет узким местом», «добавлю тест на пустой вход», «оставлю простой цикл — он понятнее, а по скорости то же самое»."}, {"type": "warn", "text": "Не молчи по 5 минут. Если думаешь — говори, о чём. Если не помнишь сигнатуру — скажи и открой документацию: это разрешено и выглядит профессионально."}]}], "quiz": [{"id": "modern-q1", "lesson": "modern-versions", "q": "В каком стандарте появились `std::optional`, `std::string_view` и structured bindings?", "options": ["C++11", "C++17", "C++14", "C++20", "C++23"], "answer": 1, "explain": "Все три — C++17, вместе с `variant`, `any`, `if constexpr` и CTAD. C++14 дал `make_unique` и generic лямбды, C++20 — concepts, ranges, `span`, `format
