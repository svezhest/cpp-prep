<meta charset="utf-8">
<title>Плюсы к Яндекс ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#e9edf4; --ink:#16202e; --muted:#5a6678; --line:#d7dde8;
  --accent:#3a4fd0; --accent-ink:#ffffff; --accent-soft:#e3e7fb;
  --ok:#1d7f48; --ok-soft:#dff2e6; --bad:#b8352c; --bad-soft:#f8e1de; --warn:#9a6200; --warn-soft:#fbefd6; --tip:#0f6f86; --tip-soft:#dcf0f4;
  --code-bg:#0f1624; --code-ink:#dbe3f0; --code-kw:#8fa2ff; --code-str:#9ad8a6; --code-com:#7d8aa3; --code-num:#f2b880; --code-type:#7fd3e6; --code-meta:#e49ad1;
  --inline-bg:#e6eaf3;
  --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d121b; --surface:#151c28; --sunk:#1b2433; --ink:#e4e9f2; --muted:#9aa6b8; --line:#283346;
  --accent:#8193ff; --accent-ink:#0d121b; --accent-soft:#232c4d;
  --ok:#5fd08f; --ok-soft:#173326; --bad:#ff8277; --bad-soft:#3a1d1b; --warn:#f0b54d; --warn-soft:#352813; --tip:#5ccbe3; --tip-soft:#14303a;
  --code-bg:#0a0f18; --inline-bg:#232c3d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d121b; --surface:#151c28; --sunk:#1b2433; --ink:#e4e9f2; --muted:#9aa6b8; --line:#283346;
  --accent:#8193ff; --accent-ink:#0d121b; --accent-soft:#232c4d;
  --ok:#5fd08f; --ok-soft:#173326; --bad:#ff8277; --bad-soft:#3a1d1b; --warn:#f0b54d; --warn-soft:#352813; --tip:#5ccbe3; --tip-soft:#14303a;
  --code-bg:#0a0f18; --inline-bg:#232c3d; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{max-width:760px;margin:0 auto;padding:10px 16px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em;margin-right:auto;display:flex;gap:6px;align-items:baseline}
.brand small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--sans);padding:6px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{max-width:760px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--sans);padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,summary:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h1{font-size:26px;line-height:1.2;margin:22px 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;max-width:62ch}
.toc{display:grid;gap:8px;margin:0}
details.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.lesson>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;gap:10px;align-items:baseline}
details.lesson>summary::-webkit-details-marker{display:none}
.lnum{font:600 12px var(--mono);color:var(--muted);min-width:2.2em;font-variant-numeric:tabular-nums}
.ltitle{font-weight:600;flex:1;text-wrap:balance}
.lmeta{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
details.lesson[open]>summary{border-bottom:1px solid var(--line)}
.lbody{padding:6px 14px 16px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.lbody p{margin:0;max-width:65ch}
.lbody ul{margin:0;padding-left:20px;display:grid;gap:4px}
.callout{border-radius:10px;padding:10px 12px;font-size:15px}
.callout b{display:block;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.callout.warn{background:var(--warn-soft)} .callout.warn b{color:var(--warn)}
.callout.tip{background:var(--tip-soft)} .callout.tip b{color:var(--tip)}
.lfoot{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--sans);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}

code.i{font:500 .86em var(--mono);background:var(--inline-bg);padding:.08em .35em;border-radius:5px;overflow-wrap:anywhere}
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:10px;overflow-x:auto;padding:12px 13px;font:400 12.5px/1.55 var(--mono);tab-size:4;-webkit-overflow-scrolling:touch}
pre.code code{font:inherit;background:none;padding:0}
.hljs-keyword,.hljs-built_in,.hljs-literal{color:var(--code-kw)}
.hljs-string,.hljs-char{color:var(--code-str)}
.hljs-comment{color:var(--code-com);font-style:italic}
.hljs-number{color:var(--code-num)}
.hljs-type,.hljs-title.class_,.hljs-title{color:var(--code-type)}
.hljs-meta,.hljs-meta .hljs-keyword,.hljs-meta .hljs-string{color:var(--code-meta)}

/* quiz */
.qbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 10px}
.qbar .stat{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;margin-right:auto}
.prog{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 14px;display:grid;gap:12px}
.qtag{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.qtext{font-size:17px;font-weight:600;line-height:1.45;margin:0;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:400 15px/1.45 var(--sans);padding:11px 12px;border-radius:11px;cursor:pointer}
.opt .k{font:700 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;min-width:22px;height:22px;display:inline-grid;place-items:center;flex:none;margin-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{color:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{color:var(--bad);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.explain{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--ink);font-size:15px}
.explain b{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.qnav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.qlink{background:none;border:0;color:var(--accent);font:600 14px var(--sans);padding:0;cursor:pointer;text-align:left}
.done{text-align:center;padding:26px 10px;display:grid;gap:10px;justify-items:center}
.big{font:700 44px var(--mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted)}

/* runnable code */
.runbox{display:grid;gap:6px;min-width:0;grid-template-columns:minmax(0,1fr)}
.view{min-width:0}
.runbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--sans);padding:6px 11px;border-radius:8px;cursor:pointer}
.rbtn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rbtn:disabled{opacity:.5;cursor:default}
.rbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rmode{font:500 11px var(--mono);color:var(--muted);margin-left:auto;letter-spacing:.03em}
textarea.ed{width:100%;min-height:120px;resize:vertical;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--accent);border-radius:10px;padding:12px 13px;font:400 13px/1.55 var(--mono);tab-size:4;white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch}
.out{margin:0;border-radius:10px;padding:10px 12px;font:400 12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto;background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.out .h{display:block;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;color:var(--muted)}
.out.ok{border-color:var(--ok);background:var(--ok-soft)} .out.ok .h{color:var(--ok)}
.out.bad{border-color:var(--bad);background:var(--bad-soft)} .out.bad .h{color:var(--bad)}
.out.busy .h{color:var(--accent)}
.expect{font:400 12px/1.5 var(--mono);color:var(--muted);white-space:pre-wrap;margin:0}
/* practice */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.tcard.solved{border-color:var(--ok)}
.fixed{display:grid;gap:6px;min-width:0;grid-template-columns:minmax(0,1fr)}
.fixed pre{opacity:.85}
.fixl{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.fixn{margin:0;font-size:13px;color:var(--muted)}
.thead{display:flex;gap:8px;align-items:baseline}
.thead h3{margin:0;font-size:16px;flex:1;text-wrap:balance}
.badge{font:600 11px var(--mono);padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.tlist{display:grid;gap:12px;margin-top:6px}
.hint{background:var(--tip-soft);border-radius:10px;padding:9px 12px;font-size:15px}
.sett{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.sett input{font:400 13px var(--mono);padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}

/* progress + roadmap */
.lmeta.ok{color:var(--ok)} .lmeta.part{color:var(--accent)} .lmeta.skip{color:var(--muted);text-decoration:line-through}
.dash{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
@media (max-width:440px){.dash{grid-template-columns:1fr;justify-items:center}}
.donut{width:150px;height:150px}
.donut text{fill:var(--ink);font-family:var(--mono)}
.legend{display:grid;gap:7px;font-size:14px;width:100%}
.legend .r{display:flex;gap:8px;align-items:center}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .n{margin-left:auto;font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.cbars{display:grid;gap:8px;margin:14px 0 4px}
.cbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:none;border:0;padding:0;text-align:left;color:var(--ink);font:500 14px var(--sans);cursor:pointer}
.cbar .t{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;grid-column:1/-1}
.cbar .t i{display:block;height:100%;background:var(--ok)}
.cbar .n{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.cbar[aria-current="true"]{color:var(--accent)}
.graph{position:relative;margin-top:14px;padding-block:6px 10px}
.graph svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.graph svg.edges path{fill:none;stroke:var(--line);stroke-width:1.6}
.graph svg.edges path.done{stroke:var(--ok)}
.lvl{display:flex;justify-content:center;gap:8px;margin-bottom:26px;position:relative;z-index:1}
.node{flex:1 1 0;max-width:150px;min-width:0;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:7px 6px 6px;font:600 12px/1.25 var(--sans);cursor:pointer;display:grid;gap:5px;text-align:center}
.node .nb{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden}
.node .nb i{display:block;height:100%;background:var(--accent)}
.node .nc{font:500 10px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.node.ok{border-color:var(--ok);background:var(--ok-soft)} .node.ok .nb i{background:var(--ok)}
.node.part{border-color:var(--accent)}
.node.skip{border-style:dashed;opacity:.55}
.node.sel{outline:2px solid var(--accent);outline-offset:2px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18);border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-width:760px;margin:0 auto}
.sheet h3{margin:0;font-size:17px;text-wrap:balance;padding-right:36px}
.sheet .x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--muted);font:600 22px var(--sans);cursor:pointer;padding:4px 8px}
.srow{display:flex;justify-content:space-between;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:6px}
.srow b{font:600 14px var(--mono)}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.legend-g{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend-g span{display:inline-flex;gap:5px;align-items:center}
.legend-g i{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);display:inline-block}
.danger{color:var(--bad)}
@media (max-width:420px){.brand small{display:none}.seg button{padding:6px 8px}}
/* «Я задолбался» */
.tired{position:fixed;z-index:15;display:grid;gap:10px}
.tired .tbtn{border:0;cursor:pointer;font:700 17px/1.2 var(--sans);color:#fff;background:linear-gradient(160deg,#e0573f,#b8352c);border-radius:16px;padding:16px 14px;box-shadow:0 6px 18px rgba(184,53,44,.28);text-wrap:balance}
.tired .tbtn:active{transform:translateY(1px) scale(.98)}
.tired .tmsg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45;min-height:3.2em}
.tired .tstat{font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.tired .tstat ol{margin:2px 0 0;padding-left:18px}
.tired .tstat button{justify-self:start;border:0;background:none;color:var(--accent);font:600 12.5px var(--sans);padding:0;cursor:pointer}
.tired .tx{display:none}
@media (min-width:1180px){
  .tired{left:max(16px,calc((100vw - 760px)/2 - 244px));top:130px;width:220px}
  .tired .tbtn{min-height:96px;font-size:20px;order:-1}
}
@media (max-width:1179px){
  .tired{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 24px));pointer-events:none}
  .tired>*{pointer-events:auto}
  .tired .tbtn{justify-self:start;padding:10px 14px;font-size:14px;border-radius:999px;order:3}
  .tired .tcard{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.2);position:relative}
  .tired .tcard .tmsg{border:0;padding:0 24px 0 0;min-height:0}
  .tired .tcard[hidden]{display:none}
  .tired .tx{display:block;position:absolute;right:6px;top:4px;border:0;background:none;color:var(--muted);font:600 20px var(--sans);cursor:pointer;padding:2px 8px}
  .wrap{padding-block-end:96px}
}
@media (min-width:1180px){ .tired .tcard{display:grid;gap:10px} .tired .tcard[hidden]{display:grid} }
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .25s}.opt{transition:background .15s,border-color .15s}}
</style>

<header class="top">
  <div class="row">
    <div class="brand">C++ <small>Яндекс ID</small></div>
    <div class="seg" role="group" aria-label="Режим">
      <button id="m-map" aria-pressed="false">Карта</button>
      <button id="m-learn" aria-pressed="true">Уроки</button>
      <button id="m-quiz" aria-pressed="false">Тест</button>
      <button id="m-task" aria-pressed="false">Практика</button>
    </div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Глава"></div>
</header>
<main class="wrap" id="main"></main>
<aside class="tired" id="tired" aria-label="Я задолбался">
  <div class="tcard" id="tcard">
    <button class="tx" id="tclose" aria-label="Закрыть">×</button>
    <div class="tmsg" id="tmsg">Если совсем тяжело - жми. Я запишу, где это случилось, и что-нибудь скажу.</div>
    <div class="tstat" id="tstat"></div>
  </div>
  <button class="tbtn" id="tbtn">Я задолбался</button>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const BOOK = {"chapters": [{"id": "mt", "title": "Многопоточность", "lessons": [{"id": "mt-thread", "title": "std::thread: запуск, join, detach, аргументы", "blocks": [{"type": "p", "text": "`std::thread` запускает поток прямо в конструкторе. Передать можно что угодно вызываемое: функцию, лямбду, функтор, указатель на метод вместе с объектом. Дальше у объекта два пути: `join()` (дождаться) или `detach()` (отпустить). Третьего нет."}, {"type": "code", "code": "#include <iostream>\n#include <thread>\n\nvoid work(int id) {\n    std::cout << \"worker \" << id << '\\n';\n}\n\nint main() {\n    std::thread t1(work, 1);          // функция + аргумент\n    std::thread t2([] { work(2); });  // лямбда\n    t1.join();                        // ждём завершения\n    t2.join();\n    std::cout << \"done\\n\";            // всегда последней\n}"}, {"type": "p", "text": "Порядок строк \"worker 1\" и \"worker 2\" не определён. Вывод в `std::cout` из разных потоков не даёт гонки данных (поток синхронизирован с stdio), но куски строк могут перемешаться."}, {"type": "p", "text": "Ключевое правило: объект `std::thread` \"joinable\", если он связан с живым или завершившимся, но ещё не присоединённым потоком. Если joinable объект разрушается (или ему присваивают другой поток), вызывается `std::terminate`. Это не ошибка компиляции и не \"тихая утечка\" - процесс падает."}, {"type": "code", "code": "#include <cstdlib>\n#include <exception>\n#include <iostream>\n#include <stdexcept>\n#include <thread>\n\nvoid may_throw() { throw std::runtime_error(\"oops\"); }\n\nvoid risky() {\n    std::thread t([] { /* ... */ });\n    may_throw();  // исключение -> раскрутка стека -> ~thread()\n    t.join();     // сюда не дошли: t joinable -> std::terminate\n}\n\nint main() {\n    // только для демо: перехватим terminate и выйдем с кодом 0\n    std::set_terminate([] {\n        std::cout << \"std::terminate\" << std::endl;\n        std::_Exit(0);\n    });\n    try {\n        risky();\n    } catch (...) {\n        std::cout << \"caught\\n\";  // не напечатается\n    }\n}", "expect": "std::terminate"}, {"type": "p", "text": "Классическое лекарство до C++20 - RAII-обёртка, которая делает `join` в деструкторе. С C++20 есть `std::jthread`, он делает это сам (следующий урок)."}, {"type": "code", "code": "#include <iostream>\n#include <thread>\n\nclass JoinGuard {\npublic:\n    explicit JoinGuard(std::thread& t) : t_(t) {}\n    ~JoinGuard() {\n        if (t_.joinable()) t_.join();\n    }\n    JoinGuard(const JoinGuard&) = delete;\n    JoinGuard& operator=(const JoinGuard&) = delete;\n\nprivate:\n    std::thread& t_;\n};\n\nvoid may_throw() {}\n\nvoid safe() {\n    std::thread t([] { std::cout << \"worker\\n\"; });\n    JoinGuard guard(t);  // join при любом выходе из функции\n    may_throw();\n}\n\nint main() {\n    safe();\n    std::cout << \"after safe\\n\";\n}", "expect": "worker\nafter safe"}, {"type": "p", "text": "Аргументы копируются (decay-copy) во внутреннее хранилище потока и передаются в функцию как rvalue. Поэтому функция с параметром `int&` не скомпилируется, пока не обернёте аргумент в `std::ref`. А указатель на локальный буфер скопируется как указатель - преобразование в `std::string` случится уже в новом потоке."}, {"type": "code", "code": "#include <functional>\n#include <iostream>\n#include <string>\n#include <thread>\n\nvoid inc(int& x) { ++x; }\nvoid greet(const std::string& s) { std::cout << s << '\\n'; }\n\nint main() {\n    int n = 0;\n    // std::thread bad(inc, n);       // не скомпилируется\n    std::thread t(inc, std::ref(n));  // явно передаём ссылку\n    t.join();\n    std::cout << n << '\\n';\n\n    char buf[] = \"hello\";\n    // greet получит const char*, string построится в потоке.\n    // Если buf умрёт раньше (detach) - висячий указатель.\n    std::thread g(greet, std::string(buf));  // так безопасно\n    g.join();\n}", "expect": "1\nhello"}, {"type": "p", "text": "Методы класса, move-only аргументы и перемещение самих потоков. `std::thread` нельзя копировать, только перемещать."}, {"type": "code", "code": "#include <iostream>\n#include <memory>\n#include <thread>\n#include <vector>\n\nstruct Worker {\n    void run(int n) { std::cout << \"run \" << n << '\\n'; }\n};\n\nvoid consume(std::unique_ptr<int> p) {\n    std::cout << \"got \" << *p << '\\n';\n}\n\nint main() {\n    Worker w;\n    std::thread t1(&Worker::run, &w, 42);  // метод + объект\n\n    auto p = std::make_unique<int>(7);\n    std::thread t2(consume, std::move(p)); // только move\n\n    std::thread t3 = std::move(t1);  // t1 больше не joinable\n    t2.join();\n    t3.join();\n\n    std::vector<std::thread> pool;\n    for (int i = 0; i < 4; ++i)\n        pool.emplace_back([i] { (void)i; /* работа */ });\n    for (auto& t : pool) t.join();\n}"}, {"type": "warn", "text": "`detach()` с захватом локальных переменных по ссылке - почти гарантированный UB: функция вернётся, стек умрёт, а поток продолжит читать. В продакшен-коде detach почти не нужен: вы теряете возможность дождаться потока при shutdown, а при выходе из `main` detached-поток обрывается без раскрутки стека."}, {"type": "code", "code": "#include <chrono>\n#include <iostream>\n#include <thread>\n\nusing namespace std::chrono_literals;\n\nvoid dangling() {\n    int local = 42;\n    std::thread t([&] {               // ссылка на стек\n        std::this_thread::sleep_for(5ms);\n        std::cout << local << '\\n';   // ждём 42, увидим мусор\n    });\n    t.detach();\n}   // local умер, поток всё ещё может его читать - UB\n\nvoid reuse_stack() {  // другая функция займёт тот же стек\n    volatile int junk[64];\n    for (int i = 0; i < 64; ++i) junk[i] = -1;\n}\n\nint main() {\n    dangling();\n    reuse_stack();\n    std::this_thread::sleep_for(50ms);\n}"}, {"type": "list", "items": ["`std::thread::hardware_concurrency()` - подсказка о числе ядер, может вернуть 0. Держите дефолт: `std::max(1u, n)`.", "`std::this_thread::get_id()`, `sleep_for`, `yield` - утилиты текущего потока.", "Исключение, вылетевшее из функции потока, не попадает в `join` - вызывается `std::terminate`. Для передачи исключений - `std::future`."]}, {"type": "tip", "text": "Вслух: \"Поток создаю здесь, владеет им вот этот объект, join - в деструкторе / в shutdown. Если по пути вылетит исключение, поток всё равно будет присоединён\"."}]}, {"id": "mt-race", "title": "Data race, race condition и почему ++counter ломается", "blocks": [{"type": "p", "text": "Data race (гонка данных) - строгий термин стандарта: два потока обращаются к одной ячейке памяти, хотя бы одно обращение - запись, хотя бы одно не атомарное, и между ними нет отношения happens-before. Результат - неопределённое поведение всей программы, а не просто \"неточное число\"."}, {"type": "p", "text": "Race condition (состояние гонки) - логическая ошибка: результат зависит от порядка выполнения. Она возможна и без data race: каждая операция защищена, но их комбинация - нет."}, {"type": "code", "code": "#include <iostream>\n#include <thread>\n\nint counter = 0;\n\nvoid add() {\n    for (int i = 0; i < 100'000; ++i)\n        ++counter;  // load, add, store - три шага, не атомарно\n}\n\nint main() {\n    std::thread a(add), b(add);\n    a.join();\n    b.join();\n    std::cout << counter << '\\n';\n}", "mode": "tsan"}, {"type": "p", "text": "Запустите несколько раз, с TSan и без. Без TSan обычно выходит либо 200000, либо ровно 100000. 100000 - это и есть гонка: оба потока прочитали 0 в регистр, каждый насчитал 100000 и записал. Работа целого потока пропала. 200000 тоже не значит, что всё в порядке: TSan в любом случае печатает `WARNING: ThreadSanitizer: data race`. Почему число так часто выглядит правильным:"}, {"type": "list", "items": ["Оптимизатор. Раз `counter` не атомарный, компилятор вправе считать, что его никто не трогает. gcc с `-O1` превращает цикл в одно чтение `counter` в регистр, 100000 сложений в регистре и одну запись в конце. Окно для потери инкремента сжимается до пары инструкций.", "Время. 100000 сложений в регистре идут доли миллисекунды. Первый поток часто заканчивает раньше, чем второй успевает стартовать: они вообще не пересекаются."]}, {"type": "p", "text": "Чтобы увидеть потерю, нужно заставить каждый шаг ходить в память и дать потокам пересечься. `volatile` запрещает держать переменную в регистре, но атомарным `++` не делает: это всё та же гонка данных."}, {"type": "code", "code": "#include <iostream>\n#include <thread>\n\nvolatile int counter = 0;  // volatile != atomic\n\nvoid add() {\n    for (int i = 0; i < 10'000'000; ++i)\n        counter = counter + 1;  // load, add, store\n}\n\nint main() {\n    std::thread a(add), b(add);\n    a.join();\n    b.join();\n    std::cout << counter << '\\n';  // < 20000000\n}", "mode": "gcc"}, {"type": "tip", "text": "Вслух: \"Гонка данных - это UB, а не 'иногда неверное число'. Тест, который 100 раз дал правильный ответ, ничего не доказывает. Поэтому стресс-тесты гоняют под TSan\"."}, {"type": "p", "text": "Почему ломается: оба потока прочитали 5, оба посчитали 6, оба записали 6 - один инкремент потерян. А поскольку это UB, компилятор вправе, например, держать `counter` в регистре весь цикл и записать результат один раз."}, {"type": "p", "text": "Два способа починить. Оба счётчика всегда дают ровно 200000: `fetch_add` - атомарное чтение-изменение-запись (на x86 одна инструкция `lock xadd`), инкремент не теряется даже с `memory_order_relaxed`. `relaxed` убирает только упорядочивание относительно других переменных, а не атомарность."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nstd::atomic<int> a_counter{0};\nint m_counter = 0;\nstd::mutex m;\n\nvoid add() {\n    for (int i = 0; i < 100'000; ++i) {\n        a_counter.fetch_add(1, std::memory_order_relaxed);\n        std::lock_guard lk(m);\n        ++m_counter;\n    }\n}\n\nint main() {\n    std::thread t1(add), t2(add);\n    t1.join();\n    t2.join();\n    std::cout << a_counter << ' ' << m_counter << '\\n';\n}", "expect": "200000 200000"}, {"type": "warn", "text": "Ловушка: \"relaxed - значит может потерять инкременты\". Нет. Для счётчика, который читают только после `join`, `relaxed` достаточно. Он не годится, когда по значению атомика другой поток судит, что готовы другие данные (флаг \"данные записаны\") - там нужен `release`/`acquire`."}, {"type": "p", "text": "Race condition без data race: каждый метод под мьютексом, но \"проверить, затем действовать\" (check-then-act) разорвано на два захвата."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <mutex>\n#include <string>\n#include <thread>\n#include <unordered_map>\n#include <vector>\n\nclass Accounts {\npublic:\n    long get(const std::string& k) {\n        std::lock_guard lk(m_);\n        return balance_[k];\n    }\n    void set(const std::string& k, long v) {\n        std::lock_guard lk(m_);\n        balance_[k] = v;\n    }\n    // БАГ: между get и set другой поток успеет снять деньги\n    bool withdraw_bad(const std::string& k, long sum) {\n        if (get(k) < sum) return false;\n        set(k, get(k) - sum);\n        return true;\n    }\n    // ПРАВИЛЬНО: вся операция - одна критическая секция\n    bool withdraw(const std::string& k, long sum) {\n        std::lock_guard lk(m_);\n        long& b = balance_[k];\n        if (b < sum) return false;\n        b -= sum;\n        return true;\n    }\n\nprivate:\n    std::mutex m_;\n    std::unordered_map<std::string, long> balance_;\n};\n\nint main() {\n    Accounts acc;\n    acc.set(\"alice\", 100);\n    std::atomic<int> ok{0};\n    std::vector<std::thread> ts;\n    for (int t = 0; t < 4; ++t)\n        ts.emplace_back([&] {\n            for (int i = 0; i < 50; ++i)\n                ok += acc.withdraw(\"alice\", 1);\n        });\n    for (auto& th : ts) th.join();\n    // 200 попыток, денег на 100: ровно 100 успехов\n    std::cout << ok << ' ' << acc.get(\"alice\") << '\\n';\n}", "expect": "100 0"}, {"type": "tip", "text": "Вслух: \"Потокобезопасность - это свойство интерфейса, а не отдельных методов. Операции API должны соответствовать инвариантам: не empty()+pop(), а try_pop(); не get()+set(), а withdraw()\"."}, {"type": "p", "text": "Ещё источники гонок, о которых часто забывают:"}, {"type": "list", "items": ["Флаг остановки `bool stop` без atomic. Это гонка данных; с `-O2` цикл `while (!stop)` может стать бесконечным: компилятор видит, что в цикле никто `stop` не меняет.", "`std::vector<bool>`: элементы упакованы в биты, соседние элементы - одна ячейка памяти. Запись в `v[0]` и `v[1]` из разных потоков - гонка. С `vector<char>` или `vector<int>` разные элементы - разные ячейки, гонки нет.", "Соседние битовые поля одной структуры - тоже одна ячейка памяти.", "Один и тот же объект `shared_ptr`, который один поток читает (копирует), а другой переприсваивает. Атомарен только счётчик ссылок, а не сам объект `shared_ptr`.", "`std::map::operator[]` - не const, может вставлять. Одновременные `find`/`at` из разных потоков без писателей безопасны, `operator[]` - нет.", "Захват счётчика цикла по ссылке `[&]` при создании потоков в цикле."]}, {"type": "code", "code": "#include <atomic>\n#include <chrono>\n#include <iostream>\n#include <thread>\n\nstd::atomic<bool> stop{false};  // не bool и не volatile bool\n\nint main() {\n    std::thread t([] {\n        while (!stop.load()) { /* работа */ }\n    });\n    std::this_thread::sleep_for(std::chrono::milliseconds(10));\n    stop.store(true);\n    t.join();\n    std::cout << \"stopped\\n\";\n}", "expect": "stopped"}, {"type": "warn", "text": "TSan (`-fsanitize=thread`) ловит гонки данных во время выполнения. На собеседовании можно сказать: \"в проде я бы прогнал стресс-тест под TSan\". Но race condition на уровне логики он не найдёт."}]}, {"id": "mt-mutex", "title": "mutex, lock_guard, unique_lock, scoped_lock", "blocks": [{"type": "p", "text": "`std::mutex` защищает инвариант, а не переменную. Блокировать вручную через `lock()/unlock()` нельзя: любое исключение или ранний `return` оставит мьютекс захваченным. Только RAII."}, {"type": "code", "code": "#include <iostream>\n#include <mutex>\n#include <thread>\n\nclass Account {\npublic:\n    void deposit(long sum) {\n        std::lock_guard lock(m_);  // CTAD: lock_guard<std::mutex>\n        balance_ += sum;\n    }\n    long balance() const {\n        std::lock_guard lock(m_);\n        return balance_;\n    }\n\nprivate:\n    mutable std::mutex m_;  // mutable: лочим в const-методах\n    long balance_ = 0;      // guarded by m_\n};\n\nint main() {\n    Account acc;\n    auto work = [&acc](long sum) {\n        for (int i = 0; i < 1000; ++i) acc.deposit(sum);\n    };\n    std::thread a(work, 1), b(work, 2);\n    a.join();\n    b.join();\n    std::cout << acc.balance() << '\\n';\n}", "expect": "3000"}, {"type": "p", "text": "Пример выше корректен, но параллельности в нём нет. Вся работа потока - это `deposit`, а `deposit` целиком под замком. Потоки по очереди ждут мьютекс, то есть выполняются последовательно. Плюс накладные расходы: при борьбе за мьютекс поток засыпает и просыпается через ядро. Такой код обычно медленнее однопоточного."}, {"type": "list", "items": ["Мьютекс даёт корректность, а не скорость. Всё, что под замком, выполняется строго по одному.", "Скорость зависит от доли работы вне замка (закон Амдала): если 90% времени под замком, больше ~1.1x не получить.", "Под замок кладут минимум: только чтение и запись общего состояния. Вычисления, ввод-вывод и аллокации - до или после."]}, {"type": "p", "text": "Типичный приём - копить локально и сливать один раз. 1000 захватов на поток превращаются в один:"}, {"type": "code", "code": "#include <iostream>\n#include <mutex>\n#include <thread>\n\nclass Account {\npublic:\n    void deposit(long sum) {\n        std::lock_guard lock(m_);\n        balance_ += sum;\n    }\n    long balance() const {\n        std::lock_guard lock(m_);\n        return balance_;\n    }\n\nprivate:\n    mutable std::mutex m_;\n    long balance_ = 0;\n};\n\nint main() {\n    Account acc;\n    auto work = [&acc](long sum) {\n        long local = 0;            // своё, без замка\n        for (int i = 0; i < 1000; ++i) local += sum;\n        acc.deposit(local);        // один захват на поток\n    };\n    std::thread a(work, 1), b(work, 2);\n    a.join();\n    b.join();\n    std::cout << acc.balance() << '\\n';\n}", "expect": "3000"}, {"type": "tip", "text": "Вслух: \"Под мьютексом код сериализуется. Я держу критическую секцию минимальной, а если общий счётчик горячий - локальная агрегация, шардирование или atomic\"."}, {"type": "warn", "text": "Безымянный замок - классика: `std::lock_guard<std::mutex>{m_};` создаёт временный объект, который разрушается в конце той же строки. Код дальше идёт без защиты. А `std::unique_lock<std::mutex>(m);` вообще объявляет новую переменную с именем `m` (most vexing parse) и ничего не лочит. Замку всегда нужно имя."}, {"type": "p", "text": "Ссылка или указатель на защищённые данные не должны выходить из-под замка. Иначе вызывающий будет читать их без мьютекса."}, {"type": "code", "code": "#include <iostream>\n#include <mutex>\n#include <string>\n#include <thread>\n#include <vector>\n\nclass Registry {\npublic:\n    // ПЛОХО: ссылка живёт дольше блокировки\n    const std::vector<std::string>& items_bad() const {\n        std::lock_guard lk(m_);\n        return items_;\n    }\n    // ХОРОШО: копия под замком\n    std::vector<std::string> snapshot() const {\n        std::lock_guard lk(m_);\n        return items_;\n    }\n    void add(std::string s) {\n        std::lock_guard lk(m_);\n        items_.push_back(std::move(s));\n    }\n\nprivate:\n    mutable std::mutex m_;\n    std::vector<std::string> items_;\n};\n\nint main() {\n    Registry r;\n    std::thread t([&] {\n        for (int i = 0; i < 10'000; ++i) r.add(\"x\");\n    });\n    std::size_t n = 0;\n    for (int k = 0; k < 300; ++k) {\n        // попробуйте: const auto& snap = r.items_bad();\n        auto snap = r.snapshot();\n        for (const auto& s : snap) n += s.size();\n    }\n    t.join();\n    volatile std::size_t sink = n;  // чтобы цикл не выкинули\n    (void)sink;\n    std::cout << r.snapshot().size() << '\\n';\n}", "expect": "10000", "mode": "tsan"}, {"type": "warn", "text": "Замените `snapshot()` на `items_bad()` и запустите: ThreadSanitizer сообщит о гонке, а вывод останется 10000. Без TSan такой код обычно \"работает\": чтение по ссылке идёт параллельно с `push_back`, который может перевыделить буфер, но падает это редко. UB не обязано проявляться."}, {"type": "p", "text": "`std::unique_lock` - гибкий замок: можно отпустить раньше, взять снова, попробовать без ожидания, отложить захват, вернуть из функции (он movable). Нужен для `condition_variable`. Чуть дороже `lock_guard`: хранит флаг владения."}, {"type": "code", "code": "#include <chrono>\n#include <iostream>\n#include <mutex>\n#include <string>\n#include <thread>\nusing namespace std::chrono_literals;\n\nstd::mutex m;\nstd::string journal;  // guarded by m\n\nvoid process() {\n    std::unique_lock lk(m);\n    journal += \"x\";\n    lk.unlock();                      // отпустили на долгую работу\n    std::this_thread::sleep_for(200ms);  // \"медленный I/O\"\n    lk.lock();                        // взяли снова\n    journal += \"y\";\n}   // деструктор отпустит, если владеет\n\nbool maybe(const char* s) {\n    std::unique_lock lk(m, std::try_to_lock);\n    if (!lk.owns_lock()) return false;  // занято - не ждём\n    journal += s;\n    return true;\n}\n\nstd::unique_lock<std::mutex> acquire() {\n    std::unique_lock lk(m);\n    return lk;                        // movable: отдаём владение\n}\n\nint main() {\n    std::thread a(process);\n    std::this_thread::sleep_for(50ms);  // a спит без замка\n    maybe(\"t\");                         // вклинились между x и y\n    a.join();\n\n    auto lk = acquire();                // замок теперь у main\n    bool got = true;\n    std::thread b([&got] { got = maybe(\"?\"); });\n    b.join();                           // b не стал ждать\n    journal += \"!\";\n    lk.unlock();\n    std::cout << journal << '\\n';\n    std::cout << \"b got lock: \" << got << '\\n';\n}", "expect": "xty!\nb got lock: 0"}, {"type": "list", "items": ["`xty`, а не `xyt`: пока `process` спал без замка, `main` успел вписать `t`. Отпустили замок - любой может зайти.", "После повторного `lock()` нельзя полагаться на то, что видели до `unlock()`: состояние могло измениться. Перепроверяйте.", "`b got lock: 0`: замок держал `main`, и `try_to_lock` сразу вернул \"не получилось\", не дожидаясь.", "Порядок держится на паузах 50 и 200 мс - это демонстрация, не способ синхронизации. Правильные способы - в уроке про condition_variable."]}, {"type": "p", "text": "Тэги конструктора `unique_lock`:"}, {"type": "list", "items": ["`std::defer_lock` - связать с мьютексом, но не захватывать (потом `std::lock(l1, l2)` или `lk.lock()`).", "`std::try_to_lock` - попробовать `try_lock()`, результат в `owns_lock()`.", "`std::adopt_lock` - мьютекс уже захвачен, просто принять владение."]}, {"type": "p", "text": "`std::scoped_lock` (C++17) принимает сколько угодно мьютексов и захватывает их алгоритмом без дедлока (как `std::lock`). С одним мьютексом - то же, что `lock_guard`. На собеседовании это выбор по умолчанию."}, {"type": "code", "code": "#include <iostream>\n#include <mutex>\n#include <utility>\n\nstruct Box {\n    std::mutex m;\n    int value = 0;\n};\n\nvoid swap_values(Box& a, Box& b) {\n    if (&a == &b) return;               // один мьютекс дважды - UB\n    std::scoped_lock lk(a.m, b.m);      // оба, без дедлока\n    std::swap(a.value, b.value);\n}\n\nvoid swap_values_old(Box& a, Box& b) {  // то же до C++17\n    if (&a == &b) return;\n    std::unique_lock la(a.m, std::defer_lock);\n    std::unique_lock lb(b.m, std::defer_lock);\n    std::lock(la, lb);\n    std::swap(a.value, b.value);\n}\n\nint main() {\n    Box x, y;\n    x.value = 1;\n    swap_values(x, y);\n    std::cout << x.value << ' ' << y.value << '\\n';\n    swap_values_old(x, y);\n    std::cout << x.value << ' ' << y.value << '\\n';\n}", "expect": "0 1\n1 0"}, {"type": "list", "items": ["`lock_guard` - самый простой, без unlock.", "`unique_lock` - гибкий, обязателен для `condition_variable`.", "`scoped_lock` - несколько мьютексов сразу.", "`shared_lock` - разделяемый захват `shared_mutex`.", "`std::timed_mutex` + `try_lock_for` - захват с таймаутом."]}, {"type": "warn", "text": "Повторный `lock()` нерекурсивного `std::mutex` тем же потоком - UB (на практике вечное зависание). `unlock()` из потока, который не владеет мьютексом, - тоже UB."}, {"type": "tip", "text": "Вслух: \"Этот мьютекс защищает поля X и Y, инвариант такой-то. Критическую секцию держу маленькой: под замком только изменение структуры, никакого I/O\". Подпишите поля комментарием `// guarded by m_`."}]}, {"id": "mt-deadlock", "title": "Дедлоки: условия, порядок захвата, recursive_mutex", "blocks": [{"type": "p", "text": "Дедлок возможен только при одновременном выполнении четырёх условий Коффмана. Чтобы его не было, достаточно сломать любое одно."}, {"type": "list", "items": ["Взаимное исключение (mutual exclusion): ресурс держит один поток.", "Удержание и ожидание (hold and wait): держу один замок и жду другой.", "Нет вытеснения (no preemption): замок нельзя отобрать силой.", "Циклическое ожидание (circular wait): A ждёт B, B ждёт A."]}, {"type": "p", "text": "На практике ломают циклическое ожидание: все берут замки в одном глобальном порядке. Или берут несколько замков атомарно через `std::scoped_lock`/`std::lock` (они ломают \"hold and wait\": если второй не взялся, первый отпускается)."}, {"type": "code", "code": "#include <iostream>\n#include <mutex>\n#include <thread>\n\nstruct Account {\n    explicit Account(int i) : id(i) {}\n    int id;\n    std::mutex m;\n    long balance = 0;\n};\n\n// ДЕДЛОК: transfer_bad(a, b) и transfer_bad(b, a) одновременно\nvoid transfer_bad(Account& from, Account& to, long sum) {\n    std::lock_guard l1(from.m);\n    std::lock_guard l2(to.m);  // ждём, держа from.m\n    from.balance -= sum;\n    to.balance += sum;\n}\n\n// Вариант 1: атомарный захват обоих\nvoid transfer(Account& from, Account& to, long sum) {\n    if (&from == &to) return;\n    std::scoped_lock lk(from.m, to.m);\n    from.balance -= sum;\n    to.balance += sum;\n}\n\n// Вариант 2: глобальный порядок по id\nvoid transfer_ordered(Account& from, Account& to, long sum) {\n    if (&from == &to) return;\n    Account& first = from.id < to.id ? from : to;\n    Account& second = from.id < to.id ? to : from;\n    std::lock_guard l1(first.m);\n    std::lock_guard l2(second.m);\n    from.balance -= sum;\n    to.balance += sum;\n}\n\nint main() {\n    Account a(1), b(2);\n    a.balance = b.balance = 1000;\n    std::thread t1([&] {\n        for (int i = 0; i < 10000; ++i) transfer(a, b, 1);\n    });\n    std::thread t2([&] {\n        for (int i = 0; i < 10000; ++i) transfer_ordered(b, a, 1);\n    });\n    t1.join();\n    t2.join();\n    std::cout << a.balance + b.balance << '\\n';\n}", "expect": "2000"}, {"type": "p", "text": "TSan умеет ловить и потенциальные дедлоки: если один поток брал A, потом B, а другой - B, потом A, он сообщит \"lock-order-inversion\", даже если зависания в этом прогоне не случилось."}, {"type": "code", "code": "#include <mutex>\n#include <thread>\n\nstd::mutex a, b;\n\nint main() {\n    std::thread t1([] {\n        std::lock_guard la(a);\n        std::lock_guard lb(b);\n    });\n    t1.join();\n    std::thread t2([] {\n        std::lock_guard lb(b);\n        std::lock_guard la(a);  // обратный порядок\n    });\n    t2.join();\n}", "mode": "tsan"}, {"type": "p", "text": "Скрытый дедлок номер один - вызов чужого кода под замком. Колбэк может вызвать метод того же объекта и попытаться взять тот же мьютекс. Правило: под замком копируем то, что нужно, а вызываем без замка."}, {"type": "code", "code": "#include <functional>\n#include <iostream>\n#include <mutex>\n#include <vector>\n\nclass Subscribers {\npublic:\n    using Handler = std::function<void(int)>;\n\n    void subscribe(Handler h) {\n        std::lock_guard lk(m_);\n        subs_.push_back(std::move(h));\n    }\n    void publish_bad(int ev) {\n        std::lock_guard lk(m_);\n        for (auto& h : subs_) h(ev);  // h -> subscribe -> дедлок\n    }\n    void publish(int ev) {\n        std::vector<Handler> copy;\n        {\n            std::lock_guard lk(m_);\n            copy = subs_;             // копия под замком\n        }\n        for (auto& h : copy) h(ev);   // вызов без замка\n    }\n\nprivate:\n    std::mutex m_;\n    std::vector<Handler> subs_;\n};\n\nint main() {\n    Subscribers s;\n    s.subscribe([&s](int ev) {\n        std::cout << \"event \" << ev << '\\n';\n        s.subscribe([](int) {});      // реентерабельный вызов\n    });\n    s.publish(1);\n    s.publish(2);\n}", "expect": "event 1\nevent 2"}, {"type": "p", "text": "`std::recursive_mutex` разрешает тому же потоку захватить мьютекс повторно. Это почти всегда запах: значит, публичный метод вызывает другой публичный метод в момент, когда инвариант может быть нарушен. Правильный рефакторинг - приватные методы `*_locked`, которые требуют, чтобы замок уже был взят."}, {"type": "code", "code": "#include <cstddef>\n#include <iostream>\n#include <mutex>\n#include <unordered_map>\n#include <utility>\n#include <vector>\n\nclass Cache {\npublic:\n    void put(int k, int v) {\n        std::lock_guard lk(m_);\n        put_locked(k, v);\n    }\n    void put_many(const std::vector<std::pair<int, int>>& kv) {\n        std::lock_guard lk(m_);\n        for (auto& [k, v] : kv) put_locked(k, v);  // не put()!\n    }\n    std::size_t size() {\n        std::lock_guard lk(m_);\n        return data_.size();\n    }\n\nprivate:\n    void put_locked(int k, int v) { data_[k] = v; }  // нужен m_\n\n    std::mutex m_;\n    std::unordered_map<int, int> data_;\n};\n\nint main() {\n    Cache c;\n    c.put(1, 1);\n    c.put_many({{2, 2}, {3, 3}});\n    std::cout << c.size() << '\\n';\n}", "expect": "3"}, {"type": "list", "items": ["`join()` потока под замком, который нужен этому потоку - дедлок.", "`future.get()` под замком, если задача-производитель берёт тот же замок - дедлок.", "Пул из N потоков, где задачи ждут результатов других задач того же пула: когда все N воркеров ждут, выполнять некому (starvation deadlock).", "`std::scoped_lock(m, m)` или `transfer(a, a)` - один мьютекс дважды, UB."]}, {"type": "tip", "text": "Вслух: \"Замки беру в фиксированном порядке (по id) или одним scoped_lock. Под замком не вызываю колбэки, не жду future, не делаю join и I/O\"."}]}, {"id": "mt-shared", "title": "shared_mutex: читатели и писатели (read/write lock)", "blocks": [{"type": "p", "text": "`std::shared_mutex` (C++17) даёт два режима: разделяемый (`std::shared_lock`) - много читателей одновременно, и эксклюзивный (`std::unique_lock` или `lock_guard`) - один писатель."}, {"type": "code", "code": "#include <iostream>\n#include <mutex>\n#include <shared_mutex>\n#include <string>\n#include <thread>\n#include <unordered_map>\n#include <vector>\n\nclass Config {\npublic:\n    std::string get(const std::string& key) const {\n        std::shared_lock lk(m_);  // читатели не мешают друг другу\n        auto it = data_.find(key);\n        return it == data_.end() ? \"\" : it->second;\n    }\n    void set(std::string key, std::string value) {\n        std::unique_lock lk(m_);  // писатель - эксклюзивно\n        data_[std::move(key)] = std::move(value);\n    }\n\nprivate:\n    mutable std::shared_mutex m_;\n    std::unordered_map<std::string, std::string> data_;\n};\n\nint main() {\n    Config cfg;\n    cfg.set(\"mode\", \"safe\");\n    std::vector<std::thread> readers;\n    for (int i = 0; i < 4; ++i)\n        readers.emplace_back([&] {\n            for (int j = 0; j < 1000; ++j) (void)cfg.get(\"mode\");\n        });\n    std::thread writer([&] { cfg.set(\"mode\", \"fast\"); });\n    for (auto& t : readers) t.join();\n    writer.join();\n    std::cout << cfg.get(\"mode\") << '\\n';\n}", "expect": "fast"}, {"type": "p", "text": "Когда это окупается:"}, {"type": "list", "items": ["Чтений намного больше, чем записей.", "Критическая секция чтения не микроскопическая (поиск в большой мапе, обход структуры).", "Много ядер реально читают параллельно."]}, {"type": "warn", "text": "Если секция - чтение одного int, `shared_mutex` часто медленнее обычного `mutex`: каждый `shared_lock` - атомарная запись в общий счётчик читателей, кэш-линия скачет между ядрами. Честный ответ на собеседовании: \"измерю под нагрузкой\". Ещё один нюанс - политика приоритета (могут ли писатели голодать) зависит от реализации."}, {"type": "p", "text": "Апгрейда shared -> exclusive нет. Держа `shared_lock` и пытаясь взять `unique_lock` того же мьютекса, поток ждёт сам себя. Правильно: отпустить чтение, взять запись и перепроверить условие - кто-то мог успеть раньше."}, {"type": "code", "code": "#include <iostream>\n#include <mutex>\n#include <shared_mutex>\n#include <string>\n#include <unordered_map>\n\nclass LazyCache {\npublic:\n    std::string get_or_load(const std::string& key) {\n        {\n            std::shared_lock lk(m_);\n            auto it = data_.find(key);\n            if (it != data_.end()) return it->second;\n        }   // отпустили shared\n        std::unique_lock lk(m_);\n        auto it = data_.find(key);   // перепроверка!\n        if (it != data_.end()) return it->second;\n        std::string v = load(key);   // долго под эксклюзивом\n        data_.emplace(key, v);\n        return v;\n    }\n    int loads() {\n        std::shared_lock lk(m_);\n        return loads_;\n    }\n\nprivate:\n    std::string load(const std::string& k) {  // вызывать под m_\n        ++loads_;\n        return k + \"!\";\n    }\n\n    std::shared_mutex m_;\n    std::unordered_map<std::string, std::string> data_;\n    int loads_ = 0;  // guarded by m_\n};\n\nint main() {\n    LazyCache c;\n    std::cout << c.get_or_load(\"a\") << ' ' << c.get_or_load(\"a\")\n              << \" loads=\" << c.loads() << '\\n';\n}", "expect": "a! a! loads=1"}, {"type": "p", "text": "Для конфигов, которые читаются на каждом запросе и меняются раз в минуту, часто лучше copy-on-write снапшот: читатель под коротким замком копирует `shared_ptr` на неизменяемый объект и дальше работает без замков. Писатель собирает новый объект целиком и подменяет указатель."}, {"type": "code", "code": "#include <iostream>\n#include <memory>\n#include <mutex>\n#include <string>\n#include <unordered_map>\n\nusing Settings = std::unordered_map<std::string, std::string>;\n\nclass ConfigHolder {\npublic:\n    std::shared_ptr<const Settings> get() const {\n        std::lock_guard lk(m_);\n        return cur_;  // копия shared_ptr: атомарный инкремент\n    }\n    void update(std::shared_ptr<const Settings> next) {\n        {\n            std::lock_guard lk(m_);\n            cur_.swap(next);\n        }   // старый объект умрёт здесь, вне замка\n    }\n\nprivate:\n    mutable std::mutex m_;\n    std::shared_ptr<const Settings> cur_ =\n        std::make_shared<const Settings>();\n};\n\nint main() {\n    ConfigHolder h;\n    auto old = h.get();   // снапшот до обновления\n    auto s = std::make_shared<Settings>();\n    (*s)[\"mode\"] = \"fast\";\n    h.update(std::move(s));\n    auto snap = h.get();  // работаем со снапшотом без замка\n    std::cout << old->size() << ' ' << snap->at(\"mode\") << '\\n';\n}", "expect": "0 fast"}, {"type": "tip", "text": "Вслух: \"Read-mostly - выбираю между shared_mutex и copy-on-write снапшотом. Для частого чтения редко меняющегося конфига - снапшот через shared_ptr (в C++20 - `std::atomic<std::shared_ptr>`)\"."}]}, {"id": "mt-condvar", "title": "condition_variable: ждать правильно", "blocks": [{"type": "p", "text": "Условная переменная - это способ уснуть, пока не изменится состояние, защищённое мьютексом. Сама по себе она ничего не хранит: состояние - это ваши переменные, cv - только \"звонок\". Схема всегда одна: ждущий проверяет предикат под мьютексом; сигналящий меняет состояние под тем же мьютексом и потом зовёт notify."}, {"type": "code", "code": "#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <string>\n#include <thread>\n\nstd::mutex m;\nstd::condition_variable cv;\nbool ready = false;   // guarded by m\nstd::string payload;  // guarded by m\n\nint main() {\n    std::thread consumer([] {\n        std::unique_lock lk(m);\n        cv.wait(lk, [] { return ready; });  // предикат обязателен\n        std::cout << \"got \" << payload << '\\n';\n    });\n\n    {\n        std::lock_guard lk(m);\n        payload = \"data\";\n        ready = true;     // меняем состояние ПОД замком\n    }\n    cv.notify_one();      // звоним после unlock\n    consumer.join();\n}", "expect": "got data"}, {"type": "p", "text": "`cv.wait(lk, pred)` эквивалентен циклу:"}, {"type": "code", "code": "#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nstd::mutex m;\nstd::condition_variable cv;\nbool ready = false;  // guarded by m\n\nint main() {\n    std::thread t([] {\n        std::lock_guard lk(m);\n        ready = true;\n        cv.notify_one();\n    });\n    std::unique_lock lk(m);\n    auto pred = [] { return ready; };\n    // то же самое, что cv.wait(lk, pred):\n    while (!pred()) {\n        cv.wait(lk);  // атомарно: unlock + сон; проснулись - lock\n    }\n    std::cout << \"ready\\n\";\n    lk.unlock();\n    t.join();\n}", "expect": "ready"}, {"type": "p", "text": "Почему цикл, а не `if`:"}, {"type": "list", "items": ["Spurious wakeup: `wait` может вернуться без всякого notify. Это разрешено стандартом.", "Украденное пробуждение: вас разбудили, но пока вы ждали мьютекс, другой потребитель уже забрал элемент.", "Lost wakeup: notify пришёл раньше, чем вы начали ждать. Без предиката вы уснёте навсегда; с предикатом увидите `ready == true` и не уснёте вообще."]}, {"type": "warn", "text": "Состояние нужно менять под тем же мьютексом, даже если флаг `std::atomic<bool>`. Иначе возможно: ждущий проверил предикат (false), ещё не уснул; сигналящий записал true и позвал notify; ждущий засыпает и пропускает сигнал навсегда. Мьютекс делает \"проверить и уснуть\" атомарным относительно \"изменить и позвать\"."}, {"type": "code", "code": "#include <atomic>\n#include <chrono>\n#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nusing namespace std::chrono_literals;\n\nstd::mutex m;\nstd::condition_variable cv;\nstd::atomic<bool> flag{false};\nstd::atomic<bool> checked{false};  // только для демо\n\n// Окно \"проверил предикат, ещё не уснул\" растянуто sleep'ом,\n// чтобы баг воспроизводился каждый раз.\nconst char* waiter() {\n    std::unique_lock lk(m);\n    if (flag.load()) return \"no wait\";\n    checked = true;\n    std::this_thread::sleep_for(20ms);   // окно\n    auto st = cv.wait_for(lk, 200ms);    // таймаут вместо вечности\n    return st == std::cv_status::timeout ? \"timeout\" : \"woken\";\n}\n\nvoid run(bool under_mutex) {\n    flag = false;\n    checked = false;\n    std::thread s([under_mutex] {\n        while (!checked) {}\n        if (under_mutex) {\n            std::lock_guard lk(m);  // ждёт, пока waiter уснёт\n            flag = true;\n        } else {\n            flag = true;            // БАГ: без мьютекса\n        }\n        cv.notify_one();\n    });\n    std::cout << waiter() << '\\n';\n    s.join();\n}\n\nint main() {\n    run(false);  // notify ушёл в пустоту: lost wakeup\n    run(true);   // под мьютексом сигнал не теряется\n}", "expect": "timeout\nwoken"}, {"type": "p", "text": "notify под замком или после? Оба варианта корректны. После unlock обычно чуть эффективнее: разбуженный поток не упирается сразу в занятый мьютекс. Под замком нужно звать, если cv может быть уничтожена сразу после того, как ждущий увидит состояние (например, cv живёт в объекте, который ждущий удалит)."}, {"type": "p", "text": "notify_one или notify_all:"}, {"type": "list", "items": ["`notify_one` - когда все ждущие ждут одного и того же, и одно изменение может обработать любой один (положили один элемент).", "`notify_all` - когда изменение важно всем (закрыли очередь, shutdown) или когда на одной cv ждут разные предикаты: notify_one может разбудить \"не того\", он снова уснёт, а нужный не проснётся.", "Два cv (`not_empty`, `not_full`) - способ будить точно тех, кого надо, без \"стада\" notify_all."]}, {"type": "p", "text": "Ожидание с таймаутом. `wait_for(lk, dur, pred)` возвращает значение предиката: `false` значит \"таймаут, и условие так и не выполнилось\". Без предиката возвращается `std::cv_status`. Для повторных ожиданий с общим дедлайном используйте `wait_until`."}, {"type": "code", "code": "#include <chrono>\n#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nusing namespace std::chrono_literals;\n\nclass Event {  // одноразовое событие\npublic:\n    void set() {\n        {\n            std::lock_guard lk(m_);\n            set_ = true;\n        }\n        cv_.notify_all();  // важно всем ждущим\n    }\n    void wait() {\n        std::unique_lock lk(m_);\n        cv_.wait(lk, [this] { return set_; });\n    }\n    bool wait_for(std::chrono::milliseconds t) {\n        std::unique_lock lk(m_);\n        return cv_.wait_for(lk, t, [this] { return set_; });\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable cv_;\n    bool set_ = false;\n};\n\nint main() {\n    Event e;\n    std::cout << e.wait_for(10ms) << '\\n';  // таймаут\n    std::thread t([&] { e.set(); });\n    e.wait();\n    std::cout << e.wait_for(10ms) << '\\n';  // уже установлено\n    t.join();\n}", "expect": "0\n1"}, {"type": "p", "text": "Счётчик-защёлка: дождаться, пока N потоков отчитаются. В C++20 есть готовые `std::latch` и `std::barrier`, но на собеседовании просят написать руками."}, {"type": "code", "code": "#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <thread>\n#include <vector>\n\nclass CountDownLatch {\npublic:\n    explicit CountDownLatch(int n) : count_(n) {}\n\n    void count_down() {\n        std::lock_guard lk(m_);\n        if (count_ > 0 && --count_ == 0)\n            cv_.notify_all();  // под замком: см. ниже\n    }\n    void wait() {\n        std::unique_lock lk(m_);\n        cv_.wait(lk, [this] { return count_ == 0; });\n    }\n\nprivate:\n    std::mutex m_;\n    std::condition_variable cv_;\n    int count_;\n};\n\nint main() {\n    CountDownLatch done(3);\n    std::vector<std::thread> ts;\n    for (int i = 0; i < 3; ++i)\n        ts.emplace_back([&] { done.count_down(); });\n    done.wait();\n    std::cout << \"all done\\n\";\n    for (auto& t : ts) t.join();\n}", "expect": "all done"}, {"type": "p", "text": "Здесь notify под замком не случайно: после `wait()` main может сразу уничтожить latch. Если бы последний поток звал notify после unlock, он мог бы обратиться к уже разрушенной cv."}, {"type": "list", "items": ["`std::condition_variable` работает только с `std::unique_lock<std::mutex>`. Для `shared_lock` или своего мьютекса - `std::condition_variable_any`.", "C++20: `std::counting_semaphore`/`std::binary_semaphore`, `std::latch`, `std::barrier`, `std::atomic::wait/notify`."]}, {"type": "tip", "text": "Вслух: \"Предикат такой-то, он читает только данные под этим мьютексом. Кто его меняет - меняет под замком и зовёт notify. На shutdown - notify_all, и предикат учитывает флаг закрытия, иначе ждущие не проснутся\"."}]}, {"id": "mt-jthread", "title": "std::jthread и stop_token (C++20)", "blocks": [{"type": "p", "text": "`std::jthread` - это `std::thread`, который в деструкторе делает `request_stop()` и затем `join()`. Плюс встроенная кооперативная отмена: если первый параметр функции - `std::stop_token`, jthread передаст его сам."}, {"type": "code", "code": "#include <chrono>\n#include <iostream>\n#include <thread>\n\nusing namespace std::chrono_literals;\n\nint main() {\n    std::jthread worker([](std::stop_token st) {\n        int ticks = 0;\n        while (!st.stop_requested()) {\n            ++ticks;\n            std::this_thread::sleep_for(5ms);\n        }\n        std::cout << \"stopped, ticks>0: \" << (ticks > 0) << '\\n';\n    });\n    std::this_thread::sleep_for(30ms);\n}   // ~jthread: request_stop(), потом join()", "expect": "stopped, ticks>0: 1"}, {"type": "warn", "text": "Отмена кооперативная. `request_stop()` только выставляет флаг и вызывает зарегистрированные колбэки. Если функция потока не проверяет токен (или вообще его не принимает), деструктор jthread будет ждать вечно. Поток никто не \"убивает\"."}, {"type": "p", "text": "Ожидание на условной переменной тоже можно сделать прерываемым: `std::condition_variable_any::wait(lock, stop_token, pred)` просыпается и по notify, и по запросу остановки. Возвращает значение предиката."}, {"type": "code", "code": "#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <queue>\n#include <thread>\n\nint main() {\n    std::mutex m;\n    std::condition_variable_any cv;\n    std::queue<int> q;\n\n    // jthread объявлен ПОСЛЕ m, cv, q: разрушится раньше них\n    std::jthread consumer([&](std::stop_token st) {\n        while (true) {\n            std::unique_lock lk(m);\n            if (!cv.wait(lk, st, [&] { return !q.empty(); }))\n                return;  // остановка запрошена и данных нет\n            int v = q.front();\n            q.pop();\n            lk.unlock();\n            std::cout << \"got \" << v << '\\n';\n        }\n    });\n\n    for (int i = 0; i < 3; ++i) {\n        {\n            std::lock_guard lk(m);\n            q.push(i);\n        }\n        cv.notify_one();\n    }\n}   // request_stop разбудит consumer, он доест очередь и выйдет", "expect": "got 0\ngot 1\ngot 2"}, {"type": "p", "text": "`std::stop_source` - \"пульт\", `std::stop_token` - \"наблюдатель\", `std::stop_callback` - функция, которая вызовется при остановке. Если остановка уже запрошена, колбэк выполнится сразу в конструкторе."}, {"type": "code", "code": "#include <iostream>\n#include <stop_token>\n\nint main() {\n    std::stop_source src;\n    std::stop_callback cb(src.get_token(), [] {\n        std::cout << \"cancel: close socket\\n\";\n    });\n    std::cout << \"working\\n\";\n    src.request_stop();  // колбэк вызовется здесь, в этом потоке\n    std::cout << src.stop_requested() << '\\n';\n}", "expect": "working\ncancel: close socket\n1"}, {"type": "p", "text": "Порядок членов класса важен. Члены разрушаются в обратном порядке объявления, поэтому поток, использующий другие поля, объявляйте последним: он стартует последним и остановится первым."}, {"type": "code", "code": "#include <chrono>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nclass Service {\npublic:\n    Service() : worker_([this](std::stop_token st) { loop(st); }) {}\n\n    long ticks() {\n        std::lock_guard lk(m_);\n        return ticks_;\n    }\n\nprivate:\n    void loop(std::stop_token st) {\n        while (!st.stop_requested()) {\n            std::lock_guard lk(m_);\n            ++ticks_;\n        }\n    }\n\n    std::mutex m_;\n    long ticks_ = 0;       // guarded by m_\n    std::jthread worker_;  // последним: умрёт первым\n};\n\nint main() {\n    Service s;\n    std::this_thread::sleep_for(std::chrono::milliseconds(5));\n    std::cout << (s.ticks() > 0) << '\\n';\n}   // ~Service: сначала ~jthread (stop + join), потом m_", "expect": "1"}, {"type": "tip", "text": "Вслух: \"Беру jthread: join в деструкторе гарантирован, остановка - через stop_token. Поле с потоком объявляю последним, чтобы оно разрушалось раньше данных, которые поток использует\"."}]}, {"id": "mt-cpp20sync", "title": "latch, barrier, semaphore, atomic wait (C++20)", "blocks": [{"type": "p", "text": "В C++20 появились четыре примитива, которые раньше писали руками на mutex + condition_variable: `std::latch`, `std::barrier`, семафоры и `atomic::wait`. Заголовки `<latch>`, `<barrier>`, `<semaphore>`, `<atomic>`. Каждый решает одну узкую задачу, зато проще и обычно дешевле: на Linux внутри futex, а не мьютекс."}, {"type": "p", "text": "`std::latch` - одноразовый счётчик вниз. `count_down()` уменьшает и не ждёт, `wait()` ждёт нуля, `arrive_and_wait()` - оба сразу. Обратно счётчик не взводится. Два типичных применения: стартовый пистолет (все потоки стартуют одновременно - так пишут честные стресс-тесты) и \"дождаться, пока N закончат\" (аналог `WaitGroup` из Go)."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <latch>\n#include <thread>\n#include <vector>\n\nint main() {\n    const int n = 4;\n    std::latch ready(n);   // все воркеры на старте\n    std::latch start(1);   // стартовый пистолет\n    std::latch done(n);    // все закончили\n    std::atomic<bool> fired{false};\n    std::atomic<int> early{0};\n\n    std::vector<std::jthread> ts;\n    for (int i = 0; i < n; ++i)\n        ts.emplace_back([&] {\n            ready.count_down();   // \"я готов\", не ждёт\n            start.wait();         // ждём выстрела\n            if (!fired) ++early;  // стартовал раньше?\n            done.count_down();\n        });\n\n    ready.wait();         // все n потоков созданы и ждут\n    fired = true;\n    start.count_down();   // 1 -> 0: все стартуют разом\n    done.wait();          // как WaitGroup.Wait() в Go\n    std::cout << \"early starts: \" << early << '\\n';\n}\n", "mode": "gcc", "expect": "early starts: 0"}, {"type": "list", "items": ["`CountDownLatch` из урока про condition_variable - это ручная версия `std::latch`.", "`count_down(n)` больше, чем осталось в счётчике, - UB. Повторно использовать latch нельзя: после нуля `wait()` возвращается сразу.", "`try_wait()` - проверить без ожидания. Таймаутов у latch нет."]}, {"type": "p", "text": "`std::barrier` - многоразовый. Есть N участников, каждый зовёт `arrive_and_wait()`. Когда пришёл последний, выполняется функция завершения (completion): ровно один раз, в одном из потоков-участников, пока остальные ещё стоят. Потом все отпускаются, и начинается следующая фаза. Типичное применение - итеративный алгоритм: шаг k+1 нельзя начинать, пока все не дописали шаг k (симуляция, Jacobi, параллельный BFS по уровням)."}, {"type": "code", "code": "#include <barrier>\n#include <iostream>\n#include <numeric>\n#include <thread>\n#include <vector>\n\nint main() {\n    const int workers = 4, steps = 3;\n    std::vector<int> cur(8, 1), next(8);\n    int phase = 0;\n\n    // completion: выполняет ОДИН поток, остальные ждут\n    auto on_phase = [&]() noexcept {\n        cur.swap(next);\n        int sum = std::accumulate(cur.begin(), cur.end(), 0);\n        std::cout << \"phase \" << phase++ << \" sum \" << sum << '\\n';\n    };\n    std::barrier sync(workers, on_phase);\n\n    std::vector<std::jthread> ts;\n    for (int w = 0; w < workers; ++w)\n        ts.emplace_back([&, w] {\n            for (int s = 0; s < steps; ++s) {\n                for (int i = 2 * w; i < 2 * w + 2; ++i)\n                    next[i] = cur[i] * 2;  // только свой кусок\n                sync.arrive_and_wait();    // фаза s закончена\n            }\n        });\n}   // ts разрушается раньше sync: потоки уже вышли\n", "mode": "tsan", "expect": "phase 0 sum 16\nphase 1 sum 32\nphase 2 sum 64"}, {"type": "p", "text": "TSan молчит, хотя completion читает весь `next`, а воркеры его пишут. Барьер даёт happens-before: всё, что участники сделали до `arrive`, видно в completion; всё, что сделал completion, видно участникам после выхода из `wait`. Поэтому `swap` буферов и печать безопасны без мьютекса."}, {"type": "list", "items": ["Completion по стандарту должен быть `noexcept` (gcc 14 это не проверяет). Бросать из него нельзя: обрабатывайте ошибки внутри.", "`arrive_and_drop()` - участник уходит навсегда: со следующей фазы барьер ждёт на одного меньше.", "`arrive()` возвращает токен, `wait(std::move(token))` ждёт по нему: можно отметиться, сделать независимую работу и только потом ждать.", "Таймаутов нет. Если один участник упал с исключением и не дошёл до барьера, остальные ждут вечно."]}, {"type": "p", "text": "Семафор - счётчик разрешений. `std::counting_semaphore<Max>`: `acquire()` ждёт, пока счётчик больше нуля, и уменьшает его; `release(n = 1)` увеличивает и будит ждущих. Есть `try_acquire()`, `try_acquire_for()`, `try_acquire_until()`. `std::binary_semaphore` - это `counting_semaphore<1>`. Типичная задача: не больше N одновременных операций - соединений с БД, запросов к внешнему API, тяжёлых задач."}, {"type": "code", "code": "#include <atomic>\n#include <chrono>\n#include <iostream>\n#include <semaphore>\n#include <thread>\n#include <vector>\n\nusing namespace std::chrono_literals;\n\nstd::counting_semaphore<3> db_slots(3);  // 3 соединения\nstd::atomic<int> in_flight{0}, peak{0};\n\n// В стандарте нет RAII-гарда для семафора - пишем сами\nstruct Permit {\n    explicit Permit(std::counting_semaphore<3>& s) : s_(s) {\n        s_.acquire();\n    }\n    ~Permit() { s_.release(); }\n    Permit(const Permit&) = delete;\n    Permit& operator=(const Permit&) = delete;\n    std::counting_semaphore<3>& s_;\n};\n\nvoid query() {\n    Permit p(db_slots);          // ждём свободный слот\n    int now = ++in_flight;\n    int old = peak.load();\n    while (old < now && !peak.compare_exchange_weak(old, now)) {}\n    std::this_thread::sleep_for(20ms);  // \"запрос в БД\"\n    --in_flight;\n}\n\nint main() {\n    {\n        std::vector<std::jthread> ts;\n        for (int i = 0; i < 10; ++i) ts.emplace_back(query);\n    }\n    std::cout << \"peak \" << peak << '\\n';  // не больше 3\n}\n", "mode": "gcc"}, {"type": "warn", "text": "Семафор - не мьютекс. У него нет владельца: `release()` может вызвать любой поток, даже тот, кто не делал `acquire()`. Это удобно для сигналов между потоками (пинг-понг в задачах раздела), но защиты от ошибок нет: лишний `release` молча добавит разрешение (а сверх `max()` - UB). RAII-гарда в стандарте нет, `condition_variable` с семафором не работает."}, {"type": "p", "text": "`std::atomic<T>::wait(old)` блокирует поток, пока значение равно `old` (сравнение побайтное). `notify_one()` / `notify_all()` будят ждущих. Ложные пробуждения обработаны внутри: `wait` возвращается только увидев значение, отличное от `old`. Это futex для всех: без мьютекса, без cv и без busy-wait. Есть и у `std::atomic_flag`."}, {"type": "code", "code": "#include <atomic>\n#include <iostream>\n#include <thread>\n\nstd::atomic<int> state{0};  // 0 - пусто, 1 - готово\nint payload = 0;            // пишется до store(1)\n\nint main() {\n    std::thread consumer([] {\n        state.wait(0);      // спит, пока state == 0\n        std::cout << \"got \" << payload << '\\n';\n    });\n    payload = 42;\n    state.store(1);         // seq_cst: публикует payload\n    state.notify_one();     // без него consumer может не проснуться\n    consumer.join();\n}\n", "mode": "tsan", "expect": "got 42"}, {"type": "list", "items": ["Порядок: сначала изменить значение, потом notify. Notify без изменения бесполезен, изменение без notify может оставить ждущего спать навсегда.", "Если значение успело смениться и вернуться к `old` (ABA), ждущий может этого не заметить и спать дальше.", "Предиката и таймаута нет: ждём ровно \"значение != old\". Для условия на нескольких переменных - mutex + cv."]}, {"type": "p", "text": "Что выбрать:"}, {"type": "list", "items": ["Один раз дождаться N событий или стартовать всех разом - `latch`.", "Повторяющиеся фазы с одними и теми же участниками - `barrier`.", "Ограничить число одновременных входов, пул ресурсов - `counting_semaphore`.", "Уснуть до изменения одного флага или счётчика - `atomic::wait`.", "Условие над несколькими полями (\"не пусто или закрыто\"), ожидание с предикатом и таймаутом, отмена по `stop_token` - mutex + `condition_variable(_any)`.", "Нужен таймаут - только семафор (`try_acquire_for`) или cv. У latch, barrier и `atomic::wait` таймаутов нет."]}, {"type": "tip", "text": "Вслух: \"Это CountDownLatch, в C++20 есть std::latch; если надо руками - счётчик под мьютексом и cv с notify_all на нуле\". И отдельно: \"Семафор - счётчик разрешений без владельца, мьютекс - замок с владельцем. Для лимита параллелизма беру counting_semaphore, для защиты данных - mutex\"."}]}, {"id": "mt-monitor", "title": "Монитор: объект, который сам себя защищает", "blocks": [{"type": "p", "text": "Монитор - паттерн 70-х (Хоар, Бринч Хансен): все данные объекта приватные, каждый публичный метод выполняется под одним внутренним мьютексом, а для ожидания \"пока не станет можно\" есть условные переменные. Снаружи объект выглядит как обычный, синхронизация спрятана внутри. В Java это встроено в язык: `synchronized`-методы плюс `wait`/`notify` у каждого объекта. В C++ пишем руками: приватный mutex + cv."}, {"type": "p", "text": "Правила монитора:"}, {"type": "list", "items": ["Все поля приватные, мьютекс тоже. Комментарий `// guarded by m_` у каждого поля.", "Каждый публичный метод берёт замок в начале и держит до конца: метод - одна критическая секция.", "Инвариант верен на входе и выходе каждого публичного метода. Внутри метода его можно временно нарушить - никто не увидит.", "Ожидание - только `cv.wait(lk, pred)` внутри метода. `wait` отпускает замок, и другие методы могут восстановить условие.", "Публичный метод не зовёт другой публичный метод того же объекта (повторный lock `std::mutex` - UB). Общую логику - в приватные `*_locked()`.", "Наружу не отдаются ссылки, указатели и итераторы на внутренние данные. Под замком не вызывается чужой код (колбэки, другие мониторы)."]}, {"type": "p", "text": "Монитор с условием: счёт, где `withdraw` ждёт, пока денег не станет достаточно. Ждущие ждут разных сумм, поэтому `deposit` зовёт `notify_all`: `notify_one` мог бы разбудить того, кому всё ещё не хватает, а тот, кому хватает, продолжил бы спать."}, {"type": "code", "code": "#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <thread>\n\nclass Account {  // монитор\npublic:\n    void deposit(long sum) {\n        {\n            std::lock_guard lk(m_);\n            balance_ += sum;\n        }\n        funds_.notify_all();  // ждущие ждут разных сумм\n    }\n\n    // блокируется, пока на счёте не станет >= sum\n    void withdraw(long sum) {\n        std::unique_lock lk(m_);\n        funds_.wait(lk, [&] { return balance_ >= sum; });\n        balance_ -= sum;\n    }\n\n    bool try_withdraw(long sum) {  // не ждёт\n        std::lock_guard lk(m_);\n        if (balance_ < sum) return false;\n        balance_ -= sum;\n        return true;\n    }\n\n    long balance() const {\n        std::lock_guard lk(m_);\n        return balance_;\n    }\n\nprivate:\n    mutable std::mutex m_;\n    std::condition_variable funds_;\n    long balance_ = 0;  // guarded by m_; инвариант: >= 0\n};\n\nint main() {\n    Account acc;\n    std::thread a([&] { acc.withdraw(70); });\n    std::thread b([&] { acc.withdraw(50); });\n    std::cout << acc.try_withdraw(1) << '\\n';  // денег нет\n    for (int i = 0; i < 12; ++i) acc.deposit(10);  // 120\n    a.join();\n    b.join();\n    std::cout << acc.balance() << '\\n';\n}\n", "mode": "tsan", "expect": "0\n0"}, {"type": "p", "text": "`BoundedQueue` из урока про очереди - тоже монитор: данные приватные, каждый метод под `m_`, два условия `not_full_` и `not_empty_`. Почти любая задача секции \"напиши потокобезопасный X\" - это задача \"напиши монитор\"."}, {"type": "warn", "text": "Монитор защищает инвариант, только если операции API совпадают с операциями предметной области. `get_balance()` + `set_balance()` - два атомарных вызова, но последовательность из двух вызовов не атомарна: это check-then-act из урока про гонки. Правильный API: `withdraw`, `transfer`, `try_pop`, `get_or_insert`."}, {"type": "p", "text": "Если клиенту нужна произвольная составная операция, дайте ему выполнить лямбду под замком. Так устроена обёртка `Synchronized<T>`: хранит T и мьютекс и не даёт добраться до T без замка. Готовые: `folly::Synchronized` (Facebook), `concurrent::Variable` в userver, `Mutex<T>` в Rust. Два стиля API: `with_lock(f)` - лямбда под замком; `wlock()` / `rlock()` - \"указатель с замком\", объект, который держит замок, пока жив, и даёт `->`."}, {"type": "code", "code": "#include <iostream>\n#include <map>\n#include <mutex>\n#include <shared_mutex>\n#include <string>\n#include <thread>\n#include <utility>\n#include <vector>\n\ntemplate <class T>\nclass Synchronized {\n    using WLock = std::unique_lock<std::shared_mutex>;\n    using RLock = std::shared_lock<std::shared_mutex>;\n\npublic:\n    // f выполняется под эксклюзивным замком\n    template <class F>\n    auto with_lock(F f) {\n        WLock lk(m_);\n        return f(value_);\n    }\n    template <class F>\n    auto with_rlock(F f) const {\n        RLock lk(m_);\n        return f(std::as_const(value_));\n    }\n\n    // \"указатель с замком\": держит замок, пока жив\n    template <class Lock, class V>\n    class Locked {\n    public:\n        Locked(std::shared_mutex& m, V& v) : lk_(m), v_(v) {}\n        V* operator->() { return &v_; }\n        V& operator*() { return v_; }\n\n    private:\n        Lock lk_;\n        V& v_;\n    };\n    auto wlock() { return Locked<WLock, T>(m_, value_); }\n    auto rlock() const {\n        return Locked<RLock, const T>(m_, value_);\n    }\n\nprivate:\n    mutable std::shared_mutex m_;\n    T value_{};  // без замка до него не добраться\n};\n\nint main() {\n    Synchronized<std::map<std::string, int>> hits;\n    {\n        std::vector<std::jthread> ts;\n        for (int i = 0; i < 4; ++i)\n            ts.emplace_back([&] {\n                for (int j = 0; j < 1000; ++j)\n                    hits.with_lock([](auto& m) { ++m[\"/\"]; });\n            });\n    }\n    hits.wlock()->emplace(\"/api\", 1);  // замок до конца `;`\n    std::cout << hits.rlock()->at(\"/\") << '\\n';\n    auto n = hits.with_rlock([](auto& m) { return m.size(); });\n    std::cout << n << '\\n';\n}\n", "mode": "tsan", "expect": "4000\n2"}, {"type": "warn", "text": "Временный объект из `wlock()` живёт до конца полного выражения (до `;`). `auto& v = *s.wlock();` - замок отпущен сразу, а ссылка осталась: дальше гонка. Держать замок дольше - только именованной переменной: `auto p = s.wlock();`. И два `wlock()`/`rlock()` одного объекта в одном выражении - повторный захват тем же потоком, UB или дедлок."}, {"type": "list", "items": ["Java-монитор реентерабельный: `synchronized`-метод может вызвать другой `synchronized`-метод того же объекта. `std::mutex` - нет, отсюда правило про `*_locked()`.", "Один мьютекс на весь объект - простой и правильный, но может стать узким местом. Дальше: shared_mutex для read-mostly, шардирование, copy-on-write снапшоты.", "Вложенные мониторы: метод монитора A под своим замком зовёт монитор B, а B под своим - A. Это дедлок с обратным порядком захвата."]}, {"type": "tip", "text": "Вслух: \"Делаю класс монитором: данные и мьютекс приватные, каждый публичный метод - одна критическая секция, ожидание через cv с предикатом. API - операции предметной области, а не геттеры и сеттеры. Если нужна произвольная транзакция - with_lock с лямбдой, как folly::Synchronized\"."}]}, {"id": "mt-queue", "title": "Потокобезопасная очередь: unbounded и bounded", "blocks": [{"type": "p", "text": "Самая частая задача секции. Сначала неограниченная блокирующая очередь. Обратите внимание на интерфейс: нет `empty()` и `front()` отдельно - только операции целиком (`pop`, `try_pop`)."}, {"type": "code", "code": "#include <condition_variable>\n#include <iostream>\n#include <mutex>\n#include <optional>\n#include <queue>\n#include <thread>\n\ntemplate <class T>\nclass ConcurrentQueue {\npublic:\n    void push(T value) {\n        {\n            std::lock_guard lk(m_);\n            q_.push(std::move(value));\n        }\n        cv_.notify_one();\n    }\n\n    T pop() {  // ждёт, пока появится элемент\n        std::unique_lock lk(m_);\n        cv_.wait(lk, [this] { return !q_.empty(); });\n        T v = std::move(q_.
