1h)` `Now() == expires_at`, условие `>=` истинно. Токен хранит ссылку на часы, поэтому видит сдвиг. От скорости не зависит: время виртуальное. Именно поэтому граничные кейсы (ttl-1s, ttl) выносят в отдельные тесты — так видно, `>` в коде или `>=`."}, {"id": "tests-q37", "lesson": "tests-time", "q": "Сессии хранятся в памяти сервиса с TTL 1 час. Какие часы взять для `expires_at`?", "options": ["`std::chrono::system_clock`: только они дают реальное время", "`std::chrono::high_resolution_clock`: самые точные", "`std::chrono::steady_clock`: монотонные, перевод системного времени и NTP на них не влияют", "Без разницы, все часы в `<chrono>` идут одинаково", "`std::time(nullptr)`: быстрее любых chrono-часов"], "answer": 2, "explain": "Для интервалов внутри процесса нужны монотонные часы. Если NTP переведёт `system_clock` назад, сессия проживёт дольше; вперёд — протухнет раньше. `system_clock` нужен, когда отметка уходит наружу: `exp` в JWT, колонка в БД. `high_resolution_clock` часто просто алиас одного из двух, монотонность не гарантирована."}, {"id": "tests-q38", "lesson": "tests-time", "q": "Тест ставит seed 42 и сравнивает 5 значений `std::uniform_int_distribution<int>(1, 100)` над `std::mt19937` с захардкоженными. В чём риск?", "options": ["`std::mt19937` с одним сидом даёт разные последовательности на разных платформах", "Сид 42 запрещён стандартом для mt19937", "Риска нет: и движок, и распределение полностью заданы стандартом", "Алгоритм distribution зависит от реализации: на libstdc++ и libc++ числа разные", "distribution кэширует значения между тестами"], "answer": 3, "explain": "Стандарт задаёт алгоритм движка: десятитысячное значение `mt19937` с сидом по умолчанию фиксировано. Но то, как distribution превращает биты в числа, — на усмотрение реализации. Проверяй свойства (диапазон, формат, уникальность), а не конкретные «случайные» числа."}, {"id": "tests-q39", "lesson": "tests-mt", "q": "Что напечатается и какой итог?", "code": "TEST(T, AssertInThread) {\n  std::thread t([] {\n    ASSERT_EQ(1, 2);\n    std::puts(\"thread: after assert\");\n  });\n  t.join();\n  std::puts(\"main: after join\");\n  EXPECT_EQ(3, 3);\n}", "options": ["Ничего: ASSERT прерывает весь тест, включая основной поток", "Обе строки; тест зелёный, провал в потоке не учитывается", "Процесс падает: ASSERT в чужом потоке вызывает std::terminate", "Обе строки; тест красный", "Только `main: after join`; тест красный"], "answer": 4, "explain": "ASSERT делает `return` из лямбды потока, поэтому `thread: after assert` не печатается. Основной поток об этом не знает и продолжает. Провал при этом записан, и тест красный. Отсюда правило: проверки — в основном потоке после join."}, {"id": "tests-q40", "lesson": "tests-mt", "q": "Что произойдёт?", "code": "constexpr int kThreads = 4;\nstd::latch start(kThreads + 1);\nstd::vector<std::thread> ts;\nfor (int i = 0; i < kThreads; ++i)\n  ts.emplace_back([&] { start.arrive_and_wait(); });\nfor (auto& t : ts) t.join();", "options": ["Зависание навсегда: счётчик дойдёт до 1, а не до 0, `join` никогда не вернётся", "Всё отработает: лишняя единица в latch игнорируется", "`std::latch` бросит исключение при переполнении", "Один поток пройдёт, остальные зависнут", "Ошибка компиляции: latch нельзя захватить по ссылке"], "answer": 0, "explain": "Счётчик 5, а `arrive_and_wait` вызывают только 4 потока: до нуля он не дойдёт. Пятая единица — для основного потока: нужен `start.count_down()` перед `join` (или `arrive_and_wait()`, если основной поток тоже ждёт). Проверено: процесс висел, пока его не убил таймер. Против таких зависаний — ctest `TIMEOUT`."}, {"id": "tests-q41", "lesson": "tests-mt", "q": "Тест с `++counter` на обычном `int` из двух потоков прошёл 1000 раз подряд с `-O2` и `--gtest_repeat=1000`. Что это доказывает?", "options": ["Что гонки нет: тысячи прогонов достаточно", "Ничего: data race — UB, она может не проявляться; нужен прогон под TSan", "Что `++` на int атомарен на x86 и ARM", "Что компилятор сам вставил mutex", "Что гонка есть только в debug-сборке, а в release её можно не исправлять"], "answer": 1, "explain": "Это UB, и результат зависит от оптимизатора и расписания. В проверке тот же тест падал с `-O0` и стабильно проходил с `-O2`: компилятор свернул цикл в одно сложение. TSan находит гонку по самому факту несинхронизированного доступа, а не по результату."}, {"id": "tests-q42", "lesson": "tests-mt", "q": "Тест иногда падает в CI и почти никогда — локально. Какая причина самая вероятная?", "code": "worker.Start();               // запускает фоновый поток\nstd::this_thread::sleep_for(50ms);\nEXPECT_TRUE(worker.IsDone());", "options": ["`EXPECT_TRUE` не потокобезопасен", "В CI другой seed у `--gtest_shuffle`", "Синхронизация через sleep: на загруженной CI-машине 50 мс не хватает", "`sleep_for` в CI игнорируется", "`IsDone()` нужно проверять через `ASSERT_TRUE`"], "answer": 2, "explain": "Классический flaky: время работы потока зависит от нагрузки на машину. Нужно ждать событие: future, latch, condition_variable. Таймаут — только страховка. Проверки gtest на pthread-платформах потокобезопасны; ASSERT вместо EXPECT ничего не изменит."}, {"id": "tests-q43", "lesson": "tests-integration", "q": "Интеграционные тесты изолированы транзакцией: `BEGIN` в SetUp, `ROLLBACK` в TearDown. В каком случае данные утекут в следующий тест?", "options": ["Тест упал на ASSERT, и TearDown не вызвался", "Тест вставил больше 1000 строк", "В тесте использовали `EXPECT_THROW`", "Код под тестом берёт своё соединение из пула и сам делает `COMMIT`", "Тесты запущены с `--gtest_repeat`"], "answer": 3, "explain": "ROLLBACK откатывает только транзакцию тестового соединения. Если репозиторий работает через другое соединение или коммитит сам, его изменения уже в базе. Тогда — TRUNCATE в SetUp или отдельная БД. TearDown вызывается и после фатального провала, размер транзакции роли не играет."}, {"id": "tests-q44", "lesson": "tests-integration", "q": "Какой тест — интеграционный в смысле этой главы?", "options": ["AuthService с `MockTokenStorage`: проверяем, что на пустой токен хранилище не вызывается", "SessionStore с FakeClock: проверяем границу TTL", "IsValidLogin на таблице из 20 логинов через TEST_P", "RateLimiter: стресс-тест с 8 потоками под TSan", "UserRepo против настоящего PostgreSQL в docker: проверяем UNIQUE-индекс на логине"], "answer": 4, "explain": "Интеграционный тест проверяет наш код вместе с настоящей инфраструктурой: SQL, схему, constraints, драйвер. Остальные варианты — юнит-тесты: зависимости подменены или их нет. Стресс под TSan — тоже юнит, просто многопоточный."}, {"id": "tests-q45", "lesson": "tests-example", "q": "Конструктор `Store` вызывает `c.Now()`. Что будет?", "code": "class StoreTest : public ::testing::Test {\n protected:\n  Store store_{clock_};\n  FakeClock clock_;\n};", "options": ["UB: поля инициализируются в порядке объявления, `clock_` ещё не создан. В проверке — segfault", "Всё в порядке: `clock_` уже создан, потому что gtest создаёт поля фикстуры заранее", "Ошибка компиляции: нельзя использовать поле до его объявления", "Всё в порядке: в инициализаторе по умолчанию поля создаются в порядке использования", "Компилятор всегда переставит поля и выдаст warning"], "answer": 0, "explain": "Члены класса инициализируются строго в порядке объявления. `store_` создаётся первым и вызывает виртуальный метод у объекта, который ещё не сконструирован. Компилятор это не отклоняет, clang не предупредил, а в прогоне — segfault. Лечится порядком: зависимости объявлять раньше того, кто их использует."}, {"id": "tests-q46", "lesson": "tests-anatomy", "q": "Как запустить все тесты `SessionStoreTest`, кроме тех, в имени которых есть `Purge`?", "options": ["`--gtest_filter='SessionStoreTest.* !*Purge*'`", "`--gtest_filter='SessionStoreTest.*-*Purge*'`", "`--gtest_filter='SessionStoreTest::*' --gtest_exclude='*Purge*'`", "`--gtest_filter='SessionStoreTest/*~Purge'`", "`--gtest_filter='-*Purge*+SessionStoreTest.*'`"], "answer": 1, "explain": "Синтаксис фильтра: положительные паттерны через `:`, после `-` — отрицательные. Полное имя теста — `Suite.Name`, через точку. Флага `--gtest_exclude` нет. Проверено на SessionStore: запустились все тесты, кроме PurgeRemovesOnlyExpired."}, {"id": "tests-q47", "lesson": "tests-anatomy", "q": "Что делает `gtest_discover_tests(auth_test)` в CMake?", "options": ["Ищет файлы `*_test.cpp` и добавляет их в сборку", "Скачивает googletest, если его нет", "После сборки запускает бинарник с `--gtest_list_tests` и регистрирует каждый тест как отдельный тест ctest", "Запускает тесты сразу после сборки", "Генерирует `main` для тестового бинарника"], "answer": 2, "explain": "Каждый TEST становится отдельной записью ctest: можно фильтровать (`ctest -R`), ставить LABELS и TIMEOUT, видеть, какой именно тест упал. Сборку файлов задаёт `add_executable`, скачивание — FetchContent, main — `gtest_main`/`gmock_main`."}, {"id": "tests-q48", "lesson": "tests-checklist", "q": "Что не так с этим тестом?", "code": "TEST(PriceTest, Discount) {\n  for (int qty = 1; qty < 100; ++qty) {\n    const double expected =\n        qty * kPrice * (qty >= 10 ? 0.9 : 1.0);\n    EXPECT_DOUBLE_EQ(Price(qty), expected);\n  }\n}", "options": ["Нельзя вызывать `EXPECT_*` в цикле", "`EXPECT_DOUBLE_EQ` нельзя использовать для денег — только `EXPECT_EQ`", "Тест слишком быстрый, gtest его не засчитает", "Ожидаемое вычисляется той же формулой, что и в коде: ошибка в формуле повторится и в тесте", "Всё хорошо: перебор 99 значений надёжнее нескольких примеров"], "answer": 3, "explain": "Логика в тесте дублирует реализацию: если в коде перепутали `>=` и `>`, тест скопирует ту же ошибку. Лучше несколько константных примеров на границах: 9, 10, 11 штук с вручную посчитанными ценами. EXPECT в цикле допустим (с SCOPED_TRACE), но проблема не в этом."}, {"id": "tests-q49", "lesson": "tests-checklist", "q": "Catch2. Сколько раз напечатается `setup`?", "code": "TEST_CASE(\"s\") {\n  std::puts(\"setup\");\n  SECTION(\"a\") { std::puts(\"a\"); }\n  SECTION(\"b\") { std::puts(\"b\"); }\n}", "options": ["1 — общий код выполняется один раз, затем секции по очереди", "3 — один раз сам TEST_CASE и по разу на секцию", "0 — код вне SECTION игнорируется", "1, и вторая секция не выполнится", "2 — TEST_CASE прогоняется с начала для каждой секции"], "answer": 4, "explain": "В Catch2 каждая листовая SECTION — отдельный прогон TEST_CASE с самого начала. Поэтому общий setup перед секциями работает как SetUp в gtest. Проверено: вывод `setup a setup b`."}], "tasks": [{"id": "tests-t1", "lesson": "tests-anatomy", "title": "Нормализация логина", "task": "Тесты в проверке ниже, функции нет. Реализуй `NormalizeLogin`: нижний регистр и обрезка пробелов по краям.", "prefix": "#include <string>\n\n#include <gtest/gtest.h>\n", "code": "// Приводит логин к нижнему регистру и убирает пробелы\n// по краям: \"  Alex \" -> \"alex\"\nstd::string NormalizeLogin(const std::string& s) {\n  // TODO\n  return s;\n}\n", "check": "TEST(NormalizeLoginTest, LowersCase) {\n  EXPECT_EQ(NormalizeLogin(\"Alex\"), \"alex\");\n}\n\nTEST(NormalizeLoginTest, TrimsSpaces) {\n  EXPECT_EQ(NormalizeLogin(\"  bob \"), \"bob\");\n}\n\nTEST(NormalizeLoginTest, OnlySpacesBecomeEmpty) {\n  EXPECT_EQ(NormalizeLogin(\"   \"), \"\");\n}\n\nTEST(NormalizeLoginTest, KeepsInnerChars) {\n  EXPECT_EQ(NormalizeLogin(\" A.b-C \"), \"a.b-c\");\n}\n", "mode": "gtest", "hint": "`find_first_not_of(' ')` и `find_last_not_of(' ')` дают границы; строка из одних пробелов — отдельный случай (`npos`).", "solution": "// Приводит логин к нижнему регистру и убирает пробелы\n// по краям: \"  Alex \" -> \"alex\"\nstd::string NormalizeLogin(const std::string& s) {\n  const auto b = s.find_first_not_of(' ');\n  if (b == std::string::npos) return \"\";\n  const auto e = s.find_last_not_of(' ');\n  std::string r = s.substr(b, e - b + 1);\n  for (char& c : r) {\n    if (c >= 'A' && c <= 'Z') c = c - 'A' + 'a';\n  }\n  return r;\n}\n"}, {"id": "tests-t2", "lesson": "tests-anatomy", "title": "Граница длины", "task": "Один тест из проверки падает. Найди баг в `IsValidLogin`. По спецификации допустимая длина 1..30.", "prefix": "#include <string>\n#include <string_view>\n\n#include <gtest/gtest.h>\n", "code": "// логин: 1..30 символов из [a-z0-9.-]\nbool IsValidLogin(std::string_view s) {\n  if (s.empty() || s.size() >= 30) return false;\n  for (char c : s) {\n    const bool ok = (c >= 'a' && c <= 'z') ||\n                    (c >= '0' && c <= '9') || c == '-' || c == '.';\n    if (!ok) return false;\n  }\n  return true;\n}\n", "check": "TEST(IsValidLoginTest, AcceptsDigitsAndDash) {\n  EXPECT_TRUE(IsValidLogin(\"alex-42\"));\n}\n\nTEST(IsValidLoginTest, RejectsEmpty) {\n  EXPECT_FALSE(IsValidLogin(\"\"));\n}\n\nTEST(IsValidLoginTest, AcceptsOneChar) {\n  EXPECT_TRUE(IsValidLogin(\"a\"));\n}\n\nTEST(IsValidLoginTest, AcceptsExactly30) {\n  EXPECT_TRUE(IsValidLogin(std::string(30, 'a')));\n}\n\nTEST(IsValidLoginTest, Rejects31) {\n  EXPECT_FALSE(IsValidLogin(std::string(31, 'a')));\n}\n", "mode": "gtest", "hint": "Посмотри, какой именно тест красный: 30 символов — это ещё валидный логин.", "solution": "// логин: 1..30 символов из [a-z0-9.-]\nbool IsValidLogin(std::string_view s) {\n  if (s.empty() || s.size() > 30) return false;\n  for (char c : s) {\n    const bool ok = (c >= 'a' && c <= 'z') ||\n                    (c >= '0' && c <= '9') || c == '-' || c == '.';\n    if (!ok) return false;\n  }\n  return true;\n}\n"}, {"id": "tests-t3", "lesson": "tests-assert", "title": "Сравнение double", "task": "Впиши проверку вместо `____`: среднее 0.1 и 0.2 равно 0.15 с допуском 1e-9. Тест должен пройти на `AverageMs` и упасть на её сломанных версиях.", "prefix": "#include <vector>\n\n#include <gtest/gtest.h>\n\ndouble AverageMs(const std::vector<double>& xs) {\n  if (xs.empty()) return 0.0;\n  double sum = 0;\n  for (double x : xs) sum += x;\n  return sum / xs.size();\n}\n", "code": "TEST(AverageMsTest, TwoFractions) {\n  // ждём 0.15 с абсолютным допуском 1e-9\n  ____(AverageMs({0.1, 0.2}), 0.15, 1e-9);\n}\n", "check": "TEST(AverageMsTest, EmptyIsZero) {\n  EXPECT_EQ(AverageMs({}), 0.0);  // ровный 0.0: тут EQ можно\n}\n\nTEST(AverageMsTest, Integers) {\n  EXPECT_EQ(AverageMs({1, 2, 3}), 2.0);\n}\n", "mutants": [{"code": "#include <vector>\n\n#include <gtest/gtest.h>\n\ndouble AverageMs(const std::vector<double>& xs) {\n  if (xs.empty()) return 0.0;\n  double sum = 0;\n  for (double x : xs) sum += x;\n  return static_cast<float>(sum) / xs.size();\n}\n", "why": "Делит во float: выходит 0.15000000596…, ошибка ~6e-9. Ловит только маленький допуск."}, {"code": "#include <cmath>\n#include <vector>\n\n#include <gtest/gtest.h>\n\ndouble AverageMs(const std::vector<double>& xs) {\n  if (xs.empty()) return 0.0;\n  double sum = 0;\n  for (double x : xs) sum += x;\n  return std::round(sum / xs.size() * 10) / 10;\n}\n", "why": "Округляет до десятых: вместо 0.15 выходит 0.2."}], "mode": "gtest", "hint": "Три аргумента — значение, ожидаемое, абсолютный допуск. `EXPECT_EQ` тут упал бы: в double получится 0.15000000000000002.", "solution": "TEST(AverageMsTest, TwoFractions) {\n  // ждём 0.15 с абсолютным допуском 1e-9\n  EXPECT_NEAR(AverageMs({0.1, 0.2}), 0.15, 1e-9);\n}\n"}, {"id": "tests-t4", "lesson": "tests-assert", "title": "Проверки исключений", "task": "Заполни пропуски: порт вне 1..65535 — `std::out_of_range`, не число — `std::invalid_argument` от `std::stoi`. В последнем тесте проверь текст исключения. Тесты должны поймать сломанные версии `ParsePort`.", "prefix": "#include <stdexcept>\n#include <string>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nint ParsePort(const std::string& s) {\n  const int v = std::stoi(s);  // \"abc\" -> std::invalid_argument\n  if (v < 1 || v > 65535) throw std::out_of_range(\"bad port\");\n  return v;\n}\n", "code": "TEST(ParsePortTest, Valid) {\n  EXPECT_EQ(ParsePort(\"8080\"), 8080);\n}\n\nTEST(ParsePortTest, OutOfRange) {\n  ____(ParsePort(\"0\"), ____);\n  ____(ParsePort(\"70000\"), ____);\n}\n\nTEST(ParsePortTest, NotANumber) {\n  ____(ParsePort(\"abc\"), ____);\n}\n\nTEST(ParsePortTest, Message) {\n  // и тип, и текст what()\n  EXPECT_THAT([] { ParsePort(\"0\"); },\n              ::testing::ThrowsMessage<std::out_of_range>(\n                  ::testing::HasSubstr(\"____\")));\n}\n", "mutants": [{"code": "#include <stdexcept>\n#include <string>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nint ParsePort(const std::string& s) {\n  const int v = std::stoi(s);  // \"abc\" -> std::invalid_argument\n  if (v < 1) throw std::out_of_range(\"bad port\");\n  return v;\n}\n", "why": "Нет верхней границы: порт 70000 принимается."}, {"code": "#include <stdexcept>\n#include <string>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nint ParsePort(const std::string& s) {\n  int v = 0;\n  try {\n    v = std::stoi(s);\n  } catch (...) {\n    throw std::out_of_range(\"bad port\");\n  }\n  if (v < 1 || v > 65535) throw std::out_of_range(\"bad port\");\n  return v;\n}\n", "why": "\"abc\" бросает out_of_range вместо invalid_argument."}, {"code": "#include <stdexcept>\n#include <string>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nint ParsePort(const std::string& s) {\n  const int v = std::stoi(s);  // \"abc\" -> std::invalid_argument\n  if (v < 1 || v > 65535) throw std::out_of_range(\"invalid port\");\n  return v;\n}\n", "why": "Тип верный, но в тексте нет \"bad port\"."}], "mode": "gtest", "hint": "`EXPECT_THROW(выражение, Тип)`. Текст берётся из `throw std::out_of_range(...)` в коде.", "solution": "TEST(ParsePortTest, Valid) {\n  EXPECT_EQ(ParsePort(\"8080\"), 8080);\n}\n\nTEST(ParsePortTest, OutOfRange) {\n  EXPECT_THROW(ParsePort(\"0\"), std::out_of_range);\n  EXPECT_THROW(ParsePort(\"70000\"), std::out_of_range);\n}\n\nTEST(ParsePortTest, NotANumber) {\n  EXPECT_THROW(ParsePort(\"abc\"), std::invalid_argument);\n}\n\nTEST(ParsePortTest, Message) {\n  // и тип, и текст what()\n  EXPECT_THAT([] { ParsePort(\"0\"); },\n              ::testing::ThrowsMessage<std::out_of_range>(\n                  ::testing::HasSubstr(\"bad port\")));\n}\n"}, {"id": "tests-t5", "lesson": "tests-assert", "title": "Тест сравнивает адреса", "task": "Функция работает правильно, а оба теста красные. Почини тесты. Посмотри, что gtest печатает в `Which is:`. Исправленные тесты должны ловить сломанные версии `FormatUserKey`.", "prefix": "#include <cstddef>\n#include <cstdio>\n\n#include <gtest/gtest.h>\n\n// пишет \"user-<id>\" в buf (C API, без аллокаций)\nvoid FormatUserKey(char* buf, std::size_t n, int id) {\n  std::snprintf(buf, n, \"user-%d\", id);\n}\n", "code": "TEST(FormatUserKeyTest, WritesKey) {\n  char buf[32];\n  FormatUserKey(buf, sizeof buf, 42);\n  EXPECT_EQ(buf, \"user-42\");\n}\n\nTEST(FormatUserKeyTest, TruncatesToBuffer) {\n  char buf[6];  // 5 символов + '\\0'\n  FormatUserKey(buf, sizeof buf, 42);\n  EXPECT_EQ(buf, \"user-\");\n}\n", "mutants": [{"code": "#include <cstddef>\n#include <cstdio>\n\n#include <gtest/gtest.h>\n\n// пишет \"user-<id>\" в buf (C API, без аллокаций)\nvoid FormatUserKey(char* buf, std::size_t n, int id) {\n  std::snprintf(buf, n, \"user_%d\", id);\n}\n", "why": "Пишет \"user_42\" вместо \"user-42\"."}, {"code": "#include <cstddef>\n#include <cstdio>\n\n#include <gtest/gtest.h>\n\n// пишет \"user-<id>\" в buf (C API, без аллокаций)\nvoid FormatUserKey(char* buf, std::size_t n, int id) {\n  std::snprintf(buf, n - 1, \"user-%d\", id);\n}\n", "why": "Обрезает на символ раньше: в буфер на 6 попадает \"user\"."}], "mode": "gtest", "hint": "`char buf[]` и литерал — это два указателя. `EXPECT_EQ` сравнивает адреса, для C-строк нужен `EXPECT_STREQ`.", "solution": "TEST(FormatUserKeyTest, WritesKey) {\n  char buf[32];\n  FormatUserKey(buf, sizeof buf, 42);\n  EXPECT_STREQ(buf, \"user-42\");\n}\n\nTEST(FormatUserKeyTest, TruncatesToBuffer) {\n  char buf[6];  // 5 символов + '\\0'\n  FormatUserKey(buf, sizeof buf, 42);\n  EXPECT_STREQ(buf, \"user-\");\n}\n"}, {"id": "tests-t6", "lesson": "tests-fixtures", "title": "Фикстура корзины", "task": "Допиши фикстуру `CartTest`: базовый класс и метод, который перед каждым тестом кладёт в корзину \"apple\" 100 x 2 и \"pear\" 50 x 1. Тесты в проверке ниже.", "prefix": "#include <map>\n#include <string>\n#include <utility>\n\n#include <gtest/gtest.h>\n\nclass Cart {\n public:\n  void Add(const std::string& sku, int price, int qty) {\n    auto& [p, q] = items_[sku];\n    p = price;\n    q += qty;\n  }\n  bool Remove(const std::string& sku) {\n    return items_.erase(sku) > 0;\n  }\n  int Total() const {\n    int sum = 0;\n    for (const auto& [sku, pq] : items_) sum += pq.first * pq.second;\n    return sum;\n  }\n\n private:\n  std::map<std::string, std::pair<int, int>> items_;  // цена, qty\n};\n", "code": "class CartTest : public ____ {\n protected:\n  // перед каждым тестом: \"apple\" 100 x 2 и \"pear\" 50 x 1\n  void ____() override {\n    ____\n  }\n\n  Cart cart_;\n};\n", "check": "TEST_F(CartTest, TotalOfPrefilledCart) {\n  EXPECT_EQ(cart_.Total(), 250);\n}\n\nTEST_F(CartTest, RemoveApple) {\n  EXPECT_TRUE(cart_.Remove(\"apple\"));\n  EXPECT_EQ(cart_.Total(), 50);\n}\n\nTEST_F(CartTest, AddMorePears) {\n  cart_.Add(\"pear\", 50, 1);\n  EXPECT_EQ(cart_.Total(), 300);\n}\n", "mode": "gtest", "hint": "Наследник `::testing::Test`, метод `SetUp()` с `override`. Каждый TEST_F получает свежий объект, поэтому третий тест видит 250, а не результат второго.", "solution": "class CartTest : public ::testing::Test {\n protected:\n  // перед каждым тестом: \"apple\" 100 x 2 и \"pear\" 50 x 1\n  void SetUp() override {\n    cart_.Add(\"apple\", 100, 2);\n    cart_.Add(\"pear\", 50, 1);\n  }\n\n  Cart cart_;\n};\n"}, {"id": "tests-t7", "lesson": "tests-fixtures", "title": "Тест зависит от соседа", "task": "По отдельности (`--gtest_filter`) оба теста зелёные, вместе второй падает. Почини фикстуру, тесты в проверке не меняются.", "prefix": "#include <cstddef>\n#include <string>\n#include <vector>\n\n#include <gtest/gtest.h>\n\nclass InMemoryUserRepo {\n public:\n  void Add(const std::string& login) { users_.push_back(login); }\n  std::size_t Size() const { return users_.size(); }\n\n private:\n  std::vector<std::string> users_;\n};\n", "code": "class UserRepoTest : public ::testing::Test {\n protected:\n  static inline InMemoryUserRepo repo_;\n};\n", "check": "TEST_F(UserRepoTest, AddIncreasesSize) {\n  repo_.Add(\"alex\");\n  EXPECT_EQ(repo_.Size(), 1u);\n}\n\nTEST_F(UserRepoTest, NewRepoIsEmpty) {\n  EXPECT_EQ(repo_.Size(), 0u);\n}\n", "mode": "gtest", "hint": "`static` поле фикстуры — одно на все тесты suite. Изменения первого теста видит второй.", "solution": "class UserRepoTest : public ::testing::Test {\n protected:\n  InMemoryUserRepo repo_;  // свой у каждого теста\n};\n"}, {"id": "tests-t8", "lesson": "tests-param", "title": "Подключи параметры", "task": "Допиши параметризованный тест: базовый класс фикстуры, макрос инстанцирования и генератор имён кейсов из поля `name`. `TEST_P` и проверка имён — ниже. Таблица должна ловить сломанные версии `IsStrongPassword`.", "prefix": "#include <set>\n#include <string>\n#include <string_view>\n\n#include <gtest/gtest.h>\n\n// >= 8 символов, есть цифра и заглавная буква\nbool IsStrongPassword(std::string_view p) {\n  if (p.size() < 8) return false;\n  bool digit = false;\n  bool upper = false;\n  for (char c : p) {\n    if (c >= '0' && c <= '9') digit = true;\n    if (c >= 'A' && c <= 'Z') upper = true;\n  }\n  return digit && upper;\n}\n\nstruct PwCase {\n  const char* name;\n  const char* pw;\n  bool strong;\n};\n", "code": "class StrongPasswordTest : public ::testing::____<PwCase> {};\n\n// имена кейсов в отчёте — из поля name: .../Matches/NoDigit\n____(\n    Cases, StrongPasswordTest,\n    ::testing::Values(PwCase{\"Short\", \"Ab1\", false},\n                      PwCase{\"NoDigit\", \"Abcdefgh\", false},\n                      PwCase{\"NoUpper\", \"abcdefg1\", false},\n                      PwCase{\"Ok\", \"Abcdefg1\", true}),\n    ____);\n", "check": "TEST_P(StrongPasswordTest, Matches) {\n  EXPECT_EQ(IsStrongPassword(GetParam().pw), GetParam().strong);\n}\n\n// все четыре кейса есть, имена взяты из поля name\nTEST(CaseNames, FromNameField) {\n  std::set<std::string> got;\n  const auto* ut = ::testing::UnitTest::GetInstance();\n  for (int i = 0; i < ut->total_test_suite_count(); ++i) {\n    const auto* s = ut->GetTestSuite(i);\n    for (int j = 0; j < s->total_test_count(); ++j)\n      got.insert(s->GetTestInfo(j)->name());\n  }\n  for (std::string n : {\"Short\", \"NoDigit\", \"NoUpper\", \"Ok\"})\n    EXPECT_TRUE(got.count(\"Matches/\" + n)) << \"нет кейса \" << n;\n}\n", "mutants": [{"code": "#include <set>\n#include <string>\n#include <string_view>\n\n#include <gtest/gtest.h>\n\n// >= 8 символов, есть цифра и заглавная буква\nbool IsStrongPassword(std::string_view p) {\n  if (p.size() < 8) return false;\n  bool digit = false;\n  bool upper = false;\n  for (char c : p) {\n    if (c >= '0' && c <= '9') digit = true;\n    if (c >= 'A' && c <= 'Z') upper = true;\n  }\n  return upper;\n}\n\nstruct PwCase {\n  const char* name;\n  const char* pw;\n  bool strong;\n};\n", "why": "Не проверяет цифру: \"Abcdefgh\" считается сильным."}, {"code": "#include <set>\n#include <string>\n#include <string_view>\n\n#include <gtest/gtest.h>\n\n// >= 8 символов, есть цифра и заглавная буква\nbool IsStrongPassword(std::string_view p) {\n  if (p.size() < 8) return false;\n  bool digit = false;\n  bool upper = false;\n  for (char c : p) {\n    if (c >= '0' && c <= '9') digit = true;\n    if (c >= 'A' && c <= 'Z') upper = true;\n  }\n  return digit;\n}\n\nstruct PwCase {\n  const char* name;\n  const char* pw;\n  bool strong;\n};\n", "why": "Не проверяет заглавную: \"abcdefg1\" считается сильным."}, {"code": "#include <set>\n#include <string>\n#include <string_view>\n\n#include <gtest/gtest.h>\n\n// >= 8 символов, есть цифра и заглавная буква\nbool IsStrongPassword(std::string_view p) {\n  if (p.size() <= 8) return false;\n  bool digit = false;\n  bool upper = false;\n  for (char c : p) {\n    if (c >= '0' && c <= '9') digit = true;\n    if (c >= 'A' && c <= 'Z') upper = true;\n  }\n  return digit && upper;\n}\n\nstruct PwCase {\n  const char* name;\n  const char* pw;\n  bool strong;\n};\n", "why": "Граница: пароль ровно из 8 символов отвергается."}], "mode": "gtest", "hint": "`::testing::TestWithParam<PwCase>`, `INSTANTIATE_TEST_SUITE_P`, четвёртый аргумент — лямбда от `const ::testing::TestParamInfo<PwCase>&`, возвращает `std::string`.", "solution": "class StrongPasswordTest : public ::testing::TestWithParam<PwCase> {};\n\n// имена кейсов в отчёте — из поля name: .../Matches/NoDigit\nINSTANTIATE_TEST_SUITE_P(\n    Cases, StrongPasswordTest,\n    ::testing::Values(PwCase{\"Short\", \"Ab1\", false},\n                      PwCase{\"NoDigit\", \"Abcdefgh\", false},\n                      PwCase{\"NoUpper\", \"abcdefg1\", false},\n                      PwCase{\"Ok\", \"Abcdefg1\", true}),\n    [](const ::testing::TestParamInfo<PwCase>& info) {\n      return std::string(info.param.name);\n    });\n"}, {"id": "tests-t9", "lesson": "tests-param", "title": "Степень двойки", "task": "Табличный тест в проверке нашёл баг. Какой кейс красный? Почини `IsPowerOfTwo`.", "prefix": "#include <cstdint>\n#include <string>\n\n#include <gtest/gtest.h>\n", "code": "bool IsPowerOfTwo(std::uint64_t n) { return (n & (n - 1)) == 0; }\n", "check": "struct Case {\n  const char* name;\n  std::uint64_t n;\n  bool expected;\n};\n\nclass PowerOfTwoTest : public ::testing::TestWithParam<Case> {};\n\nTEST_P(PowerOfTwoTest, Matches) {\n  EXPECT_EQ(IsPowerOfTwo(GetParam().n), GetParam().expected);\n}\n\nINSTANTIATE_TEST_SUITE_P(\n    Table, PowerOfTwoTest,\n    ::testing::Values(Case{\"Zero\", 0, false},\n                      Case{\"One\", 1, true},\n                      Case{\"Two\", 2, true},\n                      Case{\"Three\", 3, false},\n                      Case{\"Top\", 1ull << 63, true},\n                      Case{\"TopPlusOne\", (1ull << 63) + 1, false}),\n    [](const auto& info) { return std::string(info.param.name); });\n", "mode": "gtest", "hint": "При n = 0 выражение `n & (n - 1)` тоже равно 0.", "solution": "bool IsPowerOfTwo(std::uint64_t n) {\n  return n != 0 && (n & (n - 1)) == 0;\n}\n"}, {"id": "tests-t10", "lesson": "tests-matchers", "title": "Матчеры для множества", "task": "Подставь матчеры вместо `____`. `unordered_set` обходится в неопределённом порядке. Тесты должны ловить сломанные версии `Scopes`.", "prefix": "#include <string>\n#include <unordered_set>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing namespace ::testing;  // для краткости в задаче\n\n// права пользователя; порядок обхода не определён\nstd::unordered_set<std::string> Scopes(bool admin) {\n  std::unordered_set<std::string> s = {\"read\", \"write\"};\n  if (admin) s.insert(\"admin\");\n  return s;\n}\n", "code": "TEST(ScopesTest, RegularUserHasExactlyReadWrite) {\n  // ровно эти два, в любом порядке\n  EXPECT_THAT(Scopes(false), ____(\"read\", \"write\"));\n}\n\nTEST(ScopesTest, AdminHasThreeScopesIncludingAdmin) {\n  EXPECT_THAT(Scopes(true), ____(\"admin\"));\n  EXPECT_THAT(Scopes(true), ____(3));\n}\n\nTEST(ScopesTest, RegularUserIsNotAdmin) {\n  EXPECT_THAT(Scopes(false), ____(Contains(\"admin\")));\n}\n", "mutants": [{"code": "#include <string>\n#include <unordered_set>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing namespace ::testing;  // для краткости в задаче\n\n// права пользователя; порядок обхода не определён\nstd::unordered_set<std::string> Scopes(bool admin) {\n  std::unordered_set<std::string> s = {\"read\", \"write\"};\n  if (!admin) s.insert(\"admin\");\n  return s;\n}\n", "why": "Флаг перепутан: admin получает обычный пользователь."}, {"code": "#include <string>\n#include <unordered_set>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing namespace ::testing;  // для краткости в задаче\n\n// права пользователя; порядок обхода не определён\nstd::unordered_set<std::string> Scopes(bool admin) {\n  std::unordered_set<std::string> s = {\"read\", \"write\"};\n  if (admin) s.insert({\"admin\", \"delete\"});\n  return s;\n}\n", "why": "Админу выдаётся лишнее право \"delete\"."}, {"code": "#include <string>\n#include <unordered_set>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing namespace ::testing;  // для краткости в задаче\n\n// права пользователя; порядок обхода не определён\nstd::unordered_set<std::string> Scopes(bool admin) {\n  std::unordered_set<std::string> s = {\"read\"};\n  if (admin) s.insert({\"write\", \"admin\"});\n  return s;\n}\n", "why": "У обычного пользователя нет \"write\"."}], "mode": "gtest", "hint": "`UnorderedElementsAre`, `Contains`, `SizeIs`, `Not`. `ElementsAre` на unordered-контейнере зависит от порядка хешей.", "solution": "TEST(ScopesTest, RegularUserHasExactlyReadWrite) {\n  // ровно эти два, в любом порядке\n  EXPECT_THAT(Scopes(false), UnorderedElementsAre(\"read\", \"write\"));\n}\n\nTEST(ScopesTest, AdminHasThreeScopesIncludingAdmin) {\n  EXPECT_THAT(Scopes(true), Contains(\"admin\"));\n  EXPECT_THAT(Scopes(true), SizeIs(3));\n}\n\nTEST(ScopesTest, RegularUserIsNotAdmin) {\n  EXPECT_THAT(Scopes(false), Not(Contains(\"admin\")));\n}\n"}, {"id": "tests-t11", "lesson": "tests-matchers", "title": "Optional и Field", "task": "Заполни пропуски: найденный пользователь проверяется одним матчером, отсутствующий — сравнением, фильтр активных — через `Each` и `ElementsAre`. Тесты должны ловить сломанные версии функций.", "prefix": "#include <optional>\n#include <string>\n#include <string_view>\n#include <vector>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing namespace ::testing;  // для краткости в задаче\n\nstruct User {\n  long id = 0;\n  std::string login;\n  bool active = false;\n};\n\nstd::optional<User> FindByLogin(const std::vector<User>& users,\n                                std::string_view login) {\n  for (const auto& u : users)\n    if (u.login == login) return u;\n  return std::nullopt;\n}\n\nstd::vector<User> Active(const std::vector<User>& users) {\n  std::vector<User> out;\n  for (const auto& u : users)\n    if (u.active) out.push_back(u);\n  return out;\n}\n\nconst std::vector<User> kUsers = {\n    {1, \"alex\", true}, {2, \"bob\", false}, {3, \"carol\", true}};\n", "code": "TEST(UsersTest, FindsBob) {\n  // значение есть, и в нём id == 2\n  EXPECT_THAT(FindByLogin(kUsers, \"bob\"),\n              ____(Field(&User::id, 2)));\n}\n\nTEST(UsersTest, MissingLogin) {\n  EXPECT_EQ(FindByLogin(kUsers, \"dave\"), ____);\n}\n\nTEST(UsersTest, ActiveFilter) {\n  const auto active = Active(kUsers);\n  // все активные; логины ровно alex, carol — в этом порядке\n  EXPECT_THAT(active, Each(Field(&User::active, ____)));\n  EXPECT_THAT(active, ElementsAre(Field(&User::login, \"alex\"),\n                                  ____));\n}\n", "mutants": [{"code": "#include <optional>\n#include <string>\n#include <string_view>\n#include <vector>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing namespace ::testing;  // для краткости в задаче\n\nstruct User {\n  long id = 0;\n  std::string login;\n  bool active = false;\n};\n\nstd::optional<User> FindByLogin(const std::vector<User>& users,\n                                std::string_view login) {\n  for (const auto& u : users)\n    if (u.login == login)\n      return User{0, u.login, u.active};\n  return std::nullopt;\n}\n\nstd::vector<User> Active(const std::vector<User>& users) {\n  std::vector<User> out;\n  for (const auto& u : users)\n    if (u.active) out.push_back(u);\n  return out;\n}\n\nconst std::vector<User> kUsers = {\n    {1, \"alex\", true}, {2, \"bob\", false}, {3, \"carol\", true}};\n", "why": "FindByLogin теряет id: у найденного bob id == 0."}, {"code": "#include <optional>\n#include <string>\n#include <string_view>\n#include <vector>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing namespace ::testing;  // для краткости в задаче\n\nstruct User {\n  long id = 0;\n  std::string login;\n  bool active = false;\n};\n\nstd::optional<User> FindByLogin(const std::vector<User>& users,\n                                std::string_view login) {\n  for (const auto& u : users)\n    if (u.login == login) return u;\n  return User{};\n}\n\nstd::vector<User> Active(const std::vector<User>& users) {\n  std::vector<User> out;\n  for (const auto& u : users)\n    if (u.active) out.push_back(u);\n  return out;\n}\n\nconst std::vector<User> kUsers = {\n    {1, \"alex\", true}, {2, \"bob\", false}, {3, \"carol\", true}};\n", "why": "Для неизвестного логина возвращает пустой User, а не nullopt."}, {"code": "#include <optional>\n#include <string>\n#include <string_view>\n#include <vector>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing namespace ::testing;  // для краткости в задаче\n\nstruct User {\n  long id = 0;\n  std::string login;\n  bool active = false;\n};\n\nstd::optional<User> FindByLogin(const std::vector<User>& users,\n                                std::string_view login) {\n  for (const auto& u : users)\n    if (u.login == login) return u;\n  return std::nullopt;\n}\n\nstd::vector<User> Active(const std::vector<User>& users) {\n  std::vector<User> out;\n  for (auto it = users.rbegin(); it != users.rend(); ++it)\n    if (it->active) out.push_back(*it);\n  return out;\n}\n\nconst std::vector<User> kUsers = {\n    {1, \"alex\", true}, {2, \"bob\", false}, {3, \"carol\", true}};\n", "why": "Active меняет порядок: carol, alex."}], "mode": "gtest", "hint": "`Optional(m)` проверяет, что значение есть, и матчит его. Пустой optional — `std::nullopt`.", "solution": "TEST(UsersTest, FindsBob) {\n  // значение есть, и в нём id == 2\n  EXPECT_THAT(FindByLogin(kUsers, \"bob\"),\n              Optional(Field(&User::id, 2)));\n}\n\nTEST(UsersTest, MissingLogin) {\n  EXPECT_EQ(FindByLogin(kUsers, \"dave\"), std::nullopt);\n}\n\nTEST(UsersTest, ActiveFilter) {\n  const auto active = Active(kUsers);\n  // все активные; логины ровно alex, carol — в этом порядке\n  EXPECT_THAT(active, Each(Field(&User::active, true)));\n  EXPECT_THAT(active, ElementsAre(Field(&User::login, \"alex\"),\n                                  Field(&User::login, \"carol\")));\n}\n"}, {"id": "tests-t12", "lesson": "tests-mocks", "title": "Ретраи платежа", "task": "Допиши ожидания на мок шлюза: в первом тесте две неудачи и успех, во втором ровно три неудачи. Тесты должны ловить сломанные версии `PayWithRetry`.", "prefix": "#include <cstdint>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing ::testing::Return;\n\nclass PaymentGateway {\n public:\n  virtual ~PaymentGateway() = default;\n  virtual bool Charge(std::int64_t uid, int cents) = 0;\n};\n\nclass MockGateway : public PaymentGateway {\n public:\n  MOCK_METHOD(bool, Charge, (std::int64_t uid, int cents),\n              (override));\n};\n\n// до 3 попыток, пока Charge не вернёт true\nbool PayWithRetry(PaymentGateway& gw, std::int64_t uid, int cents) {\n  for (int i = 0; i < 3; ++i) {\n    if (gw.Charge(uid, cents)) return true;\n  }\n  return false;\n}\n", "code": "TEST(PayWithRetryTest, SucceedsOnThirdAttempt) {\n  MockGateway gw;\n  // 1-й и 2-й вызов Charge(7, 500) -> false, 3-й -> true\n  EXPECT_CALL(gw, Charge(7, 500))\n      ____;\n  EXPECT_TRUE(PayWithRetry(gw, 7, 500));\n}\n\nTEST(PayWithRetryTest, GivesUpAfterThreeFailures) {\n  MockGateway gw;\n  // ровно 3 вызова, все неуспешные\n  EXPECT_CALL(gw, Charge(7, 500))\n      ____;\n  EXPECT_FALSE(PayWithRetry(gw, 7, 500));\n}\n", "mutants": [{"code": "#include <cstdint>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing ::testing::Return;\n\nclass PaymentGateway {\n public:\n  virtual ~PaymentGateway() = default;\n  virtual bool Charge(std::int64_t uid, int cents) = 0;\n};\n\nclass MockGateway : public PaymentGateway {\n public:\n  MOCK_METHOD(bool, Charge, (std::int64_t uid, int cents),\n              (override));\n};\n\n// до 3 попыток, пока Charge не вернёт true\nbool PayWithRetry(PaymentGateway& gw, std::int64_t uid, int cents) {\n  for (int i = 0; i < 2; ++i) {\n    if (gw.Charge(uid, cents)) return true;\n  }\n  return false;\n}\n", "why": "Только 2 попытки вместо 3."}, {"code": "#include <cstdint>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nusing ::testing::Return;\n\nclass PaymentGateway {\n public:\n  virtual ~PaymentGateway() = default;\n  virtual bool Charge(std::int64_t uid, int cents) = 0;\n};\n\nclass MockGateway : public PaymentGateway {\n public:\n  MOCK_METHOD(bool, Charge, (std::int64_t uid, int cents),\n              (override));\n};\n\n// до 3 попыток, пока Charge не вернёт true\nbool PayWithRetry(PaymentGateway& gw, std::int64_t uid, int cents) {\n  for (int i = 0; i <= 3; ++i) {\n    if (gw.Charge(uid, cents)) return true;\n  }\n  return false;\n}\n", "why": "4 попытки вместо 3: лишнее списание."}], "mode": "gtest", "hint": "Цепочка `.WillOnce(Return(false))` нужное число раз. Для второго: `.Times(3).WillRepeatedly(Return(false))`.", "solution": "TEST(PayWithRetryTest, SucceedsOnThirdAttempt) {\n  MockGateway gw;\n  // 1-й и 2-й вызов Charge(7, 500) -> false, 3-й -> true\n  EXPECT_CALL(gw, Charge(7, 500))\n      .WillOnce(Return(false))\n      .WillOnce(Return(false))\n      .WillOnce(Return(true));\n  EXPECT_TRUE(PayWithRetry(gw, 7, 500));\n}\n\nTEST(PayWithRetryTest, GivesUpAfterThreeFailures) {\n  MockGateway gw;\n  // ровно 3 вызова, все неуспешные\n  EXPECT_CALL(gw, Charge(7, 500))\n      .Times(3)\n      .WillRepeatedly(Return(false));\n  EXPECT_FALSE(PayWithRetry(gw, 7, 500));\n}\n"}, {"id": "tests-t13", "lesson": "tests-mocks", "title": "Порядок в Logout", "task": "Тест с `InSequence` в проверке падает. Аудит \"logout\" должен писаться только после того, как токен реально удалён. Найди баг в сервисе.", "prefix": "#include <cstdint>\n#include <optional>\n#include <string>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nclass TokenStorage {\n public:\n  virtual ~TokenStorage() = default;\n  virtual std::optional<std::int64_t> Find(\n      const std::string& t) const = 0;\n  virtual void Remove(const std::string& t) = 0;\n};\n\nclass AuditLog {\n public:\n  virtual ~AuditLog() = default;\n  virtual void Write(const std::string& ev, std::int64_t uid) = 0;\n};\n", "code": "class AuthService {\n public:\n  AuthService(TokenStorage& s, AuditLog& a)\n      : storage_(s), audit_(a) {}\n\n  bool Logout(const std::string& token) {\n    const auto uid = storage_.Find(token);\n    if (!uid) return false;\n    audit_.Write(\"logout\", *uid);\n    storage_.Remove(token);\n    return true;\n  }\n\n private:\n  TokenStorage& storage_;\n  AuditLog& audit_;\n};\n", "check": "class MockTokenStorage : public TokenStorage {\n public:\n  MOCK_METHOD(std::optional<std::int64_t>, Find,\n              (const std::string&), (const, override));\n  MOCK_METHOD(void, Remove, (const std::string&), (override));\n};\n\nclass MockAuditLog : public AuditLog {\n public:\n  MOCK_METHOD(void, Write, (const std::string&, std::int64_t),\n              (override));\n};\n\nusing ::testing::InSequence;\nusing ::testing::Return;\n\nTEST(AuthServiceTest, AuditIsWrittenAfterRemove) {\n  MockTokenStorage storage;\n  MockAuditLog audit;\n  {\n    InSequence seq;\n    EXPECT_CALL(storage, Find(\"tok\"))\n        .WillOnce(Return(std::optional<std::int64_t>(7)));\n    EXPECT_CALL(storage, Remove(\"tok\"));\n    EXPECT_CALL(audit, Write(\"logout\", 7));\n  }\n  AuthService auth(storage, audit);\n  EXPECT_TRUE(auth.Logout(\"tok\"));\n}\n", "mode": "gtest", "hint": "Сравни порядок вызовов в `Logout` с порядком `EXPECT_CALL` внутри `InSequence`.", "solution": "class AuthService {\n public:\n  AuthService(TokenStorage& s, AuditLog& a)\n      : storage_(s), audit_(a) {}\n\n  bool Logout(const std::string& token) {\n    const auto uid = storage_.Find(token);\n    if (!uid) return false;\n    storage_.Remove(token);\n    audit_.Write(\"logout\", *uid);\n    return true;\n  }\n\n private:\n  TokenStorage& storage_;\n  AuditLog& audit_;\n};\n"}, {"id": "tests-t14", "lesson": "tests-mocks", "title": "Кэш перед базой", "task": "Реализуй `UserNameService::Get`: сначала кэш; на промахе — `Db::Load` и `Put` в кэш. Моки и тесты в проверке ниже.", "prefix": "#include <optional>\n#include <string>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nclass Cache {\n public:\n  virtual ~Cache() = default;\n  virtual std::optional<std::string> Get(const std::string& k) = 0;\n  virtual void Put(const std::string& k, const std::string& v) = 0;\n};\n\nclass Db {\n public:\n  virtual ~Db() = default;\n  virtual std::string Load(const std::string& k) = 0;\n};\n", "code": "class UserNameService {\n public:\n  UserNameService(Cache& cache, Db& db) : cache_(cache), db_(db) {}\n\n  // сначала кэш; промах -> Db::Load и Put в кэш\n  std::string Get(const std::string& key) {\n    // TODO\n    return \"\";\n  }\n\n private:\n  Cache& cache_;\n  Db& db_;\n};\n", "check": "class MockCache : public Cache {\n public:\n  MOCK_METHOD(std::optional<std::string>, Get,\n              (const std::string&), (override));\n  MOCK_METHOD(void, Put, (const std::string&, const std::string&),\n              (override));\n};\n\nclass MockDb : public Db {\n public:\n  MOCK_METHOD(std::string, Load, (const std::string&), (override));\n};\n\nusing ::testing::NiceMock;\nusing ::testing::Return;\nusing ::testing::StrictMock;\n\nTEST(UserNameServiceTest, HitDoesNotTouchDb) {\n  NiceMock<MockCache> cache;\n  StrictMock<MockDb> db;  // любой вызов Load — провал\n  EXPECT_CALL(cache, Get(\"u1\"))\n      .WillOnce(Return(std::optional<std::string>(\"alex\")));\n  UserNameService service(cache, db);\n\n  EXPECT_EQ(service.Get(\"u1\"), \"alex\");\n}\n\nTEST(UserNameServiceTest, MissLoadsFromDbAndFillsCache) {\n  MockCache cache;\n  MockDb db;\n  EXPECT_CALL(cache, Get(\"u2\")).WillOnce(Return(std::nullopt));\n  EXPECT_CALL(db, Load(\"u2\")).WillOnce(Return(\"bob\"));\n  EXPECT_CALL(cache, Put(\"u2\", \"bob\"));\n  UserNameService service(cache, db);\n\n  EXPECT_EQ(service.Get(\"u2\"), \"bob\");\n}\n", "mode": "gtest", "hint": "Попадание в кэш не должно трогать базу: там `StrictMock<MockDb>`.", "solution": "class UserNameService {\n public:\n  UserNameService(Cache& cache, Db& db) : cache_(cache), db_(db) {}\n\n  // сначала кэш; промах -> Db::Load и Put в кэш\n  std::string Get(const std::string& key) {\n    if (auto cached = cache_.Get(key)) return *cached;\n    std::string value = db_.Load(key);\n    cache_.Put(key, value);\n    return value;\n  }\n\n private:\n  Cache& cache_;\n  Db& db_;\n};\n"}, {"id": "tests-t15", "lesson": "tests-mocks", "title": "Напиши MOCK_METHOD", "task": "Напиши три `MOCK_METHOD` для интерфейса `KeyValue`. Учти `const` и тип с запятой. Тест в проверке ниже.", "prefix": "#include <map>\n#include <optional>\n#include <string>\n\n#include <gmock/gmock.h>\n#include <gtest/gtest.h>\n\nclass KeyValue {\n public:\n  virtual ~KeyValue() = default;\n  virtual std::optional<std::string> Get(\n      const std::string& key) const = 0;\n  virtual bool Set(const std::string& key, const std::string& value,\n                   int ttl_sec) = 0;\n  virtual std::map<std::string, int> Stats() const = 0;\n};\n", "code": "class MockKeyValue : public KeyValue {\n public:\n  // три MOCK_METHOD\n  ____\n};\n", "check": "using ::testing::Return;\n\nTEST(MockKeyValueTest, AllMethodsMocked) {\n  MockKeyValue kv;\n  EXPECT_CALL(kv, Get(\"a\"))\n      .WillOnce(Return(std::optional<std::string>(\"1\")));\n  EXPECT_CALL(kv, Set(\"a\", \"2\", 60)).WillOnce(Return(true));\n  EXPECT_CALL(kv, Stats())\n      .WillOnce(Return(std::map<std::string, int>{{\"hits\", 1}}));\n\n  const KeyValue& ro = kv;  // вызов через const-ссылку на базу\n  EXPECT_EQ(ro.Get(\"a\"), \"1\");\n  EXPECT_TRUE(kv.Set(\"a\", \"2\", 60));\n  EXPECT_EQ(ro.Stats().at(\"hits\"), 1);\n}\n", "mode": "gtest", "hint": "`MOCK_METHOD(Тип, Имя, (аргументы), (const, override))`. `std::map<std::string, int>` оберни в скобки.", "solution": "class MockKeyValue : public KeyValue {\n public:\n  MOCK_METHOD(std::optional<std::string>, Get,\n              (const std::string& key), (const, override));\n  MOCK_METHOD(bool, Set,\n              (const std::string& key, const std::string& value,\n               int ttl_sec),\n              (override));\n  // запятая в типе — в скобки\n  MOCK_METHOD((std::map<std::string, int>), Stats, (),\n              (const, override));\n};\n"}, {"id": "tests-t16", "lesson": "tests-time", "title": "Ручные часы", "task": "Тесты лимитера в проверке двигают время через `clock.Advance(...)`. Напиши `FakeClock`.", "prefix": "#include <chrono>\n\n#include <gtest/gtest.h>\n\nusing namespace std::chrono_literals;\n\nclass Clock {\n public:\n  using TimePoint = std::chrono::steady_clock::time_point;\n  virtual ~Clock() = default;\n  virtual TimePoint Now() const = 0;\n};\n\n// не больше limit запросов за окно; окно стартует заново,\n// когда с его начала прошло >= window\nclass RateLimiter {\n public:\n  RateLimiter(const Clock& clock, int limit,\n              std::chrono::seconds window)\n      : clock_(clock), limit_(limit), window_(window),\n        start_(clock.Now()) {}\n\n  bool Allow() {\n    const auto now = clock_.Now();\n    if (now - start_ >= window_) {\n      start_ = now;\n      used_ = 0;\n    }\n    if (used_ >= limit_) return false;\n    ++used_;\n    return true;\n  }\n\n private:\n  const Clock& clock_;\n  const int limit_;\n  const std::chrono::seconds window_;\n  Clock::TimePoint start_;\n  int used_ = 0;\n};\n", "code": "// время двигаем руками: Now() и Advance(seconds)\nclass FakeClock : public Clock {\n public:\n  ____\n};\n", "check": "TEST(RateLimiterTest, BlocksAfterLimit) {\n  FakeClock clock;\n  RateLimiter rl(clock, 2, 10s);\n  EXPECT_TRUE(rl.Allow());\n  EXPECT_TRUE(rl.Allow());\n  EXPECT_FALSE(rl.Allow());\n}\n\nTEST(RateLimiterTest, StillBlockedJustBeforeWindowEnd) {\n  FakeClock clock;\n  RateLimiter rl(clock, 2, 10s);\n  rl.Allow();\n  rl.Allow();\n  clock.Advance(9s);\n  EXPECT_FALSE(rl.Allow());\n}\n\nTEST(RateLimiterTest, NewWindowAfterAdvance) {\n  FakeClock clock;\n  RateLimiter rl(clock, 2, 10s);\n  rl.Allow();\n  rl.Allow();\n  clock.Advance(10s);\n  EXPECT_TRUE(rl.Allow());\n}\n", "mode": "gtest", "hint": "Поле `TimePoint now_{}`, `Now() const override` его возвращает, `Advance(std::chrono::seconds)` прибавляет.", "solution": "// время двигаем руками: Now() и Advance(seconds)\nclass FakeClock : public Clock {\n public:\n  TimePoint Now() const override { return now_; }\n  void Advance(std::chrono::seconds d) { now_ += d; }\n\n private:\n  TimePoint now_{};\n};\n"}, {"id": "tests-t17", "lesson": "tests-time", "title": "Часы мимо инъекции", "task": "Свежий токен считается протухшим. Найди баг в `AccessToken`: тесты и `FakeClock` верные.", "prefix": "#include <chrono>\n\n#include <gtest/gtest.h>\n\nusing namespace std::chrono_literals;\n\nclass Clock {\n public:\n  using TimePoint = std::chrono::steady_clock::time_point;\n  virtual ~Clock() = default;\n  virtual TimePoint Now() const = 0;\n};\n\nclass FakeClock : public Clock {\n public:\n  TimePoint Now() const override { return now_; }\n  void Advance(std::chrono::seconds d) { now_ += d; }\n\n private:\n  TimePoint now_{};\n};\n", "code": "class AccessToken {\n public:\n  AccessToken(const Clock& clock, std::chrono::seconds ttl)\n      : clock_(clock), expires_at_(clock.Now() + ttl) {}\n\n  bool IsExpired() const {\n    return std::chrono::steady_clock::now() >= expires_at_;\n  }\n\n private:\n  const Clock& clock_;\n  Clock::TimePoint expires_at_;\n};\n", "check": "TEST(AccessTokenTest, FreshTokenIsValid) {\n  FakeClock clock;\n  const AccessToken token(clock, 1h);\n  EXPECT_FALSE(token.IsExpired());\n}\n\nTEST(AccessTokenTest, ValidOneSecondBeforeTtl) {\n  FakeClock clock;\n  const AccessToken token(clock, 1h);\n  clock.Advance(1h - 1s);\n  EXPECT_FALSE(token.IsExpired());\n}\n\nTEST(AccessTokenTest, ExpiresExactlyAtTtl) {\n  FakeClock clock;\n  const AccessToken token(clock, 1h);\n  clock.Advance(1h);\n  EXPECT_TRUE(token.IsExpired());\n}\n", "mode": "gtest", "hint": "Часы передали в конструктор, но `IsExpired` их не использует.", "solution": "class AccessToken {\n public:\n  AccessToken(const Clock& clock, std::chrono::seconds ttl)\n      : clock_(clock), expires_at_(clock.Now() + ttl) {}\n\n  bool IsExpired() const { return clock_.Now() >= expires_at_; }\n\n private:\n  const Clock& clock_;\n  Clock::TimePoint expires_at_;\n};\n"}, {"id": "tests-t18", "lesson": "tests-mt", "title": "Потокобезопасный счётчик", "task": "Реализуй `HitCounter`: `Hit` и `Get` вызываются из разных потоков. Тесты в проверке, второй — стресс на 8 потоков.", "prefix": "#include <latch>\n#include <mutex>\n#include <string>\n#include <thread>\n#include <unordered_map>\n#include <vector>\n\n#include <gtest/gtest.h>\n", "code": "// счётчик хитов по страницам; Hit и Get зовут из разных потоков\nclass HitCounter {\n public:\n  void Hit(const std::string& page) {\n    // TODO\n  }\n  int Get(const std::string& page) const {\n    // TODO\n    return 0;\n  }\n\n private:\n  // TODO\n};\n", "check": "TEST(HitCounterTest, CountsPerPage) {\n  HitCounter c;\n  c.Hit(\"a\");\n  c.Hit(\"a\");\n  c.Hit(\"b\");\n  EXPECT_EQ(c.Get(\"a\"), 2);\n  EXPECT_EQ(c.Get(\"b\"), 1);\n  EXPECT_EQ(c.Get(\"none\"), 0);\n}\n\nTEST(HitCounterTest, ConcurrentHitsAreNotLost) {\n  constexpr int kThreads = 8;\n  constexpr int kHits = 10000;\n  HitCounter c;\n  std::latch start(kThreads);\n  std::vector<std::thread> threads;\n  for (int i = 0; i < kThreads; ++i) {\n    threads.emplace_back([&, i] {\n      start.arrive_and_wait();\n      const std::string page = i % 2 == 0 ? \"a\" : \"b\";\n      for (int j = 0; j < kHits; ++j) {\n        c.Hit(page);\n        c.Get(page);\n      }\n    });\n  }\n  for (auto& t : threads) t.join();\n  EXPECT_EQ(c.Get(\"a\"), kThreads / 2 * kHits);\n  EXPECT_EQ(c.Get(\"b\"), kThreads / 2 * kHits);\n}\n", "mode": "gtest", "hint": "`std::mutex` + `std::unordered_map<std::string, int>`. `Get` — const-метод, поэтому mutex `mutable`.", "solution": "// счётчик хитов по страницам; Hit и Get зовут из разных потоков\nclass HitCounter {\n public:\n  void Hit(const std::string& page) {\n    std::lock_guard lock(mu_);\n    ++hits_[page];\n  }\n  int Get(const std::string& page) const {\n    std::lock_guard lock(mu_);\n    const auto it = hits_.find(page);\n    return it == hits_.end() ? 0 : it->second;\n  }\n\n private:\n  mutable std::mutex mu_;  // Get — const, а lock нужен\n  std::unordered_map<std::string, int> hits_;\n};\n"}, {"id": "tests-t19", "lesson": "tests-mt", "title": "Стресс-тест с latch", "task": "Допиши стресс-тест лимитера: стартовые ворота, ожидание потоков и проверку инварианта. Тест должен ловить сломанные версии `RateLimiter`.", "prefix": "#include <atomic>\n#include <chrono>\n#include <latch>\n#include <thread>\n#include <vector>\n\n#include <gtest/gtest.h>\n\nclass RateLimiter {\n public:\n  explicit RateLimiter(int limit) : left_(limit) {}\n  bool TryAcquire() {\n    int cur = left_.load();\n    while (cur > 0) {\n      if (left_.compare_exchange_weak(cur, cur - 1)) return true;\n    }\n    return false;\n  }\n\n private:\n  std::atomic<int> left_;\n};\n", "code": "TEST(RateLimiterTest, ConcurrentAcquireNeverExceedsLimit) {\n  constexpr int kLimit = 100;\n  constexpr int kThreads = 8;\n  constexpr int kAttempts = 1000;\n  RateLimiter limiter(kLimit);\n  std::atomic<int> granted{0};\n  std::latch start(____);  // ворота: все стартуют разом\n\n  std::vector<std::thread> threads;\n  for (int i = 0; i < kThreads; ++i) {\n    threads.emplace_back([&] {\n      start.____();\n      for (int j = 0; j < kAttempts; ++j) {\n        if (limiter.TryAcquire()) granted.fetch_add(1);\n      }\n    });\n  }\n  for (auto& t : threads) t.____();\n\n  EXPECT_EQ(granted.load(), ____);\n}\n", "mutants": [{"code": "#include <atomic>\n#include <chrono>\n#include <latch>\n#include <thread>\n#include <vector>\n\n#include <gtest/gtest.h>\n\nclass RateLimiter {\n public:\n  explicit RateLimiter(int limit) : left_(limit) {}\n  bool TryAcquire() {\n    int cur = left_.load();\n    while (cur >= 0) {\n      if (left_.compare_exchange_weak(cur, cur - 1)) return true;\n    }\n    return false;\n  }\n\n private:\n  std::atomic<int> left_;\n};\n", "why": "Выдаёт на один больше лимита."}, {"code": "#include <atomic>\n#include <chrono>\n#include <latch>\n#include <thread>\n#include <vector>\n\n#include <gtest/gtest.h>\n\nclass RateLimiter {\n public:\n  explicit RateLimiter(int limit) : left_(limit - 1) {}\n  bool TryAcquire() {\n    int cur = left_.load();\n    while (cur > 0) {\n      if (left_.compare_exchange_weak(cur, cur - 1)) return true;\n    }\n    return false;\n  }\n\n private:\n  std::atomic<int> left_;\n};\n", "why": "Выдаёт на один меньше лимита."}, {"code": "#include <atomic>\n#include <chrono>\n#include <latch>\n#include <thread>\n#include <vector>\n\n#include <gtest/gtest.h>\n\nclass RateLimiter {\n public:\n  explicit RateLimiter(int limit) : left_(limit) {}\n  bool TryAcquire() {\n    if (left_.load() <= 0) return false;\n    std::this_thread::sleep_for(\n        std::chrono::microseconds(100));\n    left_.fetch_sub(1);\n    return true;\n  }\n\n private:\n  std::atomic<int> left_;\n};\n", "why": "Проверка и списание не атомарны: потоки вместе видят \"остался 1\" и выдают больше лимита."}], "mode": "gtest", "hint": "`std::latch` на число потоков, `arrive_and_wait()`, `join()`. Выдано должно быть ровно `kLimit`.", "solution": "TEST(RateLimiterTest, ConcurrentAcquireNeverExceedsLimit) {\n  constexpr int kLimit = 100;\n  constexpr int kThreads = 8;\n  constexpr int kAttempts = 1000;\n  RateLimiter limiter(kLimit);\n  std::atomic<int> granted{0};\n  std::latch start(kThreads);  // ворота: все стартуют разом\n\n  std::vector<std::thread> threads;\n  for (int i = 0; i < kThreads; ++i) {\n    threads.emplace_back([&] {\n      start.arrive_and_wait();\n      for (int j = 0; j < kAttempts; ++j) {\n        if (limiter.TryAcquire()) granted.fetch_add(1);\n      }\n    });\n  }\n  for (auto& t : threads) t.join();\n\n  EXPECT_EQ(granted.load(), kLimit);\n}\n"}, {"id": "tests-t20", "lesson": "tests-integration", "title": "Скип без БД", "task": "Интеграционный тест должен пропускаться, если `TEST_PG_DSN` не задан. Здесь его нет — тест в проверке должен стать SKIPPED, а не красным.", "prefix": "#include <cstdlib>\n#include <memory>\n#include <stdexcept>\n#include <string>\n\n#include <gtest/gtest.h>\n\n// ЗАГЛУШКА драйвера: на этой странице Postgres нет\nnamespace db {\nclass Connection {\n public:\n  explicit Connection(const std::string&) {\n    throw std::runtime_error(\"stub: нужен настоящий Postgres\");\n  }\n  int QueryInt(const std::string&) { return 0; }\n};\n}  // namespace db\n", "code": "class PgSmokeIT : public ::testing::Test {\n protected:\n  void SetUp() override {\n    const char* dsn = std::getenv(\"TEST_PG_DSN\");\n    // нет переменной — пропусти тест с причиной\n    if (dsn == nullptr) ____;\n    conn_ = std::make_unique<db::Connection>(dsn);\n  }\n\n  std::unique_ptr<db::Connection> conn_;\n};\n", "check": "TEST_F(PgSmokeIT, SelectOne) {\n  EXPECT_EQ(conn_->QueryInt(\"SELECT 1\"), 1);\n}\n", "mode": "gtest", "hint": "`GTEST_SKIP() << \"причина\";`. Просто `return;` из SetUp не спасёт: тело выполнится с пустым `conn_`.", "solution": "class PgSmokeIT : public ::testing::Test {\n protected:\n  void SetUp() override {\n    const char* dsn = std::getenv(\"TEST_PG_DSN\");\n    // нет переменной — пропусти тест с причиной\n    if (dsn == nullptr) GTEST_SKIP() << \"TEST_PG_DSN is not set\";\n    conn_ = std::make_unique<db::Connection>(dsn);\n  }\n\n  std::unique_ptr<db::Connection> conn_;\n};\n"}, {"id": "tests-t21", "lesson": "tests-example", "title": "Sliding TTL", "task": "Интервьюер добавил условие: успешный `Validate` продлевает сессию на ttl от текущего момента. Тесты в проверке, допиши `Validate`.", "prefix": "#include <chrono>\n#include <cstdint>\n#include <optional>\n#include <string>\n#include <unordered_map>\n\n#include <gtest/gtest.h>\n\nusing namespace std::chrono_literals;\n\nclass Clock {\n public:\n  using TimePoint = std::chrono::steady_clock::time_point;\n  virtual ~Clock() = default;\n  virtual TimePoint Now() const = 0;\n};\n\nclass FakeClock : public Clock {\n public:\n  TimePoint Now() const override { return now_; }\n  void Advance(std::chrono::seconds d) { now_ += d; }\n\n private:\n  TimePoint now_{};\n};\n", "code": "// sliding TTL: каждый успешный Validate продлевает сессию\n// на ttl от текущего момента\nclass SessionStore {\n public:\n  SessionStore(const Clock& clock, std::chrono::seconds ttl)\n      : clock_(clock), ttl_(ttl) {}\n\n  std::string Create(std::int64_t uid) {\n    std::string token = \"tok-\" + std::to_string(++seq_);\n    sessions_[token] = Session{uid, clock_.Now() + ttl_};\n    return token;\n  }\n\n  std::optional<std::int64_t> Validate(const std::string& token) {\n    const auto it = sessions_.find(token);\n    if (it == sessions_.end()) return std::nullopt;\n    if (clock_.Now() >= it->second.expires_at) return std::nullopt;\n    // TODO: продлить сессию\n    return it->second.uid;\n  }\n\n private:\n  struct Session {\n    std::int64_t uid;\n    Clock::TimePoint expires_at;\n  };\n  const Clock& clock_;\n  const std::chrono::seconds ttl_;\n  int seq_ = 0;\n  std::unordered_map<std::string, Session> sessions_;\n};\n", "check": "class SlidingTtlTest : public ::testing::Test {\n protected:\n  FakeClock clock_;\n  SessionStore store_{clock_, 1h};\n};\n\nTEST_F(SlidingTtlTest, ExpiresWithoutActivity) {\n  const auto token = store_.Create(42);\n  clock_.Advance(1h);\n  EXPECT_EQ(store_.Validate(token), std::nullopt);\n}\n\nTEST_F(SlidingTtlTest, ValidateProlongs) {\n  const auto token = store_.Create(42);\n  clock_.Advance(50min);\n  EXPECT_EQ(store_.Validate(token), 42);\n  clock_.Advance(50min);  // с создания прошло 100 минут\n  EXPECT_EQ(store_.Validate(token), 42);\n}\n\nTEST_F(SlidingTtlTest, TtlCountsFromLastValidate) {\n  const auto token = store_.Create(42);\n  clock_.Advance(30min);\n  EXPECT_EQ(store_.Validate(token), 42);\n  clock_.Advance(1h);  // ровно ttl с последнего Validate\n  EXPECT_EQ(store_.Validate(token), std::nullopt);\n}\n", "mode": "gtest", "hint": "После проверки срока присвой `expires_at = now + ttl_`. Протухшую сессию не продлевай.", "solution": "// sliding TTL: каждый успешный Validate продлевает сессию\n// на ttl от текущего момента\nclass SessionStore {\n public:\n  SessionStore(const Clock& clock, std::chrono::seconds ttl)\n      : clock_(clock), ttl_(ttl) {}\n\n  std::string Create(std::int64_t uid) {\n    std::string token = \"tok-\" + std::to_string(++seq_);\n    sessions_[token] = Session{uid, clock_.Now() + ttl_};\n    return token;\n  }\n\n  std::optional<std::int64_t> Validate(const std::string& token) {\n    const auto it = sessions_.find(token);\n    if (it == sessions_.end()) return std::nullopt;\n    const auto now = clock_.Now();\n    if (now >= it->second.expires_at) return std::nullopt;\n    it->second.expires_at = now + ttl_;\n    return it->second.uid;\n  }\n\n private:\n  struct Session {\n    std::int64_t uid;\n    Clock::TimePoint expires_at;\n  };\n  const Clock& clock_;\n  const std::chrono::seconds ttl_;\n  int seq_ = 0;\n  std::unordered_map<std::string, Session> sessions_;\n};\n"}, {"id": "tests-t22", "lesson": "tests-checklist", "title": "Характеризационный тест", "task": "Перед рефакторингом зафиксируй текущее поведение `Slugify`. Прочитай код и впиши ожидаемые строки вместо `\"____\"`. Тест должен поймать «рефакторинги», которые меняют поведение.", "prefix": "#include <cctype>\n#include <string>\n\n#include <gtest/gtest.h>\n\n// старый код, который собираются переписать\nstd::string Slugify(const std::string& s) {\n  std::string out;\n  bool dash = false;\n  for (char ch : s) {\n    const auto c = static_cast<unsigned char>(ch);\n    if (std::isalnum(c)) {\n      if (dash && !out.empty()) out += '-';\n      out += static_cast<char>(std::tolower(c));\n      dash = false;\n    } else {\n      dash = true;\n    }\n  }\n  return out;\n}\n", "code": "// ожидаемое — константы, а не вызов другой функции\nTEST(SlugifyTest, Characterization) {\n  EXPECT_EQ(Slugify(\"Hello, World!\"), \"____\");\n  EXPECT_EQ(Slugify(\"  C++ 23 \"), \"____\");\n  EXPECT_EQ(Slugify(\"--a--b--\"), \"____\");\n  EXPECT_EQ(Slugify(\"!!!\"), \"____\");\n}\n", "mutants": [{"code": "#include <cctype>\n#include <string>\n\n#include <gtest/gtest.h>\n\n// старый код, который собираются переписать\nstd::string Slugify(const std::string& s) {\n  std::string out;\n  bool dash = false;\n  for (char ch : s) {\n    const auto c = static_cast<unsigned char>(ch);\n    if (std::isalnum(c)) {\n      if (dash) out += '-';\n      out += static_cast<char>(std::tolower(c));\n      dash = false;\n    } else {\n      dash = true;\n    }\n  }\n  return out;\n}\n", "why": "Дефис в начале: \"  C++ 23 \" даёт \"-c-23\"."}, {"code": "#include <cctype>\n#include <string>\n\n#include <gtest/gtest.h>\n\n// старый код, который собираются переписать\nstd::string Slugify(const std::string& s) {\n  std::string out;\n  bool dash = false;\n  for (char ch : s) {\n    const auto c = static_cast<unsigned char>(ch);\n    if (std::isalnum(c)) {\n      if (dash && !out.empty()) out += '-';\n      out += static_cast<char>(std::tolower(c));\n      dash = false;\n    } else if (!out.empty() && out.back() != '-') {\n      out += '-';\n    }\n  }\n  return out;\n}\n", "why": "Дефис в конце: \"Hello, World!\" даёт \"hello-world-\"."}, {"code": "#include <cctype>\n#include <string>\n\n#include <gtest/gtest.h>\n\n// старый код, который собираются переписать\nstd::string Slugify(const std::string& s) {\n  std::string out;\n  bool dash = false;\n  for (char ch : s) {\n    const auto c = static_cast<unsigned char>(ch);\n    if (std::isalnum(c)) {\n      if (dash && !out.empty()) out += '-';\n      out += static_cast<char>(c);\n      dash = false;\n    } else {\n      dash = true;\n    }\n  }\n  return out;\n}\n", "why": "Не приводит к нижнему регистру: \"Hello-World\"."}], "mode": "gtest", "hint": "Разделитель ставится, только если до него уже что-то есть в `out`, и только перед следующей буквой или цифрой.", "solution": "// ожидаемое — константы, а не вызов другой функции\nTEST(SlugifyTest, Characterization) {\n  EXPECT_EQ(Slugify(\"Hello, World!\"), \"hello-world\");\n  EXPECT_EQ(Slugify(\"  C++ 23 \"), \"c-23\");\n  EXPECT_EQ(Slugify(\"--a--b--\"), \"a-b\");\n  EXPECT_EQ(Slugify(\"!!!\"), \"\");\n}\n"}]}, {"id": "modern", "title": "Современный C++ и STL", "lessons": [{"id": "modern-versions", "title": "Карта стандартов: что когда появилось", "blocks": [{"type": "p", "text": "Зачем знать точно: если проект на C++17, а ты пишешь `m.contains(k)`, код не соберётся. Интервьюер заметит. Ниже только то, что реально встречается в продакшн-коде и на собеседовании."}, {"type": "list", "items": ["C++11 — большой перелом: `auto`, `decltype`, range-for, лямбды, rvalue-ссылки и move, `unique_ptr`/`shared_ptr`/`weak_ptr`, `std::thread`/`mutex`/`atomic`/`condition_variable`, `unordered_map`/`unordered_set`, `nullptr`, `enum class`, `override`/`final`, `= default`/`= delete`, `{}`-инициализация, variadic templates, `static_assert`, `std::array`, `std::function`, `emplace_back`.", "C++14 — доводка: `std::make_unique`, generic лямбды (`auto` в параметрах), init-capture `[p = std::move(p)]`, вывод типа возврата `auto f()`, `decltype(auto)`, циклы в `constexpr`, `std::exchange`, разделители `1'000'000`, heterogeneous lookup через `std::less<>`.", "C++17 — словарные типы: `optional`, `variant`, `any`, `string_view`, structured bindings, `if`/`switch` с инициализатором, `if constexpr`, fold expressions, CTAD, `std::filesystem`, parallel algorithms, `inline` переменные, `namespace a::b`, гарантированный copy elision, `[[nodiscard]]`, `[[maybe_unused]]`, `try_emplace`/`insert_or_assign`, `extract`/`merge`, `std::scoped_lock`, `std::shared_mutex`.", "C++20 — «большая четвёрка»: concepts, ranges, coroutines, modules. Плюс `std::span`, `<=>` и `= default` сравнения, designated initializers, `std::format`, `std::jthread`/`stop_token`, `latch`/`barrier`/`counting_semaphore`, `consteval`/`constinit`, `contains()` у ассоциативных контейнеров, `starts_with`/`ends_with` у строк, `std::erase`/`std::erase_if`, `[[likely]]`/`[[unlikely]]`, шаблонные лямбды `[]<typename T>`, `std::bit_cast`, `std::source_location`, `std::ssize`.", "C++23 — удобства: `std::expected`, `std::print`/`std::println`, `std::mdspan`, `std::generator`, deducing this (явный объектный параметр), `std::ranges::to`, `views::zip`/`enumerate`/`chunk`/`slide`, `string::contains`, `std::flat_map`, `std::move_only_function`, `std::unreachable`, монадические `and_then`/`transform`/`or_else` у `optional`, `[[assume]]`."]}, {"type": "p", "text": "Одна и та же задача в разных стандартах:"}, {"type": "code", "code": "#include <iostream>\n#include <map>\n#include <string>\n\nusing Map = std::map<std::string, int>;\n\n// C++98: явный тип итератора\nint Lookup98(const Map& m, const std::string& key) {\n    std::map<std::string, int>::const_iterator it = m.find(key);\n    if (it != m.end()) {\n        return it->second;\n    }\n    return 0;\n}\n\n// C++17: if с инициализатором, переменная не утекает наружу\nint Lookup17(const Map& m, const std::string& key) {\n    if (auto found = m.find(key); found != m.end()) {\n        const auto& [name, value] = *found;\n        return value;\n    }\n    return 0;\n}\n\n// C++20: contains — только проверка наличия\nint Lookup20(const Map& m, const std::string& key) {\n    return m.contains(key) ? m.at(key) : 0;\n}\n\nint main() {\n    Map m{{\"rps\", 100}};\n    std::cout << Lookup98(m, \"rps\") << ' ' << Lookup17(m, \"rps\")\n              << ' ' << Lookup20(m, \"burst\") << '\\n';\n}\n", "expect": "100 100 0"}, {"type": "tip", "text": "Спроси в начале: «Какой стандарт в проекте — 17 или 20?». Дальше проговаривай: «на C++20 возьму `std::erase_if`, на 17 — erase-remove». Это и есть уверенное владение STL."}, {"type": "warn", "text": "Библиотечные фичи C++23 доезжают до компиляторов неравномерно: `std::generator`, `std::flat_map`, `views::enumerate` есть не везде. На собеседовании не строй решение вокруг экзотики, если можно обойтись C++20."}]}, {"id": "modern-move", "title": "Move-семантика: быстрый повтор", "blocks": [{"type": "p", "text": "lvalue — у выражения есть имя и адрес. rvalue — временный объект или результат `std::move`. Перемещение = забрать ресурсы (буфер, указатель), а источник оставить в «валидном, но неспецифицированном» состоянии."}, {"type": "p", "text": "`std::move` ничего не перемещает. Это просто `static_cast<T&&>(x)`. Перемещает конструктор или оператор присваивания, который выберется по перегрузке. Если move-конструктора нет, `std::move` молча приведёт к копированию."}, {"type": "list", "items": ["Rule of 0: если класс владеет ресурсами только через члены-RAII (`string`, `vector`, `unique_ptr`), не пиши ни деструктор, ни копирование, ни перемещение. Это вариант по умолчанию.", "Rule of 3 (до C++11): написал деструктор — напиши copy-конструктор и copy-присваивание.", "Rule of 5: плюс move-конструктор и move-присваивание.", "Объявленный деструктор (даже `= default`) или copy-операции подавляют неявный move. Тип молча начинает копироваться там, где ты ждал перемещения."]}, {"type": "code", "code": "#include <algorithm>\n#include <cstddef>\n#include <iostream>\n#include <utility>\n\n// Rule of 5 нужен только для класса, который сам владеет ресурсом.\nclass Buffer {\npublic:\n    explicit Buffer(std::size_t size)\n        : data_(new char[size]), size_(size) {}\n    ~Buffer() { delete[] data_; }\n\n    Buffer(const Buffer& other)\n        : data_(new char[other.size_]), size_(other.size_) {\n        std::copy(other.data_, other.data_ + size_, data_);\n    }\n    Buffer& operator=(Buffer other) noexcept {  // copy-and-swap\n        swap(other);\n        return *this;\n    }\n    Buffer(Buffer&& other) noexcept\n        : data_(std::exchange(other.data_, nullptr)),\n          size_(std::exchange(other.size_, 0)) {}\n\n    void swap(Buffer& other) noexcept {\n        std::swap(data_, other.data_);\n        std::swap(size_, other.size_);\n    }\n    std::size_t Size() const { return size_; }\n\nprivate:\n    char* data_;\n    std::size_t size_;\n};\n\nint main() {\n    Buffer a(16);\n    Buffer b = a;             // copy\n    Buffer c = std::move(a);  // move: a отдал буфер\n    std::cout << a.Size() << ' ' << b.Size() << ' '\n              << c.Size() << '\\n';\n    b = Buffer(4);            // присваивание: move в параметр + swap\n    c = b;                    // присваивание: copy в параметр + swap\n    std::cout << b.Size() << ' ' << c.Size() << '\\n';\n}\n", "expect": "0 16 16\n4 4"}, {"type": "p", "text": "Оператор присваивания по значению покрывает и copy, и move: аргумент сконструируется копией или перемещением, дальше `swap`. Но в реальном коде лучше `std::vector<char>` или `std::unique_ptr<char[]>` и rule of 0."}, {"type": "p", "text": "Почему `noexcept` у move-конструктора критичен. При реаллокации `vector` переносит элементы через `std::move_if_noexcept`. Если move может бросить, а copy есть, вектор копирует: так он сохраняет строгую гарантию исключений."}, {"type": "code", "code": "#include <iostream>\n#include <vector>\n\nstruct Loud {\n    Loud() = default;\n    Loud(const Loud&) { std::cout << \"copy \"; }\n    Loud(Loud&&) { std::cout << \"move \"; }  // нет noexcept\n};\n\nint main() {\n    std::vector<Loud> v(2);  // capacity == 2\n    v.emplace_back();        // реаллокация: переносим 2 элемента\n    std::cout << '\\n';\n}\n", "expect": "copy copy"}, {"type": "warn", "text": "Добавь `noexcept` к `Loud(Loud&&)` — и вывод станет `move move`. Неявно сгенерированный move-конструктор сам получает `noexcept`, если move всех членов `noexcept`. Проблема только у рукописного."}, {"type": "p", "text": "Moved-from состояние. Для стандартных типов: объект валиден, значение не специфицировано. Можно присвоить новое значение, вызвать `clear()`, уничтожить. Нельзя полагаться на содержимое. Исключение — `unique_ptr` и `shared_ptr`: после move они гарантированно пусты."}, {"type": "p", "text": "Perfect forwarding. `T&&`, где `T` выводится, — это forwarding (универсальная) ссылка. Она принимает и lvalue, и rvalue. `std::forward<T>(x)` возвращает исходную категорию значения."}, {"type": "code", "code": "#include <iostream>\n#include <memory>\n#include <string>\n#include <utility>\n#include <vector>\n\ntemplate <typename T, typename... Args>\nstd::unique_ptr<T> MakeOwned(Args&&... args) {\n    return std::unique_ptr<T>(new T(std::forward<Args>(args)...));\n}\n\nvoid Store(std::string&& s, std::vector<std::string>& out) {\n    // s — имя, значит lvalue, хоть тип и string&&\n    out.push_back(std::move(s));\n}\n\nstruct Tracer {\n    Tracer() = default;\n    Tracer(const Tracer&) { std::cout << \"copy\\n\"; }\n    Tracer(Tracer&&) noexcept { std::cout << \"move\\n\"; }\n};\n\nint main() {\n    Tracer t;\n    auto a = MakeOwned<Tracer>(t);             // lvalue\n    auto b = MakeOwned<Tracer>(std::move(t));  // rvalue\n\n    std::vector<std::string> out;\n    Store(\"abc\", out);\n    std::cout << out[0] << '\\n';\n}\n", "expect": "copy\nmove\nabc"}, {"type": "warn", "text": "Forwarding ссылка — только `T&&` с выводимым `T` или `auto&&`. `std::vector<T>&&`, `const T&&`, `T&&` в методе шаблонного класса (где `T` уже известен) — обычные rvalue-ссылки. И помни: именованная rvalue-ссылка — это lvalue."}, {"type": "p", "text": "Copy elision. С C++17 возврат prvalue (`return T{...};`) гарантированно не копирует и не перемещает — работает даже для некопируемых и неперемещаемых типов. NRVO (возврат именованной локальной переменной) не гарантирован, но компиляторы делают его. Если NRVO не сработал, локальная переменная в `return` перемещается неявно."}, {"type": "code", "code": "#include <iostream>\n#include <string>\n#include <utility>\n\nstruct Tracer {\n    Tracer() = default;\n    Tracer(const Tracer&) { std::cout << \"copy \"; }\n    Tracer(Tracer&&) noexcept { std::cout << \"move \"; }\n};\n\nTracer Make() {\n    Tracer t;\n    return t;               // NRVO или неявный move\n}\n\nTracer MakeMoved() {\n    Tracer t;\n    return std::move(t);    // хуже: запрещает NRVO\n}\n\nclass User {\npublic:\n    // sink-параметр: по значению + move внутрь\n    explicit User(std::string name) : name_(std::move(name)) {}\n    const std::string& Name() const { return name_; }\n\nprivate:\n    std::string name_;\n};\n\nint main() {\n    Tracer a = Make();\n    std::cout << \"| \";\n    Tracer b = MakeMoved();\n    std::cout << \"|\\n\";\n\n    std::string name = \"alice\";\n    User u(std::move(name));  // ни одной копии строки\n    std::cout << u.Name() << '\\n';\n}\n", "expect": "| move |\nalice"}, {"type": "warn", "text": "`return std::move(local);` — антипаттерн. Он отключает NRVO (выражение больше не имя переменной), а move и так случился бы неявно. Компиляторы предупреждают: pessimizing move."}, {"type": "tip", "text": "Вслух: «move-конструктор помечаю `noexcept`, иначе vector при росте будет копировать. Возвращаю по значению — сработает NRVO, `std::move` в return не нужен»."}]}, {"id": "modern-smart", "title": "Умные указатели", "blocks": [{"type": "p", "text": "`unique_ptr` — единоличное владение. Только перемещается. С дефолтным deleter размер равен сырому указателю, накладных расходов нет. Создавать через `std::make_unique` (C++14): нет голого `new`, нет утечки при исключении в соседнем аргументе."}, {"type": "code", "code": "#include <cstdio>\n#include <iostream>\n#include <memory>\n\nstruct FileCloser {\n    void operator()(std::FILE* f) const noexcept {\n        if (f != nullptr) {\n            std::fclose(f);\n        }\n    }\n};\n\n// Пустой функтор-deleter не увеличивает размер unique_ptr.\nusing FilePtr = std::unique_ptr<std::FILE, FileCloser>;\n// Указатель на функцию хранится внутри: размер x2.\nusing FilePtrFn = std::unique_ptr<std::FILE, int (*)(std::FILE*)>;\n\nFilePtr OpenLog(const char* path) {\n    return FilePtr(std::fopen(path, \"a\"));\n}\n\nstruct Worker {\n    ~Worker() { std::cout << \"~Worker\\n\"; }\n};\n\n// Параметр по значению: функция забирает владение.\nvoid Submit(std::unique_ptr<Worker> worker) {\n    std::cout << \"submitted\\n\";\n}  // worker уничтожается здесь\n\nint main() {\n    std::cout << sizeof(FilePtr) << ' ' << sizeof(FilePtrFn) << '\\n';\n    auto w = std::make_unique<Worker>();\n    Submit(std::move(w));\n    std::cout << (w == nullptr) << '\\n';  // w теперь пуст\n}\n", "expect": "8 16\nsubmitted\n~Worker\n1"}, {"type": "warn", "text": "Указатель на функцию в роли deleter тоже работает, но его надо хранить: размер `unique_ptr` удваивается. Функтор без состояния бесплатен."}, {"type": "p", "text": "Копирование `unique_ptr` — ошибка компиляции, а не рантайма. Пример ниже не собирается намеренно: запусти и прочитай ошибку `use of deleted function`."}, {"type": "code", "code": "#include <memory>\n#include <utility>\n\nint main() {\n    auto a = std::make_unique<int>(42);\n    auto b = a;               // ошибка: copy-конструктор удалён\n    auto c = std::move(a);    // так можно: владение переехало\n}\n"}, {"type": "p", "text": "`shared_ptr` — совместное владение через control block: счётчик сильных ссылок, счётчик слабых, deleter, аллокатор. Сам `shared_ptr` — два указателя: на объект и на блок."}, {"type": "list", "items": ["`std::make_shared<T>(...)` — одна аллокация: объект и блок рядом. Быстрее и лучше для кэша.", "Минус `make_shared`: память под объект живёт, пока жив последний `weak_ptr` (деструктор вызовется вовремя, но блок общий).", "Каждое копирование — атомарный инкремент, каждое уничтожение — атомарный декремент. На 1M RPS лишние копии `shared_ptr` видны в профиле.", "Потокобезопасен только счётчик. Сам объект — нет. И один и тот же экземпляр `shared_ptr` нельзя менять из двух потоков без синхронизации (для этого есть `std::atomic<std::shared_ptr<T>>`, C++20).", "Aliasing-конструктор: `std::shared_ptr<Member>(owner, &owner->member)` — указывает на член, но держит живым весь `owner`."]}, {"type": "warn", "text": "Два `shared_ptr` из одного сырого указателя — два control block и двойное удаление: `shared_ptr<T> a(raw); shared_ptr<T> b(raw);`. Та же ошибка — `shared_ptr<T>(this)` внутри метода."}, {"type": "p", "text": "`weak_ptr` — наблюдатель без владения. Разрывает циклы (ребёнок → родитель), подходит для кэшей и подписок. Доступ только через `lock()`: вернёт `shared_ptr` или пустой."}, {"type": "code", "code": "#include <iostream>\n#include <memory>\n#include <string>\n#include <vector>\n\nstruct Node {\n    explicit Node(std::string n) : name(std::move(n)) {}\n    ~Node() { std::cout << \"~\" << name << ' '; }\n\n    std::string name;\n    std::vector<std::shared_ptr<Node>> children;\n    std::weak_ptr<Node> parent;  // shared_ptr здесь дал бы цикл\n};\n\nint main() {\n    auto root = std::make_shared<Node>(\"root\");\n    auto leaf = std::make_shared<Node>(\"leaf\");\n    root->children.push_back(leaf);\n    leaf->parent = root;\n\n    if (auto p = leaf->parent.lock()) {\n        std::cout << \"parent=\" << p->name << '\\n';\n    }\n    leaf.reset();  // leaf ещё жив: им владеет root\n    root.reset();\n    std::cout << '\\n';\n}\n", "expect": "parent=root\n~root ~leaf"}, {"type": "warn", "text": "`if (!w.expired()) { w.lock()->...; }` — гонка: между проверкой и `lock()` объект могут удалить. Правильно: один вызов `lock()` и проверка результата."}, {"type": "p", "text": "`enable_shared_from_this` нужен, когда объект сам должен продлить себе жизнь — типично в асинхронных колбэках."}, {"type": "code", "code": "#include <functional>\n#include <iostream>\n#include <memory>\n#include <vector>\n\n// Ими
