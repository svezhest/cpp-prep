`."}, {"id": "modern-q2", "lesson": "modern-versions", "q": "Проект собирается с `-std=c++17`. Что из этого не скомпилируется?", "options": ["`auto [it, ok] = cache.try_emplace(key, 1);`", "`if (auto it = cache.find(key); it != cache.end()) { ... }`", "`if (cache.contains(key)) { ... }`", "`auto p = std::make_unique<Widget>();`", "`std::string_view name = \"alice\";`"], "answer": 2, "explain": "`contains` у ассоциативных контейнеров появился только в C++20. `try_emplace`, `if` с инициализатором и `string_view` — C++17, `make_unique` — C++14."}, {"id": "modern-q3", "lesson": "modern-versions", "q": "Что из списка появилось именно в C++23?", "options": ["`std::span` и `std::format`", "`std::jthread` и `std::stop_token`", "`std::optional` и `std::variant`", "concepts и `requires`", "`std::expected` и `std::print`"], "answer": 4, "explain": "`std::expected`, `std::print`/`println`, `std::mdspan`, `std::generator`, `ranges::to`, deducing this — C++23. `span`, `format`, `jthread`, concepts — C++20. `optional`/`variant` — C++17."}, {"id": "modern-q4", "lesson": "modern-versions", "q": "Какая пара «фича — стандарт» неверна?", "options": ["`std::make_unique` — C++14", "`std::erase_if` для vector — C++20", "fold expressions — C++17", "generic лямбды `[](auto x)` — C++11", "шаблонные лямбды `[]<typename T>` — C++20"], "answer": 3, "explain": "Generic лямбды с `auto` в параметрах появились в C++14. В C++11 у лямбд параметры были только конкретных типов."}, {"id": "modern-q5", "lesson": "modern-move", "q": "Что выведет программа?", "code": "#include <iostream>\n#include <vector>\n\nstruct Loud {\n    Loud() = default;\n    Loud(const Loud&) { std::cout << \"copy \"; }\n    Loud(Loud&&) { std::cout << \"move \"; }\n};\n\nint main() {\n    std::vector<Loud> v(2);\n    v.emplace_back();\n}", "options": ["`copy copy`", "`move move`", "`copy copy copy`", "`move move move`", "Ничего: emplace_back строит на месте"], "answer": 0, "explain": "При реаллокации `vector` переносит старые элементы через `std::move_if_noexcept`. Move-конструктор не помечен `noexcept`, а copy есть, поэтому вектор копирует, сохраняя строгую гарантию. Новый элемент строится на месте и ничего не печатает. С `noexcept` было бы `move move`."}, {"id": "modern-q6", "lesson": "modern-move", "q": "`std::string a = \"hello\"; std::string b = std::move(a);` Что стандарт гарантирует про `a`?", "options": ["`a` гарантированно пуст", "`a` по-прежнему равен \"hello\"", "`a` валиден, значение не специфицировано: можно присвоить, очистить или уничтожить", "Любое обращение к `a` — UB, даже присваивание", "`a` уже уничтожен, деструктор не вызовется"], "answer": 2, "explain": "Moved-from объекты стандартной библиотеки — valid but unspecified. На практике строка обычно пуста, но при SSO реализация может оставить и копию. Присваивание и `clear()` безопасны, полагаться на содержимое нельзя."}, {"id": "modern-q7", "lesson": "modern-move", "q": "Для какого типа после `auto q = std::move(p);` стандарт гарантирует конкретное состояние `p`?", "options": ["`std::unique_ptr<int>`: `p == nullptr`", "`std::string`: `p.empty()`", "`std::array<int, 3>`: все элементы равны 0", "`int`: `p == 0`", "`std::optional<int>`: `!p.has_value()`"], "answer": 0, "explain": "Для `unique_ptr` (и `shared_ptr`) пустота после move прописана в стандарте. Перемещение `int` — копия, значение остаётся. Moved-from `optional<int>` остаётся с значением (перемещено содержимое, а не флаг). У строки — unspecified. `std::array<int, 3>` перемещается поэлементно, то есть копируется."}, {"id": "modern-q8", "lesson": "modern-move", "q": "Что выведет программа?", "code": "#include <iostream>\n\nvoid g(int&) { std::cout << \"lvalue\"; }\nvoid g(int&&) { std::cout << \"rvalue\"; }\n\nvoid f(int&& x) { g(x); }\n\nint main() { f(42); }", "options": ["`rvalue`", "Не скомпилируется: неоднозначность", "Зависит от оптимизаций", "`lvalue`"], "answer": 3, "explain": "Внутри `f` параметр `x` — имя, значит lvalue, независимо от того, что тип — `int&&`. Чтобы передать дальше как rvalue, нужен `std::move(x)` или `std::forward<T>(x)` в шаблоне."}, {"id": "modern-q9", "lesson": "modern-move", "q": "Где `T&&` — forwarding (универсальная) ссылка?", "options": ["`template <class T> void f(std::vector<T>&& v);`", "`template <class T> void f(const T&& x);`", "`template <class T> struct Box { void Put(T&& x); };`", "`void f(std::string&& s);`", "`template <class T> void f(T&& x);`"], "answer": 4, "explain": "Forwarding ссылка — только `T&&` с выводимым в этом же вызове `T` (и `auto&&`). `vector<T>&&` и `const T&&` — rvalue-ссылки. В методе `Box<T>::Put` тип `T` уже зафиксирован классом, вывода нет."}, {"id": "modern-q10", "lesson": "modern-move", "q": "Что плохого в `return std::move(result);`, где `result` — локальный `std::vector<int>`?", "options": ["Ничего, это рекомендуемый стиль с C++11", "Запрещает NRVO; без `std::move` был бы NRVO или неявный move", "Это UB: возвращается ссылка на локальный объект", "Не скомпилируется: нельзя move из локальной переменной", "Вектор скопируется вместо перемещения"], "answer": 1, "explain": "Выражение `std::move(result)` — уже не имя переменной, и NRVO невозможен: будет move-конструктор. Без `std::move` компилятор применит NRVO, а если не сможет — переместит неявно. Копии в обоих случаях нет."}, {"id": "modern-q11", "lesson": "modern-move", "q": "У класса только члены `std::string` и `std::vector<int>`. Добавили `~Session() = default;`. Что произошло с перемещением?", "options": ["Ничего: `= default` не считается пользовательским деструктором", "Класс перестал копироваться, но перемещается", "Move остался, но перестал быть `noexcept`", "Неявный move больше не объявляется; `std::move(s)` будет копировать", "Не скомпилируется `std::move(s)`"], "answer": 3, "explain": "Пользовательски объявленный деструктор (даже `= default`) подавляет неявные move-операции. Copy-операции при этом генерируются (устаревшее поведение), поэтому rvalue молча уходит в копию. Это аргумент за rule of 0."}, {"id": "modern-q12", "lesson": "modern-move", "q": "Компилируется ли код (C++17 и новее)?", "code": "#include <mutex>\n\nstruct Mutexed {\n    std::mutex mu;\n    int value = 0;\n};\n\nMutexed Make() { return Mutexed{}; }\n\nint main() {\n    Mutexed m = Make();\n    return m.value;\n}", "options": ["Нет: у `Mutexed` удалены copy и move", "Да, но только с оптимизациями", "Да: возврат prvalue — гарантированный copy elision, конструкторы не нужны", "Нет: нужен `std::move` в return", "Да, но это UB"], "answer": 2, "explain": "С C++17 `return T{...};` и `T x = T{...};` материализуют объект сразу в месте назначения. Copy/move конструкторы даже не проверяются. Для NRVO (`T x; return x;`) это не так — там нужен доступный move или copy."}, {"id": "modern-q13", "lesson": "modern-smart", "q": "Что произойдёт?", "code": "#include <memory>\n\nstruct Widget {};\n\nint main() {\n    Widget* raw = new Widget;\n    std::shared_ptr<Widget> a(raw);\n    std::shared_ptr<Widget> b(raw);\n}", "options": ["Двойное удаление: два независимых control block — UB", "Всё корректно: счётчик станет 2", "Не скомпилируется: shared_ptr из сырого указателя запрещён", "Утечка: объект никогда не удалится", "`b` бросит исключение `std::bad_weak_ptr`"], "answer": 0, "explain": "Каждый конструктор из сырого указателя создаёт свой control block со счётчиком 1. Оба вызовут `delete` — двойное освобождение. Второй владелец должен быть копией: `auto b = a;`."}, {"id": "modern-q14", "lesson": "modern-smart", "q": "Что выведет программа?", "code": "#include <iostream>\n#include <memory>\n\nstruct B;\nstruct A {\n    std::shared_ptr<B> b;\n    ~A() { std::cout << \"~A \"; }\n};\nstruct B {\n    std::shared_ptr<A> a;\n    ~B() { std::cout << \"~B \"; }\n};\n\nint main() {\n    auto a = std::make_shared<A>();\n    auto b = std::make_shared<B>();\n    a->b = b;\n    b->a = a;\n    std::cout << '\\n';\n}", "options": ["`~A ~B`", "`~B ~A`", "Порядок не определён", "Не скомпилируется", "Пустую строку: деструкторы не вызовутся"], "answer": 4, "explain": "`a` и `b` ссылаются друг на друга через `shared_ptr`: после выхода из `main` у каждого счётчик 1 — цикл, утечка. Одну из связей нужно сделать `weak_ptr`."}, {"id": "modern-q15", "lesson": "modern-smart", "q": "Объект создан через `std::make_shared`. Последний `shared_ptr` уничтожен, но жив один `weak_ptr`. Что с памятью?", "options": ["Объект и память освобождены, остался только control block", "Деструктор вызван, но общий блок памяти (объект + control block) освободится только после последнего `weak_ptr`", "Деструктор не вызван, пока жив `weak_ptr`", "Всё освобождено, `weak_ptr` указывает в мусор", "Утечка: память не освободится никогда"], "answer": 1, "explain": "`make_shared` делает одну аллокацию под объект и счётчики. Деструктор вызывается при обнулении сильного счётчика, но блок нельзя вернуть, пока жив слабый счётчик. Для больших объектов с долгоживущими `weak_ptr` это довод за `shared_ptr<T>(new T)`."}, {"id": "modern-q16", "lesson": "modern-smart", "q": "Функция только читает поля виджета и не сохраняет его. Какая сигнатура лучше?", "options": ["`void Draw(std::shared_ptr<Widget> w);`", "`void Draw(const std::shared_ptr<Widget>& w);`", "`void Draw(const Widget& w);`", "`void Draw(std::unique_ptr<Widget> w);`", "`void Draw(Widget w);`"], "answer": 2, "explain": "Владение функции не нужно — передаём ссылку. `shared_ptr` по значению — два атомарных изменения счётчика и навязывание вызывающему именно `shared_ptr`. `unique_ptr` по значению забрал бы владение, `Widget` по значению — копия."}, {"id": "modern-q17", "lesson": "modern-smart", "q": "Что выведет программа на 64-битной платформе?", "code": "#include <cstdio>\n#include <iostream>\n#include <memory>\n\nstruct Closer {\n    void operator()(std::FILE* f) const { std::fclose(f); }\n};\n\nusing FnPtr = int (*)(std::FILE*);\n\nint main() {\n    std::cout << sizeof(std::unique_ptr<std::FILE, Closer>) << ' '\n              << sizeof(std::unique_ptr<std::FILE, FnPtr>);\n}", "options": ["`8 8`", "`16 16`", "`8 24`", "`16 8`", "`8 16`"], "answer": 4, "explain": "С пустым функтором-deleter `unique_ptr` равен сырому указателю (empty base optimization). Указатель на функцию — это состояние, его надо хранить: размер удваивается."}, {"id": "modern-q18", "lesson": "modern-smart", "q": "Класс наследует `enable_shared_from_this`. Объект создан на стеке, и у него вызвали `shared_from_this()`. Что будет (C++17+)?", "options": ["Вернётся пустой `shared_ptr`", "Создастся новый control block, объект удалят дважды", "Ошибка компиляции", "Исключение `std::bad_weak_ptr`", "Вернётся `shared_ptr` со счётчиком 1"], "answer": 3, "explain": "`shared_from_this` берёт `weak_ptr`, который заполняет первый `shared_ptr`, создавший объект. Если владельца нет, с C++17 бросается `std::bad_weak_ptr`. По той же причине его нельзя вызывать в конструкторе."}, {"id": "modern-q19", "lesson": "modern-smart", "q": "Два потока одновременно делают `auto local = global_ptr;` (копия одного и того же `std::shared_ptr`). Третий поток в это время делает `global_ptr = std::make_shared<Config>();`. Есть ли гонка?", "options": ["Да: запись в один экземпляр `shared_ptr` вместе с чтением — гонка; нужен mutex или `std::atomic<std::shared_ptr<Config>>`", "Нет: счётчик ссылок атомарный, значит `shared_ptr` потокобезопасен", "Гонка только между двумя читателями", "Нет, если `Config` неизменяемый", "Да, но только на 32-битных платформах"], "answer": 0, "explain": "Атомарен только счётчик в control block. Сам объект `shared_ptr` (два указателя) при одновременной записи и чтении — обычная гонка данных. Одновременные копии без записи безопасны."}, {"id": "modern-q20", "lesson": "modern-seq", "q": "Что произойдёт?", "code": "#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int> v{1, 2, 3};\n    int& first = v[0];\n    v.push_back(4);\n    std::cout << first << '\\n';\n}", "options": ["Выведет `1`", "UB: `push_back` реаллоцировал память, `first` висит", "Выведет `4`", "Не скомпилируется: нельзя брать ссылку на элемент вектора", "Бросит `std::out_of_range`"], "answer": 1, "explain": "`v{1, 2, 3}` имеет capacity 3, четвёртый элемент вызывает реаллокацию. Все ссылки, указатели и итераторы на старый буфер становятся невалидными. ASan покажет heap-use-after-free."}, {"id": "modern-q21", "lesson": "modern-seq", "q": "Что выведет программа?", "code": "#include <algorithm>\n#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int> v{1, 2, 3, 4, 5};\n    auto even = [](int x) { return x % 2 == 0; };\n    auto new_end = std::remove_if(v.begin(), v.end(), even);\n    (void)new_end;\n    std::cout << v.size() << '\\n';\n}", "options": ["`5`", "`3`", "`2`", "Не скомпилируется", "UB"], "answer": 0, "explain": "`std::remove_if` не меняет размер контейнера: он сдвигает оставшиеся элементы в начало и возвращает новый логический конец. Хвост остаётся (в moved-from состоянии). Нужен `erase` или `std::erase_if`."}, {"id": "modern-q22", "lesson": "modern-seq", "q": "Что выведет программа?", "code": "#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int> v;\n    v.reserve(10);\n    std::cout << v.size() << '\\n';\n    v[5] = 1;\n}", "options": ["`10`, и `v[5]` безопасно", "`10`, а `v[5]` бросит исключение", "`0`, затем обращение `v[5]` — UB", "`0`, и `v[5]` бросит `std::out_of_range`", "Не скомпилируется"], "answer": 2, "explain": "`reserve` выделяет память, но не создаёт элементы: `size()` остаётся 0. `operator[]` не проверяет границы, запись за `size()` — UB, даже если память выделена. Нужен `resize(10)` или `push_back`."}, {"id": "modern-q23", "lesson": "modern-seq", "q": "`std::deque<int> d` содержит элементы, есть `int& ref = d[3]` и итератор `it = d.begin() + 3`. Выполнили `d.push_back(7)`. Что осталось валидным?", "options": ["Оба валидны", "Оба невалидны", "`it` валиден, `ref` — нет", "Зависит от того, была ли реаллокация", "`ref` валидна, `it` — нет"], "answer": 4, "explain": "Вставка в начало или конец `deque` инвалидирует все итераторы (мог перестроиться массив указателей на блоки), но ссылки на элементы остаются: сами блоки не переезжают. У `vector` при реаллокации ломается всё."}, {"id": "modern-q24", "lesson": "modern-seq", "q": "Какая строка не скомпилируется?", "code": "#include <vector>\n\nint main() {\n    std::vector<std::vector<int>> rows;\n    rows.push_back(3);\n    rows.emplace_back(3);\n    rows.push_back({3});\n    rows.emplace_back();\n}", "options": ["`rows.emplace_back(3);`", "`rows.push_back(3);`", "`rows.push_back({3});`", "`rows.emplace_back();`", "Все компилируются"], "answer": 1, "explain": "Конструктор `vector(size_type)` — `explicit`. `push_back(3)` требует неявного преобразования `int` → `vector<int>` и не компилируется. `emplace_back(3)` вызывает конструктор явно — вектор из трёх нулей. `push_back({3})` — initializer_list, вектор из одного элемента 3."}, {"id": "modern-q25", "lesson": "modern-seq", "q": "Цикл удаляет нечётные. Что не так?", "code": "#include <vector>\n\nvoid DropOdd(std::vector<int>& v) {\n    for (auto it = v.begin(); it != v.end(); ++it) {\n        if (*it % 2 != 0) {\n            v.erase(it);\n        }\n    }\n}", "options": ["Ничего, код корректен", "Только производительность: O(n²)", "Не скомпилируется: `erase` принимает `const_iterator`", "После `erase(it)` итератор невалиден, а `++it` по нему — UB", "Удалит только первый нечётный"], "answer": 3, "explain": "`erase` инвалидирует итератор на удалённый элемент. Правильно: `it = v.erase(it);` в ветке удаления и `++it` в остальных. А лучше `std::erase_if(v, pred)` — O(n) вместо O(n²)."}, {"id": "modern-q26", "lesson": "modern-seq", "q": "Что не так с `std::vector<bool> flags(10); auto f = flags[0]; f = true;`?", "options": ["Ничего: `f` — копия `bool`, `flags` не меняется", "Не скомпилируется: нельзя `auto` для элемента вектора", "`f` — прокси-объект, а не `bool`: присваивание меняет `flags[0]`", "UB: `flags[0]` не инициализирован", "`f` — `bool&`, так же как для `vector<int>` был бы `int&`"], "answer": 2, "explain": "`vector<bool>` хранит биты и возвращает `std::vector<bool>::reference` — прокси. `auto` выводит тип прокси, и запись через него меняет исходный бит. Для `vector<int>` `auto` дал бы копию `int`."}, {"id": "modern-q27", "lesson": "modern-assoc", "q": "Что выведет программа?", "code": "#include <iostream>\n#include <map>\n#include <string>\n\nint main() {\n    std::map<std::string, int> m;\n    if (m[\"a\"] == 0) {\n        std::cout << \"\";\n    }\n    std::cout << m.size() << '\\n';\n}", "options": ["`1`", "`0`", "Не скомпилируется", "UB: ключа нет", "Бросит `std::out_of_range`"], "answer": 0, "explain": "`operator[]` вставляет элемент со значением по умолчанию, если ключа нет. Даже простая проверка `m[\"a\"] == 0` добавила запись. Для чтения — `find`, `contains`, `at`."}, {"id": "modern-q28", "lesson": "modern-assoc", "q": "Почему не компилируется?", "code": "#include <map>\n#include <string>\n\nclass Limits {\npublic:\n    int Get(const std::string& user) const {\n        return limits_[user];\n    }\n\nprivate:\n    std::map<std::string, int> limits_;\n};", "options": ["У `std::map` нет `operator[]` для `std::string`", "Нужно `this->limits_`", "`const` метод не может возвращать `int`", "Компилируется без ошибок", "`operator[]` у map не-const: может вставить элемент"], "answer": 4, "explain": "В const-методе `limits_` — `const std::map`, а у `operator[]` нет const-перегрузки. Используй `find` или `at` (бросит, если ключа нет)."}, {"id": "modern-q29", "lesson": "modern-assoc", "q": "Что происходит в этом цикле?", "code": "#include <map>\n#include <string>\n\nint Sum(const std::map<std::string, int>& m) {\n    int total = 0;\n    for (const std::pair<std::string, int>& kv : m) {\n        total += kv.second;\n    }\n    return total;\n}", "options": ["Ничего лишнего: обход по константной ссылке", "Каждый элемент копируется во временную пару: тип не совпадает с `value_type`", "Не скомпилируется: нельзя связать ссылку с другим типом", "UB: ссылка на временный объект после итерации", "Ключи копируются, значения — нет"], "answer": 1, "explain": "`value_type` у `std::map<std::string, int>` — `std::pair<const std::string, int>`. `const std::pair<std::string, int>&` к нему не привязывается напрямую, поэтому создаётся временная пара (копия строки) и ссылка связывается с ней. Пиши `const auto& [key, value]`."}, {"id": "modern-q30", "lesson": "modern-assoc", "q": "Что выведет программа?", "code": "#include <iostream>\n#include <map>\n#include <string>\n#include <utility>\n\nint main() {\n    std::map<int, std::string> m{{1, \"a\"}};\n    std::string s = \"b\";\n    m.try_emplace(1, std::move(s));\n    std::cout << m[1] << ' ' << s << '\\n';\n}", "options": ["`b `", "`b b`", "`a `", "`a b`", "`b a`"], "answer": 3, "explain": "`try_emplace` при существующем ключе не трогает аргументы: `s` не перемещена и остаётся \"b\", значение в map — \"a\". `emplace` в такой ситуации мог бы уже переместить `s` во временную пару."}, {"id": "modern-q31", "lesson": "modern-assoc", "q": "Во время вставки в `std::unordered_map` случился rehash. Что осталось валидным?", "options": ["Всё: итераторы, ссылки, указатели", "Ничего", "Итераторы; ссылки — нет", "Только `end()`", "Ссылки и указатели на элементы; итераторы — нет"], "answer": 4, "explain": "Стандартный `unordered_map` хранит элементы в нодах. При rehash перестраиваются бакеты, ноды не переезжают — ссылки живы. Итераторы инвалидируются, потому что меняется порядок обхода. У flat hash map с открытой адресацией ломаются и ссылки."}, {"id": "modern-q32", "lesson": "modern-assoc", "q": "Сложность `std::lower_bound(s.begin(), s.end(), x)` для `std::set<int> s` из n элементов?", "options": ["O(log n) во всём", "O(1)", "O(n log n)", "O(log n) сравнений, но O(n) шагов итератора", "Не скомпилируется: нужен random access итератор"], "answer": 3, "explain": "Алгоритм работает и с bidirectional итераторами, но `std::advance` для них линейный. Метод `s.lower_bound(x)` спускается по дереву — честный O(log n)."}, {"id": "modern-q33", "lesson": "modern-assoc", "q": "Нужно поменять ключ элемента `std::map` без копирования значения (значение тяжёлое). Как правильно в C++17?", "options": ["`m.find(old_key)->first = new_key;`", "`auto node = m.extract(old_key); node.key() = new_key; m.insert(std::move(node));`", "`m[new_key] = m[old_key]; m.erase(old_key);`", "`std::swap(m[old_key], m[new_key]);`", "Невозможно: ключи map неизменяемы"], "answer": 1, "explain": "Node handle позволяет вынуть ноду без копирования и аллокации, поменять ключ и вставить обратно. Через итератор ключ менять нельзя: он `const`. Вариант с `[]` копирует значение и конструирует лишнее."}, {"id": "modern-q34", "lesson": "modern-views", "q": "В какой строке висячий `string_view`?", "options": ["`std::string_view a = \"abc\";`", "`std::string s = \"abc\"; std::string_view c = s;`", "`std::string_view b = std::string(\"ab\") + \"c\";`", "`std::string_view d = std::string_view(\"abc\").substr(1);`", "Висячих нет"], "answer": 2, "explain": "`std::string(\"ab\") + \"c\"` — временная строка, умирает в конце полного выражения, `b` смотрит в освобождённую память. Литерал живёт всю программу, `s` — локальная переменная, `substr` у view тоже указывает в литерал."}, {"id": "modern-q35", "lesson": "modern-views", "q": "Что выведет программа?", "code": "#include <cstdio>\n#include <string_view>\n\nint main() {\n    std::string_view sv = \"hello world\";\n    std::string_view word = sv.substr(0, 5);\n    std::printf(\"%s\\n\", word.data());\n}", "options": ["`hello world`", "`hello`", "`world`", "UB: `data()` пуст", "Не скомпилируется"], "answer": 0, "explain": "`substr` у `string_view` не копирует и не добавляет `\\0`. `data()` указывает в начало исходного литерала, а `%s` печатает до нуля — всю строку. Поэтому view нельзя передавать в C API, ожидающие нуль-терминированную строку."}, {"id": "modern-q36", "lesson": "modern-views", "q": "`std::string ReadLine();` Что не так в `auto parts = Split(ReadLine(), ',');`, где `Split` возвращает `std::vector<std::string_view>`?", "options": ["Ничего: `auto` продлевает жизнь временного объекта", "Не скомпилируется: `std::string` не приводится к `string_view`", "Лишнее копирование строки", "Временная строка умрёт после выражения, все views в `parts` висят", "`Split` получит пустую строку"], "answer": 3, "explain": "Продление жизни временного работает только при прямом связывании со ссылкой. Здесь строка — аргумент функции и умирает в конце полного выражения. Нужно сохранить строку в переменную."}, {"id": "modern-q37", "lesson": "modern-views", "q": "Функция принимает массив сумм только для чтения. Какой параметр лучше в C++20?", "options": ["`std::vector<std::int64_t> amounts`", "`std::span<const std::int64_t> amounts`", "`std::span<std::int64_t>& amounts`", "`const std::int64_t* amounts`", "`std::initializer_list<std::int64_t> amounts`"], "answer": 1, "explain": "`span<const T>` по значению принимает `vector`, `array`, C-массив и кусок буфера без копирования и шаблонов. Вектор по значению — копия. Сырой указатель теряет размер. `span` — сам по себе view, по ссылке его не передают."}, {"id": "modern-q38", "lesson": "modern-vocab", "q": "Что выведет программа?", "code": "#include <iostream>\n#include <optional>\n\nint main() {\n    std::optional<bool> flag = false;\n    std::cout << (flag ? \"yes\" : \"no\") << '\\n';\n}", "options": ["`no`", "Не скомпилируется", "`yes`", "UB"], "answer": 2, "explain": "`if (flag)` у `optional` проверяет наличие значения, а не само значение. Внутри лежит `false`, но оно есть. Нужно `if (flag && *flag)` или `flag.value_or(false)`."}, {"id": "modern-q39", "lesson": "modern-vocab", "q": "Что выведет программа?", "code": "#include <iostream>\n#include <string>\n#include <variant>\n\nint main() {\n    std::variant<int, std::string> v;\n    std::cout << v.index() << ' ';\n    try {\n        std::cout << std::get<std::string>(v);\n    } catch (const std::bad_variant_access&) {\n        std::cout << \"bad\";\n    }\n    std::cout << '\\n';\n}", "options": ["`1 bad`", "`0 `", "`-1 bad`", "UB", "`0 bad`"], "answer": 4, "explain": "Default-конструктор `variant` строит первую альтернативу — `int`, `index()` = 0. `std::get<std::string>` на другой альтернативе бросает `std::bad_variant_access`."}, {"id": "modern-q40", "lesson": "modern-vocab", "q": "`std::variant<std::string, bool> v = \"abc\";` Какой `v.index()` по правилам C++20?", "code": "#include <iostream>\n#include <string>\n#include <variant>\n\nint main() {\n    std::variant<std::string, bool> v = \"abc\";\n    std::cout << v.index();\n}", "options": ["`0`: строка", "`1`: bool", "Не скомпилируется: неоднозначность", "`-1`: valueless", "Зависит от реализации"], "answer": 0, "explain": "До C++20 `const char*` → `bool` (стандартное преобразование) выигрывало у `std::string` (пользовательское), и `v` содержал `true`. Предложение P0608 в C++20 запретило сужающие и булевы конверсии при выборе альтернативы — теперь выбирается строка."}, {"id": "modern-q41", "lesson": "modern-vocab", "q": "`std::expected<int, Error> r = std::unexpected(Error::kTimeout);` Что верно?", "options": ["`*r` бросит исключение, а `r.value()` вернёт 0", "`r.value()` бросит `std::bad_expected_access<Error>`, а `*r` — UB", "`r.value()` вернёт `int{}`", "`r.error()` — UB, ошибка достаётся только через `value()`", "`if (r)` истинно: объект создан"], "answer": 1, "explain": "Как у `optional`: `*` и `->` без проверок, `value()` с проверкой и исключением. `error()` корректен именно когда внутри ошибка. `if (r)` проверяет наличие значения — здесь ложно."}, {"id": "modern-q42", "lesson": "modern-vocab", "q": "Сервис получает 1M RPS, примерно 5% запросов с невалидным токеном. Как вернуть «токен невалиден» из функции проверки?", "options": ["Бросить исключение: так ошибку нельзя проигнорировать", "Вернуть `Claims` с пустыми полями", "Вернуть `bool` и писать результат в глобальную переменную", "`std::abort()`: невалидный токен — нарушение инварианта", "`std::expected<Claims, AuthError>`: ошибка штатная и частая"], "answer": 4, "explain": "Ожидаемые частые ошибки лучше возвращать значением: `throw` стоит микросекунды, а 50 000 исключений в секунду заметны в p99. `expected` делает ошибку частью типа. Исключения — для действительно исключительного."}, {"id": "modern-q43", "lesson": "modern-syntax", "q": "Что выведет программа?", "code": "#include <iostream>\n#include <string>\n#include <utility>\n\nint main() {\n    std::pair<std::string, int> p{\"a\", 1};\n    auto [s, n] = p;\n    s += \"b\";\n    std::cout << p.first << ' ';\n    auto& [r, m] = p;\n    r += \"b\";\n    std::cout << p.first << '\\n';\n    (void)n;\n    (void)m;\n}", "options": ["`ab ab`", "`a a`", "`ab a`", "`a ab`", "Не скомпилируется"], "answer": 3, "explain": "`auto [s, n] = p;` копирует всю пару во скрытую переменную, `s` — её поле. Изменение не трогает `p`. `auto& [r, m] = p;` — ссылка на `p`, изменение видно."}, {"id": "modern-q44", "lesson": "modern-syntax", "q": "`std::vector v{1, 2, 3}; std::vector w{v};` Какой тип у `w`?", "code": "#include <type_traits>\n#include <vector>\n\nstd::vector v{1, 2, 3};\nstd::vector w{v};\nstatic_assert(std::is_same_v<decltype(w), std::vector<int>>);", "options": ["`std::vector<int>`", "`std::vector<std::vector<int>>`", "`std::initializer_list<std::vector<int>>`", "Не скомпилируется: неоднозначность", "`std::vector<int*>`"], "answer": 0, "explain": "Для одного аргумента-специализации того же шаблона CTAD предпочитает копирование: `w` — копия `v`. Чтобы получить вектор векторов, пиши тип явно."}, {"id": "modern-q45", "lesson": "modern-syntax", "q": "Какой тип выведет CTAD для `std::vector names{\"alice\", \"bob\"};`?", "code": "#include <type_traits>\n#include <vector>\n\nstd::vector names{\"alice\", \"bob\"};\nstatic_assert(std::is_same_v<decltype(names),\n                             std::vector<const char*>>);", "options": ["`std::vector<std::string>`", "`std::vector<std::string_view>`", "`std::vector<const char*>`", "`std::vector<char>`", "Не скомпилируется: разная длина литералов"], "answer": 2, "explain": "Литералы — массивы `const char[6]` и `const char[4]`, при выводе через initializer_list они распадаются в `const char*`. Нужны строки — пиши `std::vector<std::string>` явно или используй `\"alice\"s`."}, {"id": "modern-q46", "lesson": "modern-syntax", "q": "Что выведет программа?", "code": "#include <iostream>\n\ntemplate <typename... Ts>\nint L(Ts... xs) { return (... - xs); }\n\ntemplate <typename... Ts>\nint R(Ts... xs) { return (xs - ...); }\n\nint main() {\n    std::cout << L(10, 3, 2) << ' ' << R(10, 3, 2) << '\\n';\n}", "options": ["`9 5`", "`5 5`", "`9 9`", "`15 15`", "`5 9`"], "answer": 4, "explain": "`(... - xs)` — левая свёртка: `(10 - 3) - 2 = 5`. `(xs - ...)` — правая: `10 - (3 - 2) = 9`. Для неассоциативных операций сторона свёртки меняет результат."}, {"id": "modern-q47", "lesson": "modern-syntax", "q": "Почему эта функция компилируется для `int`, хотя у `int` нет метода `ToString()`?", "code": "#include <string>\n#include <type_traits>\n\ntemplate <typename T>\nstd::string ToText(const T& value) {\n    if constexpr (std::is_arithmetic_v<T>) {\n        return std::to_string(value);\n    } else {\n        return value.ToString();\n    }\n}\n\nstd::string X() { return ToText(42); }", "options": ["Компилятор удаляет недостижимый код при оптимизации", "Ветка `if constexpr` с ложным условием в шаблоне не инстанцируется", "Не компилируется: обычный `if` и `if constexpr` проверяются одинаково", "`ToString` найдётся через ADL", "Все ветки инстанцируются, но ошибки в них игнорируются"], "answer": 1, "explain": "Discarded statement в шаблоне не инстанцируется для данного `T`. С обычным `if` обе ветки должны быть валидны, и `value.ToString()` для `int` дал бы ошибку. Вне шаблонов `if constexpr` так не работает."}, {"id": "modern-q48", "lesson": "modern-lambda", "q": "Что выведет программа?", "code": "#include <iostream>\n\nint main() {\n    int x = 1;\n    int y = 1;\n    auto f = [x, &y] { return x * 10 + y; };\n    x = 2;\n    y = 2;\n    std::cout << f() << '\\n';\n}", "options": ["`22`", "`11`", "`12`", "`21`", "Не скомпилируется"], "answer": 2, "explain": "`x` захвачен по значению в момент создания лямбды — внутри 1. `y` по ссылке — видно новое значение 2. Итог: `1 * 10 + 2 = 12`."}, {"id": "modern-q49", "lesson": "modern-lambda", "q": "Что выведет программа?", "code": "#include <iostream>\n\nint main() {\n    int c = 0;\n    auto f = [c]() mutable { return ++c; };\n    f();\n    auto g = f;\n    f();\n    std::cout << f() << g() << c << '\\n';\n}", "options": ["`310`", "`330`", "`220`", "`320`", "`333`"], "answer": 3, "explain": "У mutable-лямбды своё поле `c`, внешняя `c` не меняется — 0. Первый `f()` сделал поле 1, `g = f` скопировал лямбду вместе с состоянием (1). Второй `f()` → 2. В выводе `f()` → 3, `g()` → 2. С C++17 операнды `<<` вычисляются слева направо."}, {"id": "modern-q50", "lesson": "modern-lambda", "q": "Что не так с этой фабрикой?", "code": "#include <functional>\n\nstd::function<int()> MakeCounter() {\n    int count = 0;\n    return [&count] { return ++count; };\n}", "options": ["Лямбда хранит ссылку на локальную `count`, после выхода из функции ссылка висит — UB при вызове", "Ничего: лямбда продлевает жизнь захваченных переменных", "Не скомпилируется: нельзя менять захваченное без `mutable`", "`std::function` не может хранить лямбду с захватом", "Утечка памяти в `std::function`"], "answer": 0, "explain": "Захват по ссылке не продлевает жизнь. Правильно — init-capture по значению: `[count = 0]() mutable { return ++count; }`. `mutable` для ссылочного захвата не нужен: меняется не поле лямбды, а объект по ссылке."}, {"id": "modern-q51", "lesson": "modern-lambda", "q": "Метод класса возвращает колбэк `[=] { return limit_ * 2; }` (`limit_` — поле). Колбэк вызывают после уничтожения объекта. Что будет?", "options": ["Всё корректно: `[=]` скопировал `limit_`", "Не скомпилируется: поля нельзя захватывать", "UB: `[=]` захватил указатель `this`, а не копию `limit_`", "Колбэк вернёт 0", "Объект проживёт, пока жив колбэк"], "answer": 2, "explain": "Поля не захватываются сами по себе: `limit_` — это `this->limit_`, и `[=]` неявно захватывает `this` (в C++20 это устарело). Нужен `[limit = limit_]` или `[*this]` (копия объекта)."}, {"id": "modern-q52", "lesson": "modern-lambda", "q": "Какая строка не скомпилируется?", "code": "#include <functional>\n\nvoid F(int k) {\n    int (*fp1)(int) = [](int x) { return x + 1; };\n    auto f = [k](int x) { return x + k; };\n    std::function<int(int)> f2 = [k](int x) { return x + k; };\n    auto p = +[](int x) { return x; };\n    int (*fp2)(int) = [k](int x) { return x + k; };\n}", "options": ["`int (*fp1)(int) = [](int x) { return x + 1; };`", "`int (*fp2)(int) = [k](int x) { return x + k; };`", "`auto f = [k](int x) { return x + k; };`", "`std::function<int(int)> f2 = [k](int x) { return x + k; };`", "`auto p = +[](int x) { return x; };`"], "answer": 1, "explain": "К указателю на функцию приводится только лямбда без захвата: ей некуда положить состояние. Унарный `+` форсирует это приведение для лямбды без захвата. `std::function` хранит любой вызываемый объект."}, {"id": "modern-q53", "lesson": "modern-algo", "q": "`std::sort(v.begin(), v.end(), [](int a, int b) { return a <= b; });` Что не так?", "options": ["Ничего: просто сортировка по неубыванию", "Сортировка станет нестабильной, но корректной", "Не скомпилируется: компаратор должен быть `std::less`", "Только медленнее: O(n²)", "Компаратор нарушает strict weak ordering (`comp(a, a)` истинно) — UB, возможен выход за границы"], "answer": 4, "explain": "Требование: `comp(a, a) == false`. С `<=` при равных элементах внутренние циклы introsort полагаются на «барьер» и могут уйти за границы массива. Для неубывания достаточно `<`."}, {"id": "modern-q54", "lesson": "modern-algo", "q": "Что выведет программа?", "code": "#include <algorithm>\n#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int> v{1, 1, 2, 1};\n    v.erase(std::unique(v.begin(), v.end()), v.end());\n    for (int x : v) {\n        std::cout << x << ' ';\n    }\n    std::cout << '\\n';\n}", "options": ["`1 2`", "`2 1`", "`1 1 2 1`", "`1 2 1`", "`1 2 1 1`"], "answer": 3, "explain": "`std::unique` убирает только подряд идущие дубли. Без сортировки получаем `1 2 1`. Чтобы убрать все дубли — сначала `sort`."}, {"id": "modern-q55", "lesson": "modern-algo", "q": "Что выведет программа?", "code": "#include <iostream>\n#include <numeric>\n#include <vector>\n\nint main() {\n    std::vector<double> prices{0.5, 0.5, 0.5};\n    std::cout << std::accumulate(prices.begin(), prices.end(), 0)\n              << '\\n';\n}", "options": ["`0`", "`1.5`", "`1`", "`2`", "Не скомпилируется"], "answer": 0, "explain": "Тип накопителя `accumulate` — тип начального значения, здесь `int`. Каждый шаг: `0 + 0.5 = 0.5` → обрезается в `int` 0. Итог 0. Нужно `0.0`."}, {"id": "modern-q56", "lesson": "modern-algo", "q": "Что выведет программа?", "code": "#include <algorithm>\n#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int> v{1, 2, 2, 2, 5};\n    auto lo = std::lower_bound(v.begin(), v.end(), 2);\n    auto hi = std::upper_bound(v.begin(), v.end(), 2);\n    std::cout << lo - v.begin() << ' ' << hi - v.begin() << ' '\n              << hi - lo << '\\n';\n}", "options": ["`1 3 3`", "`2 4 2`", "`1 4 3`", "`1 3 2`", "`0 4 4`"], "answer": 2, "explain": "`lower_bound` — первый `>= 2`, индекс 1. `upper_bound` — первый `> 2`, индекс 4 (элемент 5). Количество двоек — разность, 3."}, {"id": "modern-q57", "lesson": "modern-algo", "q": "Нужны 10 самых больших из 10⁷ чисел в векторе, порядок внутри десятки важен. Что оптимально по времени?", "options": ["`std::sort` всего вектора и взять первые 10", "`nth_element` (O(n) в среднем) и `sort` первых 10", "`std::stable_sort` всего вектора", "10 раз `std::max_element` с удалением", "`std::set` из всех элементов"], "answer": 1, "explain": "`nth_element` разбивает за линейное время, потом сортировка 10 элементов — копейки. Полная сортировка — O(n log n). `partial_sort` (O(n log k)) или `priority_queue` размера k — тоже хорошие ответы. `set` — n аллокаций."}, {"id": "modern-q58", "lesson": "modern-algo", "q": "Что вернёт `std::all_of(v.begin(), v.end(), pred)` для пустого `v`?", "options": ["`true`", "`false`", "UB", "Бросит исключение", "Зависит от `pred`"], "answer": 0, "explain": "«Все элементы пустого множества удовлетворяют условию» — истина (vacuous truth). `any_of` на пустом — `false`, `none_of` — `true`. Частая ловушка в проверках «все платежи подтверждены»."}, {"id": "modern-q59", "lesson": "modern-algo", "q": "Какой алгоритм гарантирует сохранение относительного порядка равных элементов?", "options": ["`std::sort`", "`std::partial_sort`", "`std::nth_element`", "`std::stable_sort`", "`std::partition`"], "answer": 3, "explain": "Только `stable_sort` (и `stable_partition`) гарантируют стабильность. `sort` — introsort, нестабилен. Это важно при сортировке, например, транзакций по сумме с сохранением порядка по времени."}, {"id": "modern-q60", "lesson": "modern-ranges", "q": "Что выведет программа?", "code": "#include <iostream>\n#include <ranges>\n#include <vector>\n\nint main() {\n    int calls = 0;\n    auto sq = [&calls](int x) { ++calls; return x * x; };\n    std::vector<int> v{1, 2, 3, 4, 5, 6};\n    auto r = v | std::views::transform(sq)\n               | std::views::filter([](int x) { return x % 2 == 0; });\n    std::cout << calls << ' ';\n    for (int x : r) {\n        (void)x;\n    }\n    std::cout << calls << '\\n';\n}", "options": ["`6 9`", "`0 6`", "`6 6`", "`0 3`", "`0 9`"], "answer": 4, "explain": "До обхода ничего не вычисляется — 0. Фильтр вызывает трансформацию для каждого из 6 элементов, чтобы проверить предикат, и ещё раз при разыменовании каждого из трёх прошедших: 6 + 3 = 9."}, {"id": "modern-q61", "lesson": "modern-ranges", "q": "Почему не компилируется?", "code": "#include <ranges>\n#include <vector>\n\nvoid F(const std::vector<int>& v) {\n    for (auto i : std::views::iota(0, v.size())) {\n        (void)i;\n    }\n}", "options": ["`iota` требует `begin` и `end`, а не числа", "`views::iota` появился только в C++23", "`int` и `size_t` разной знаковости — `iota` их не принимает", "Нельзя использовать view в range-for", "Компилируется без ошибок"], "answer": 2, "explain": "Вывод `iota_view` требует, чтобы оба целых были одной знаковости. `0` — `int`, `v.size()` — `size_t`. Пиши `iota(0uz, v.size())` (C++23) или `iota(std::size_t{0}, v.size())`."}, {"id": "modern-q62", "lesson": "modern-ranges", "q": "Что будет с этим кодом?", "code": "#include <algorithm>\n#include <vector>\n\nstd::vector<int> LoadIds();\n\nint F() {\n    auto it = std::ranges::find(LoadIds(), 42);\n    return *it;\n}", "options": ["UB: итератор во временный вектор", "Корректно: временный вектор живёт до конца функции", "Вернёт -1", "Ошибка компиляции: `it` имеет тип `std::ranges::dangling`", "Бросит исключение"], "answer": 3, "explain": "Range-алгоритмы, получив rvalue-контейнер, возвращают `std::ranges::dangling` вместо итератора. Разыменовать его нельзя — ошибка видна при компиляции, а классический `std::find` с итераторами временного объекта дал бы UB."}, {"id": "modern-q63", "lesson": "modern-ranges", "q": "Почему не компилируется?", "code": "#include <ranges>\n#include <vector>\n\nint Sum(const std::vector<int>& v) {\n    const auto& evens =\n        v | std::views::filter([](int x) { return x % 2 == 0; });\n    int total = 0;\n    for (int x : evens) {\n        total += x;\n    }\n    return total;\n}", "options": ["Нельзя хранить view в переменной", "`filter_view` не обходится через `const&`: `begin()` кэширует и не const", "`views::filter` требует `std::list`", "Лямбда в `filter` должна быть `constexpr`", "Компилируется без ошибок"], "answer": 1, "explain": "Чтобы `begin()` был амортизированно O(1), `filter_view` кэширует первый подходящий элемент и поэтому имеет только не-const `begin()`. Через `const auto&` обойти нельзя. Принимай view по значению или `auto&&`."}, {"id": "modern-q64", "lesson": "modern-ranges", "q": "Что выведет программа?", "code": "#include <algorithm>\n#include <functional>\n#include <iostream>\n#include <string>\n#include <vector>\n\nstruct User { std::string name; int age; };\n\nint main() {\n    std::vector<User> users{{\"ann\", 20}, {\"bob\", 30}, {\"cid\", 40}};\n    std::ranges::sort(users, std::greater{}, &User::age);\n    for (const auto& u : users) {\n        std::cout << u.name << ' ';\n    }\n    std::cout << '\\n';\n}", "options": ["`ann bob cid`", "`ann cid bob`", "`bob ann cid`", "Не скомпилируется: нужна лямбда-компаратор", "`cid bob ann`"], "answer": 4, "explain": "Третий аргумент — проекция: сравниваются `age`. Компаратор `std::greater{}` — по убыванию возраста: 40, 30, 20."}, {"id": "modern-q65", "lesson": "modern-ranges", "q": "Что выведет программа?", "code": "#include <iostream>\n#include <ranges>\n\nint main() {\n    namespace views = std::views;\n    for (int i : views::iota(0, 10) | views::reverse\n                     | views::drop(1) | views::take(3)) {\n        std::cout << i << ' ';\n    }\n    std::cout << '\\n';\n}", "options": ["`8 7 6`", "`9 8 7`", "`7 6 5`", "`1 2 3`", "`2 1 0`"], "answer": 0, "explain": "`iota(0, 10)` — 0…9. `reverse` — 9…0. `drop(1)` — 8…0. `take(3)` — 8 7 6."}, {"id": "modern-q66", "lesson": "modern-concepts", "q": "Что выведет программа?", "code": "#include <concepts>\n#include <iostream>\n\ntemplate <std::integral T>\nconst char* Kind(T) { return \"integral\"; }\n\ntemplate <std::signed_integral T>\nconst char* Kind(T) { return \"signed\"; }\n\nint main() {\n    std::cout << Kind(5) << ' ' << Kind(5u) << '\\n';\n}", "options": ["`integral integral`", "`signed signed`", "Не скомпилируется: неоднозначность", "`signed integral`", "`integral signed`"], "answer": 3, "explain": "`std::signed_integral` определён как `std::integral<T> && std::is_signed_v<T>` и включает (subsumes) `std::integral`. Для `int` подходят обе перегрузки, выбирается более ограниченная. Для `unsigned` подходит только первая."}, {"id": "modern-q67", "lesson": "modern-concepts", "q": "Что проверяет концепт?", "code": "#include <string>\n\ntemplate <typename T>\nconcept NonEmpty = requires(T t) {\n    t.size() > 0;\n};\n\nstatic_assert(NonEmpty<std::string>);", "options": ["Что у объекта `size()` больше нуля", "Что `T` — непустой контейнер во время выполнения", "Не скомпилируется: в requires нельзя операторы сравнения", "Что `size()` — `constexpr` и больше нуля", "Только что выражение `t.size() > 0` компилируется; значение не проверяется"], "answer": 4, "explain": "Simple requirement в requires-выражении проверяет лишь валидность выражения. Тип с любым `size()`, который сравнивается с 0, удовлетворяет концепту. Проверка значения — вложенный `requires` с константным выражением."}, {"id": "modern-q68", "lesson": "modern-concepts", "q": "Что делает `template <typename T, std::enable_if_t<std::is_integral_v<T>, int> = 0> void f(T);` и чем заменить в C++20?", "options": ["SFINAE: убирает перегрузку для нецелых `T`; в C++20 — `template <std::integral T> void f(T);`", "Делает `f` constexpr; в C++20 — `consteval`", "Принудительно приводит `T` к `int`; в C++20 — `static_cast`", "Запрещает вызов с `int`; в C++20 — `= delete`", "Задаёт `T = int` по умолчанию; в C++20 — `auto`"], "answer": 0, "explain": "Если `is_integral_v<T>` ложно, `enable_if_t` не существует, подстановка проваливается, и шаблон тихо исключается из перегрузок. Концепт делает то же самое явно и даёт понятную ошибку."}, {"id": "modern-q69", "lesson": "modern-misc", "q": "Почему не компилируется `a == b`?", "code": "#include <compare>\n#include <cstdint>\n\nstruct Client {\n    std::int64_t id;\n    std::strong_ordering operator<=>(const Client& o) const {\n        return id <=> o.id;\n    }\n};\n\nbool Same(const Client& a, const Client& b) { return a == b; }", "options": ["`<=>` должен возвращать `bool`", "Пользовательский (не `= default`) `<=>` не генерирует `==`", "`std::strong_ordering` не сравнивается с 0", "Нужен `#include <compare>` для `==`", "Компилируется: `==` выводится из `<=>`"], "answer": 1, "explain": "Только `operator<=>() = default` неявно объявляет `operator==`. Написанный руками `<=>` даёт `<`, `>`, `<=`, `>=`, но не `==` и `!=` — равенство часто можно проверить дешевле."}, {"id": "modern-q70", "lesson": "modern-misc", "q": "Что выведет программа?", "code": "#include <compare>\n#include <iostream>\n\nstruct Version {\n    int major, minor, patch;\n    auto operator<=>(const Version&) const = default;\n};\n\nint main() {\n    Version a{1, 2, 3};\n    Version b{1, 10, 0};\n    std::cout << (a < b) << (a == b) << (a != b) << '\\n';\n}", "options": ["`011`", "`100`", "`101`", "`110`", "Не скомпилируется"], "answer": 2, "explain": "Defaulted `<=>` сравнивает поля по порядку: `major` равны, `minor` 2 < 10 — значит `a < b`. `==` сгенерирован вместе с `<=>`, `!=` переписан как `!(a == b)`."}, {"id": "modern-q71", "lesson": "modern-misc", "q": "Что выведет `std::format(\"[{:>5}|{:<3}|{:^5}]\", 1, 2, 3)`?", "code": "#include <format>\n#include <iostream>\n\nint main() {\n    std::cout << std::format(\"[{:>5}|{:<3}|{:^5}]\", 1, 2, 3) << '\\n';\n}", "options": ["`[    1|2  |  3  ]`", "`[1    |  2|  3  ]`", "`[    1|  2|3    ]`", "`[1|2|3]`", "`[    1|2  | 3   ]`"], "answer": 0, "explain": "`>` — выравнивание вправо, `<` — влево, `^` — по центру. Ширина 5 для центра: два пробела слева, два справа."}, {"id": "modern-q72", "lesson": "modern-misc", "q": "`constinit int g = 5;` Что из этого верно?", "code": "constinit int g = 5;\n\nvoid Bump() { g = 6; }", "options": ["`constinit` — синоним `constexpr`, `g = 6;` не скомпилируется", "`g` — константа времени выполнения", "`g` инициализирован при компиляции, но его можно менять: `g = 6;` корректно", "`constinit` можно ставить только на локальные переменные", "`constinit` делает переменную `thread_local`"], "answer": 2, "explain": "`constinit` гарантирует только статическую (compile-time) инициализацию переменной со static/thread storage duration. Константностью он не наделяет. Цель — избежать static initialization order fiasco."}, {"id": "modern-q73", "lesson": "modern-misc", "q": "Что из этого нарушает правила designated initializers в C++20?", "options": ["`Opts{.timeout_ms = 50}` — остальные поля по умолчанию", "`Opts{.retries = 3, .timeout_ms = 50}` при объявлении `timeout_ms` раньше `retries`", "`Opts{.timeout_ms = 50, .retries = 3}` в порядке объявления", "`Opts{}` — все поля по умолчанию", "`return {.timeout_ms = 50};` из функции, возвращающей `Opts`"], "answer": 1, "explain": "В C++ (в отличие от C) designators должны идти в порядке объявления полей. Пропускать поля можно. Смешивать с позиционными нельзя. Некоторые компиляторы принимают неправильный порядок как расширение — не полагайся на это."}, {"id": "modern-q74", "lesson": "modern-misc", "q": "Функция помечена `[[nodiscard]]`, вызывающий проигнорировал результат. Что будет?", "options": ["Ошибка компиляции всегда", "Исключение во время выполнения", "UB", "Предупреждение компилятора (с `-Werror` — ошибка сборки)", "Ничего: атрибут только для документации"], "answer": 3, "explain": "`[[nodiscard]]` — указание компилятору выдать диагностику. По стандарту это предупреждение. Подавить намеренно: `static_cast<void>(f())` или `std::ignore = f();`."}, {"id": "modern-q75", "lesson": "modern-misc", "q": "`consteval int Kib(int n) { return n * 1024; }` Какой вызов не скомпилируется?", "code": "consteval int Kib(int n) { return n * 1024; }\n\nconstexpr int k = Kib(4);\nint arr[Kib(1)];\nstatic_assert(Kib(2) == 2048);\nint x = Kib(8);\nint Size(int n) { return Kib(n); }", "options": ["`constexpr int k = Kib(4);`", "`int arr[Kib(1)];`", "`static_assert(Kib(2) == 2048);`", "`int x = Kib(8);`", "`int Size(int n) { return Kib(n); }`"], "answer": 4, "explain": "`consteval` — immediate function: каждый вызов обязан вычисляться при компиляции. `n` — параметр времени выполнения. Последний вариант корректен: аргумент константа, результат вычислен при компиляции и просто копируется в `x`."}, {"id": "modern-q76", "lesson": "modern-review1", "q": "`bool IsBanned(const std::string& user) { return banned_[user]; }`, `banned_` — `unordered_map<std::string, bool>`, вызов из многих потоков под `std::shared_lock`. Главная проблема?", "options": ["Лишнее копирование строки при вызове", "`operator[]` вставляет элемент — это запись под shared-локом: гонка данных и рост памяти", "`unordered_map` медленнее `map`", "Отсутствует `noexcept`", "Нужен `std::lock_guard` вместо `shared_lock`, иначе дедлок"], "answer": 1, "explain": "Под shared-локом несколько читателей работают одновременно. Если хоть один `operator[]` вставит ключ, таблица может сделать rehash прямо во время чтения другим потоком. Плюс каждый незнакомый пользователь остаётся в памяти навсегда. Нужно `contains` или `find` и `const`-метод."}, {"id": "modern-q77", "lesson": "modern-review1", "q": "`result = result + parts[i];` в цикле по n строкам суммарной длины L. Сложность и исправление?", "options": ["O(n · L) копирований; `result += parts[i]` и `reserve`", "O(L), всё нормально благодаря move", "O(n log L); заменить на `std::accumulate`", "O(L²) только в debug-сборке", "O(1) амортизированно, как `push_back`"], "answer": 0, "explain": "`result + x` строит новую строку, копируя всё накопленное, — на каждой итерации. Итог квадратичен. `+=` дописывает в существующий буфер (амортизированно O(длины x)), а `reserve` убирает реаллокации."}, {"id": "modern-q78", "lesson": "modern-review2", "q": "Почему этот класс опасен?", "code": "class Parser {\npublic:\n    Parser() : buf_(new char[1024]) {}\n    ~Parser() { delete[] buf_; }\n\nprivate:\n    char* buf_;\n};\n\nvoid F() {\n    Parser a;\n    Parser b = a;\n}", "options": ["`new char[1024]` может вернуть `nullptr`", "Нужно `delete`, а не `delete[]`", "Деструктор должен быть `virtual`", "Ничего опасного", "Неявная копия копирует указатель — два `delete[]` одного буфера"], "answer": 4, "explain": "Компилятор сгенерировал копирование почленно: оба объекта указывают на один буфер, и оба деструктора освободят его. Rule of 3 нарушен. Лучшее исправление — `std::vector<char>` или `std::unique_ptr<char[]>` и rule of 0."}, {"id": "modern-q79", "lesson": "modern-review2", "q": "В `Transfer` сначала меняются балансы, потом `history.push_back`. Какой порядок даёт строгую гарантию исключений?", "options": ["Сначала балансы, потом `push_back` в `try` с `catch (...) {}`", "Порядок не важен, если поставить `noexcept` на функцию", "Сначала всё, что может бросить (`reserve` истории), потом изменения из `noexcept` операций", "Сначала `push_back`, потом балансы — и никакого `reserve`", "Обернуть всё в `std::lock_guard`"], "answer": 2, "explain": "Строгая гарантия: либо успех, либо состояние не изменилось. Выполни все бросающие операции до первой мутации. `noexcept` на функции при исключении вызовет `std::terminate`. Глотать исключение в `catch (...)` — потерять запись в истории."}, {"id": "modern-q80", "lesson": "modern-review2", "q": "Метод возвращает `const std::string&` и в ветке «не найдено» делает `return \"\";`. Что происходит?", "options": ["Возвращается ссылка на литерал, всё корректно", "Временный объект живёт, пока жива ссылка у вызывающего", "Не компилируется: `const char*` не приводится к `std::string`", "Возвращается ссылка на временный `std::string`, уничтоженный при выходе — висячая ссылка", "Возвращается ссылка на статическую пустую строку"], "answer": 3, "explain": "Из `\"\"` создаётся временный `std::string`, ссылка на него возвращается, объект умирает. Продление жизни через ссылку не работает при возврате из функции. Исправления: вернуть указатель (`nullptr`), `std::optional`, или ссылку на `static const std::string kEmpty`."}, {"id": "modern-q81", "lesson": "modern-review2", "q": "Найти дубликаты в `vector<int>` из 10⁶ элементов. Было два вложенных цикла. Что сказать первым делом перед переписыванием?", "options": ["Сразу переписать на `std::set` — всегда лучше", "Уточнить контракт: важен ли порядок результата и можно ли менять вход — от этого зависит выбор между хэш-таблицей и сортировкой", "Распараллелить вложенные циклы на потоки", "Заменить `int` на `long long`, чтобы избежать переполнения", "Ничего: на 10⁶ O(n²) работает быстро"], "answer": 1, "explain": "Интервьюер ждёт вопросы о контракте. Если порядок не важен и вход можно копировать — `sort` + соседи, O(n log n). Если важен порядок появления — `unordered_map` со счётчиком, O(n) в среднем. O(n²) на 10⁶ — 10¹² операций."}, {"id": "modern-q82", "lesson": "modern-checklist", "q": "Во фрагменте ты нашёл: висячую ссылку, O(n²) и неудачные имена переменных. В каком порядке о них говорить?", "options": ["Имена → O(n²) → висячая ссылка: от простого к сложному", "O(n²) → висячая ссылка → имена: производительность важнее всего", "Только O(n²): остальное мелочи", "В порядке строк в коде", "Висячая ссылка → O(n²) → имена"], "answer": 4, "explain": "Сначала корректность (UB, гонки, утечки), потом сложность, потом стиль. Так видно, что ты понимаешь цену каждой проблемы. Имена важны, но их правят последними."}, {"id": "modern-q83", "lesson": "modern-checklist", "q": "Какой инструмент поймает гонку данных в тесте?", "options": ["ThreadSanitizer", "AddressSanitizer", "UndefinedBehaviorSanitizer", "`-Wall -Wextra`", "`static_assert`"], "answer": 0, "explain": "TSan отслеживает доступы из разных потоков без синхронизации. ASan ловит висячие ссылки и выход за границы, UBSan — переполнение знаковых и прочее UB. Предупреждения компилятора гонки не видят."}, {"id": "modern-q84", "lesson": "modern-checklist", "q": "Интервьюер добавил условие: «функцию теперь вызывают из нескольких потоков». Что сделать первым?", "options": ["Сразу обернуть всё тело в `std::lock_guard` на глобальном mutex", "Заменить все `int` на `std::atomic<int>`", "Сделать все переменные `thread_local`", "Уточнить соотношение чтений и записей и какие данные общие, потом выбрать `mutex`/`shared_mutex` или шардирование", "Ничего: STL-контейнеры потокобезопасны"], "answer": 3, "explain": "Стандартные контейнеры не синхронизированы: одновременное чтение безопасно, запись с чем угодно — нет. Решение зависит от нагрузки: много чтений — `shared_mutex`, горячие ключи — шардирование. Глобальный лок на всё — рабочий, но медленный старт; скажи это вслух."}], "tasks": [{"id": "modern-t01", "lesson": "modern-versions", "title": "if с инициализатором", "task": "Допиши `PriceOr`: найди ключ одним поиском, итератор объяви прямо в `if`, чтобы он не жил дольше проверки. `main` в проверке фиксирован.", "prefix": "#include <iostream>\n#include <map>\n#include <string>", "code": "int PriceOr(const std::map<std::string, int>& prices,\n            const std::string& item, int fallback) {\n    if (auto it = ____; ____) {\n        return it->second;\n    }\n    return fallback;\n}", "check": "int main() {\n    std::map<std::string, int> prices{{\"tea\", 120}, {\"pie\", 0}};\n    int tea = PriceOr(prices, \"tea\", -1);\n    int pie = PriceOr(prices, \"pie\", -1);  // цена 0 — тоже цена\n    int cake = PriceOr(prices, \"cake\", -1);\n    std::cout << tea << ' ' << pie << ' ' << cake << '\\n';\n    bool ok = tea == 120 && pie == 0 && cake == -1;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "120 0 -1\nOK", "hint": "Синтаксис `if (init; cond)`: сначала `prices.find(item)`, потом сравнение с `end()`.", "solution": "int PriceOr(const std::map<std::string, int>& prices,\n            const std::string& item, int fallback) {\n    if (auto it = prices.find(item); it != prices.end()) {\n        return it->second;\n    }\n    return fallback;\n}"}, {"id": "modern-t02", "lesson": "modern-move", "title": "Move-конструктор, который обнуляет источник", "task": "Допиши move-конструктор и move-присваивание `Buffer`. Источник после move пустой: `nullptr` и размер 0. Оба `noexcept`. Присваивание освобождает старый буфер через `Free` и переживает самоприсваивание. Проверка следит за указателями и считает живые буферы.", "prefix": "#include <cstddef>\n#include <iostream>\n#include <type_traits>\n#include <utility>\n\nint g_live = 0;  // сколько буферов выделено и ещё не освобождено\n\nchar* Alloc(std::size_t n) {\n    ++g_live;\n    return new char[n];\n}\n\nvoid Free(char* p) {\n    if (p) --g_live;\n    delete[] p;\n}", "code": "class Buffer {\npublic:\n    explicit Buffer(std::size_t size)\n        : data_(Alloc(size)), size_(size) {}\n    ~Buffer() { Free(data_); }\n    Buffer(const Buffer&) = delete;\n    Buffer& operator=(const Buffer&) = delete;\n\n    Buffer(Buffer&& other) noexcept\n        : data_(____), size_(____) {}\n\n    Buffer& operator=(Buffer&& other) noexcept {\n        // TODO: освободи свой буфер, забери чужой, обнули other\n        return *this;\n    }\n\n    const char* Data() const { return data_; }\n    std::size_t Size() const { return size_; }\n\nprivate:\n    char* data_;\n    std::size_t size_;\n};", "check": "int main() {\n    static_assert(std::is_nothrow_move_constructible_v<Buffer>);\n    static_assert(std::is_nothrow_move_assignable_v<Buffer>);\n    int base = g_live;\n    bool ok = true;\n    {\n        Buffer a(8);\n        const char* p = a.Data();\n        Buffer b(std::move(a));\n        ok = ok && b.Data() == p && b.Size() == 8;\n        ok = ok && a.Data() == nullptr && a.Size() == 0;\n\n        Buffer c(2);\n        c = std::move(b);  // старый буфер c должен удалиться\n        ok = ok && c.Data() == p && c.Size() == 8;\n        ok = ok && b.Data() == nullptr && b.Size() == 0;\n        ok = ok && g_live == base + 1;\n\n        Buffer& same = c;\n        c = std::move(same);  // самоприсваивание ничего не ломает\n        ok = ok && c.Data() == p && c.Size() == 8;\n        ok = ok && g_live == base + 1;\n        std::cout << \"self-move \" << (ok ? \"ok\" : \"broken\") << '\\n';\n    }\n    ok = ok && g_live == base;  // все буферы освобождены\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "self-move ok\nOK", "hint": "`std::exchange(other.data_, nullptr)` забирает значение и сразу кладёт на его место новое. В присваивании не забудь `Free(data_)` для своего буфера и проверку `this != &other`.", "solution": "class Buffer {\npublic:\n    explicit Buffer(std::size_t size)\n        : data_(Alloc(size)), size_(size) {}\n    ~Buffer() { Free(data_); }\n    Buffer(const Buffer&) = delete;\n    Buffer& operator=(const Buffer&) = delete;\n\n    Buffer(Buffer&& other) noexcept\n        : data_(std::exchange(other.data_, nullptr)),\n          size_(std::exchange(other.size_, 0)) {}\n\n    Buffer& operator=(Buffer&& other) noexcept {\n        if (this != &other) {\n            Free(data_);\n            data_ = std::exchange(other.data_, nullptr);\n            size_ = std::exchange(other.size_, 0);\n        }\n        return *this;\n    }\n\n    const char* Data() const { return data_; }\n    std::size_t Size() const { return size_; }\n\nprivate:\n    char* data_;\n    std::size_t size_;\n};"}, {"id": "modern-t03", "lesson": "modern-move", "title": "Почему vector копирует", "task": "При росте вектора элементы `Order` копируются, а не перемещаются. Добавь одно слово в `Order`, чтобы проверка увидела 0 копий и 2 перемещения. `Id` в «Дано» считает свои копии и перемещения.", "prefix": "#include <iostream>\n#include <type_traits>\n#include <utility>\n#include <vector>\n\nint g_copies = 0;\nint g_moves = 0;\n\nstruct Id {  // считает, сколько раз его копировали и перемещали\n    Id() = default;\n    Id(const Id&) { ++g_copies; }\n    Id(Id&&) noexcept { ++g_moves; }\n};", "code": "struct Order {\n    Order() = default;\n    Order(const Order& o) : id(o.id) {}\n    Order(Order&& o) : id(std::move(o.id)) {}\n    Id id;\n};", "check": "int main() {\n    std::vector<Order> v(2);  // capacity == 2\n    v.emplace_back();         // реаллокация: 2 старых элемента\n    std::cout << \"copies \" << g_copies << \", moves \" << g_moves\n              << '\\n';\n    bool ok = g_copies == 0 && g_moves == 2 &&\n              std::is_nothrow_move_constructible_v<Order>;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "copies 0, moves 2\nOK", "hint": "`vector` использует `std::move_if_noexcept`: перемещает, только если move-конструктор не бросает.", "solution": "struct Order {\n    Order() = default;\n    Order(const Order& o) : id(o.id) {}\n    Order(Order&& o) noexcept : id(std::move(o.id)) {}\n    Id id;\n};"}, {"id": "modern-t04", "lesson": "modern-move", "title": "Perfect forwarding в фабрике", "task": "`MakeOwned` всегда копирует аргументы, даже rvalue. Почини одну строку, чтобы rvalue перемещались, а lvalue копировались. `Tracer` в «Дано» считает копии и перемещения.", "prefix": "#include <iostream>\n#include <memory>\n#include <utility>\n\nint g_copies = 0;\nint g_moves = 0;\n\nstruct Tracer {  // считает свои копии и перемещения\n    Tracer() = default;\n    Tracer(const Tracer&) { ++g_copies; }\n    Tracer(Tracer&&) noexcept { ++g_moves; }\n};\n\nstruct Job {\n    Job(int id, Tracer t) : id(id), tracer(std::move(t)) {}\n    int id;\n    Tracer tracer;\n};", "code": "template <typename T, typename... Args>\nstd::unique_ptr<T> MakeOwned(Args&&... args) {\n    return std::unique_ptr<T>(new T(args...));  // TODO\n}", "check": "bool Expect(const char* what, int copies, int moves) {\n    std::cout << what << \": copy \" << g_copies\n              << \", move \" << g_moves << '\\n';\n    bool ok = g_copies == copies && g_moves == moves;\n    g_copies = g_moves = 0;\n    return ok;\n}\n\nint main() {\n    Tracer t;\n    auto a = MakeOwned<Job>(1, t);  // copy в параметр, move в поле\n    bool ok = Expect(\"lvalue\", 1, 1);\n    auto b = MakeOwned<Job>(2, std::move(t));  // move, move\n    ok = Expect(\"rvalue\", 0, 2) && ok;\n    ok = ok && a->id == 1 && b->id == 2;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "lvalue: copy 1, move 1\nrvalue: copy 0, move 2\nOK", "hint": "Внутри функции `args` — именованные, значит lvalue. Верни им исходную категорию через `std::forward<Args>(args)...`.", "solution": "template <typename T, typename... Args>\nstd::unique_ptr<T> MakeOwned(Args&&... args) {\n    return std::unique_ptr<T>(new T(std::forward<Args>(args)...));\n}"}, {"id": "modern-t05", "lesson": "modern-smart", "title": "Передача владения unique_ptr", "task": "Код не компилируется. Почини два места так, чтобы владение задачей переехало в очередь: `job` пустой, в очереди тот же объект, а не копия.", "prefix": "#include <cstddef>\n#include <iostream>\n#include <memory>\n#include <utility>\n#include <vector>\n\nstruct Job {\n    int id;\n};", "code": "class Queue {\npublic:\n    void Push(std::unique_ptr<Job> job) {\n        jobs_.push_back(job);\n    }\n    std::size_t Size() const { return jobs_.size(); }\n    const Job* Front() const { return jobs_.front().get(); }\n\nprivate:\n    std::vector<std::unique_ptr<Job>> jobs_;\n};\n\n// Переложи задачу в очередь: после вызова job пустой.\nvoid Submit(Queue& q, std::unique_ptr<Job>& job) {\n    q.Push(job);\n}", "check": "int main() {\n    Queue q;\n    auto job = std::make_unique<Job>(Job{7});\n    const Job* raw = job.get();\n    Submit(q, job);\n    std::cout << \"job empty \" << (job == nullptr)\n              << \", size \" << q.Size() << '\\n';\n    // в очереди тот же объект, а не копия\n    bool ok = job == nullptr && q.Size() == 1 && q.Front() == raw;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "job empty 1, size 1\nOK", "hint": "`unique_ptr` нельзя копировать, только перемещать: и при вызове `Push`, и при `push_back` внутри.", "solution": "class Queue {\npublic:\n    void Push(std::unique_ptr<Job> job) {\n        jobs_.push_back(std::move(job));\n    }\n    std::size_t Size() const { return jobs_.size(); }\n    const Job* Front() const { return jobs_.front().get(); }\n\nprivate:\n    std::vector<std::unique_ptr<Job>> jobs_;\n};\n\n// Переложи задачу в очередь: после вызова job пустой.\nvoid Submit(Queue& q, std::unique_ptr<Job>& job) {\n    q.Push(std::move(job));\n}"}, {"id": "modern-t06", "lesson": "modern-smart", "title": "Разорви цикл shared_ptr", "task": "Родитель и ребёнок держат друг друга через `shared_ptr`, и оба утекают. Поменяй одно поле `Child`, чтобы оба объекта удалились, а ребёнок по-прежнему мог добраться до родителя.", "prefix": "#include <iostream>\n#include <memory>\n\nint g_alive = 0;  // сколько Parent и Child сейчас живо\n\nstruct Alive {\n    Alive() { ++g_alive; }\n    ~Alive() { --g_alive; }\n};\n\nstruct Child;\n\nstruct Parent {\n    Alive alive;\n    std::shared_ptr<Child> child;\n};", "code": "struct Child {\n    Alive alive;\n    std::shared_ptr<Parent> parent;  // TODO: разорви цикл\n};", "check": "int main() {\n    bool linked = false;\n    {\n        auto p = std::make_shared<Parent>();\n        p->child = std::make_shared<Child>();\n        p->child->parent = p;\n        // ребёнок по-прежнему видит родителя\n        linked = std::shared_ptr<Parent>(p->child->parent) == p;\n        std::cout << \"use_count \" << p.use_count() << '\\n';\n    }\n    std::cout << \"alive \" << g_alive << '\\n';\n    bool ok = linked && g_alive == 0;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "use_count 1\nalive 0\nOK", "hint": "Обратная ссылка ребёнок → родитель не должна владеть. Для неё есть `std::weak_ptr`.", "solution": "struct Child {\n    Alive alive;\n    std::weak_ptr<Parent> parent;\n};"}, {"id": "modern-t07", "lesson": "modern-seq", "title": "erase-remove", "task": "`RemoveZeros` должна удалять все нули, но размер вектора не меняется. Почини на C++17, за O(n), без `std::erase`.", "prefix": "#include <algorithm>\n#include <iostream>\n#include <vector>", "code": "// C++17, без std::erase: удали все нули за O(n).\nvoid RemoveZeros(std::vector<int>& v) {\n    std::remove(v.begin(), v.end(), 0);\n}", "check": "bool Test(std::vector<int> v, const std::vector<int>& want) {\n    RemoveZeros(v);\n    std::cout << '[';\n    for (int x : v) {\n        std::cout << ' ' << x;\n    }\n    std::cout << \" ] size \" << v.size() << '\\n';\n    return v == want;\n}\n\nint main() {\n    bool ok = Test({0, 1, 0, 2, 3, 0}, {1, 2, 3});\n    ok = Test({0, 0}, {}) && ok;\n    ok = Test({4, 5}, {4, 5}) && ok;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "[ 1 2 3 ] size 3\n[ ] size 0\n[ 4 5 ] size 2\nOK", "hint": "`std::remove` только сдвигает нужные элементы вперёд и возвращает новый конец. Хвост отрежь через `v.erase(новый_конец, v.end())`.", "solution": "// C++17, без std::erase: удали все нули за O(n).\nvoid RemoveZeros(std::vector<int>& v) {\n    v.erase(std::remove(v.begin(), v.end(), 0), v.end());\n}"}, {"id": "modern-t08", "lesson": "modern-seq", "title": "Инвалидация итератора в цикле", "task": "`erase` делает итератор невалидным, поэтому цикл уже берёт новый из `it = v.erase(it)`. Но чётные всё равно остаются. Почини, цикл оставь ручным, без `erase_if`.", "prefix": "#include <iostream>\n#include <vector>", "code": "// Удали чётные. Цикл оставь ручным, без erase_if.\nvoid RemoveEven(std::vector<int>& v) {\n    for (auto it = v.begin(); it != v.end(); ++it) {\n        if (*it % 2 == 0) {\n            it = v.erase(it);\n        }\n    }\n}", "check": "bool Test(std::vector<int> v, const std::vector<int>& want) {\n    RemoveEven(v);\n    std::cout << '[';\n    for (int x : v) {\n        std::cout << ' ' << x;\n    }\n    std::cout << \" ] size \" << v.size() << '\\n';\n    return v == want;\n}\n\nint main() {\n    bool ok = Test({2, 4, 5, 7}, {5, 7});\n    ok = Test({1, 2, 2, 3}, {1, 3}) && ok;\n    ok = Test({1, 6, 8}, {1}) && ok;\n    ok = Test({}, {}) && ok;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "[ 5 7 ] size 2\n[ 1 3 ] size 2\n[ 1 ] size 1\n[ ] size 0\nOK", "hint": "`erase` возвращает итератор на следующий элемент: он уже «сдвинут». `++it` — только если ничего не удаляли.", "solution": "// Удали чётные. Цикл оставь ручным, без erase_if.\nvoid RemoveEven(std::vector<int>& v) {\n    for (auto it = v.begin(); it != v.end();) {\n        if (*it % 2 == 0) {\n            it = v.erase(it);\n        } else {\n            ++it;\n        }\n    }\n}"}, {"id": "modern-t09", "lesson": "modern-seq", "title": "emplace_back и reserve", "task": "`MakeItems` заполняет вектор, и объекты при этом много раз перемещаются. Сделай так, чтобы лишних копий и перемещений `Item` не было совсем.", "prefix": "#include <iostream>\n#include <string>\n#include <utility>\n#include <vector>\n\nint g_extra = 0;  // сколько раз Item копировали или перемещали\n\nstruct Item {\n    Item(int id, std::string name) : id(id), name(std::move(name)) {}\n    Item(const Item& o) : id(o.id), name(o.name) { ++g_extra; }\n    Item(Item&& o) noexcept : id(o.id), name(std::move(o.name)) {\n        ++g_extra;\n    }\n    int id;\n    std::string name;\n};", "code": "// n элементов Item(i, \"item\"), i = 0..n-1.\nstd::vector<Item> MakeItems(int n) {\n    std::vector<Item> items;\n    // TODO: ни одной лишней копии и перемещения\n    for (int i = 0; i < n; ++i) {\n        items.push_back(Item(i, \"item\"));\n    }\n    return items;\n}", "check": "int main() {\n    auto items = MakeItems(50);\n    bool ok = items.size() == 50;\n    for (int i = 0; ok && i < 50; ++i) {\n        ok = items[i].id == i && items[i].name == \"item\";\n    }\n    std::cout << items.size() << \" items, extra \" << g_extra << '\\n';\n    ok = ok && g_extra == 0;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "50 items, extra 0\nOK", "hint": "Два источника лишних move: временный `Item(...)` в `push_back` и реаллокации. Первое лечит `emplace_back(i, \"item\")`, второе — `reserve`.", "solution": "// n элементов Item(i, \"item\"), i = 0..n-1.\nstd::vector<Item> MakeItems(int n) {\n    std::vector<Item> items;\n    items.reserve(n);\n    for (int i = 0; i < n; ++i) {\n        items.emplace_back(i, \"item\");\n    }\n    return items;\n}"}, {"id": "modern-t10", "lesson": "modern-assoc", "title": "Подсчёт слов и structured bindings", "task": "Допиши `CountWords`. В `MostFrequent` заполни заголовок цикла structured bindings так, чтобы элементы map не копировались: проверка сравнивает адрес возвращённого ключа с адресом ключа в map.", "prefix": "#include <iostream>\n#include <map>\n#include <sstream>\n#include <string>", "code": "std::map<std::string, int> CountWords(const std::string& text) {\n    std::map<std::string, int> counts;\n    std::istringstream in(text);\n    // TODO: посчитай слова\n    return counts;\n}\n\n// Самое частое слово: ссылка на ключ внутри counts, без копий.\nconst std::string& MostFrequent(\n        const std::map<std::string, int>& counts) {\n    const std::string* best = nullptr;\n    int best_count = 0;\n    for (____ : counts) {\n        if (count > best_count) {\n            best = &word;\n            best_count = count;\n        }\n    }\n    return *best;\n}", "check": "int main() {\n    auto counts = CountWords(\"pear apple pear kiwi apple pear\");\n    for (const auto& [word, count] : counts) {\n        std::cout << word << ' ' << count << '\\n';\n    }\n    std::map<std::string, int> want{\n        {\"apple\", 2}, {\"kiwi\", 1}, {\"pear\", 3}};\n    bool ok = counts == want;\n    // ссылка ведёт в сам map, а не в копию элемента\n    ok = ok && &MostFrequent(counts) == &counts.find(\"pear\")->first;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "apple 2\nkiwi 1\npear 3\nOK", "hint": "Слова читаются циклом `for (std::string w; in >> w;)`. В `MostFrequent` — `const auto& [word, count]`: без `&` элемент копируется, и `&word` указывает на копию.", "solution": "std::map<std::string, int> CountWords(const std::string& text) {\n    std::map<std::string, int> counts;\n    std::istringstream in(text);\n    for (std::string word; in >> word;) {\n        ++counts[word];\n    }\n    return counts;\n}\n\n// Самое частое слово: ссылка на ключ внутри counts, без копий.\nconst std::string& MostFrequent(\n        const std::map<std::string, int>& counts) {\n    const std::string* best = nullptr;\n    int best_count = 0;\n    for (const auto& [word, count] : counts) {\n        if (count > best_count) {\n            best = &word;\n            best_count = count;\n        }\n    }\n    return *best;\n}"}, {"id": "modern-t11", "lesson": "modern-assoc", "title": "Свой ключ в unordered_map", "task": "Напиши `KeyHash`, чтобы `Key` работал как ключ `unordered_map`. Хэш должен учитывать оба поля: проверка сравнивает хэши ключей, отличающихся одним полем.", "prefix": "#include <cstddef>\n#include <functional>\n#include <iostream>\n#include <string>\n#include <unordered_map>\n\nstruct Key {\n    std::string user;\n    int shard = 0;\n    bool operator==(const Key&) const = default;\n};", "code": "struct KeyHash {\n    // TODO: operator(), который комбинирует оба поля\n};", "check": "int main() {\n    std::unordered_map<Key, int, KeyHash> hits;\n    ++hits[{\"ann\", 1}];\n    ++hits[{\"ann\", 1}];\n    ++hits[{\"ann\", 2}];\n    std::cout << hits.size() << ' ' << hits[{\"ann\", 1}] << '\\n';\n    bool ok = hits.size() == 2 && hits[{\"ann\", 1}] == 2;\n    // хэш зависит от обоих полей\n    const KeyHash h{};\n    ok = ok && h({\"ann\", 1}) != h({\"ann\", 2});\n    ok = ok && h({\"ann\", 1}) != h({\"bob\", 1});\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "2 2\nOK", "hint": "Посчитай `std::hash` от каждого поля и смешай их, например `h1 ^ (h2 + 0x9e3779b97f4a7c15 + (h1 << 6) + (h1 >> 2))`. `noexcept` и `const` у `operator()` обязательны по смыслу.", "solution": "struct KeyHash {\n    std::size_t operator()(const Key& k) const noexcept {\n        std::size_t h = std::hash<std::string>{}(k.user);\n        std::size_t s = std::hash<int>{}(k.shard);\n        return h ^ (s + 0x9e3779b97f4a7c15 + (h << 6) + (h >> 2));\n    }\n};"}, {"id": "modern-t12", "lesson": "modern-views", "title": "string_view без висячих ссылок", "task": "Допиши `FirstWord` и `TrimSpaces`. Обе возвращают кусок входа: без аллокаций и без `std::string` внутри. Проверка смотрит, что результат указывает внутрь входной строки.", "prefix": "#include <iostream>\n#include <string_view>", "code": "// Обе функции — O(1)-представления входа, без аллокаций.\nstd::string_view FirstWord(std::string_view s) {\n    // TODO: всё до первого пробела (или вся строка)\n    return {};\n}\n\nstd::string_view TrimSpaces(std::string_view s) {\n    // TODO: убери пробелы по краям\n    return s;\n}", "check": "// got — кусок in: те же байты, а не копия\nbool Test(std::string_view got, std::string_view want,\n          std::string_view in) {\n    bool inside = got.empty() ||\n        (got.data() >= in.data() &&\n         got.data() + got.size() <= in.data() + in.size());\n    std::cout << '[' << (inside ? got : \"<не кусок входа>\") << \"]\\n\";\n    return inside && got == want;\n}\n\nint main() {\n    std::string_view req = \"GET /api/v1 HTTP/1.1\";\n    std::string_view ping = \"ping\";\n    std::string_view id = \"   id=42  \";\n    std::string_view blank = \"    \";\n    std::string_view two = \" a b \";\n    bool ok = Test(FirstWord(req), \"GET\", req);\n    ok = Test(FirstWord(ping), \"ping\", ping) && ok;\n    ok = Test(TrimSpaces(id), \"id=42\", id) && ok;\n    ok = Test(TrimSpaces(blank), \"\", blank) && ok;\n    ok = Test(TrimSpaces(two), \"a b\", two) && ok;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "[GET]\n[ping]\n[id=42]\n[]\n[a b]\nOK", "hint": "`substr` у `string_view` — O(1). Для краёв: `find_first_not_of(' ')` и `find_last_not_of(' ')`. Строка из одних пробелов — отдельный случай.", "solution": "// Обе функции — O(1)-представления входа, без аллокаций.\nstd::string_view FirstWord(std::string_view s) {\n    return s.substr(0, s.find(' '));\n}\n\nstd::string_view TrimSpaces(std::string_view s) {\n    auto first = s.find_first_not_of(' ');\n    if (first == std::string_view::npos) {\n        return {};\n    }\n    auto last = s.find_last_not_of(' ');\n    return s.substr(first, last - first + 1);\n}"}, {"id": "modern-t13", "lesson": "modern-views", "title": "Параметр std::span", "task": "Подставь тип параметра, чтобы одна нешаблонная функция принимала vector (и const vector), array, C-массив и кусок массива. Проверка берёт `&Sum`, у шаблона так нельзя.", "prefix": "#include <array>\n#include <iostream>\n#include <span>\n#include <vector>", "code": "// Одна функция для vector, array и C-массива. Не шаблон.\nlong long Sum(____ xs) {\n    long long total = 0;\n    for (int x : xs) {\n        total += x;\n    }\n    return total;\n}", "check": "// Sum — обычная функция: адрес шаблона без <...> не взять\nusing SumPtr = decltype(&Sum);\n\nint main() {\n    std::vector<int> v{1, 2, 3};\n    const std::vector<int> cv{4, 5};\n    std::array<int, 5> a{1, 2, 3, 4, 5};\n    int raw[] = {10, 20, 30, 40};\n    long long got[] = {Sum(v), Sum(cv), Sum(a), Sum(raw),\n                       Sum(std::span(raw).last(2))};\n    for (long long x : got) {\n        std::cout << x << ' ';\n    }\n    std::cout << '\\n';\n    bool ok = got[0] == 6 && got[1] == 9 && got[2] == 15 &&\n              got[3] == 100 && got[4] == 70;\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "6 9 15 100 70\nOK", "hint": "Только чтение непрерывного массива — `std::span<const int>`.", "solution": "// Одна функция для vector, array и C-массива. Не шаблон.\nlong long Sum(std::span<const int> xs) {\n    long long total = 0;\n    for (int x : xs) {\n        total += x;\n    }\n    return total;\n}"}, {"id": "modern-t14", "lesson": "modern-vocab", "title": "optional вместо -1", "task": "Допиши `FindIndex`: индекс первого вхождения или пустой `optional`. Индекс 0 — тоже найденное значение.", "prefix": "#include <cstddef>\n#include <iostream>\n#include <optional>\n#include <vector>", "code": "// Индекс первого x или «ничего». Без -1 и без исключений.\nstd::optional<std::size_t> FindIndex(const std::vector<int>& v,\n                                     int x) {\n    // TODO\n    return std::nullopt;\n}", "check": "int main() {\n    std::vector<int> v{5, 8, 13, 8};\n    std::optional<std::size_t> got[] = {\n        FindIndex(v, 13), FindIndex(v, 8), FindIndex(v, 5),\n        FindIndex(v, 1), FindIndex({}, 5)};\n    for (const auto& idx : got) {\n        if (idx) {\n            std::cout << *idx << ' ';\n        } else {\n            std::cout << \"none \";\n        }\n    }\n    std::cout << '\\n';\n    bool ok = got[0] == 2u && got[1] == 1u && got[2] == 0u &&\n              !got[3] && !got[4];\n    std::cout << (ok ? \"OK\" : \"FAIL\") << '\\n';\n    return ok ? 0 : 1;\n}", "mode": "gcc", "expect": "2 1 0 none none\nOK", "hint": "Из функции, возвращающей `std::optional<std::size_t>`, можно просто `return i;` — значение обернётся само.", "solution": "// Индекс первого x или «ничего». Без -1 и без исключений.\nstd::optional<std::size_t> FindIndex(const std::vector<int>& v,\n                                     int x) {\n    for (std::size_t i = 0; i < v.size(); ++i) {\n        if (v[i] == x) {\n            return i;\n        }\n    }\n    return std::nullopt;\n}"}, {"id": "modern-t15", "lesson": "modern-vocab", "title": "variant и std::visit", "task": "Код не компилируется: visitor в `Area` обрабатывает не все типы. Допиши ветки для `Rect` и `Dot` (площадь
